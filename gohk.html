// you can read without knowing any Chinese — and "which line am I near" is
// hard to answer from a list of station names. So the ten lines are drawn in
// their own colours, with every station on them, and a button turns the whole
// thing off again when it is in the way.
//
// The colours are MTR's own and are not in mtr.json, which carries only the
// station order; they are stable enough to name here.
const RAIL_COLOURS = {
  AEL:'#00888A', DRL:'#F550A7', EAL:'#53B7E8', ISL:'#007DC5', KTL:'#00AB4E',
  SIL:'#BAC429', TCL:'#F7943E', TKL:'#7D499D', TML:'#923011', TWL:'#ED1D24',
};
const RAIL_LABEL_ZOOM = 14;
const railLayer = L.layerGroup();
let railShown = false;
try { railShown = localStorage.getItem('gohk-map-rail') === 'on'; } catch (e) {}

function drawRail() {
  railLayer.clearLayers();
  if (!railShown || !mtrData) return;

  // The lines first, so the station dots sit on top of them.
  for (const [line, variants] of Object.entries(mtrData.lines || {})) {
    const colour = RAIL_COLOURS[line] || '#334155';
    for (const run of variants) {
      const points = run.map(code => mtrData.stations[code])
                        .filter(Boolean).map(st => [st[2], st[3]]);
      if (points.length < 2) continue;
      L.polyline(points, { color: colour, weight: 5, opacity: 0.85,
                           lineJoin: 'round', lineCap: 'round' }).addTo(railLayer);
    }
  }

  // Then every station, once, however many lines call at it.
  const withLabel = map.getZoom() >= RAIL_LABEL_ZOOM;
  const area = map.getBounds();
  for (const [code, st] of Object.entries(mtrData.stations || {})) {
    const here = [st[2], st[3]];
    if (withLabel && !area.contains(here)) continue;   // labels only for what is on screen
    const marker = L.circleMarker(here, {
      radius: 5, color: '#1f2937', weight: 2, fillColor: '#ffffff', fillOpacity: 1,
    }).addTo(railLayer);
    const name = lang === 'zh' ? (st[1] || st[0]) : st[0];
    marker.bindTooltip(name, { direction: 'right', className: 'railname',
                               permanent: withLabel, offset: [6, 0] });
    // A station is a place to catch a train, so a tap goes to the trains.
    marker.on('click', () => { mtrSetStation(code); showMode('mtr'); });
  }
}

async function toggleRail() {
  railShown = !railShown;
  try { localStorage.setItem('gohk-map-rail', railShown ? 'on' : 'off'); } catch (e) {}
  paintRailButton();
  if (railShown) {
    if (!mtrData) await loadMtr().catch(error => console.warn('Rail unavailable:', error));
    railLayer.addTo(map);
  } else {
    map.removeLayer(railLayer);
  }
  drawRail();
}

function paintRailButton() {
  const button = document.getElementById('mtrtoggle');
  if (!button) return;
  button.classList.toggle('on', railShown);
  button.title = T('mapRail');
  button.setAttribute('aria-label', T('mapRail'));
  button.setAttribute('aria-pressed', railShown ? 'true' : 'false');
}

// ------------------------------------------------------------------ wiring
// Called when the MAP tab opens: load once, draw, and keep drawing as the
// rider pans. Everything is lazy — a rider who never opens the map never
// downloads any of it.
// Keep the locate button off the copyright notice whatever the notice does.
// Called when the map opens, and again whenever the shape of the screen or
// the size of the text could have changed.
function fitLocateButton() {
  const attribution = document.querySelector('.leaflet-control-attribution');
  const height = attribution ? Math.ceil(attribution.getBoundingClientRect().height) : 0;
  document.documentElement.style.setProperty('--attrh', (height || 48) + 'px');
}

function openMapLayer() {
  renderSpotChips();
  paintRailButton();
  setTimeout(fitLocateButton, 0);
  // The only moment the map's own furniture can be measured is while it is
  // on screen. Framing a journey happens elsewhere, so take the reading now.
  setTimeout(measureMapChrome, 30);
  // The railway comes back the way the rider left it last time.
  if (railShown) {
    (mtrData ? Promise.resolve() : loadMtr().catch(() => {}))
      .then(() => { railLayer.addTo(map); drawRail(); });
  }
  if (spots) { drawSpots(); return; }
  loadSpots().then(() => { renderSpotChips(); drawSpots(); renderSpotResults(); });
}

map.on('moveend', drawSpots);
map.on('moveend', drawRail);      // station labels follow the view

document.addEventListener('click', event => {
  const chip = event.target.closest('.spotchip');
  if (chip) {
    spotFilter = chip.dataset.cat || '';
    renderSpotChips();
    drawSpots();
    // The hotel list is a separate download. Ask for it the moment it is
    // wanted, then redraw — the map stays usable while it arrives.
    if (spotFilter === 'hotel' && !hotelsLoaded) {
      status.textContent = T('spotHotelLoading');
      loadHotels().then(() => { if (spotFilter === 'hotel') { drawSpots(); renderSpotResults(); } });
    }
    return;
  }
  const hit = event.target.closest('.spothit');
  if (hit) {
    const input = document.getElementById('spot-search');
    if (input) input.value = '';
    spotQuery = ''; spotPlaces = []; spotPlacesFor = '';
    renderSpotResults();
    if (hit.dataset.goto) {
      const [lat, lng] = hit.dataset.goto.split(',');
      planFromHere(lat, lng, hit.dataset.label);
    } else {
      goToSpot(spotById(hit.dataset.spot));
    }
    return;
  }
  const act = event.target.closest('[data-act]');
  if (!act || !act.closest('#spotcard')) return;
  const what = act.dataset.act;
  if (what === 'spot-close') { closeSpotSheet(); return; }
  if (what === 'spot-route') { planFromHere(act.dataset.y, act.dataset.x, act.dataset.label); return; }
  if (what === 'spot-open')  { closeSpotSheet(); goToSpot(spotById(act.dataset.spot)); return; }
  if (what === 'spot-rail')  { closeSpotSheet(); mtrSetStation(act.dataset.code); showMode('mtr'); return; }
  if (what === 'spot-stop') {
    const stop = findStopById(act.dataset.id);
    closeSpotSheet();
    if (stop) { stopSetStop(stop); showMode('stop'); }
    return;
  }
  if (what === 'spot-dest') {
    closeSpotSheet();
    stopOpenDest(act.dataset.name);
    showMode('stop');
    return;
  }
});

// Tapping the dimmed background closes the sheet, exactly like the other two.
document.getElementById('spotsheet').addEventListener('click', event => {
  if (event.target.id === 'spotsheet') closeSpotSheet();
});

document.getElementById('maplocate').addEventListener('click', mapLocate);
document.getElementById('mtrtoggle').addEventListener('click', toggleRail);

(function wireSpotSearch() {
  const input = document.getElementById('spot-search');
  const clear = document.getElementById('spot-clear');
  if (!input || !clear) return;
  input.addEventListener('input', () => {
    spotQuery = input.value;
    if (spotQuery.trim() && !spots) loadSpots().then(renderSpotResults);
    // Typing a name is a deliberate act, so this is the moment to pay for the
    // hotel list: somebody hunting for their guesthouse by name should find
    // it whether or not they thought to press the 🛏 chip first.
    if (spotQuery.trim().length >= 2 && !hotelsLoaded) loadHotels().then(renderSpotResults);
    renderSpotResults();
    // The bundled places answer instantly; the gazetteer is a network call,
    // so it waits until the typing settles rather than firing per keystroke.
    clearTimeout(spotPlaceTimer);
    spotPlaceTimer = setTimeout(() => {
      const asked = spotQuery;
      lookupSpotPlaces(asked).then(() => { if (spotQuery === asked) renderSpotResults(); });
    }, 500);
  });
  clear.addEventListener('click', () => {
    input.value = ''; spotQuery = ''; spotPlaces = []; spotPlacesFor = '';
    renderSpotResults(); input.blur();
  });
  const reset = document.getElementById('spot-reset');
  if (reset) reset.addEventListener('click', () => { resetMapView(); input.blur(); });
})();


// Open on 車站. The trip planner is one tap away under 巴士.
showMode('stop');
</script>
