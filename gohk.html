    // offer them all at once first — "every bus from any 屯門轉車 stop".
    if (reachList.length > 1) {
      const all = reachList.flatMap(g => g.hits);
      const ids = all.map(x => x.stop);
      html += '<button data-stop-id="' + esc(all[0].stop) + '" data-stop-group="' + esc(ids.join(',')) + '"><span class="pickmain">🚏 ' +
        esc(T('stopAllFrom').replace('{s}', query.trim())) + ' <span class="polecode">' + esc(T('stopBays').replace('{n}', all.length)) + '</span>' +
        poleRoutesLine(ids, 6, destIds) + '</span></button>';
    }
    html += list.map(card).join('');
    box.innerHTML = html || '<div class="favempty">' + T('noMatch') + '</div>';
    return;
  }
  // ONE CARD PER STATION NAME, whatever the bays are called.
  // 太子站,旺角花墟 is ELEVEN poles — MK184-188, MK500-503, MK751-752 — and
  // the QR code on the pole in the street says only "MK187". Splitting them
  // by facing gave three cards with the same name, which is a puzzle to solve
  // before you can look up a bus. They are one place to a rider, so they are
  // one card, exactly as the destination-filtered search has always done.
  //
  // What makes that safe is the other half of this change: once a card holds
  // more than one pole, every arrival row says WHICH pole its bus leaves from
  // and which way that pole faces. Merging without that would have quietly
  // offered a rider the 6C from the far side of Prince Edward Road.
  const stations = new Map();
  for (const stop of named) {
    const k = stationKey(stop);
    if (!stations.has(k)) stations.set(k, { stops: [], rank: 1 });
    const g = stations.get(k);
    g.stops.push(stop);
    g.rank = Math.min(g.rank, prefixRank(stop));
  }
  const hits = [...stations.values()]
    .sort((a, b) => a.rank - b.rank || b.stops.length - a.stops.length ||
                    stopName(a.stops[0]).length - stopName(b.stops[0]).length)
    .slice(0, 8);
  box.innerHTML = hits.length
    ? hits.map(h => {
        // Lead with the pole nearest the phone, so the screen opens on the
        // one the rider can actually see.
        const lead = herePoint
          ? h.stops.slice().sort((a, b) => metresBetween(herePoint.lat, herePoint.lng, Number(a.lat), Number(a.long)) -
                                           metresBetween(herePoint.lat, herePoint.lng, Number(b.lat), Number(b.long)))[0]
          : h.stops[0];
        const ids = h.stops.map(x => x.stop);
        const chip = h.stops.length > 1 ? T('stopBays').replace('{n}', h.stops.length) : poleCodeOf(lead);
        return '<button data-stop-id="' + esc(lead.stop) + '" data-stop-group="' + esc(ids.join(',')) + '">' +
        '<span class="pickmain">🚏 ' + esc(stopName(lead)) +
        (chip ? ' <span class="polecode">' + esc(chip) + '</span>' : '') +
        groupDirHtml(ids) +
        poleRoutesLine(ids, 4, filtering ? destIds : null) + '</span></button>'; }).join('')
    : '<div class="favempty">' + (filtering && named.length ? T('stopSearchNoneTo').replace('{d}', esc(stopState.destQuery)) : T('noMatch')) + '</div>';
}

document.getElementById('stopview').addEventListener('click', event => {
  // The ☆ on a route row is the app-wide "save this bus" star; let it through.
  if (event.target.closest('[data-star]')) return;
  const el = event.target.closest('[data-stop-id],[data-stop-act],.eta-row');
  if (!el) return;
  if (el.dataset.stopId) {
    const stop = findStopById(el.dataset.stopId);
    if (stop) {
      const groupStops = el.dataset.stopGroup ? el.dataset.stopGroup.split(',').map(findStopById).filter(Boolean) : null;
      stopSetStop(stop, groupStops);
      const carry = el.dataset.nofilter ? '' : (el.dataset.filter || stopState.destQuery);
      if (carry) { stopState.destFilter = carry; renderStopView(); }
    }
    return;
  }
  if (el.classList.contains('eta-row')) {
    // The row's own star carries route, direction, type and company.
    const star = el.querySelector('[data-star]');
    if (star) openSavedDepartureRoute({ route: star.dataset.route, dir: star.dataset.dir,
                                        serviceType: star.dataset.type, co: star.dataset.co });
    return;
  }
  switch (el.dataset.stopAct) {
    case 'change':  stopState = Object.assign(freshStopState(), { locateTried: true, destQuery: stopState.destQuery, destPicked: stopState.destPicked, indexing: stopState.indexing }); renderStopView(); break;
    case 'refresh': stopLoadRows(true); break;
    case 'geo-yes': rememberGeoChoice('yes'); stopLocate(); break;
    // THE PIN ON A SEARCH BOX. Both need the same thing first — a fix — so
    // they share one path: locate if we have to, then act on the answer.
    // withHere() is what makes the button work on the first tap rather than
    // asking the rider to press 我的位置 and then press the pin.
    case 'here-dest': withHere(here => {
      const near = nearestPoleTo(here);
      if (!near) { status.textContent = T('stopNoneNear'); return; }
      // The NAME, not the pole: 我要去 matches on names, and which bay you
      // happen to be beside is not what you mean by "here".
      stopState.destQuery = stopName(near);
      stopState.destPicked = true;
      renderStopView();
      status.textContent = T('hereIs').replace('{s}', stopName(near));
    }); break;
    case 'here-start': withHere(here => {
      const near = nearestPoleTo(here);
      if (!near) { status.textContent = T('stopNoneNear'); return; }
      stopSetStop(near);          // straight to the buses leaving from here
      stopLoadRows();
    }); break;
    case 'geo-no':  rememberGeoChoice('no'); renderStopView(); break;
    case 'dest': {
      const name = el.dataset.name || '';
      stopState.destQuery = stopState.destQuery === name ? '' : name;
      stopState.destPicked = true;
      renderStopView();
      break;
    }
    case 'routepick': {  // a suggested BUS NUMBER: straight to "which way?"
      const hit = routeSuggestions[Number(el.dataset.index)];
      if (!hit) break;
      // 60X is not a destination. Leaving it in the box would have the picker
      // filtering every stop by a place that does not exist the moment the
      // rider came back from the route.
      stopState.destQuery = ''; stopState.destPicked = false;
      showDirections(hit.no, hit.variants, hit.co);
      break;
    }
    case 'destpick': {   // a suggested name: the whole name into the box
      stopState.destQuery = el.dataset.name || '';
      stopState.destPicked = true;
      renderStopView();
      break;
    }
    case 'filterpick': { // same, for the 往… box on the pole screen
      stopState.destFilter = el.dataset.name || '';
      renderStopView();
      break;
    }
    case 'deststar': {
      const name = String(stopState.destQuery || '').trim();
      const result = toggleStopDest(name);
      if (result === null) { status.textContent = T('stopDestFull'); break; }
      status.textContent = T(result ? 'stopDestSavedMsg' : 'stopDestRemovedMsg').replace('{d}', name);
      renderStopView();
      break;
    }
    case 'fav': {
      const sf = stopFavs[Number(el.dataset.index)];
      const across = el.dataset.stopGroup ? el.dataset.stopGroup.split(',').map(findStopById).filter(Boolean) : null;
      stopOpenSaved(sf, !!el.dataset.nofilter, across);
      break;
    }
    case 'star': {
      const result = toggleStopFav(stopState.stop);
      if (result === null) { status.textContent = T('stopFull'); break; }
      status.textContent = T(result ? 'stopSavedMsg' : 'stopRemovedMsg').replace('{s}', stopName(stopState.stop));
      renderStopView();
      break;
    }
  }
});
document.getElementById('stopview').addEventListener('input', event => {
  if (event.target.id === 'stop-search') stopRenderSearch(event.target.value);
  if (event.target.id === 'stop-dest') {
    stopState.destQuery = event.target.value;
    stopState.destPicked = false;                  // typing again: suggest again
    stopScheduleRefresh();                         // the lists change; the box stays put
  }
  if (event.target.id === 'stop-filter') {
    stopState.destFilter = event.target.value;
    const rows = document.getElementById('stop-rows');
    if (rows) rows.innerHTML = stopRowsHtml();
    // Names that start with the text, to tap instead of finishing the word.
    const sug = document.getElementById('stop-filter-suggest');
    if (sug) {
      const list = destSuggestions(event.target.value, 6);
      const done = list.length === 1 && tidyName(list[0].name) === tidyName(event.target.value);
      sug.innerHTML = list.length && !done
        ? '<div class="suggest">' + list.map(x => '<button data-stop-act="filterpick" data-name="' + esc(x.name) + '">' + esc(x.name) + '</button>').join('') + '</div>'
        : '';
    }
  }
});

// ============================================================
// THE MTR TAB — nearest station, line, direction, next trains
// ============================================================
// The official line colours, used only as a stripe on the line buttons: the
// words stay dark on white, so the colour helps but is never relied on.
const MTR_LINE_COLOURS = { AEL:'#00888A', TCL:'#F3982D', TWL:'#E2231A', ISL:'#0075C2',
  KTL:'#00AF41', TKL:'#7D499D', EAL:'#5EB7E8', TML:'#9C2E00', SIL:'#B5BD00', DRL:'#EB6EA5' };
const MTR_NEAR_M   = 1500;     // further than this and "nearest" is not near
const MTR_CACHE_MS = 30000;    // the feed itself is refreshed about this often

let mtrState = freshMtrState();
function freshMtrState() {
  return { station:null, line:null, dir:null, dest:null,
           blocks:{}, alerts:{}, blocksFor:null, fetchedAt:0,
           loading:false, locating:false, locateTried:false, noneNear:false };
}

function stationName(code) {
  const s = mtrData && mtrData.stations[code];
  return s ? (lang === 'zh' ? (s[1] || s[0]) : s[0]) : code;
}

// The running order of this line that passes through this station (some
// lines have branch variants), so "ahead" means something.
function mtrOrderFor(line, station, alsoWith) {
  const variants = (mtrData.lines || {})[line] || [];
  return variants.find(v => v.includes(station) && (!alsoWith || v.includes(alsoWith)))
      || variants.find(v => v.includes(station)) || variants[0] || [];
}

// A saved train is the MTR screen with its three answers already given.
function mtrOpenSaved(t) {
  if (!t) return;
  mtrState = Object.assign(freshMtrState(), { locateTried: true, station: t.station, line: t.line, dir: t.dir });
  if (activeMode !== 'mtr') { showMode('mtr'); return; }   // openMtrView keeps a preset station
  renderMtrView(); mtrLoadBlocks();
}

// The feed for one line at one station, both directions, or null.
async function fetchTrainBlock(line, station) {
  const url = MTR_ETA_URL + '?line=' + encodeURIComponent(line) +
              '&sta=' + encodeURIComponent(station) + '&lang=' + (lang === 'zh' ? 'TC' : 'EN');
  const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
  if (!response.ok) throw new Error('server said ' + response.status);
  const data = await response.json();
  if (data.status === 0) return { alert: data.message || T('trainAlert') };
  return (data.data || {})[line + '-' + station] || {};
}

// A COUNTDOWN NOBODY CAN USE IS NOT A COUNTDOWN.
// The MTR feed keeps answering after the last train, and what it returns is
// the wait for the FIRST train of the next service day — "1423 分鐘" on the
// 收藏 tab at twenty past midnight. Nobody stands on a platform for
// twenty-three hours, and the number reads as a fault in the app rather than
// the end of the service. Past two hours we say there is nothing due, which
// is the true and useful answer.
const TRAIN_MAX_WAIT = 120;
function usableWait(value) {
  const n = Number(value);
  return isFinite(n) && n >= 0 && n <= TRAIN_MAX_WAIT ? n : null;
}

async function loadTrainFavEta(t, index) {
  const cell = document.getElementById('trainfav-eta-' + index);
  if (!cell) return;
  try {
    const block = await fetchTrainBlock(t.line, t.station);
    if (!document.getElementById('trainfav-eta-' + index)) return;
    if (block.alert) { cell.textContent = block.alert; cell.classList.add('quiet'); return; }
    const mins = (block[t.dir] || []).filter(x => x.valid !== 'N').map(x => usableWait(x.ttnt))
      .filter(n => n !== null).slice(0, 3);
    if (!mins.length) { cell.textContent = T('noneDue'); cell.classList.add('quiet'); return; }
    cell.textContent = mins.map(n => n === 0 ? T('due') : n + T('min')).join(' · ');
    cell.classList.remove('quiet');
  } catch (error) { cell.textContent = T('etaOffline'); cell.classList.add('quiet'); }
}

function openMtrView() {
  const panel = document.getElementById('panel');
  const view  = document.getElementById('mtrview');
  panel.classList.remove('favmode', 'setmode', 'routemode', 'stopmode');
  document.getElementById('favview').style.display = 'none';
  document.getElementById('setview').style.display = 'none';
  document.getElementById('stopview').style.display = 'none';
  view.style.display = 'block';
  panel.classList.add('mtrmode');
  panel.scrollTop = 0;

  if (!mtrData) {
    view.innerHTML = '<div class="favhead">🚇 ' + T('mtrTitle') + '</div>' +
                     '<div class="favempty">' + T('loading') + '</div>';
    loadMtr().then(() => { if (activeMode === 'mtr') openMtrView(); });
    return;
  }

  if (!mtrState.station) {
    if (herePoint) {
      const near = railStationsNear(herePoint.lat, herePoint.lng, MTR_NEAR_M);
      if (near.length) { mtrSetStation(near[0].code); return; }
      mtrState.noneNear = true;
    } else if (navigator.geolocation && geoChoice() === 'yes'
               && !mtrState.locating && !mtrState.locateTried) {
      // They already said yes once; do not ask again, just look.
      mtrState.locateTried = true;
      mtrLocate();
    }
  }
  renderMtrView();
  if (mtrState.station) mtrLoadBlocks();     // every line through it, not just the chosen one
}

function mtrLocate() {
  if (!navigator.geolocation) { status.textContent = T('noGeo'); return; }
  mtrState.locating = true; renderMtrView();
  status.textContent = T('findingYou');
  navigator.geolocation.getCurrentPosition(
    position => {
      herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
      mtrState.locating = false;
      const near = railStationsNear(herePoint.lat, herePoint.lng, MTR_NEAR_M);
      if (near.length) mtrSetStation(near[0].code);
      else { mtrState.noneNear = true; renderMtrView(); }
    },
    () => { mtrState.locating = false; status.textContent = T('locationFailed'); renderMtrView(); },
    { enableHighAccuracy:true, timeout:10000 });
}

function mtrSetStation(code) {
  mtrState = Object.assign(freshMtrState(), { locateTried: mtrState.locateTried, station: code });
  const lines = whichLinesServe(code);
  if (lines.length === 1) mtrState.line = lines[0];     // one line is not a choice
  renderMtrView();
  mtrLoadBlocks();
}
// A direction belongs to a line: tapping ◀ 開往 金鐘 under 東鐵綫 picks both.
function mtrSetDir(dir, line) {
  if (line) mtrState.line = line;
  mtrState.dir = dir; mtrState.dest = null; renderMtrView();
}
function mtrSetDest(code) { mtrState.dest = (mtrState.dest === code ? null : code); renderMtrView(); }
// Stand at another station on this line — a tap on its chip or a slide that
// settles on it. The direction is kept when the new station has it, so a
// rider moving along the line towards somewhere is not asked again.
function mtrJumpTo(code, line) {
  const keepDir = (line && mtrState.line === line) ? mtrState.dir : null;
  mtrState = Object.assign(freshMtrState(), { locateTried: true, station: code, line: line || null, dir: keepDir });
  const lines = whichLinesServe(code);
  if (!mtrState.line && lines.length === 1) mtrState.line = lines[0];
  if (mtrState.line && !lines.includes(mtrState.line)) { mtrState.line = lines.length === 1 ? lines[0] : null; mtrState.dir = null; }
  renderMtrView();
  mtrLoadBlocks();
}

// One request per line through the station, all at once: at an interchange
// like 九龍塘 the rider sees both lines and all four directions in one go,
// with no line-picking step.
async function mtrLoadBlocks(force) {
  const { station } = mtrState;
  if (!station) return;
  const lines = whichLinesServe(station);
  if (!force && mtrState.blocksFor === station && Date.now() - mtrState.fetchedAt < MTR_CACHE_MS) return;
  mtrState.loading = true; renderMtrView();
  const results = await Promise.all(lines.map(async line => {
    try {
      const url = MTR_ETA_URL + '?line=' + encodeURIComponent(line) +
                  '&sta=' + encodeURIComponent(station) + '&lang=' + (lang === 'zh' ? 'TC' : 'EN');
      const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!response.ok) throw new Error('server said ' + response.status);
      const data = await response.json();
      if (data.status === 0) return { line, block: {}, alert: data.message || T('trainAlert'), delay: data.isdelay === 'Y' };
      return { line, block: (data.data || {})[line + '-' + station] || {}, alert: null, delay: data.isdelay === 'Y' };
    } catch (error) {
      return { line, block: null, alert: T('etaOffline'), delay: false };
    }
  }));
  if (mtrState.station !== station) return;             // moved on meanwhile
  mtrState.blocks = {}; mtrState.alerts = {};
  for (const r of results) { mtrState.blocks[r.line] = r.block; mtrState.alerts[r.line] = r.alert; noteMtrDelay(r.line, r.delay); }
  mtrState.blocksFor = station; mtrState.fetchedAt = Date.now(); mtrState.loading = false;
  // On the chosen line, one direction with trains is not a choice either.
  if (mtrState.line) {
    const dirs = mtrDirections(mtrState.line);
    if (!mtrState.dir && dirs.length === 1) mtrState.dir = dirs[0].key;
    if (mtrState.dir && !dirs.some(d => d.key === mtrState.dir)) mtrState.dir = dirs.length === 1 ? dirs[0].key : null;
  }
  renderMtrView();
  refreshAlerts();
}
function mtrLoaded(line) {
  return mtrState.blocksFor === mtrState.station && !!mtrState.blocks &&
         Object.prototype.hasOwnProperty.call(mtrState.blocks, line);
}

function mtrTrains(key, line) {
  const block = (mtrState.blocks || {})[line || mtrState.line] || {};
  return (block[key] || []).filter(t => t.valid !== 'N')
    .map(t => ({ min: usableWait(t.ttnt), dest: t.dest, plat: t.plat }))
    .filter(t => t.min !== null);
}

// Directions are named by where the trains are actually going, read from the
// feed, never guessed from the timetable's idea of "up".
function mtrDirections(line) {
  const out = [];
  for (const key of ['UP', 'DOWN']) {
    const trains = mtrTrains(key, line);
    if (trains.length) out.push({ key, dest: trains[0].dest });
  }
  return out;
}

// One line laid out left to right, with this station in the middle. Which
// direction is "left" is decided by where its terminus sits in the running
// order, so the two direction buttons underneath sit on the same sides as
// the stations they lead to. Before the feed answers there are no
// directions yet; the strip still draws, its chips just wait.
function mtrSides(line) {
  const st = mtrState;
  if (!line || !st.station) return null;
  const dirs = mtrDirections(line);
  const order = mtrOrderFor(line, st.station, dirs[0] && dirs[0].dest);
  const i = order.indexOf(st.station);
  if (i < 0) return null;
  const at = d => order.indexOf(d.dest);
  const left  = dirs.find(d => at(d) >= 0 && at(d) < i) || null;
  const right = dirs.find(d => d !== left && at(d) > i) || dirs.find(d => d !== left) || null;
  return { order, i, left, right };
}

// Centre every strip on the station, then listen: when the rider slides one
// and lets go, whichever station is now in its middle becomes the station,
// and lines, directions, trains and destination follow from it.
let mtrStripSettled = 0;
function mtrCentreStrip() {
  mtrStripSettled = Date.now();
  for (const strip of document.querySelectorAll('#mtrview .mtrstrip')) {
    const here = strip.querySelector('.mtrstop.here');
    if (!here) continue;
    strip.scrollLeft = Math.max(0, here.offsetLeft - strip.clientWidth / 2 + here.offsetWidth / 2);
    // Only a slide the rider started counts. Browsers also fire scroll when
    // the layout shifts under a strip (keyboard opening, a rotate, our own
    // centring), and one of those must never change the station.
    let timer = null, armed = false;
    const arm = () => { armed = true; };
    strip.onpointerdown = arm; strip.ontouchstart = arm; strip.onwheel = arm;
    strip.onscroll = () => {
      if (Date.now() - mtrStripSettled < 400 || strip.clientWidth === 0) return;
      clearTimeout(timer);
      if (!armed) { timer = setTimeout(mtrCentreStrip, 220); return; }   // layout moved it: put it back
      timer = setTimeout(() => {
        armed = false;
        const middle = strip.scrollLeft + strip.clientWidth / 2;
        let best = null, bestGap = Infinity;
        for (const chip of strip.querySelectorAll('.mtrstop')) {
          const gap = Math.abs(chip.offsetLeft + chip.offsetWidth / 2 - middle);
          if (gap < bestGap) { bestGap = gap; best = chip; }
        }
        const code = best && best.dataset.code;
        if (!code || code === mtrState.station) { mtrCentreStrip(); return; }
        mtrJumpTo(code, strip.dataset.line);
      }, 220);
    };
  }
}

// Every station ahead in the chosen direction, to the end of the line.
function mtrStationsAhead() {
  const { line, station, dir } = mtrState;
  if (!line || !station || !dir) return [];
  const trains = mtrTrains(dir, line);
  if (!trains.length) return [];
  const order = mtrOrderFor(line, station, trains[0].dest);
  const i = order.indexOf(station), d = order.indexOf(trains[0].dest);
  if (i < 0 || d < 0 || d === i) return [];
  return d > i ? order.slice(i + 1) : order.slice(0, i).reverse();
}

function clockIn(minutes) {
  return new Date(Date.now() + minutes * 60000)
    .toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function renderMtrView() {
  const view = document.getElementById('mtrview');
  if (!view || !mtrData) return;
  const st = mtrState;
  let html = '<div class="favhead">🚇 ' + T('mtrTitle') + '</div>';

  // ---- 1. WHICH STATION ----
  if (!st.station) {
    if (st.locating) {
      html += '<div class="favempty">' + T('findingYou') + '</div>';
    } else {
      if (navigator.geolocation && geoChoice() !== 'no' && geoChoice() !== 'yes' && !herePoint) {
        html += '<div class="mtrgeo"><div class="geotitle">' + T('mtrGeoTitle') + '</div>' +
                '<div class="geobody">' + T('mtrGeoBody') + '</div>' +
                '<div class="geobtns"><button class="geoyes" data-mtr-act="geo-yes">' + T('geoYes') + '</button>' +
                '<button class="geono" data-mtr-act="geo-no">' + T('geoNo') + '</button></div></div>';
      } else if (navigator.geolocation && !herePoint) {
        html += '<div class="mtrpick"><button data-mtr-act="geo-yes">' + T('myLocation') + '</button></div>';
      }
      if (herePoint) {
        const near = railStationsNear(herePoint.lat, herePoint.lng, MTR_NEAR_M);
        if (near.length) {
          html += '<div class="mtrsub">' + T('mtrNearby') + '</div><div class="mtrpick">' +
            near.slice(0, 3).map(n => '<button data-mtr-station="' + n.code + '">📍 ' + esc(stationName(n.code)) +
              '<span class="mtrdist">' + Math.round(n.metres) + ' m</span></button>').join('') + '</div>';
        } else {
          html += '<div class="favempty">' + T('mtrNoneNear') + '</div>';
        }
      }
      const saved = savedStations();
      if (saved.length) {
        html += '<div class="mtrsub">' + T('mtrSaved') + '</div><div class="mtrpick">' +
          saved.map(sv => '<button data-mtr-station="' + sv.code + '">⭐ ' + esc(stationName(sv.code)) + '</button>').join('') + '</div>';
      }
      if (trainFavs.length) {
        html += '<div class="mtrsub">' + T('mtrSavedTrains') + '</div><div class="mtrpick">' +
          trainFavs.map((t, i) => '<button data-mtr-act="train" data-index="' + i + '" style="border-left:12px solid ' +
            (MTR_LINE_COLOURS[t.line] || '#999') + '">★ ' + esc(stationName(t.station)) + ' · ' +
            T('towards') + ' ' + esc(stationName(t.dest)) + '</button>').join('') + '</div>';
      }
      html += '<div class="mtrsub">' + T('mtrSearchPh').replace('…', '') + '</div>' +
              '<div class="frow"><input id="mtr-search" type="text" placeholder="' + esc(T('mtrSearchPh')) + '" autocomplete="off"></div>' +
              '<div class="mtrpick" id="mtr-search-results"></div>';
    }
    view.innerHTML = html;
    return;
  }

  // ---- station chosen ----
  html = '';   // the heading row below names the station; a 港鐵 title above it is a wasted line
  // Every line through the station at once, each with its own strip and
  // both direction buttons carrying the next train — at 九龍塘 that is
  // 東鐵綫 and 觀塘綫, four directions, nothing to pick first. The big
  // centred chip on each strip is the station; sliding a strip changes it.
  const lines = whichLinesServe(st.station);
  const here = herePoint ? Math.round(metresBetween(herePoint.lat, herePoint.lng,
                 mtrData.stations[st.station][2], mtrData.stations[st.station][3])) : null;
  html += '<div class="mtrhead"><div class="mtrsub mtrstation">🚇 ' + esc(stationName(st.station)) +
          (here !== null ? ' <small>' + T('mtrAway').replace('{m}', here) + '</small>' : '') + '</div>' +
          '<button class="refreshbtn" data-mtr-act="refresh"' + (st.loading ? ' disabled' : '') + '>' +
          T(st.loading ? 'refreshing' : 'refresh') + '</button>' +
          '<button class="refreshbtn" data-mtr-act="change">' + T('mtrChange') + '</button></div>' +
          '<div class="rshint">' + T('mtrLineStrip') + '</div>';

  // A direction button: where it goes, and the next train or two under it.
  const dirBtn = (line, d, cls) => {
    if (!d) return '<div class="mtrdir blank"></div>';
    const next = mtrTrains(d.key, line).slice(0, 2).map(t => t.min === 0 ? T('due') : t.min + T('min')).join(' · ');
    const on = st.line === line && st.dir === d.key;
    return '<button class="mtrdir ' + cls + (on ? ' on' : '') + '" data-mtr-dir="' + d.key + '" data-line="' + line + '">' +
      '<span class="dirname">' + (cls === 'left' ? '◀ ' : '') + T('towards') + ' ' + esc(stationName(d.dest)) + (cls === 'right' ? ' ▶' : '') + '</span>' +
      '<span class="dirnext">' + (next || T('noneDue')) + '</span></button>';
  };

  for (const line of lines) {
    const colour = MTR_LINE_COLOURS[line] || '#999';
    const sides = mtrSides(line);
    const loaded = mtrLoaded(line);
    const alert = loaded ? st.alerts[line] : null;
    const active = st.line === line;
    html += '<section class="mtrlinesec" style="border-left-color:' + colour + '">' +
            '<div class="mtrlinename">' + esc(railLineName(line)) + '</div>';
    if (sides) {
      html += '<div class="mtrstrip" id="mtr-strip-' + line + '" data-line="' + line + '"><span class="mtrpad"></span>' +
        sides.order.map((code, j) => {
          const here = j === sides.i;
          return '<button class="mtrstop' + (here ? ' here dead' : '') + '" data-code="' + code + '" style="border-top-color:' + colour + '"' +
            (here ? ' aria-current="true" tabindex="-1"' : ' data-mtr-jump="' + code + '" data-line="' + line + '"') +
            '>' + esc(stationName(code)) + '</button>';
        }).join('') + '<span class="mtrpad"></span></div>';
    }
    if (alert) html += '<div class="mtralert">⚠ ' + esc(alert) + '</div>';
    if (!loaded) {
      html += '<div class="favempty">' + T('rsCheckingEta') + '</div>';
    } else {
      const dirs = mtrDirections(line);
      if (!dirs.length) { if (!alert) html += '<div class="favempty">' + T('noneDue') + '</div>'; }
      else if (sides) html += '<div class="mtrdirs">' + dirBtn(line, sides.left, 'left') + dirBtn(line, sides.right, 'right') + '</div>';
      else html += '<div class="mtrdirs">' + dirs.map(d => dirBtn(line, d, '')).join('') + '</div>';
    }

    // ---- the chosen direction on this line: next trains, then the place ----
    if (active && st.dir && loaded) {
      const trains = mtrTrains(st.dir, line).slice(0, 4);
      const chosen = mtrDirections(line).find(d => d.key === st.dir);
      const headDest = trains[0] ? trains[0].dest : (chosen ? chosen.dest : null);
      if (headDest) {
        const stamp = new Date(st.fetchedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        const saved = isSavedTrain(st.station, line, st.dir);
        // The direction button above already says when the next trains
        // come; a card per train underneath was the same numbers again,
        // four times over. The stamp and the ☆ (save this train) stay.
        html += '<div class="mtrupdated">' + T('updatedAt').replace('{t}', stamp) + '</div>';
        const ahead = mtrStationsAhead();
        const star = '<button class="rsstar' + (saved ? ' on' : '') + '" data-mtr-act="star" data-dest="' + headDest +
                     '" aria-label="' + T('favTrains') + '">' + (saved ? '★' : '☆') + '</button>';
        // Every station ahead this way, in order, numbered by stops away.
        // Tapping one gives the arrival time; the strip above stays "where
        // I am" and never doubles as the place you are going.
        html += '<div class="mtrhead"><div class="mtrsub">' +
                (ahead.length ? T('mtrNextStops') : T('mtrNextTrains') + ' · ' + T('towards') + ' ' + esc(stationName(headDest))) +
                '</div>' + star + '</div>';
        if (ahead.length) {
          html += '<div class="mtrnexts">' +
            ahead.map((code, i) => '<button class="mtrnext' + (st.dest === code ? ' on' : '') + '" data-mtr-dest="' + code + '">' +
              '<span class="n">' + (i + 1) + '</span><span class="nm">' + esc(stationName(code)) + '</span></button>').join('') + '</div>';
          if (st.dest && ahead.includes(st.dest)) {
            const stops = ahead.indexOf(st.dest) + 1;
            const route = railRoute(st.station, st.dest);
            const ride  = Math.max(1, Math.round(route ? route.cost : stops * 2.5));
            const wait  = trains[0] ? trains[0].min : 0;
            const fare  = railFare(st.station, st.dest);
            html += '<div class="mtrsummary"><div class="big">🚉 ' + esc(stationName(st.dest)) + '</div>' +
              '<div class="line">' + (stops === 1 ? T('mtrOneStop') : T('mtrStops').replace('{n}', stops)) +
              ' · ' + T('mtrRide').replace('{m}', ride) + (fare !== null ? ' · ' + fareText(fare) : '') + '</div>' +
              '<div class="arrive">' + (wait === 0 ? T('mtrArriveNow') : T('mtrArrive').replace('{w}', wait))
                .replace('{t}', clockIn(wait + ride)) + '</div></div>';
          }
        }
      }
    }
    html += '</section>';
  }

  // ---- the planner's train results, if a trip was searched ----
  if (typeof railPicks !== 'undefined' && railPicks.length) {
    html += '<div class="mtrsub">' + T('mtrTrips') + '</div><div class="mtrpick">' +
      '<button data-mtr-act="trips">🧭 ' + T('mtrShowTrips').replace('{n}', railPicks.length) + '</button></div>';
  }
  view.innerHTML = html;
  mtrCentreStrip();
}

function mtrRenderSearch(query) {
  const box = document.getElementById('mtr-search-results');
  if (!box || !mtrData) return;
  const q = sc(String(query || '').trim().toLowerCase());
  box.innerHTML = '';
  if (!q) return;
  const starts = code => { const s = mtrData.stations[code]; return (sc(s[1] || '').startsWith(q) || s[0].toLowerCase().startsWith(q)) ? 0 : 1; };
  const hits = Object.keys(mtrData.stations).filter(code => {
    const s = mtrData.stations[code];
    return sc(s[1] || '').includes(q) || s[0].toLowerCase().includes(q);
  }).sort((a, b) => starts(a) - starts(b) || stationName(a).length - stationName(b).length).slice(0, 6);
  box.innerHTML = hits.length
    ? hits.map(code => '<button data-mtr-station="' + code + '">🚇 ' + esc(stationName(code)) + '</button>').join('')
    : '<div class="favempty">' + T('noMatch') + '</div>';
}

// Back to the planner's train cards, for anyone who searched a trip.
function showRailResults() {
  const panel = document.getElementById('panel');
  panel.classList.remove('mtrmode');
  document.getElementById('mtrview').style.display = 'none';
  document.getElementById('compare').style.display = '';
  document.getElementById('journeys').style.display = '';
  currentPicks = railPicks;
  if (!currentPicks.length) return;
  setResultsMode(true);
  buildCompareStrip(currentPicks);
  selectOption(currentPicks[0]);
  panel.scrollTop = 0;
  currentPicks.forEach(pick => loadNextBus(pick));
}

// One listener for the whole screen: it is redrawn from scratch on every
// change, so per-button handlers would be lost on each redraw.
document.getElementById('mtrview').addEventListener('click', event => {
  const el = event.target.closest('[data-mtr-station],[data-mtr-dir],[data-mtr-dest],[data-mtr-jump],[data-mtr-act]');
  if (!el) return;
  const d = el.dataset;
  if (d.mtrJump) { mtrJumpTo(d.mtrJump, d.line); return; }   // a station on a strip: stand there
  if (d.mtrStation) return mtrSetStation(d.mtrStation);
  if (d.mtrDir)     return mtrSetDir(d.mtrDir, d.line);
  if (d.mtrDest)    return mtrSetDest(d.mtrDest);
  switch (d.mtrAct) {
    case 'change':  mtrState = Object.assign(freshMtrState(), { locateTried: true }); renderMtrView(); break;
    case 'refresh': mtrLoadBlocks(true); break;
    case 'geo-yes': rememberGeoChoice('yes'); mtrLocate(); break;
    case 'geo-no':  rememberGeoChoice('no'); renderMtrView(); break;
    case 'trips':   showRailResults(); break;
    case 'star': {
      const entry = { station: mtrState.station, line: mtrState.line, dir: mtrState.dir, dest: d.dest };
      const added = toggleTrainFav(entry);
      status.textContent = T(added ? 'trainSaved' : 'trainRemoved').replace('{s}', stationName(entry.station));
      renderMtrView();
      break;
    }
    case 'train': mtrOpenSaved(trainFavs[Number(d.index)]); break;
  }
});
document.getElementById('mtrview').addEventListener('input', event => {
  if (event.target.id === 'mtr-search') mtrRenderSearch(event.target.value);
});

// ============================================================
// TRAFFIC ALERTS — what the government and the operators are saying,
// checked against what the rider has saved and what is open on screen.
// ============================================================
// Three sources, as the user chose:
//  1. The Transport Department's special traffic news (road closures,
//     accidents, service adjustments) — one XML, both languages, with a
//     road, a district, landmarks and the full text, which names bus
//     routes when they are diverted.
//  2. The MTR next-train feed's own isdelay flag, per line.
//  3. The bus companies' arrival remarks (受交通擠塞影響, 改道, 暫停…).
// A notice counts when it NAMES the rider's bus or station (certain), or
// when its road or landmark matches a stop on the rider's route (possible).
// Watched: saved buses, stops, places and trains, plus whatever route,
// stop or station is open. The popup shows once per notice; the red line
// under the weather stays while the notice does, and reopens the text.
const TD_NEWS_URL = 'https://www.td.gov.hk/tc/special_news/trafficnews.xml';
const ALERT_REFRESH_MS = 5 * 60 * 1000;
const BUS_TROUBLE = /延誤|受阻|擠塞|改道|暫停|取消|停駛|延遲|delay|congest|divert|suspend|cancel/i;
// The four values this section works on are declared much earlier in the
// file, beside the other saved state — see "TRAFFIC ALERT STATE". They have
// to exist before the start-up block runs, because the weather bar is drawn
// there and it reads them.
function rememberSeen(keys) {
  const now = Date.now();
  for (const k of keys) alertsSeen[k] = now;
  for (const k of Object.keys(alertsSeen)) if (now - alertsSeen[k] > 3 * 86400000) delete alertsSeen[k];
  try { localStorage.setItem('hkfast-alerts-seen', JSON.stringify(alertsSeen)); } catch (e) {}
}

// Route numbers named in a notice. A bare number only counts after the word
// 路線 / route, so times and dates never become the number 5 bus; anything
// with a letter in it (60X, NR338S, A33X) is a route wherever it appears.
function routeTokens(text) {
  const out = new Set();
  const t = String(text || '');
  for (const m of t.matchAll(/(?:路線|路线|routes?|巴士)\s*(?:no\.?\s*)?([A-Za-z]{0,2}\d{1,4}[A-Za-z]{0,2})/gi)) out.add(m[1].toUpperCase());
  for (const m of t.matchAll(/(?<![A-Za-z0-9])([A-Za-z]{1,2}\d{1,3}[A-Za-z]?|\d{1,3}[A-Za-z]{1,2})(?![A-Za-z0-9])/g)) out.add(m[1].toUpperCase());
  return out;
}

async function loadTdNews() {
  try {
    const response = await fetch(TD_NEWS_URL, { cache: 'no-store', signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const doc = new DOMParser().parseFromString(await response.text(), 'text/xml');
    const g = (m, tag) => ((m.querySelector(tag) || {}).textContent || '').trim();
    tdNotices = [...doc.querySelectorAll('message')].map(m => {
      const n = {
        id: g(m, 'INCIDENT_NUMBER') || g(m, 'ID'), date: g(m, 'ANNOUNCEMENT_DATE'), statusEn: g(m, 'INCIDENT_STATUS_EN'),
        heading_tc: g(m, 'INCIDENT_HEADING_CN'), heading_en: g(m, 'INCIDENT_HEADING_EN'),
        detail_tc: g(m, 'INCIDENT_DETAIL_CN'), detail_en: g(m, 'INCIDENT_DETAIL_EN'),
        location_tc: g(m, 'LOCATION_CN'), location_en: g(m, 'LOCATION_EN'),
        district_tc: g(m, 'DISTRICT_CN'), district_en: g(m, 'DISTRICT_EN'),
        direction_tc: g(m, 'DIRECTION_CN'), direction_en: g(m, 'DIRECTION_EN'),
        near_tc: g(m, 'NEAR_LANDMARK_CN'), near_en: g(m, 'NEAR_LANDMARK_EN'),
        between_tc: g(m, 'BETWEEN_LANDMARK_CN'), between_en: g(m, 'BETWEEN_LANDMARK_EN'),
        content_tc: g(m, 'CONTENT_CN'), content_en: g(m, 'CONTENT_EN') };
      n.routes = routeTokens(n.content_tc + ' ' + n.content_en + ' ' + n.detail_tc + ' ' + n.detail_en);
      return n;
    }).filter(n => !/CLOSED|CANCEL/i.test(n.statusEn));
  } catch (error) { console.warn('TD news unavailable:', error); }
}

// What the rider cares about right now: route numbers, stop names (both
// languages, tidied), MTR stations and lines — each with the words for the
// popup ("my bus 60X", "saved stop 屯門公路轉車站", "on screen: 太子站").
function alertWatchItems() {
  const routes = new Map(), names = [], stations = new Map(), lines = new Set();
  const addName = (tc, en, label) => {
    const keys = [tidyName(plainStopName(tc)), tidyName(plainStopName(en))].filter(k => k.length >= 2);
    if (keys.length) names.push({ keys, label });
  };
  const addRoute = (r, label) => { r = String(r || '').toUpperCase(); if (r && !routes.has(r)) routes.set(r, label); };
  for (const dep of departures) {
    addRoute(dep.route, T('alertMyBus').replace('{r}', dep.route));
    addName(dep.stopName_tc, dep.stopName_en, T('alertMyBus').replace('{r}', dep.route));
  }
  // Matched on the real stop name, announced in the rider's own word for it.
  for (const f of stopFavs) addName(f.name_tc, f.name_en, T('alertSavedStop').replace('{s}', favLabel(f)));
  for (const d of stopDests) addName(destName(d), destName(d), T('alertPlace').replace('{s}', destLabel(d)));
  for (const t of trainFavs) { stations.set(t.station, T('alertTrain').replace('{s}', stationName(t.station))); lines.add(t.line); }
  if (activeMode === 'stop' && stopState.stop) {
    const group = stopGroupNow();
    for (const g of group) addName(g.name_tc, g.name_en, T('alertOnScreen').replace('{s}', stopName(g)));
    const shown = (stopState.rows || []).map(r => String(r.route).toUpperCase());
    const list = shown.length ? [...new Set(shown)] : routesServingAny(group.map(g => g.stop)).map(r => r.route);
    for (const r of list) addRoute(r, T('alertOnScreen').replace('{s}', r));
  }
  if (activeMode === 'bus' && routeStopsState && routeStopsState.context) {
    const r = String(routeStopsState.context.routeNo || '').toUpperCase();
    if (r) { addRoute(r, T('alertOnScreen').replace('{s}', r)); for (const st of routeStopsState.stops) addName(st.name_tc, st.name_en, T('alertOnScreen').replace('{s}', r)); }
  }
  if (activeMode === 'mtr' && mtrState.station) {
    stations.set(mtrState.station, T('alertOnScreen').replace('{s}', stationName(mtrState.station)));
    for (const l of whichLinesServe(mtrState.station)) lines.add(l);
  }
  return { routes, names, stations, lines };
}

// Does this notice touch any of them? Certain when it names the bus or the
// station; possible when its road or landmark is in a stop's name.
function tdHits(n, watch) {
  const hits = [], seen = new Set();
  const add = (sure, label) => { if (!seen.has(label)) { seen.add(label); hits.push({ sure, label }); } };
  for (const r of n.routes) if (watch.routes.has(r)) add(true, watch.routes.get(r));
  const places = [n.location_tc, n.near_tc, n.between_tc, n.location_en, n.near_en, n.between_en].map(tidyName).filter(x => x.length >= 2);
  for (const item of watch.names) {
    if (item.keys.some(k => places.some(pl => k.includes(pl) || (k.length >= 3 && pl.includes(k))))) add(false, item.label);
  }
  if (/港鐵|鐵路|MTR|rail/i.test(n.heading_tc + n.heading_en + n.detail_tc + n.detail_en)) {
    for (const [code, label] of watch.stations) {
      const s = mtrData && mtrData.stations[code];
      const tc = s && s[1], en = s && s[0];
      if ((tc && n.content_tc.includes(tc)) || (en && n.content_en.toLowerCase().includes(en.toLowerCase()))) add(true, label);
    }
  }
  return hits;
}

// The live flags: a line the feed says is delayed, a bus whose remark says
// trouble. Kept with the time they were first seen, so each episode shows
// its popup once and the banner stays until the flag clears.
function noteMtrDelay(line, delayed) {
  if (delayed) { if (!alertFlags.mtr[line]) alertFlags.mtr[line] = { since: Date.now() }; }
  else delete alertFlags.mtr[line];
}
function noteBusRemarks(rows, stopIds, labelFor) {
  const byRoute = new Map();
  for (const r of rows) {
    const route = String(r.route || '').toUpperCase();
    if (!route) continue;
    const rmk = (r.rmk_tc || '') + ' ' + (r.rmk_en || '');
    if (!byRoute.has(route)) byRoute.set(route, null);
    if (BUS_TROUBLE.test(rmk) && !byRoute.get(route)) byRoute.set(route, lang === 'zh' ? (r.rmk_tc || r.rmk_en) : (r.rmk_en || r.rmk_tc));
  }
  for (const stopId of stopIds) for (const [route, text] of byRoute) {
    const key = route + '|' + stopId;
    if (text) alertFlags.bus[key] = Object.assign(alertFlags.bus[key] || { since: Date.now() }, { text, label: labelFor(route) });
    else delete alertFlags.bus[key];
  }
}
// Saved trains and saved buses are not on screen, so they are asked about
// on the same 5-minute beat as the news.
async function fetchTrainDelayFlag(line, station) {
  const url = MTR_ETA_URL + '?line=' + encodeURIComponent(line) + '&sta=' + encodeURIComponent(station) + '&lang=' + (lang === 'zh' ? 'TC' : 'EN');
  const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
  if (!response.ok) throw new Error('server said ' + response.status);
  const data = await response.json();
  return data.isdelay === 'Y';
}
async function checkSavedTrains() {
  const done = new Set();
  await Promise.all(trainFavs.map(async t => {
    if (done.has(t.line)) return;
    done.add(t.line);
    try { noteMtrDelay(t.line, await fetchTrainDelayFlag(t.line, t.station)); } catch (error) {}
  }));
}
async function checkSavedBuses() {
  await Promise.all(departures.filter(d => d.stop).map(async dep => {
    try {
      const rows = await fetchPoleRows({ stop: dep.stop, name_tc: dep.stopName_tc, name_en: dep.stopName_en });
      if (Array.isArray(rows)) noteBusRemarks(rows.filter(r => String(r.route).toUpperCase() === String(dep.route).toUpperCase()), [dep.stop], route => T('alertMyBus').replace('{r}', route));
    } catch (error) {}
  }));
}

function composeAlerts() {
  const watch = alertWatchItems();
  const list = [];
  for (const n of tdNotices) {
    const hits = tdHits(n, watch);
    if (hits.length) list.push({ key: 'td:' + n.id + '@' + n.date, kind: 'td', notice: n, hits });
  }
  for (const [line, f] of Object.entries(alertFlags.mtr)) {
    if (!watch.lines.has(line)) continue;
    list.push({ key: 'mtr:' + line + '@' + f.since, kind: 'mtr', line, hits: [{ sure: true, label: railLineName(line) }] });
  }
  const onScreenStops = (activeMode === 'stop' && stopState.stop) ? new Set(stopGroupNow().map(g => g.stop)) : new Set();
  for (const [k, f] of Object.entries(alertFlags.bus)) {
    const [route, stopId] = k.split('|');
    const relevant = departures.some(d => String(d.route).toUpperCase() === route && d.stop === stopId) || onScreenStops.has(stopId);
    if (!relevant) continue;
    list.push({ key: 'bus:' + k + '@' + f.since, kind: 'bus', route, text: f.text, hits: [{ sure: true, label: f.label }] });
  }
  return list;
}
function refreshAlerts() {
  if (typeof renderWeatherBar !== 'function') return;
  currentAlerts = composeAlerts();
  renderWeatherBar();
  const fresh = currentAlerts.filter(a => !alertsSeen[a.key]);
  if (fresh.length) { showAlertSheet(fresh); rememberSeen(fresh.map(a => a.key)); }
}
async function checkAlerts() {
  await loadTdNews();
  await Promise.all([checkSavedTrains(), checkSavedBuses()]);
  refreshAlerts();
}

// "附近嘅交通狀況": the notices for the districts around the rider, as a
// line of moving text inside the weather bar. Districts by distance to their
// centres — the nearest one always, and any within 6 km. With no location,
// the whole feed. A tap opens the notices in full.
const HK_DISTRICTS = [['中西區',22.2855,114.1548],['灣仔',22.2793,114.1728],['東區',22.2841,114.2242],['南區',22.2473,114.1580],
  ['油尖旺',22.3135,114.1700],['深水埗',22.3300,114.1622],['九龍城',22.3282,114.1916],['黃大仙',22.3421,114.1930],['觀塘',22.3130,114.2260],
  ['葵青',22.3630,114.1310],['荃灣',22.3708,114.1130],['屯門',22.3910,113.9730],['元朗',22.4445,114.0220],['北區',22.4960,114.1380],
  ['大埔',22.4500,114.1640],['沙田',22.3820,114.1890],['西貢',22.3810,114.2710],['離島',22.2630,113.9430]];
function nearbyDistricts() {
  if (!herePoint) return null;
  const d = HK_DISTRICTS.map(([n, la, lo]) => ({ n, m: metresBetween(herePoint.lat, herePoint.lng, la, lo) })).sort((a, b) => a.m - b.m);
  return d.filter((x, i) => i === 0 || x.m <= 6000).map(x => x.n);
}
function nearbyNotices() {
  const ds = nearbyDistricts();
  if (!ds) return tdNotices.slice(0, 8);
  const keys = ds.map(tidyName);
  return tdNotices.filter(n => { const d = tidyName(n.district_tc); return d && keys.some(k => d.includes(k) || k.includes(d)); }).slice(0, 8);
}
function tickerChip(list) {
  const wrap = document.createElement('div');
  wrap.className = 'wxticker';
  const span = document.createElement('span');
  span.className = 'wxtickertext';
  const zh = lang === 'zh';
  const text = list.map(n => '🚧 ' + [zh ? n.heading_tc : n.heading_en, zh ? n.location_tc : n.location_en,
    zh ? n.direction_tc : n.direction_en, zh ? n.detail_tc : n.detail_en].filter(Boolean).join(' · ')).join('　｜　');
  span.textContent = sc(text);
  span.style.animationDuration = Math.max(14, Math.round(text.length * 0.3)) + 's';
  wrap.appendChild(span);
  wrap.addEventListener('click', () => showAlertSheet(list.map(n => ({ key: 'near:' + n.id, kind: 'td', notice: n,
    hits: [{ sure: null, label: sc(n.district_tc || n.location_tc || n.heading_tc || '') }] }))));
  return wrap;
}
function alertChip() {
  const button = document.createElement('button');
  button.className = 'wxalert';
  const who = [...new Set(currentAlerts.flatMap(a => a.hits.map(h => h.label)))].slice(0, 2).join(lang === 'zh' ? '、' : ', ');
  button.textContent = T('alertBanner').replace('{x}', who);
  button.addEventListener('click', () => showAlertSheet(currentAlerts));
  return button;
}
function showAlertSheet(list) {
  const sheet = document.getElementById('alertsheet'), card = document.getElementById('alertcard');
  if (!sheet || !card || !list.length) return;
  const zh = lang === 'zh';
  const item = a => {
    const who = a.hits.map(h => (h.sure === null ? T('alertNearby') : h.sure ? T('alertSure') : T('alertMaybe')).replace('{x}', esc(h.label))).join('<br>');
    if (a.kind === 'td') {
      const n = a.notice;
      const title = [zh ? n.heading_tc : n.heading_en, zh ? n.location_tc : n.location_en, zh ? n.direction_tc : n.direction_en].filter(Boolean).join(' · ');
      const body = zh ? (n.content_tc || n.detail_tc) : (n.content_en || n.detail_en);
      const when = n.date ? n.date.replace('T', ' ').slice(0, 16) : '';
      return '<div class="alertitem"><div class="alertwho">' + who + '</div><div class="alerttitle">' + esc(title) + '</div>' +
             '<div class="alerttext">' + esc(body) + '</div><div class="alertmeta">' + esc(when) + (when ? ' · ' : '') + T('alertSource') + '</div></div>';
    }
    if (a.kind === 'mtr')
      return '<div class="alertitem"><div class="alertwho">' + who + '</div><div class="alerttitle">' + esc(T('alertMtrDelay').replace('{line}', railLineName(a.line))) + '</div>' +
             '<div class="alertmeta">' + T('alertSourceMtr') + '</div></div>';
    return '<div class="alertitem"><div class="alertwho">' + who + '</div><div class="alerttitle">' + esc(a.route) + '：' + esc(a.text) + '</div>' +
           '<div class="alertmeta">' + T('alertSourceBus') + '</div></div>';
  };
  card.innerHTML = '<div class="dirhead"><b>⚠</b><span>' + T('alertTitle') + '</span></div>' + list.map(item).join('') +
                   '<button class="dircancel" data-alert-ok="1">' + T('alertOk') + '</button>';
  sheet.classList.add('open');
}
function closeAlertSheet() {
  const sheet = document.getElementById('alertsheet');
  if (sheet) sheet.classList.remove('open');
}
document.getElementById('alertsheet').addEventListener('click', event => {
  if (event.target.id === 'alertsheet' || event.target.closest('[data-alert-ok]')) closeAlertSheet();
});

// WEATHER — Hong Kong Observatory open data
// ============================================================
// Two calls: the current report (temperature per weather station, plus any
// warning headline) and the warning summary. Both are public, both are

// unreachable the bar simply does not appear.
//
// Fetched once on open and refreshed every 10 minutes, never faster: this
// app's rule is no background chatter, and the Observatory updates hourly.
const HKO_BASE = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php';
const WEATHER_REFRESH_MS = 10 * 60 * 1000;

// Where each Observatory weather station actually is, so "the weather near
// your stop" means the nearest reading rather than the city average.
//
// Keyed by BOTH names on purpose: the feed answers in whichever language it
// was asked in, so a Chinese-only table would match nothing at all in
