// Draw ALL options, but only the chosen one is bold. The others stay on the
// map as thin faded lines so the user can see what they are choosing between
// without three loud lines fighting each other.
function drawOneOption(chosenPick) {
  if (!startPoint || !endPoint) return;
  routeLayer.clearLayers();
  detailLayer.clearLayers();
  document.getElementById('stopdetail').style.display = 'none';

  // Replace the big labelled START / DESTINATION pins with small quiet dots.
  // Only ONE thing on the map should be labelled "A": the stop you board at.
  journeyLayer.clearLayers();
  L.circleMarker([startPoint.lat, startPoint.lng], { radius:7, color:'white',
    weight:3, fillColor:'#166534', fillOpacity:1 }).addTo(journeyLayer)
    .bindPopup('<b>' + T('start') + '</b><br>' + startPoint.label);
  L.circleMarker([endPoint.lat, endPoint.lng], { radius:7, color:'white',
    weight:3, fillColor:'#991b1b', fillOpacity:1 }).addTo(journeyLayer)
    .bindPopup('<b>' + T('destination') + '</b><br>' + endPoint.label);

  const latLngOf = stop => [Number(stop.lat), Number(stop.long)];
  const all = [[startPoint.lat, startPoint.lng], [endPoint.lat, endPoint.lng]];

  // --- 1. The unselected options: thin, pale, in the background ---
  for (const pick of currentPicks) {
    if (pick.number === chosenPick.number) continue;

    pick.journey.legs.forEach(leg => {
      const shape = shapeForLeg(leg);
      L.polyline(shape, { color: '#9ca3af', weight: 3, opacity: .35 }).addTo(routeLayer);
    });
  }

  // --- 2. The selected option: bold, with every station marked ---
  const journey = chosenPick.journey;
  const colour = chosenPick.colour;

  L.polyline([[startPoint.lat, startPoint.lng], latLngOf(journey.legs[0].on)],
             { color: '#166534', weight: 5, dashArray: '3 9' }).addTo(routeLayer);

  journey.legs.forEach((leg, legIndex) => {
    const shape = shapeForLeg(leg);

    // A white halo under the coloured line makes it stand out from the map.
    L.polyline(shape, { color: 'white', weight: 13, opacity: .9 }).addTo(routeLayer);
    L.polyline(shape, { color: colour, weight: 7, opacity: 1 }).addTo(routeLayer);
    all.push(...shape);

    // Every station this bus calls at, as its own dot, joined by the line.
    const stations = (leg.path && leg.path.length > 1) ? leg.path : [leg.on, leg.off];
    stations.forEach((station, index) => {
      const isEnd = index === 0 || index === stations.length - 1;
      L.circleMarker(latLngOf(station), {
        radius: isEnd ? 9 : 6,
        color: 'white', weight: isEnd ? 4 : 2,
        fillColor: colour, fillOpacity: 1
      }).addTo(routeLayer)
        .bindPopup('<b>' + station.name_en + '</b><br><small>' +
                   (station.name_tc || '') + '</small><br>Stop ' + (index + 1) +
                   ' of ' + stations.length + ' on bus ' + leg.route);
    });

    // Labels alternate left and right so consecutive markers do not cover
    // each other. Without this the START pin disappears under GET ON.
    const onSide  = legIndex % 2 === 0 ? 'right' : 'left';
    const offSide = legIndex % 2 === 0 ? 'left'  : 'right';

    const isFirst = legIndex === 0;
    const isLast  = legIndex === journey.legs.length - 1;

    addStopLabel(latLngOf(leg.on),
                 isFirst ? 'A' : (legIndex + 1),
                 T('getOn') + ' ' + leg.route,
                 stopName(leg.on), false, onSide, 900,
                 () => zoomToStopDetail(leg.on, isFirst ? startPoint : journey.legs[legIndex-1].off,
                                        leg, true));

    addStopLabel(latLngOf(leg.off),
                 isLast ? 'B' : '↓',
                 T('getOff') + ' ' + leg.route,
                 stopName(leg.off), true, offSide, 890,
                 () => zoomToStopDetail(leg.off, isLast ? endPoint : journey.legs[legIndex+1].on,
                                        leg, false));
  });

  const lastLeg = journey.legs[journey.legs.length - 1];
  L.polyline([latLngOf(lastLeg.off), [endPoint.lat, endPoint.lng]],
             { color: '#991b1b', weight: 5, dashArray: '3 9' }).addTo(routeLayer);

  map.fitBounds(L.latLngBounds(all), mapPadding());

  document.getElementById('rb-route').textContent = journey.legs.map(l => l.route).join(' → ');
  const companies = [...new Set(journey.legs.map(l => coName(l.co)))];
  document.getElementById('rb-company').textContent =
    companies.join(' + ') + ' · ' + T('option') + ' ' + chosenPick.number;
  document.getElementById('rb-from').textContent = stopName(journey.legs[0].on);
  document.getElementById('rb-to').textContent = stopName(lastLeg.off);
  // The fare belongs here too: this banner is what stays on screen while
  // the rider walks to the stop, so it should answer "how much" as well.
  const bannerFare = journeyFareText(journey);
  document.getElementById('rb-note').textContent =
    T('aboutMin').replace('{n}', journey.total) +
    (bannerFare === '\u2014' ? '' : '  \u00b7  ' + bannerFare);
  const banner = document.getElementById('routebanner');
  banner.classList.remove('ctb');
  banner.style.display = 'block';
  reserveRoomForBanner();
}

// The line for one bus leg. We prefer whichever version has MORE points,
// because more points means a line that bends with the road instead of
// cutting straight across the map.
// One stop label. "side" decides whether the text sits to the left or the
// right of the dot, which is how we stop labels overlapping each other.
function addStopLabel(latlng, dotText, title, name, finish, side, z, onClick) {
  const wrap = '<div class="endwrap' + (finish ? ' finish' : '') +
               (side === 'left' ? ' flip' : '') + '">' +
               '<div class="enddot">' + dotText + '</div>' +
               '<div class="endtext">' + title + '<br>' + name + '</div></div>';

  const marker = L.marker(latlng, { zIndexOffset: z,
    icon: L.divIcon({ className: '', iconSize: null,
      iconAnchor: side === 'left' ? [258, 22] : [22, 22], html: wrap })
  }).addTo(routeLayer);

  if (onClick) marker.on('click', onClick);
  return marker;
}

// ZOOM IN ON ONE END OF THE JOURNEY
// Standing at a stop, the question is not "where is this on the map" but
// "which side of the street, and how do I walk there". So we zoom close
// enough to see the pavement and draw the walking line.
function zoomToStopDetail(stop, fromPoint, leg, isBoarding) {
  const stopLatLng = [Number(stop.lat), Number(stop.long)];
  const fromLatLng = [fromPoint.lat, fromPoint.lng];

  detailLayer.clearLayers();
  const colour = isBoarding ? '#166534' : '#991b1b';

  L.polyline([fromLatLng, stopLatLng],
             { color: colour, weight: 5, dashArray: '4 8' }).addTo(detailLayer);

  // A BIG ARROW sitting ABOVE the stop and pointing down at it. The exact
  // spot stays completely uncovered — which is the whole point, since the
  // rider is trying to see which side of the road to stand on.
  L.marker(stopLatLng, { zIndexOffset: 1200, interactive: false,
    icon: L.divIcon({ className: '', iconSize: null, iconAnchor: [26, 92],
      html: '<div class="bigarrow" style="color:' + colour + '">&#9660;</div>' })
  }).addTo(detailLayer);

  L.circleMarker(stopLatLng, { radius: 26, color: colour, weight: 4,
    fill: false, dashArray: '5 6' }).addTo(detailLayer);
  L.circleMarker(stopLatLng, { radius: 8, color: 'white', weight: 3,
    fillColor: colour, fillOpacity: 1 }).addTo(detailLayer);

  const walk = walkingEstimate(metresBetween(fromPoint.lat, fromPoint.lng,
                                             Number(stop.lat), Number(stop.long)));

  // The details go in a FIXED panel at the top-right. Being fixed, it can
  // never drift over the stop no matter how the map moves.
  const panel = document.getElementById('stopdetail');
  panel.className = isBoarding ? 'boarding' : 'alighting';
  panel.style.display = 'block';
  panel.innerHTML =
    '<button id="sd-close">&#10005;</button>' +
    '<div class="sd-head">' +
      (isBoarding ? T('boardHereDetail').replace('{route}', leg.route)
                  : T('alightHereDetail').replace('{route}', leg.route)) + '</div>' +
    '<div class="sd-stop">' + stopName(stop) + '</div>' +
    '<div class="sd-sub">' + (lang === 'zh' ? stop.name_en : (stop.name_tc || '')) + '</div>' +
    '<div class="sd-line">' +
      (isBoarding ? T('towards') + ' <b>' + stopName(leg.off) + '</b>'
                  : T('thenWalkTo') + ' <b>' + endPoint.label + '</b>') + '</div>' +
    '<div class="sd-walk">&#128694; ' + walk.minutes + T('min') + ' &middot; ' + walk.metres + ' m</div>' +
    '<div class="sd-note">' + T('checkSide') + '</div>';

  document.getElementById('sd-close').addEventListener('click', () => {
    panel.style.display = 'none';
    detailLayer.clearLayers();
  });

  // Frame both points clear of the left panel, the right panel and the
  // bottom banner. The map's centre is not the screen's centre.
  map.fitBounds(L.latLngBounds([stopLatLng, fromLatLng]), {
    ...mapPadding(),
    maxZoom: 18
  });
}

function shapeForLeg(leg) {
  const latLngOf = stop => [Number(stop.lat), Number(stop.long)];
  const viaStops = (leg.path && leg.path.length > 1)
    ? leg.path.map(latLngOf) : [latLngOf(leg.on), latLngOf(leg.off)];

  const official = officialShape(leg.route, leg.on, leg.off);
  if (official && official.length > viaStops.length) { shapeHits++; return official; }
  shapeMisses++;
  return viaStops;
}




// When is the next bus for this option? This is the question someone
// standing at the stop actually has, so it goes on the card itself.
// MTR's own real-time feed. Documented at opendata.mtr.com.hk (Next Train API
// v1.7) and served from the same government real-time platform as the bus
// ETAs. It answers per LINE and STATION, not per stop, which is why it needs
// its own path rather than joining the bus loop above.
const MTR_ETA_URL = 'https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php';

// The feed splits trains into UP and DOWN. Rather than guess which is which,
// look at where the trains are headed: the direction whose destination lies
// beyond our alighting station, along the line's own running order, is ours.
function railDirectionKey(lineCode, fromCode, toCode, block) {
  const variants = (mtrData.lines || {})[lineCode] || [];
  const order = variants.find(v => v.includes(fromCode) && v.includes(toCode)) || variants[0] || [];
  const from = order.indexOf(fromCode), to = order.indexOf(toCode);
  if (from < 0 || to < 0) return null;
  const forward = to > from;

  for (const key of ['UP', 'DOWN']) {
    const trains = block[key];
    if (!Array.isArray(trains) || trains.length === 0) continue;
    const dest = order.indexOf(trains[0].dest);
    if (dest < 0 || dest === from) continue;   // a train terminating here takes nobody anywhere
    if (forward ? dest > from : dest < from) return key;
  }
  return null;
}

async function loadTrainTimes(pick, line) {
  const leg = pick.journey.legs[0];
  const tile = document.getElementById('ceta-' + pick.number);
  const setBoth = (text, cssClass) => {
    line.className = cssClass || 'jnext';
    line.textContent = text;
    if (tile) tile.textContent = text;
  };

  try {
    const url = MTR_ETA_URL + '?line=' + encodeURIComponent(leg.lineCode) +
                '&sta=' + encodeURIComponent(leg.on.stop) +
                '&lang=' + (lang === 'zh' ? 'TC' : 'EN');
    const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const data = await response.json();

    // status 0 means a service alert or a suspended station. That is real news
    // for a rider, so show MTR's own words rather than a countdown.
    if (data.status === 0) return setBoth(data.message || T('trainAlert'), 'jnext warn');

    const block = (data.data || {})[leg.lineCode + '-' + leg.on.stop];
    if (!block) throw new Error('no block for this station');

    const key = railDirectionKey(leg.lineCode, leg.on.stop, leg.off.stop, block);
    const trains = (key && block[key] ? block[key] : []).filter(t => t.valid !== 'N');
    if (trains.length === 0) throw new Error('no trains listed');

    const minutes = trains.slice(0, 3)
      .map(t => usableWait(t.ttnt))
      .filter(n => n !== null)
      .map(n => n === 0 ? T('due') : n + ' ' + T('min'));
    if (minutes.length === 0) throw new Error('no usable times');

    setBoth(T('nextTrain') + ' ' + minutes.join(', '));
  } catch (error) {
    // The feed is down, blocked, or this station is not covered. Say the one
    // thing that stays true about the MTR rather than showing an error.
    console.warn('Live train times unavailable:', error);
    setBoth(T('trainsFrequent'));
    if (tile) tile.textContent = T('frequentShort');
  }
}

async function loadNextBus(pick) {
  const line = document.getElementById('next-' + pick.number);
  if (!line) return;

  const leg = pick.journey.legs[0];

  // Trains have their own feed, keyed by line and station.
  if (leg.co === 'mtr') {
    line.className = 'jnext';
    line.textContent = T('trainsFrequent');
    const tile = document.getElementById('ceta-' + pick.number);
    if (tile) tile.textContent = T('frequentShort');
    loadTrainTimes(pick, line);
    return;
  }

  // WHICH BUSES ACTUALLY HELP FROM THIS STOP?
  // Standing at a stop, you do not care about "the 58M" — you care about the
  // next bus that gets you where you are going. Several routes from the same
  // stop may do that, so we show them all, soonest first.
  const usefulRoutes = new Set([leg.route]);
  for (const other of (currentPicks || [])) {
    const otherLeg = other.journey.legs[0];
    if (otherLeg.on.stop === leg.on.stop) usefulRoutes.add(otherLeg.route);
  }

  try {
    // Every operator publishes arrivals differently. KMB asks for the stop
    // alone; Citybus and NLB want stop AND route. Green minibus uses a
    // separate service altogether, which we do not have wired up — so rather
    // than show a wrong time, we say plainly that live times are unavailable.
    if (leg.co === 'gmb') {
      line.className = 'jnext waiting';
      line.textContent = T('noLiveMinibus');
      const gmbTile = document.getElementById('ceta-' + pick.number);
      if (gmbTile) gmbTile.textContent = '—';
      return;
    }

    let url;
    if (leg.co === 'ctb')      url = CTB_BASE + '/eta/CTB/' + leg.on.stop + '/' + encodeURIComponent(leg.route);
    else if (leg.co === 'nlb') url = null;              // NLB needs its own API too
    else                       url = 'https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + leg.on.stop;

    if (!url) {
      line.className = 'jnext waiting';
      line.textContent = T('liveUnavailable') + ' ' + leg.route;
      const noTile = document.getElementById('ceta-' + pick.number);
      if (noTile) noTile.textContent = '—';
      return;
    }

    const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);

    const entries = (await response.json()).data || [];
    const now = Date.now();

    const arrivals = entries
      .filter(entry => usefulRoutes.has(entry.route) && entry.eta)
      .map(entry => ({
        route: entry.route,
        minutes: Math.round((new Date(entry.eta).getTime() - now) / 60000)
      }))
      .filter(arrival => arrival.minutes >= 0)
      .sort((a, b) => a.minutes - b.minutes)
      .slice(0, 4);

    if (arrivals.length === 0) {
      line.className = 'jnext waiting';
      line.textContent = T('noBusDue');
      const emptyTile = document.getElementById('ceta-' + pick.number);
      if (emptyTile) emptyTile.textContent = '—';
      return;
    }

    const soonest = arrivals[0];
    const clock = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });

    const tileEta = document.getElementById('ceta-' + pick.number);
    if (tileEta) {
      tileEta.textContent = soonest.route + ' ' +
        (soonest.minutes === 0 ? T('dueNow') : soonest.minutes + T('min'));
    }

    // If the soonest useful bus is NOT this card's route, say so plainly —
    // that is exactly the information someone at the stop needs.
    const differentRoute = soonest.route !== leg.route;

    line.className = 'jnext';
    line.innerHTML =
      (differentRoute
        ? '<div style="font-size:0.94rem;color:#fde68a;font-weight:700;margin-bottom:4px">' +
          T('sooner') + '</div>'
        : '') +
      T('next') + ' ' + soonest.route + ' ' + T('inTime') +
      ' <span class="mins">' +
      (soonest.minutes === 0 ? T('dueNow') : soonest.minutes + T('min')) + '</span>' +
      (arrivals.length > 1
        ? '<div style="font-size:1rem;font-weight:600;margin-top:5px">' + T('then') + ' ' +
          arrivals.slice(1).map(a => a.route + ' ' + a.minutes + T('min')).join(' · ') + '</div>'
        : '') +
      '<div style="font-size:0.94rem;font-weight:600;opacity:.8;margin-top:4px">' +
        T('checked') + ' ' + clock + '</div>';
  } catch (error) {
    line.className = 'jnext waiting';
    line.textContent = T('liveUnavailable') + ' ' + leg.route;
  }
}


// ============================================================
// 7. BROWSABLE BUS STOPS
// ============================================================
// While a journey is on screen, the browsable stop dots are just clutter —
// the user has already chosen. They come back when the journey is cleared.
let journeyMode = false;

function drawStops() {
  stopLayer.clearLayers();
  if (journeyMode) return;
  if (allStops.length === 0 || map.getZoom() < 15) return;

  // Only the stops on screen, then merged so one physical stop is one dot.
  const area = map.getBounds();
  const visible = allStops.filter(stop => !stop.isStation &&
    area.contains([Number(stop.lat), Number(stop.long)]));

  for (const group of mergeNearbyStops(visible)) {
    const marker = L.circleMarker([group.lat, group.lng], {
      radius:9, color:'#991b1b', weight:3, fillColor:'#ef4444', fillOpacity:0.9
    }).addTo(stopLayer);

    marker.bindPopup(stopHeader(group) + '<div class="eta-note">' + T('checkingBus') + '</div>');

    // A merged dot shows arrivals from EVERY stop code at that spot —
    // which is what the rider standing there actually wants to know.
    marker.on('popupopen', () => loadMergedArrivals(group, marker));
  }
}
map.on('moveend', drawStops);

window.addEventListener('resize', () => {
  clearTimeout(window._resizeTimer);
  window._resizeTimer = setTimeout(() => { map.invalidateSize(); drawStops(); }, 200);
});


// ============================================================
// 8. ARRIVAL TIMES
// ============================================================
function stopHeader(stop) {
  const main = plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en);
  const sub  = plainStopName(lang === 'zh' ? stop.name_en : (stop.name_tc || ''));
  return '<b>' + main + '</b><br><small>' + sub + '</small><hr style="margin:6px 0">';
}

// Fetch arrivals for every stop code merged into one dot, then show them
// together as a single list, sorted soonest first.
async function loadMergedArrivals(group, marker) {
  try {
    const results = await Promise.all(group.members.map(async member => {
      try {
        const response = await fetch(
          'https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + member.stop,
          { signal: AbortSignal.timeout(10000) });
        if (!response.ok) return [];
        const rows = (await response.json()).data || [];
        // The feed does not say which stop it answered for, and a saved
        // departure is meaningless without one. Stamp it on here.
        return rows.map(row => Object.assign({}, row,
          { stop: member.stop, stopName_en: member.name_en, stopName_tc: member.name_tc }));
      } catch (error) { return []; }
    }));

    const clock = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    marker.setPopupContent(stopHeader(group) + formatArrivals(results.flat()) +
      '<div class="eta-note" style="margin-top:6px">' + T('checked') + ' ' + clock + '</div>');
  } catch (error) {
    marker.setPopupContent(stopHeader(group) +
      '<div class="eta-note">' + T('liveUnavailable') + '</div>');
  }
}

async function loadKmbArrivals(stop, marker) {
  try {
    const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + stop.stop,
                                 { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const json = await response.json();
    const rows = (json.data || []).map(row => Object.assign({}, row,
      { stop: stop.stop, stopName_en: stop.name_en, stopName_tc: stop.name_tc }));
    const clock = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    marker.setPopupContent(stopHeader(stop) + formatArrivals(rows) +
      '<div class="eta-note" style="margin-top:6px">' + T('updatedAt').replace('{t}', clock) + '</div>');
  } catch (error) {
    marker.setPopupContent(stopHeader(stop) +
      '<div class="eta-note">' + T('couldNotLoadArrivals') + '</div>');
  }
}

function formatArrivals(entries, opts) {
  if (!entries || entries.length === 0) return '<div class="eta-note">' + T('noBusesListed') + '</div>';
  const now = Date.now(), byRoute = new Map();

  for (const entry of entries) {
    if (!entry.eta) continue;
    const minutes = Math.round((new Date(entry.eta).getTime() - now) / 60000);
    if (minutes < 0) continue;
    const label = entry.route + '|' + (entry.dest_en || '');
    // Keep one whole entry per route: it carries the direction, service type
    // and seq we need to price the ride from THIS stop.
    if (!byRoute.has(label)) byRoute.set(label, { minutes: [], sample: entry });
    const bucket = byRoute.get(label).minutes;
    if (!bucket.includes(minutes)) bucket.push(minutes);   // two bays, one bus: one time
  }
  if (byRoute.size === 0) return '<div class="eta-note">' + T('noBusDue') + '</div>';
  for (const group of byRoute.values()) group.minutes.sort((a, b) => a - b);

  // Soonest first: by arrival at the place when one is set, otherwise by the
  // next bus. A bus due in 18 minutes that arrives last belongs last.
  const items = [];
  for (const [label, group] of byRoute) {
    const route = label.split('|')[0];
    const sample = group.sample;
    // In the reader's language. The row was keyed on dest_en to keep one row
    // per direction, and then showed that same English name to everyone.
    const dest = esc(lang === 'zh' ? (sample.dest_tc || sample.dest_en || '')
                                   : (sample.dest_en || sample.dest_tc || ''));
    const fare = stopFare(sample.route, sample.dir, sample.service_type, sample.seq, sample.co);
    const fareTag = fare === null ? ''
      : '<span class="eta-fare">' + fareText(fare) + '</span>';

    // A star per row. This row already IS a route, a direction and a stop,
    // so one tap saves all three — no follow-up questions, which is the
    // whole reason a saved departure beats a saved route number.
    const saved = isSavedDeparture(sample.route, sample.dir, sample.stop);
    const star = sample.stop
      ? '<button class="eta-star' + (saved ? ' on' : '') + '"' +
        ' data-star="1"' +
        ' data-route="' + sample.route + '"' +
        ' data-dir="' + (sample.dir || '') + '"' +
        ' data-type="' + (sample.service_type || '1') + '"' +
        ' data-co="' + (sample.co || 'KMB') + '"' +
        ' data-stop="' + sample.stop + '"' +
        ' data-sen="' + esc(sample.stopName_en || '') + '"' +
        ' data-stc="' + esc(sample.stopName_tc || '') + '"' +
        ' data-den="' + esc(sample.dest_en || '') + '"' +
        ' data-dtc="' + esc(sample.dest_tc || '') + '"' +
        ' title="' + T('saveDeparture') + '">' + (saved ? '★' : '☆') + '</button>'
      : '';

    // WHICH POLE THIS BUS LEAVES FROM.
    // Only when the screen is showing several. A station like 太子站,旺角花墟
    // is eleven poles on both sides of Prince Edward Road, and merging them
    // into one card is only honest if the row then says where to stand. The
    // facing comes from the same measurement the search cards use.
    let poleTag = '';
    if (opts && opts.multiPole && sample.stop) {
      const at = findStopById(sample.stop);
      const code = at ? poleCodeOf(at) : '';
      const face = poleFacing(sample.stop);
      if (code || face >= 0) {
        poleTag = '<span class="eta-pole">' + (code ? esc(code) : '') +
                  (face >= 0 ? (code ? ' ' : '') + esc(T(FACE_KEYS[face])) : '') + '</span>';
      }
    }

    // With a place set on the 車站 tab: how many stops, and roughly when the
    // first bus gets there. MINUTES_PER_STOP is the planner's own rough figure.
    let arriveTag = '';
    const stopsAway = opts && opts.arrive ? opts.arrive.get(routeKeyForRow(sample)) : undefined;
    if (stopsAway !== undefined) {
      const at = new Date(now + (group.minutes[0] + stopsAway * MINUTES_PER_STOP) * 60000);
      const hhmm = at.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
      arriveTag = '<span class="eta-arrive">🏁 ' + T('etaArrive').replace('{n}', stopsAway).replace('{t}', hhmm).replace('{d}', esc(opts.destName || '')) + '</span>';
    }
    const sortKey = stopsAway !== undefined ? group.minutes[0] + stopsAway * MINUTES_PER_STOP : group.minutes[0];
    items.push({ sortKey, html:
      '<div class="eta-row">' + star + '<span class="eta-route">' + route + '</span>' +
      '<span class="eta-dest">' + dest + '</span>' + fareTag + poleTag +
      '<span class="eta-times">' +
      group.minutes.slice(0,3).map(m => m === 0 ? T('due') : m + T('min')).join(', ') +
      '</span>' + arriveTag + '</div>' });
  }
  items.sort((a, b) => a.sortKey - b.sortKey);
  return items.map(x => x.html).join('');
}


// ============================================================
// 9. ROUTE LOOKUP
// ============================================================
const routeInput = document.getElementById('route-text');
const routeList  = document.getElementById('route-results');

// Step 1: type a route number, see which routes match — one row per NUMBER,
// not per direction. Choosing the direction is a separate, clearer step.
// Typing a route number is the signal that the user is looking up a bus, not
// planning a trip. The panel switches over on the first character and stays
// there until the ✕ — a mode that turned itself off again mid-task would be
// worse than one that never turned on.
function enterRouteMode() {
  const panel = document.getElementById('panel');
  panel.classList.remove('favmode', 'setmode', 'mtrmode', 'stopmode');
  document.getElementById('favview').style.display = 'none';
  document.getElementById('setview').style.display = 'none';
  document.getElementById('mtrview').style.display = 'none';
  document.getElementById('stopview').style.display = 'none';
  panel.classList.add('routemode');
  // Looking up a bus belongs under the bus tab. Leaving the old section
  // highlighted would point at a screen that is no longer on display.
  if (activeMode !== 'bus') { activeMode = 'bus'; paintBottomBar(); }
  panel.scrollTop = 0;
}

function leaveRouteMode() {
  const panel = document.getElementById('panel');
  panel.classList.remove('routemode');
  routeInput.value = '';
  routeList.innerHTML = '';
  clearRouteStops();
  routeLayer.clearLayers();
  document.getElementById('routebanner').style.display = 'none';
  journeyMode = false;
  drawStops();
  panel.scrollTop = 0;
  // Route lookup used to BE a tab, so closing it could just leave the panel
  // as it was. It is now a mode of the 巴士 tab, and leaving it with every
  // view hidden would show a blank panel.
  showMode('stop');
}

document.getElementById('route-exit').addEventListener('click', leaveRouteMode);

// ---- 📍 WHICH OF THESE STOPS AM I AT? ----
// The list marks itself when a fix is already to hand, but on a cold open
// there is none, and scrolling thirty-four stops hunting for a name you half
// remember is exactly the job a phone should do.
function markNearestOnRoute() {
  if (!routeStopsState) { status.textContent = T('rsPickRouteFirst'); return; }
  withHere(here => {
    if (!routeStopsState) return;
    const near = nearestRouteStop(here);
    if (!near) { status.textContent = T('stopNoneNear'); return; }
    routeStopsState.boardAt = near.index;
    routeStopsState.alightAt = null;            // a new boarding stop ends the old ride
    routeStopsState.autoBoard = true;
    routeStopsState.autoMetres = near.metres;
    paintStopCounts();
    syncRideWatch();
    scrollToMarkedStop();
    paintWalkLink();
    const stop = routeStopsState.stops[near.index];
    status.textContent = T('rsNearestFound')
      .replace('{s}', plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en))
      .replace('{m}', Math.round(near.metres));
  });
}
document.getElementById('route-here').addEventListener('click', markNearestOnRoute);

// ---- ➤ WALK ME THERE ----
// A real link with a real href, not a scripted window.open: the open has to
// happen on the tap itself, and a fix that arrives a second later would be
// blocked as a popup. So the arrow stays dim until 📍 has found the stop,
// and then it is simply a link the rider taps.
function walkUrl(lat, lng) {
  const onApple = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return onApple
    ? 'https://maps.apple.com/?daddr=' + lat + ',' + lng + '&dirflg=w'
    : 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng + '&travelmode=walking';
}
function paintWalkLink() {
  const link = document.getElementById('route-walk');
  if (!link) return;
  const st = routeStopsState;
  const stop = st && st.boardAt !== null ? st.stops[st.boardAt] : null;
  const lat = stop ? Number(stop.lat) : NaN, lng = stop ? Number(stop.long) : NaN;
  if (!isFinite(lat) || !isFinite(lng)) {
    link.removeAttribute('href');
    link.classList.add('off');
    link.title = T('rsWalkNeedStop');
    return;
  }
  link.href = walkUrl(lat, lng);
  link.classList.remove('off');
  link.title = T('rsWalkTo').replace('{s}', plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en));
}

routeInput.addEventListener('input', () => {
  const typed = routeInput.value.trim().toUpperCase();
  routeList.innerHTML = '';
  if (!typed) return;
  enterRouteMode();

  // Group KMB entries by route number so "60M" appears once, not four times.
  const kmbByNumber = new Map();
  for (const route of allRoutes.filter(r => r.route.toUpperCase().startsWith(typed))) {
    if (!kmbByNumber.has(route.route)) kmbByNumber.set(route.route, []);
    kmbByNumber.get(route.route).push(route);
  }

  const kmbRows = [...kmbByNumber].slice(0, 6);
  const ctbRows = ctbRoutes.filter(r => r.route.toUpperCase().startsWith(typed)).slice(0, 4);

  // Typed the whole number and it is the only match: no list to tap through,
  // straight to "which way?". "60X" is one tap fewer; "6" still shows 6, 6C…
  if (kmbRows.length + ctbRows.length === 1) {
    const only = kmbRows[0] ? { no: kmbRows[0][0], variants: kmbRows[0][1], co: 'KMB' } : { no: ctbRows[0].route, variants: [ctbRows[0]], co: 'CITYBUS' };
    if (only.no.toUpperCase() === typed) { showDirections(only.no, only.variants, only.co); return; }
  }

  for (const [routeNo, variants] of kmbRows) {
    const n = kmbDirections(variants).main.length;
    const item = document.createElement('li');
    item.innerHTML = '<span class="badge badge-kmb">KMB</span>' +
                     '<span class="routeno">' + routeNo + '</span>' +
                     '<span style="color:#4b5563">' + n + ' ' + (n > 1 ? T('directions') : T('direction')) + '</span>';
    item.addEventListener('click', () => showDirections(routeNo, variants, 'KMB'));
    routeList.appendChild(item);
  }
  for (const route of ctbRows) {
    const item = document.createElement('li');
    item.innerHTML = '<span class="badge badge-ctb">CITYBUS</span>' +
                     '<span class="routeno">' + route.route + '</span>' +
                     '<span style="color:#4b5563">2 ' + T('directions') + '</span>';
    item.addEventListener('click', () => showDirections(route.route, [route], 'CITYBUS'));
    routeList.appendChild(item);
  }

  if (!routeList.children.length)
    routeList.innerHTML = '<li>' + T(allRoutes.length === 0 && ctbRoutes.length === 0 ? 'dataLoading' : 'noMatch') + '</li>';
});

// Step 2: which way is the bus going? One sheet, one big button per
// direction, then the stop list. "Outbound" means nothing to most riders, so
// each button says 開往 <terminus>. Peak-hour and special routings are folded
// away behind one line — they are real, but they are not the question.
function kmbDirections(variants) {
  const byBound = new Map();
  for (const v of variants) { if (!byBound.has(v.bound)) byBound.set(v.bound, []); byBound.get(v.bound).push(v); }
  const main = [], special = [];
  for (const list of byBound.values()) {
    const normal = list.find(v => String(v.service_type) === '1') || list[0];
    main.push(normal);
    for (const v of list) if (v !== normal) special.push(v);
  }
  return { main, special };
}

function showDirections(routeNo, variants, company) {
  routeList.innerHTML = '';
  routeInput.blur();                     // keyboard down before the sheet comes up

  let choices = [];                      // { from, to, note, go }
  let extras  = [];
  if (company === 'CITYBUS') {
    const route = variants[0];
    for (const direction of ['outbound', 'inbound']) {
      const from = direction === 'outbound' ? endName(route, 'orig') : endName(route, 'dest');
      const to   = direction === 'outbound' ? endName(route, 'dest') : endName(route, 'orig');
      choices.push({ from, to, note: null, go: () => showCtbRoute(route, direction, from, to) });
    }
  } else {
    const { main, special } = kmbDirections(variants);
    choices = main.map(r => ({ from: endName(r, 'orig'), to: endName(r, 'dest'), note: null, go: () => showKmbRoute(r) }));
    extras  = special.map(r => ({ from: endName(r, 'orig'), to: endName(r, 'dest'), note: T('special'), go: () => showKmbRoute(r) }));
  }

  // TAKING OVER THE PANEL IS THIS FUNCTION'S JOB, not the caller's.
  // It used to be done by the route box's own typing handler, which called
  // enterRouteMode() on every keystroke — so a route opened from anywhere
  // else drew its stop list UNDERNEATH the picker instead of replacing it.
  const goRoute = choice => { goToRouteMode(routeNo); choice.go(); };

  // A circular route has one way to go: no question to ask.
  if (choices.length === 1 && !extras.length) { goRoute(choices[0]); return; }

  const sheet = document.getElementById('dirsheet');
  const card  = document.getElementById('dircard');
  const button = (c, i, cls) =>
    '<button class="dirbtn' + (cls || '') + '" data-dir="' + i + '">' +
    '<b>' + T('towards') + ' <i>' + esc(c.to) + '</i></b>' +
    '<small>' + T('from') + ' ' + esc(c.from) + (c.note ? ' · <span class="dirnote">⚠ ' + esc(c.note) + '</span>' : '') + '</small></button>';
  const all = choices.concat(extras);
  card.innerHTML = '<div class="dirhead"><b>' + esc(routeNo) + '</b><span>' + T('dirTitle') + '</span></div>' +
    choices.map((c, i) => button(c, i)).join('') +
    (extras.length ? '<button class="dirmore" data-more="1">' + T('dirMore').replace('{n}', extras.length) + '</button>' +
      '<div id="dirextras" hidden>' + extras.map((c, i) => button(c, choices.length + i)).join('') + '</div>' : '') +
    '<button class="dircancel" data-cancel="1">' + T('cancel') + '</button>';
  card.onclick = event => {
    const more = event.target.closest('[data-more]');
    if (more) {
      const box = document.getElementById('dirextras');
      box.hidden = !box.hidden;
      more.textContent = T(box.hidden ? 'dirMore' : 'dirLess').replace('{n}', extras.length);
      return;
    }
    if (event.target.closest('[data-cancel]')) { closeDirections(); return; }
    const btn = event.target.closest('[data-dir]');
    if (!btn) return;
    closeDirections();
    goRoute(all[Number(btn.dataset.dir)]);
  };
  sheet.classList.add('open');
}
function closeDirections() {
  const sheet = document.getElementById('dirsheet');
  sheet.classList.remove('open');
  document.getElementById('dircard').innerHTML = '';
}
document.getElementById('dirsheet').addEventListener('click', event => { if (event.target.id === 'dirsheet') closeDirections(); });
document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeDirections(); closeAlertSheet(); } });

// Terminus names in the reader's own language. The feeds carry both, so
// showing the English one to a Chinese reader is a choice, not a limit.
function endName(record, which) {
  const zh = which === 'orig' ? record.orig_tc : record.dest_tc;
  const en = which === 'orig' ? record.orig_en : record.dest_en;
  return plainStopName(lang === 'zh' ? (zh || en) : (en || zh));
}


async function showKmbRoute(route) {
  routeList.innerHTML = '';
  routeLayer.clearLayers();
  const dir = route.bound === 'O' ? 'outbound' : 'inbound';
  const key = 'kmb-rs-' + route.route + '-' + dir + '-' + route.service_type;

  try {
    let refs = await cacheGet(key);
    if (!refs) {
      const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' +
        encodeURIComponent(route.route) + '/' + dir + '/' + encodeURIComponent(route.service_type),
        { signal: AbortSignal.timeout(10000) });
      if (!response.ok) throw new Error('server said ' + response.status);
      refs = (await response.json()).data;
      cachePut(key, refs);
    }

    const byId = new Map(allStops.map(s => [s.stop, s]));
    const stops = refs.map(r => byId.get(r.stop)).filter(Boolean);
    paintRoute(route.route, 'KMB', endName(route, 'orig'), endName(route, 'dest'),
               stops, '#3b82f6', '#1e3a8a', null,
               // The ETA feed reports direction as O/I, so the stop list is
               // given the same letter the route carries rather than the
               // "outbound"/"inbound" word used in the route-stop URL.
               { co:'KMB', dir:route.bound, serviceType:route.service_type,
                 destEn:route.dest_en, destTc:route.dest_tc });
  } catch (error) {
    status.textContent = T('couldNotLoadRoute').replace('{r}', route.route);
  }
}

async function showCtbRoute(route, dir, from, to) {
  routeList.innerHTML = '';
  routeLayer.clearLayers();
  status.textContent = T('loadingRoute').replace('{r}', route.route);
  const key = 'ctb-rs-' + route.route + '-' + dir;

  try {
    let ids = await cacheGet(key);
    if (!ids) {
      const response = await fetch(CTB_BASE + '/route-stop/CTB/' +
        encodeURIComponent(route.route) + '/' + dir, { signal: AbortSignal.timeout(10000) });
      if (!response.ok) throw new Error('server said ' + response.status);
      ids = (await response.json()).data.map(e => e.stop);
      cachePut(key, ids);
    }

    // Citybus has no bulk stop download, so each stop is one request.
    // We fetch five at a time and cache hard, rather than firing 40 at once.
    const stops = [];
    for (let i = 0; i < ids.length; i += 5) {
      const found = await Promise.all(ids.slice(i, i+5).map(getCtbStop));
      stops.push(...found.filter(Boolean));
    }
    paintRoute(route.route, 'Citybus', from, to, stops, '#fb923c', '#9a3412', route.route,
               { co:'CTB', dir: dir === 'outbound' ? 'O' : 'I', serviceType:null,
                 destEn:to, destTc:to });
  } catch (error) {
    status.textContent = T('couldNotLoadRoute').replace('{r}', route.route);
  }
}

async function getCtbStop(stopId) {
  const key = 'ctb-stop-' + stopId;
  const cached = await cacheGet(key);
  if (cached) return cached;
  try {
    const response = await fetch(CTB_BASE + '/stop/' + stopId, { signal: AbortSignal.timeout(10000) });
    if (!response.ok) return null;
    const stop = (await response.json()).data;
    if (!stop || stop.lat === undefined) return null;

// ============================================================
// INSTALLING, AND WORKING WITHOUT A CONNECTION
// ============================================================
// Three separate things live here, and they are together because they are
// all about the app as an app rather than about buses:
//
//   1. Registering sw.js, which is what stores the page so it opens with no
//      signal. What it will and will not store — and why the map is blank
//      offline — is written at the top of that file.
//   2. Saying plainly when there is no connection. This app is used at bus
//      stops, in MTR tunnels and inside buildings, so no connection is a
//      normal state, not an error. Half the app still works; the rider is
//      told which half.
//   3. The "add to home screen" button in SETTINGS. Chrome offers this
//      itself, buried in a three-dot menu — not a place to send someone who
//      is new to phones. Caught here and offered as a plain button instead.
//
// WHY THE UPDATE IS A BUTTON AND NOT AUTOMATIC
// A service worker can replace the app the moment a new one is ready. On a
// phone that could wipe the journey someone is halfway through reading, at
// the stop, in the rain. So a new version waits, says so on the top bar, and
// takes over only when it is tapped.

// the early-read state near the top, because the top bar and SETTINGS can
// both ask for them before this point in the file has run.

// exactly what "standalone" means. Two spellings: the standard one, and the
// one iOS has used since before the standard existed.

function offlineChip() {
  const chip = document.createElement('span');

  chip.textContent = T('offlineChip');
  chip.title = T('offlineWhat');
  return chip;
}

function updateChip() {
  const button = document.createElement('button');
  button.className = 'wxupdate';
  button.textContent = T('updateReady');
  button.addEventListener('click', () => {
    if (!updateWaiting || !updateWaiting.waiting) return;
    updateAsked = true;
    button.disabled = true;
    // The new worker takes over, and controllerchange below reloads us into
    // it. Reloading here instead would show the OLD page one last time.
    updateWaiting.waiting.postMessage('SKIP_WAITING');
  });
  return button;
}

// Connection state. Both events redraw the top bar, so the notice appears and
// disappears on its own without the rider having to reload anything.
window.addEventListener('offline', () => {
  renderWeatherBar();
  status.textContent = T('offlineWhat');
});

window.addEventListener('online', () => {
  renderWeatherBar();
  status.textContent = T('backOnline');

  loadWeather();
});

// Chrome fires this when the app qualifies for installing. Answering it with
// preventDefault() takes the browser's own banner away, which is only worth
// doing because we put a plainer button in SETTINGS in its place.
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  installPrompt = event;
  if (activeMode === 'set') renderSettings();
});

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  if (activeMode === 'set') renderSettings();
});

// REGISTERING THE WORKER
// Only over http(s): opened straight from the file system there is no origin
// to attach a worker to, and calling this there throws. Deferred to the load
// event so that storing the app never competes for the connection with the
// route data the rider is actually waiting for.

    navigator.serviceWorker.register('sw.js').then(registration => {
      // A new version may already have been sitting there since last time.
      if (registration.waiting && navigator.serviceWorker.controller)

      registration.addEventListener('updatefound', () => {
        const incoming = registration.installing;
        if (!incoming) return;
        incoming.addEventListener('statechange', () => {

          // REPLACEMENT. Without that second test the very first install —
          // the one that is not an update at all — would announce itself.
          if (incoming.state === 'installed' && navigator.serviceWorker.controller)

      // out of nowhere on someone's very first visit.
      if (updateAsked) location.reload();

  });
}

// So: this pole's own bays that get there; failing that, the bays of the SAME
// STATION NAME that do. stationKey must match exactly and the walk is capped,
// because names repeat across Hong Kong — the four 水邊村 stops are 29 km apart.
const CROSS_STATION_M = 800;
function reachingBays(stop, destIds) {
  const mine = poleGroup(stop);
  if (!destIds || !destIds.size) return { bays: mine, crossed: false };
  const hits = mine.filter(s => reachingRoutes(s.stop, destIds).length);
  if (hits.length) return { bays: hits, crossed: false };
  const key = stationKey(stop);
  const lat = Number(stop.lat), lng = Number(stop.long);
  if (!key || !isFinite(lat) || !isFinite(lng)) return { bays: mine, crossed: false };
  const kin = (placeFamilyNow().get(placeKey(stop)) || []).filter(s =>
    stationKey(s) === key &&
    metresBetween(lat, lng, Number(s.lat), Number(s.long)) <= CROSS_STATION_M &&
    reachingRoutes(s.stop, destIds).length);
  return kin.length ? { bays: kin, crossed: true } : { bays: mine, crossed: false };
}
// Dedupe a distance-ordered or search-ordered list into groups. `keep` says
// which poles are allowed at all (the destination filter).
function groupPoles(list, keep, max) {
  const out = [], covered = new Set();
  for (const item of list) {
    const stop = item.stop && item.stop.stop ? item.stop : item;           // {stop, metres} or a stop
    if (covered.has(stop.stop) || !keep(stop)) continue;
    // A bay already shown under an earlier card is not shown twice.
    const group = poleGroup(stop).filter(g => keep(g) && !covered.has(g.stop));
    group.forEach(g => covered.add(g.stop));
    out.push({ group, metres: item.metres });
    if (out.length >= max) break;
  }
  return out;
}
function stopGroupNow() {
  const st = stopState;
  if (!st.stop) return [];
  if (!st.group || (st.group.length === 1 && stopIndex)) st.group = poleGroup(st.stop);
  return st.group;
}
// The destination typed on the picker, as stop ids — null when none typed.
function destIdsNow() {
  const q = String(stopState.destQuery || '').trim();
  if (!q) return null;
  return stopIdsMatching(q);
}
// Does this route, from this pole onwards, stop at any of these places?
function routeReaches(routeKey, fromSeq, destIds) {
  const entries = (typeof routeIndex !== 'undefined' && routeIndex && routeIndex.get(routeKey)) || [];
  let best = null;
  for (const e of entries) {
    if (e.seq > fromSeq && destIds.has(e.stopId) && (!best || e.seq < best.seq)) best = e;
  }
  return best ? { stopsAway: best.seq - fromSeq, stopId: best.stopId } : null;
}
// The routeKey for a live arrival row: exact match on service type first,
// then any variant of the same route and direction.
function routeKeyForRow(row) {
  const co = String(row.co || 'KMB').toLowerCase();
  const dir = row.dir || 'O';
  const exact = row.route + '|' + dir + '|' + (row.service_type || '1') + '|' + co;
  if (typeof routeIndex !== 'undefined' && routeIndex && routeIndex.has(exact)) return exact;
  const head = row.route + '|' + dir + '|';
  for (const k of (routeIndex ? routeIndex.keys() : [])) if (k.startsWith(head) && k.endsWith('|' + co)) return k;
  return exact;
}

function findStopById(id) { return lookupStop(id); }

function openStopView() {
  const panel = document.getElementById('panel');
  const view  = document.getElementById('stopview');
  panel.classList.remove('favmode', 'setmode', 'mtrmode', 'routemode');
  for (const id of ['favview', 'setview', 'mtrview']) document.getElementById(id).style.display = 'none';
  view.style.display = 'block';
  panel.classList.add('stopmode');
  panel.scrollTop = 0;
  // The planner builds the route index the first time a trip is searched.
  // This tab reads the same index, so it has to be built here too — without
  // it no pole can say where its buses go and the destination search has
  // nothing to walk. Cached after the first time, so this is a one-off wait.
  if (!stopIndex && !stopState.indexing) {
    stopState.indexing = true;
    buildIndexes().catch(error => console.warn('Index unavailable:', error))
      .then(() => { stopState.indexing = false; if (activeMode === 'stop') renderStopView(); });
  }
  if (!stopState.stop && !herePoint && navigator.geolocation && geoChoice() === 'yes'
      && !stopState.locating && !stopState.locateTried) {
    stopState.locateTried = true;
    stopLocate();
  }
  renderStopView();
  if (stopState.stop && !stopState.rows && !stopState.loading) stopLoadRows();
}

function stopLocate() {
  if (!navigator.geolocation) { status.textContent = T('noGeo'); return; }
  stopState.locating = true; renderStopView();
  status.textContent = T('findingYou');
  navigator.geolocation.getCurrentPosition(
    position => {
      herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
      stopState.locating = false; renderStopView();
    },
    () => { stopState.locating = false; status.textContent = T('locationFailed'); renderStopView(); },
    { enableHighAccuracy:true, timeout:10000 });
}

// Run something once we know where the rider is. Already located: straight
// through. Otherwise ask the phone first, and remember that they said yes —
// tapping a location pin IS saying yes, so it would be rude to ask again.
function withHere(then) {
  if (herePoint) { then(herePoint); return; }
  if (!navigator.geolocation) { status.textContent = T('noGeo'); return; }
  rememberGeoChoice('yes');
  // Only redraw the picker when the picker is what the rider is looking at.
  // The pin on a route screen uses this too, and there the stop view is
  // hidden — redrawing it would be work nobody sees.
  const paint = () => { if (activeMode === 'stop') renderStopView(); };
  stopState.locating = true; paint();
  status.textContent = T('findingYou');
  navigator.geolocation.getCurrentPosition(
    position => {
      herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
      stopState.locating = false;
      paint();
      then(herePoint);
    },
    () => { stopState.locating = false; status.textContent = T('locationFailed'); paint(); },
    { enableHighAccuracy: true, timeout: 10000 });
}

// The closest pole to a point, ignoring rail stations — this is the bus tab.
function nearestPoleTo(here) {
  const near = stopsNear(here.lat, here.lng, STOP_NEAR_M).filter(n => !n.stop.isStation);
  return near.length ? near[0].stop : null;
}

function stopSetStop(stop, groupStops) {
  const group = groupStops && groupStops.length > 1 ? groupStops : poleGroup(stop);
  stopState = Object.assign(freshStopState(), { locateTried: true, stop, group, destQuery: stopState.destQuery, destPicked: stopState.destPicked, indexing: stopState.indexing });
  renderStopView();
  stopLoadRows();
}

// One tap on a saved stop is this screen with the stop already chosen.
function stopOpenSaved(sf, noFilter, group) {
  // The place typed above stays with you: it becomes the 往… filter here —
  // unless this stop has no bus there at all, in which case filtering by it
  // would open an empty screen. Show everything the stop does have instead.
  // destQuery is what the rider typed and must survive — going back to the
  // picker has to still say 屯門市中心. destFilter is the narrowing applied to
  // THIS stop's rows, and that is the only thing dropped.
  const dest = String(stopState.destQuery || '').trim();
  // `group` is the other bank of the same station, when that is where the
  // bus the rider wants actually leaves from. Open THAT, not the saved pole.
  const bays = (group && group.length) ? group : poleGroup(sf);
  stopState = Object.assign(freshStopState(), { locateTried: true, stop: bays[0], group: bays,
                                                destQuery: dest, destFilter: noFilter ? '' : dest,
                                                destPicked: stopState.destPicked, indexing: stopState.indexing });
  if (activeMode !== 'stop') { showMode('stop'); return; }
  renderStopView(); stopLoadRows();
}

// One tap on a saved destination is the 車站 tab with 我要去 already filled in
// and the picker open, so the next tap is the stop you are standing at. No
// stop is chosen here on purpose: which pole you leave from depends on where
// you are today, which is the whole reason a destination is stored as a name.
function stopOpenDest(name) {
  name = String(name || '').trim();
  stopState = Object.assign(freshStopState(), { locateTried: stopState.locateTried,
                                                destQuery: name, destPicked: true,
                                                indexing: stopState.indexing });
  if (activeMode !== 'stop') { showMode('stop'); return; }
  renderStopView();
}

// Live rows for one pole: an array, or null when its company has no feed.
async function fetchPoleRows(stop) {
  const co = stopCompany(stop.stop);
  let rows = null;
  if (co === 'KMB') {
    const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + stop.stop,
                                 { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    rows = (await response.json()).data || [];
  } else if (co === 'CTB') {
    // Citybus answers per route, so ask for each route the index says stops here.
    const routes = [...new Set(routesAtStop(stop.stop).filter(r => r.co === 'CTB').map(r => r.route))].slice(0, 12);
    const lists = await Promise.all(routes.map(async route => {
      try {
        const response = await fetch(CTB_BASE + '/eta/CTB/' + stop.stop + '/' + encodeURIComponent(route),
                                     { signal: AbortSignal.timeout(10000) });
        return response.ok ? ((await response.json()).data || []) : [];
      } catch (error) { return []; }
    }));
    rows = lists.flat();
  }
  return rows === null ? null : rows.map(row => Object.assign({}, row,
    { stop: stop.stop, stopName_en: stop.name_en, stopName_tc: stop.name_tc, co: row.co || co }));
}

async function stopLoadRows(force) {
  const stop = stopState.stop;
  if (!stop) return;
  if (!force && stopState.rows && Date.now() - stopState.fetchedAt < 30000) return;
  stopState.loading = true; stopState.alert = null; renderStopView();
  // One screen for every bay of the group: ask each, and show each bay's
  // buses the moment they arrive instead of waiting for the slowest bay.
  const group = stopGroupNow();
  const results = new Array(group.length).fill(null);
  const settled = new Array(group.length).fill(false);
  const paintSoFar = () => {
    if (stopState.stop !== stop) return;
    const live = results.filter(Array.isArray);
    if (!live.length) return;
    stopState.rows = live.flat();
    const rowsBox = document.getElementById('stop-rows');
    if (rowsBox) rowsBox.innerHTML = stopRowsHtml();
  };
  await Promise.all(group.map((s, i) => fetchPoleRows(s)
    .then(r => { results[i] = r; }, () => { results[i] = undefined; })
    .then(() => { settled[i] = true; if (settled.some(x => !x)) paintSoFar(); })));
  if (stopState.stop !== stop) return;                   // moved on meanwhile
  const failed = results.filter(r => r === undefined).length;
  if (failed === results.length) {
    stopState.rows = []; stopState.alert = T('etaOffline');
  } else {
    const live = results.filter(Array.isArray);
    stopState.noLive = !live.length;
    stopState.rows = live.flat();
  }
  stopState.fetchedAt = Date.now(); stopState.loading = false;
  const rowsBox = document.getElementById('stop-rows');
  if (rowsBox && document.activeElement && document.activeElement.id === 'stop-filter') rowsBox.innerHTML = stopRowsHtml();
  else renderStopView();
  // Any remark on a row here that says delayed, diverted or suspended.
  noteBusRemarks(stopState.rows || [], group.map(g => g.stop), route => T('alertOnScreen').replace('{s}', route));
  refreshAlerts();
}

// The picker in two halves. The top holds the 我要去 box (with the location
// card above it); the rest is everything that changes as the place is typed.
// A keystroke redraws only the rest, so the box under the rider's finger is
// never rebuilt — rebuilding it on every letter broke the keyboard's word
// composition on the phone and made typing feel slow.
function stopPickerParts() {
  const st = stopState;
  // The typed destination, if any, narrows every list on this screen to
  // poles that have a direct bus there — and each pole's line to just those
  // buses. A pole that cannot take you where you said is not an option.
  const destIds = destIdsNow();
  const filtering = !!(destIds && destIds.size);
  const keep = stop => !filtering || reachingRoutes(stop.stop, destIds).length > 0;
  const poleButton = (group, metres) => {
    const stop = group[0];
    const chip = group.length > 1 ? T('stopBays').replace('{n}', group.length) : poleCodeOf(stop);
    return '<button data-stop-id="' + esc(stop.stop) + '"><span class="pickmain">📍 ' + esc(stopName(stop)) +
      (chip ? ' <span class="polecode">' + esc(chip) + '</span>' : '') +
      groupDirHtml(group.map(g => g.stop)) +
      poleRoutesLine(group.map(g => g.stop), 4, filtering ? destIds : null) + '</span>' +
      (metres != null ? '<span class="mtrdist">' + Math.round(metres) + ' m</span>' : '') + '</button>';
  };

  let top = '', rest = '', star = '';
  if (st.locating) return { top: '<div class="favempty">' + T('findingYou') + '</div>', rest, star };

  if (navigator.geolocation && !herePoint && geoChoice() !== 'no' && geoChoice() !== 'yes') {
    top += '<div class="mtrgeo"><div class="geotitle">' + T('stopGeoTitle') + '</div>' +
           '<div class="geobody">' + T('stopGeoBody') + '</div>' +
           '<div class="geobtns"><button class="geoyes" data-stop-act="geo-yes">' + T('geoYes') + '</button>' +
           '<button class="geono" data-stop-act="geo-no">' + T('geoNo') + '</button></div></div>';
  }
  // No 我的位置 bar here any more. It was a whole row at the top of the
  // landing screen doing what the 📍 on the left of each search box now does,
  // and doing it less precisely — the bar only fetched a fix, while the pins
  // fetch one AND act on it. The card above still runs on a first visit,
  // because asking in our own words before the browser's own prompt appears
  // is the one thing a pin cannot do.
  if (st.indexing || !stopIndex) top += '<div class="rshint">' + T('stopIndexing') + '</div>';

  // Where are you going? The star saves the place once it names real stops.
  const destTyped = String(st.destQuery || '').trim();
  const destSaved = destTyped && isSavedDest(destTyped);
  const canSaveDest = destTyped && (destSaved || filtering);
  star = canSaveDest
    ? '<button class="rsstar' + (destSaved ? ' on' : '') + '" data-stop-act="deststar" title="' + esc(T(destSaved ? 'stopDestUnstar' : 'stopDestStar')) +
      '" aria-label="' + esc(T(destSaved ? 'stopDestUnstar' : 'stopDestStar')) + '">' + (destSaved ? '★' : '☆') + '</button>'
    : '';
  // A pin on the left of each box, so "where I am" never has to be typed.
  // On 我要去 it fills the box with the stop you are standing at — which is
  // what makes the ★ beside it useful: stand somewhere once, save it, and it
  // is a one-tap destination for ever after.
  const pin = act => '<button class="rspin" data-stop-act="' + act + '" title="' + esc(T('useMyLocation')) +
                     '" aria-label="' + esc(T('useMyLocation')) + '">📍</button>';

  top += '<div class="mtrsub">' + T('stopDestPh').replace(/[（(].*$/, '') + '</div>' +
         '<div class="frow">' + pin('here-dest') +
         '<input id="stop-dest" type="text" placeholder="' + esc(T('stopDestPh')) + '" autocomplete="off" value="' + esc(st.destQuery || '') + '">' +
         '<span id="stop-dest-star">' + star + '</span></div>' +
         '<div id="stop-dest-results"></div>';

  if (stopDests.length) {
    // One tap sets the place; tapping the lit one again clears it.
    rest += '<div class="mtrsub">' + T('stopDestSaved') + '</div><div class="destchips">' +
      stopDests.map(d => { const n = destName(d), on = n === destTyped;
        return '<button class="destchip' + (on ? ' on' : '') + '" data-stop-act="dest" data-name="' + esc(n) + '">' +
               (on ? '★ ' : '') + esc(destLabel(d)) + '</button>'; }).join('') +
      '</div>';
  }
  // The starting stop: type it, or tap one saved. The nearest poles come
  // last — they are the fallback when you have not said where you are.
  rest += '<div class="mtrsub sectionbreak">' + T('stopStartHead') + '</div>' +
          '<div class="frow">' + pin('here-start') +
          '<input id="stop-search" type="text" placeholder="' + esc(T('stopSearchPh')) + '" autocomplete="off"></div>' +
          '<div class="mtrpick" id="stop-search-results"></div>';
  // Saved poles as one-tap pills, same shape as the saved places above.
  // YOUR SAVED STOPS, ALWAYS SHOWN — but greyed when they cannot get you
  // where you just said you were going. Hiding them was tried and was worse:
  // a favourite that vanishes reads as lost, not as unsuitable. Dimmed, it
  // still says "this is yours" while saying "not for this trip".
  //
  // Reachability is judged over the whole GROUP of bays, not the one saved
  // pole, because tapping the pill opens the group. Judging the single pole
  // would grey out a stop that works the moment you tap it.
  //
  // It stays TAPPABLE. A dead button is a dead end — an older rider taps it,
  // nothing happens, and the app looks broken. Tapping a greyed one opens it
  // WITHOUT the destination filter, which is the same thing the greyed
  // station cards in the search above already do.
  const savedShown = stopFavs.slice(0, MAX_STOPS);
  if (savedShown.length) {
    rest += '<div class="mtrsub">' + T('stopSavedPicks') + '</div><div class="destchips">' +
      savedShown.map(f => {
        const found = reachingBays(f, filtering ? destIds : null);
        const ids = found.bays.map(g => g.stop);
        const reaches = !filtering || reachingRoutes(ids, destIds).length > 0;
        // Both halves of the answer are marked, not just the bad half. Greying
        // the wrong ones tells you where NOT to go; lighting the right ones
        // tells you where to go, which is the question actually being asked.
        // Same amber as the chosen destination above, so one glance down the
        // screen reads "here → there" in one colour.
        const mark = !filtering ? '' : (reaches ? ' ok' : ' dim');
        // When the answer is across the road, the pill says so and names the
        // bay it will open — the pole code on it is no longer the saved one,
        // and a rider standing at TM101 has to be told to move.
        const lead = found.bays[0];
        const code = found.crossed ? poleCodeOf(lead) : poleCodeOf(f);
        return '<button class="destchip' + mark + '" data-stop-act="fav" data-index="' +
          stopFavs.indexOf(f) + '"' + (found.crossed ? ' data-stop-group="' + esc(ids.join(',')) + '"' : '') +
          (reaches ? '' : ' data-nofilter="1"') + '>' +
          (filtering && reaches ? '✓ ' : '📍 ') + esc(favLabel(f)) +
          (code ? ' <small>' + esc(code) + '</small>' : '') +
          (found.crossed ? '' : poleDirHtml(f.stop)) +
          (found.crossed ? groupDirHtml(ids) + '<small class="crossover">' + esc(T('stopCrossOver')) + '</small>' : '') +
          (reaches ? '' : '<small class="noreach">' + esc(T('stopNoDirect')) + '</small>') +
          '</button>';
      }).join('') + '</div>';
  }
  if (st.destQuery && destIds && !destIds.size)
    rest += '<div class="favempty">' + T('stopDestNoName').replace('{d}', esc(st.destQuery)) + '</div>';
  if (filtering) rest += '<div class="rshint">' + T('stopShowingTo').replace('{d}', esc(st.destQuery)) + '</div>';
  if (herePoint) {
    const nearAll = stopsNear(herePoint.lat, herePoint.lng, filtering ? 600 : STOP_NEAR_M).filter(n => !n.stop.isStation);
    const near = groupPoles(nearAll, keep, filtering ? 6 : 4);
    if (near.length)
      rest += '<div class="mtrsub sectionbreak">' + T('stopNearby') + '</div><div class="mtrpick">' + near.map(n => poleButton(n.group, n.metres)).join('') + '</div>';
    else
      rest += '<div class="favempty">' + (filtering ? T('stopNearNoneTo').replace('{d}', esc(st.destQuery)) : T('stopNoneNear')) + '</div>';
  }
  return { top, rest, star };
}

// A keystroke in 我要去: one redraw per frame, of the lower half only. The
// start-stop box keeps whatever was typed in it, and its results follow.
let stopRefreshPending = 0;
function stopScheduleRefresh() {
  if (stopRefreshPending) return;
  // A short timer, not an animation frame: frames stop in a backgrounded
  // tab, and the redraw would then wait until the tab was looked at again.
  stopRefreshPending = setTimeout(() => {
    stopRefreshPending = 0;
    const rest = document.getElementById('stop-rest');
    if (!rest || stopState.stop) { renderStopView(); return; }
    const parts = stopPickerParts();
    const startBox = document.getElementById('stop-search');
    const startTyped = startBox ? startBox.value : '';
    rest.innerHTML = parts.rest;
    const starBox = document.getElementById('stop-dest-star');
    if (starBox && starBox.innerHTML !== parts.star) starBox.innerHTML = parts.star;
    if (startTyped) { const again = document.getElementById('stop-search'); if (again) { again.value = startTyped; stopRenderSearch(startTyped); } }
    stopRenderDest(stopState.destQuery);
  }, 16);
}

function renderStopView() {
  const view = document.getElementById('stopview');
  if (!view) return;
  const st = stopState;
  let html = '';   // no heading: the tab is the heading, and the space is worth more

  if (!st.stop) {
    const parts = stopPickerParts();
    view.innerHTML = '<div id="stop-top">' + parts.top + '</div><div id="stop-rest">' + parts.rest + '</div>';
    if (st.destQuery) stopRenderDest(st.destQuery);
    return;
  }

  // ---- 2. THE STOP ----
  const stop = st.stop;
  const group = stopGroupNow();
  const groupIds = group.map(g => g.stop);
  const here = herePoint ? Math.round(metresBetween(herePoint.lat, herePoint.lng, Number(stop.lat), Number(stop.long))) : null;
  const saved = isSavedStop(stop.stop);
  const code = poleCodeOf(stop);
  const chip = group.length > 1 ? T('stopBays').replace('{n}', group.length) : code;
  html += '<div class="mtrsta"><div class="mtrname">🚏 ' + esc(stopName(stop)) +
          (chip ? ' <span class="polecode">' + esc(chip) + '</span>' : '') +
          groupDirHtml(group.map(x => x.stop)) +
          (here !== null ? '<small>' + T('mtrAway').replace('{m}', here) + '</small>' : '') + '</div>' +
          // Save / unsave is one small star beside 更改 — the full-width
          // 已收藏 bar it replaces was a whole line saying something the
          // rider already knew, on the screen where every line counts.
          '<button class="' + (saved ? 'rsstar on' : 'rsstar') + '" data-stop-act="star" title="' + esc(T(saved ? 'stopSavedBtn' : 'stopSaveBtn')) +
          '" aria-label="' + esc(T(saved ? 'stopSavedBtn' : 'stopSaveBtn')) + '">' + (saved ? '★' : '☆') + '</button>' +
          '<button class="refreshbtn" data-stop-act="change">' + T('mtrChange') + '</button></div>';

  // ---- 3. EVERY BUS FROM IT, narrowed to a direction if asked ----
  html += '<div class="mtrhead"><div class="mtrsub">' + T('stopRoutesHere') + '</div>' +
          '<button class="refreshbtn" data-stop-act="refresh"' + (st.loading ? ' disabled' : '') + '>' +
          T(st.loading ? 'refreshing' : 'refresh') + '</button></div>' +
          '<div class="frow"><input id="stop-filter" type="text" placeholder="' + esc(T('stopFilterPh')) + '" autocomplete="off" value="' + esc(st.destFilter || '') + '"></div>' +
          '<div id="stop-filter-suggest"></div>' +
          '<div id="stop-rows">' + stopRowsHtml() + '</div>';
  view.innerHTML = html;
}

// The route rows for the chosen pole, filtered by destination when one is
// typed. Kept separate so typing in the filter redraws only this part and
// the box keeps focus.
function stopRowsHtml() {
  const st = stopState, stop = st.stop;
  if (!stop) return '';
  const stamp = st.fetchedAt ? new Date(st.fetchedAt).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) : '';
  const destIds = st.destFilter ? stopIdsMatching(st.destFilter) : null;
  const groupIds = stopGroupNow().map(g => g.stop);
  let html = '';
  if (st.loading && !st.rows) return '<div class="favempty">' + T('rsCheckingEta') + '</div>';
  if (st.alert) return '<div class="mtralert">⚠ ' + esc(st.alert) + '</div>';
  if (st.noLive) {
    let routes = routesServingAny(groupIds);
    if (destIds) routes = routes.filter(r => routeReaches(r.key, r.seq, destIds));
    if (!routes.length && destIds) return '<div class="favempty">' + T('stopFilterNone').replace('{d}', esc(st.destFilter)) + '</div>';
    return '<div class="rshint">' + T('stopNoLive') + '</div>' +
      routes.map(r => '<div class="stoproute"><span class="rt">' + esc(r.route) + '</span>' +
        '<span class="quiet">' + (r.dest ? T('towards') + ' ' + esc(r.dest) + ' · ' : '') + esc(r.co) + '</span></div>').join('');
  }
  if (st.rows) {
    let rows = st.rows;
    let arrive = null;
    if (destIds) {
      arrive = new Map();                       // route key → stops from here to the place
      rows = rows.filter(row => {
        const key = routeKeyForRow(row);
        const seq = Number(row.seq) || (routesServing(row.stop || stop.stop).find(r => r.key === key) || {}).seq || 0;
        const reach = routeReaches(key, seq, destIds);
        if (reach) arrive.set(key, reach.stopsAway);
        return !!reach;
      });
      if (!rows.length) return '<div class="favempty">' + T('stopFilterNone').replace('{d}', esc(st.destFilter)) + '</div>';
      html += '<div class="rshint">' + T('stopFilterOn').replace('{d}', esc(st.destFilter)) + '</div>';
    } else {
      html += '<div class="rshint">' + T('stopTapRoute') + '</div>';
    }
    const multiPole = groupIds.length > 1;
    html += formatArrivals(rows, (arrive || multiPole)
      ? { arrive, destName: st.destFilter, multiPole } : null);
    if (stamp) html += '<div class="mtrupdated">' + T('updatedAt').replace('{t}', stamp) + '</div>';
  }
  return html;
}

// "I want to go to X": every pole within 600 m, and every bus from it that
// stops at X further down its route. Grouped by pole, nearest first, so the
// answer is "cross to MK752 and take the 60X", not a list of route numbers.
// Station names that begin with what was typed, Chinese or English, one
// line per name, shortest first — 金 lists 金鐘 before 金鐘道, "tue" lists
// Tuen Mun. Names that merely contain the text follow if there is room.
const suggestMemo = new Map();
function destSuggestions(q, max) {
  const needle = needleOf(q);
  if (!needle) return [];
  const memoKey = lang + '|' + script + '|' + dataStamp() + '|' + needle;
  const hit = suggestMemo.get(memoKey);
  if (hit) return hit;
  const seen = new Map();
  for (const stop of plannableStops()) {
    const [nk, ne] = memoKeys(stop);
    let rank;
    if (nk === needle || ne === needle) rank = 0;
    else if (nk.startsWith(needle) || ne.startsWith(needle)) rank = 1;
    else if (nk.includes(needle) || ne.includes(needle)) rank = 2;
    else continue;
    const name = sc(stopName(stop));      // shown and typed back in the script the rider chose
    if (!name) continue;
    const have = seen.get(name);
    if (!have) seen.set(name, { name, rank, count: 1 });
    else { have.count++; if (rank < have.rank) have.rank = rank; }
  }
  const list = [...seen.values()]
    // Busier names first: 金鐘站 has many poles, 金錢 one or two.
    .sort((a, b) => a.rank - b.rank || b.count - a.count || a.name.length - b.name.length)
    .slice(0, max || 8);
  if (suggestMemo.size >= 60) suggestMemo.delete(suggestMemo.keys().next().value);
  suggestMemo.set(memoKey, list);
  return list;
}

// ROUTE NUMBERS IN THE DESTINATION BOX.
// The 巴士 tab used to be a separate screen whose only job was this. It is
// now the same box you type a place into, because a rider does not think
// "am I looking up a route or a place" — they think "60X" or "屯門市中心" and
// expect the app to know which. Numbers and place names never collide: no
// Hong Kong stop is called 60X.
function routeMatches(typed) {
  const q = String(typed || '').trim().toUpperCase();
  if (!q) return [];
  const out = [];
  const byNumber = new Map();
  for (const route of allRoutes) {
    if (!route.route.toUpperCase().startsWith(q)) continue;
    if (!byNumber.has(route.route)) byNumber.set(route.route, []);
    byNumber.get(route.route).push(route);
  }
  for (const [no, variants] of [...byNumber].slice(0, 6))
    out.push({ no, variants, co: 'KMB' });
  for (const route of ctbRoutes.filter(r => r.route.toUpperCase().startsWith(q)).slice(0, 4))
    out.push({ no: route.route, variants: [route], co: 'CITYBUS' });
  // The exact number first, then shortest: typing 6 puts 6 above 6C above 60X.
  out.sort((a, b) => (a.no.toUpperCase() === q ? 0 : 1) - (b.no.toUpperCase() === q ? 0 : 1) ||
                     a.no.length - b.no.length || a.no.localeCompare(b.no));
  return out.slice(0, 6);
}

// Held between the render and the tap: a route match is an object, and a
// data- attribute can only carry a string.
let routeSuggestions = [];

function stopRenderDest(query) {
  const box = document.getElementById('stop-dest-results');
  if (!box) return;
  stopState.destQuery = query;
  const q = String(query || '').trim();
  box.innerHTML = '';
  if (q.length < 1) return;
  let html = '';
  // Suggest while typing; once a name is picked (or tapped from the saved
  // places) the list stands down until the text changes again.
  routeSuggestions = routeMatches(q);
  if (routeSuggestions.length) {
    html += '<div class="suggest routesuggest">' + routeSuggestions.map((r, i) =>
      '<button data-stop-act="routepick" data-index="' + i + '">🚌 ' + esc(r.no) +
      '<small>' + esc(r.co === 'KMB' ? 'KMB' : 'CITYBUS') + '</small></button>').join('') + '</div>';
  }
  if (!stopState.destPicked) {
    const list = destSuggestions(q, 8);
    const done = list.length === 1 && tidyName(list[0].name) === tidyName(q);
    if (list.length && !done)
      html += '<div class="suggest">' + list.map(x => '<button data-stop-act="destpick" data-name="' + esc(x.name) + '">' + esc(x.name) + '</button>').join('') + '</div>';
  }
  if (!stopIndex) html += '<div class="rshint">' + T('stopIndexing') + '</div>';
  else if (!herePoint) html += '<div class="favempty">' + T('stopDestNeedLoc') + '</div>';
  box.innerHTML = html;
}

function stopRenderSearch(query) {
  const box = document.getElementById('stop-search-results');
  if (!box) return;
  const needle = needleOf(query);
  box.innerHTML = '';
  if (needle.length < 1) return;
  const destIds = destIdsNow();
  const filtering = !!(destIds && destIds.size);
  const stops = plannableStops();
  let named = stops.filter(stop => nameMatches(stop, needle, false));
  if (!named.length && needle.length >= 2) named = stops.filter(stop => nameMatches(stop, needle, true));
  // Names that START with the text first, shortest first: 屯門 puts 屯門市中心
  // ahead of 新屯門中心.
  const prefixRank = stop => { const [nk, ne] = memoKeys(stop); return (nk.startsWith(needle) || ne.startsWith(needle)) ? 0 : 1; };
  named.sort((a, b) => prefixRank(a) - prefixRank(b) || stopName(a).length - stopName(b).length);
  // Both ends known: list the STATIONS that match, each as one card even
  // when it is several poles (屯門公路轉車站 is TM750 and TM756, two stops on
  // the same 60X run). The card names the buses that reach the place; the
  // tap opens every one of those poles together, filtered to the place and
  // sorted soonest-arrival first — the full answer, with live times.
  if (filtering) {
    // ONE CARD PER STATION NAME, AND ONLY THE BAYS THAT GO YOUR WAY.
    // 屯門公路轉車站 is twenty-five bays in two banks either side of Tuen Mun
    // Road, 536 m apart. Two of them — TM750 and TM756 on the Kowloon-bound
    // side — carry the 60X to 太子站. The other twenty-three carry buses back
    // to Tuen Mun. Pooling all twenty-five under one card offered the rider a
    // stop where their bus goes past on the far carriageway, and averaged the
    // facing of two opposite banks into no arrow at all.
    //
    // So the destination does not merely SORT the cards any more, it decides
    // what a card contains: g.hits, the bays with a bus that actually gets
    // there. The bay count, the direction arrow, the route lines and the
    // group opened by a tap are all built from those, never from g.stops.
    const groups = new Map();
    for (const stop of named) {
      const k = stationKey(stop);
      if (!groups.has(k)) groups.set(k, { stops: [], hits: [], best: Infinity, rank: 1 });
      const g = groups.get(k);
      g.stops.push(stop);
      g.rank = Math.min(g.rank, prefixRank(stop));
      const reach = reachingRoutes(stop.stop, destIds);
      if (reach.length) { g.hits.push(stop); g.best = Math.min(g.best, ...reach.map(x => x.reach.stopsAway)); }
    }
    // Busier names (more poles) before quieter ones: 太子站 before 太祥街.
    const ranked = [...groups.values()]
      .sort((a, b) => ((b.hits.length > 0) - (a.hits.length > 0)) || a.rank - b.rank || a.best - b.best ||
                      b.stops.length - a.stops.length || stopName(a.stops[0]).length - stopName(b.stops[0]).length);
    // Once ONE station can get you there, the ones that cannot are not
    // options and are not shown. They are only listed when nothing at all
    // matches and gets there — then there is no right answer to bury them
    // under, and a dimmed list that opens without the filter beats a blank
    // screen: typing 太 must always find 太子站, whatever the place.
    const reaching = ranked.filter(g => g.hits.length);
    const list = (reaching.length ? reaching : ranked).slice(0, 8);
    // What the "every bus from any 屯門轉車 stop" button pools is what is on
    // screen, not every match there was.
    const reachList = list.filter(g => g.hits.length);
    const place = esc(stopState.destQuery);
    const card = g => {
      const bays = g.hits.length ? g.hits : g.stops;
      // Board at the pole nearest the phone, else the first named.
      const lead = herePoint
        ? bays.slice().sort((a, b) => metresBetween(herePoint.lat, herePoint.lng, Number(a.lat), Number(a.long)) - metresBetween(herePoint.lat, herePoint.lng, Number(b.lat), Number(b.long)))[0]
        : bays[0];
      const ids = bays.map(x => x.stop);
      const chip = bays.length > 1 ? T('stopBays').replace('{n}', bays.length) : poleCodeOf(lead);
      return '<button' + (g.hits.length ? '' : ' class="dim" data-nofilter="1"') + ' data-stop-id="' + esc(lead.stop) + '" data-stop-group="' + esc(ids.join(',')) + '"><span class="pickmain">🚏 ' + esc(stopName(lead)) +
        (chip ? ' <span class="polecode">' + esc(chip) + '</span>' : '') +
        groupDirHtml(ids) +
        (g.hits.length ? poleRoutesLine(ids, 6, destIds) : '<small class="poleroutes">' + T('stopNoReach').replace('{d}', place) + '</small>') +
        '</span></button>';
    };
    let html = '';
    if (reachList.length) html += '<div class="mtrsub">' + T('stopOptHead').replace('{s}', esc(query.trim())).replace('{d}', place) + '</div>';
    // The typed name matched more than one station name that gets there:
