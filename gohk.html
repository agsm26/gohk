  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }

  /* The grip itself is styled further down, with the rest of the sheet. */

  /* ==========================================================
     PHONE LAYOUT — the only layout.
     This app is used on a phone and nowhere else, so there is no desktop
     branch to fall out of step with. The panel is a bottom sheet, the
     controls sit under the thumb, and the grip cycles three heights.
     ========================================================== */
  #panel {
    top:auto; bottom:0; left:0; right:0; width:auto;
    /* max-height must COUNT the padding. Without this the 84px of bottom-bar
       clearance is added on TOP of a 100dvh sheet, the extra hangs above the
       screen, and the first row of option tiles is cut off with no way to
       scroll to it. */
    box-sizing:border-box;
    max-width:none; border-radius:16px 16px 0 0;
    max-height:55vh; padding:8px 14px 20px;
    box-shadow:0 -3px 16px rgba(0,0,0,.3);
    transition:max-height .2s ease;
    overscroll-behavior:contain;    /* scrolling the sheet must not drag the page */
    /* Keep the last button clear of the iPhone home indicator. */
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  }
  /* dvh follows the browser toolbar as it slides away; vh does not, which is
     why a "full height" sheet on iOS Safari used to run off the bottom of the
     screen. Older browsers ignore the dvh line and keep the vh one above it. */
  #panel { max-height:55dvh; }
  #panel.peek { max-height:150px; overflow:hidden; }
  /* Every tall state is capped at the space below the bar, so the top of the
     sheet can never slide underneath it. */
  #panel.tall { max-height:min(88vh, calc(100vh - var(--toph)));
                max-height:min(88dvh, calc(100dvh - var(--toph))); }

  /* THE MAP BELONGS TO THE MAP TAB AND TO NOTHING ELSE.
     It used to lie behind every screen, reachable by pulling this sheet
     down — which is how a journey planned days ago was still drawn under
     the bus times with no way to be rid of it. 地圖 is a tab of its own
     now, so every other screen is opaque and takes the whole screen: the
     results list included, which was the last one still hanging over the
     map as a sheet. */
  #panel {
    top:var(--toph); max-height:calc(100vh - var(--toph));
    max-height:calc(100dvh - var(--toph)); border-radius:0;
    padding-top:16px; box-shadow:none;
  }
  /* The results screen leads with three tiles that are already framed and
     numbered; a 16px band of nothing above them is 16px the journey does
     not get. Every other screen leads with a heading and keeps its air. */
  #panel.results { padding-top:8px; }
  /* Three sheet heights and a grip to cycle them existed ONLY so the map
     could be brought back into view. Nothing is under the panel to look at
     any more, so a short panel would show bare background and the grip
     would read as broken. Both go; every state is the full screen. */
  #panel.peek, #panel.tall, #panel.results,
  #panel.results.peek, #panel.results.tall {
    max-height:calc(100vh - var(--toph));
    max-height:calc(100dvh - var(--toph));
    overflow-y:auto;
  }
  #sheetgrip { display:none; }
  /* The bar is overhead now, so the sheet only needs to clear the iPhone
     home indicator at the bottom, not a 84px bar. */
  #panel { padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px)); }

  /* "Tap on map" cannot work when there is no map behind the panel, and
     there never is now. Typing and GPS cover both ends. */
  .btn[id$="-pin"] { display:none; }
  .btns { gap:0; }

  /* The grip's own 44px tap target and grey bar are gone with it — the rule
     that hid it sat ABOVE this block and lost, so 44px of nothing stayed at
     the top of every screen. Removed here rather than fought with. */

  #compare { gap:6px; }
  .ctile { padding:8px 4px; }
  .ctile .ctitle { font-size:0.94rem; min-height:26px; }
  .ctile .ctime  { font-size:1.2353rem; }
  .ctile .cbus   { font-size:1rem; }
  .ctile .cfare  { font-size:0.94rem; }

  #stopdetail { top:calc(var(--toph) + 10px); right:10px; left:10px; width:auto; }

  #routebanner { padding:10px 12px; }
  #routebanner .rb-route { font-size:1.4118rem; }
  #routebanner .rb-line  { font-size:1rem; }
  #rb-trip .tp { font-size:1rem; }
  #rb-close { width:44px; height:44px; font-size:1.1765rem; top:8px; right:8px; }

  /* The Lands Department logo must stay visible. The bar is overhead now, so
     the bottom-left corner is clear again — and that is where the sheet's
     rounded corner leaves map showing. */
  #landsdlogo { top:auto; bottom:6px; left:8px; }

  #routebanner { position:absolute; bottom:0; left:0; right:0; z-index:1000;
                 background:var(--navy); color:white; padding:14px 18px; display:none;
                 padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px)); }
  #routebanner.ctb { background:#9a3412; }
  /* Planning a trip: the card below carries the route, the terminals and the
     total, so the banner drops all four and keeps the trip and the ✎. */
  /* Planning a trip: the banner is gone entirely. Everything it carried —
     both ends of the trip, the ✕ and the ✎ — is the head of the card now,
     directly under the three choices, where it is read rather than sat
     under. Looking up a single bus route still uses the banner as it was. */
  #routebanner.tripmode { display:none !important; }
  #routebanner .rb-route { font-size:1.8824rem; font-weight:800; }
  #routebanner .rb-company { font-size:1rem; opacity:.85; margin-left:10px; }
  #routebanner .rb-line { font-size:1.2941rem; margin-top:8px; }
  #routebanner .rb-label { display:inline-block; min-width:76px; font-weight:800; font-size:1rem; opacity:.9; }
  #routebanner .rb-note { font-size:0.94rem; opacity:.85; margin-top:8px; }
  #rb-close { position:absolute; top:10px; right:12px; background:rgba(255,255,255,.2);
              border:none; color:white; font-size:1.4118rem; width:52px; height:52px;
              border-radius:26px; cursor:pointer; }

  /* ==============================================================
     PLACES WORTH GOING — the tourist layer on the MAP tab.
     Every control here is hidden outside the map: a floating chip row
     over a list of arrival times would be clutter over the one screen
     a rider is actually reading.
     ============================================================== */
  #maptools, #maplocate, #mtrtoggle { display:none; }
  body.mapopen #maptools { display:block; }
  body.mapopen #maplocate, body.mapopen #mtrtoggle { display:flex; }
  #maptools { position:fixed; top:calc(var(--toph) + 8px); left:10px; right:10px; z-index:1150; }
  .mtsearch { display:flex; gap:4px; align-items:center; background:var(--surface);
              border:2px solid var(--line); border-radius:var(--r-md); padding:2px 4px;
              box-shadow:0 2px 10px rgba(0,0,0,.2); }
  .mtsearch input { flex:1 1 auto; min-width:0; border:none; outline:none; background:transparent;
                    font-size:1.06rem; padding:10px 6px; color:var(--ink); }
  .mtsearch button { flex:0 0 auto; min-width:44px; min-height:44px; border:none; background:transparent;
                     font-size:1.1rem; font-weight:800; color:var(--ink-3); border-radius:var(--r-sm); }
  /* The one thing on this screen that UNDOES something, so it is the one
     thing here that is red, and it is a full-width bar rather than another
     round chip — nothing else should be mistakable for it. */
  #spot-reset { display:none; width:100%; box-sizing:border-box; min-height:50px;
                margin-top:6px; border:none; border-radius:var(--r-md);
                background:var(--red); color:#fff; font-size:1.04rem; font-weight:800;
                box-shadow:0 2px 10px rgba(0,0,0,.22); }
  #spot-reset.on { display:block; }
  #spot-reset:active { background:#7f1d1d; }
  /* The chips SCROLL sideways and never wrap. Nine categories in Chinese at
     特大 are far wider than a 375px phone, and a wrapped second row would
     push the map itself out from under the rider's thumb. */
  #spotchips { display:flex; gap:6px; overflow-x:auto; padding:8px 2px 2px; scrollbar-width:none; }
  #spotchips::-webkit-scrollbar { display:none; }
  .spotchip { flex:0 0 auto; min-height:44px; padding:4px 14px; border-radius:999px;
              border:2px solid var(--line); background:var(--surface); color:var(--ink-2);
              font-size:1rem; font-weight:800; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.16); }
  .spotchip.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  #spotresults { margin-top:6px; background:var(--surface); border:2px solid var(--line);
                 border-radius:var(--r-md); box-shadow:0 4px 16px rgba(0,0,0,.25);
                 max-height:46vh; overflow:auto; }
  #spotresults:empty { display:none; }
  .spothit { display:block; width:100%; text-align:left; border:none; background:transparent;
             border-bottom:1px solid var(--line-soft); padding:10px 12px; min-height:56px; color:var(--ink); }
  .spothit:last-child { border-bottom:none; }
  .spothit:active { background:var(--navy-tint); }
  .spothead-sm { padding:8px 12px 4px; font-size:0.9rem; font-weight:800;
                 color:var(--ink-3); background:var(--surface-3); }
  .spothit b { display:block; font-size:1.06rem; line-height:1.3; }
  .spothit small { display:block; font-size:0.9rem; font-weight:700; color:var(--ink-3); margin-top:2px; }
  /* Big enough to hit with a thumb while holding a suitcase. */
  /* Clear of the map attribution. The Lands Department licence requires the
     copyright notice to stay ON the map face, so a button sitting on top of
     it is a licence problem rather than a cosmetic one. The notice wraps to
     two or three lines depending on width AND grows with the text size
     setting (36px at 標準, 47px at 特大), so the clearance is MEASURED into
     --attrh rather than guessed — see fitLocateButton(). */
  #maplocate { position:fixed; right:14px;
               bottom:calc(var(--attrh, 48px) + 12px + env(safe-area-inset-bottom, 0px));
               z-index:1150; width:62px; height:62px; border-radius:50%; padding:0;
               border:2px solid var(--line); background:var(--surface); color:var(--ink);
               align-items:center; justify-content:center; font-size:1.7rem;
               box-shadow:0 4px 16px rgba(0,0,0,.32); }
  #maplocate.on { background:var(--navy); border-color:var(--navy); }
  #maplocate.busy { opacity:.6; }
  /* The railway switch sits directly above the locate button, in the same
     stack and measured off the same attribution height, so the two move
     together when the copyright notice changes size. */
  #mtrtoggle { position:fixed; right:14px;
               bottom:calc(var(--attrh, 48px) + 84px + env(safe-area-inset-bottom, 0px));
               z-index:1150; width:62px; height:62px; border-radius:50%; padding:0;
               border:2px solid var(--line); background:var(--surface); color:var(--ink);
               align-items:center; justify-content:center; font-size:1.7rem;
               box-shadow:0 4px 16px rgba(0,0,0,.32); opacity:.75; }
  #mtrtoggle.on { background:var(--navy); border-color:var(--navy); opacity:1; }
  /* Station dots and their names. Kept small: the lines are the shape a
     rider reads at a glance, and the names are for when they have zoomed in. */
  .railname { pointer-events:none; font-size:11px; font-weight:800; color:#0f172a;
              white-space:nowrap; text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }

  /* A place pin. The label rides under it from zoom 16 so a tourist can read
     the map without tapping every dot. The box is wide to make room for the
     label, so only the pin and the label themselves take taps. */
  .spotpin-wrap { background:none; border:none; }
  .spotpinbox { display:flex; flex-direction:column; align-items:center; width:140px;
                pointer-events:none; }
  .spotpin { pointer-events:auto; display:flex; align-items:center; justify-content:center;
             width:30px; height:30px; border-radius:50%; background:#fff;
             border:3px solid var(--pin, #334155); font-size:15px; line-height:1;
             box-shadow:0 1px 5px rgba(0,0,0,.4); }
  .spotlabel { pointer-events:auto; max-width:138px; margin-top:2px; font-size:11px; font-weight:800;
               color:#0f172a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
               text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .herepin { display:flex; align-items:center; justify-content:center; width:26px; height:26px;
             border-radius:50%; background:var(--navy); border:3px solid #fff;
             box-shadow:0 0 0 2px var(--navy), 0 2px 8px rgba(0,0,0,.4); }

  /* The place sheet. Same shape as the "which way?" sheet, because a rider
     who has met one has met them all. */
  #spotsheet { display:none; position:fixed; inset:0; z-index:2000; background:rgba(15,23,42,.55);
               align-items:flex-end; justify-content:center; padding:10px; }
  #spotsheet.open { display:flex; }
  /* The bar you push down on. It is also the only hint that the card CAN be
     pushed down, so it is drawn even though it does nothing on its own. */
  #spotcard .sheetgrip { width:44px; height:5px; margin:2px auto 10px; border-radius:3px;
                         background:var(--line); }
  #spotcard { touch-action: pan-y; will-change: transform; }
  .spothead { display:flex; gap:10px; align-items:flex-start; }
  .spothead .sh-icon { flex:0 0 auto; font-size:1.9rem; line-height:1.2; }
  .spothead .sh-name { flex:1 1 auto; min-width:0; }
  .spothead b { display:block; font-size:1.3rem; line-height:1.28; color:var(--ink); }
  .spothead small { display:block; font-size:0.94rem; font-weight:700; color:var(--ink-3); margin-top:3px; }
  .spotkind { display:inline-block; margin-top:6px; padding:2px 10px; border-radius:999px;
              background:var(--surface-2); color:var(--ink-2); font-size:0.88rem; font-weight:800; }
  /* THE MAIN ACTION, WHERE THE EYE ALREADY IS.
     This button used to sit under the list of nearby stops, which on a phone
     puts it below three or four cards: someone looking at 星光大道 had to
     scroll past everything to reach the one button that answers "how do I
     get there". It now sits beside the name, on screen the moment the card
     opens. The stops below it are what they always were — detail for anyone
     who wants to choose their own. */
  .spothead .sh-go { flex:0 0 auto; width:5.9rem; min-height:66px; padding:8px 4px;
                     display:flex; flex-direction:column; align-items:center;
                     justify-content:center; gap:3px; border:none;
                     border-radius:var(--r-md); background:var(--navy); color:#fff;
                     font-size:1rem; font-weight:800; line-height:1.18; text-align:center; }
  .spothead .sh-go:active { background:#16306e; }
  .sh-go-i { font-size:1.4rem; line-height:1; }
  .spotmeta { font-size:0.98rem; line-height:1.5; color:var(--ink-2); margin-top:8px; }
  .spotmeta .k { font-weight:800; color:var(--ink-3); }
  .spotdesc { font-size:0.98rem; line-height:1.55; color:var(--ink-2); margin-top:8px;
              max-height:22vh; overflow:auto; }
  .spotgohead { font-size:1.1rem; font-weight:800; color:var(--ink); margin:14px 0 0;
                padding-top:12px; border-top:2px solid var(--line-soft); }
  .spotway { display:block; width:100%; text-align:left; border:2px solid var(--line);
             border-radius:var(--r-md); background:var(--surface); padding:10px 12px;
             margin-top:8px; min-height:56px; color:var(--ink); }
  .spotway:active { background:var(--navy-tint); }
  .spotway b { display:block; font-size:1.12rem; line-height:1.3; }
  .spotway small { display:block; font-size:0.92rem; font-weight:700; color:var(--ink-3); margin-top:2px; }
  .spotway.rail { border-left:8px solid var(--blue); }
  .spotway.bus { border-left:8px solid var(--red); }
  .wayeta { display:block; margin-top:5px; font-size:1.02rem; font-weight:800; color:var(--green); }
  .wayeta .r { color:var(--blue); }
  /* The second-best action: real, but plainly not the main one. Without its
     own look it was indistinguishable from 關閉 sitting right below it. */
  .spotalt { display:block; width:100%; min-height:52px; margin-top:8px;
             border:2px solid var(--line); border-radius:var(--r-md);
             background:var(--surface); color:var(--ink-2);
             font-size:1.04rem; font-weight:800; }
  .spotalt:active { background:var(--navy-tint); }
  .spotshut { display:block; width:100%; min-height:48px; margin-top:8px; border:none;
              background:transparent; font-size:1.02rem; font-weight:800; color:var(--ink-3); }
  .spotwait { font-size:0.98rem; font-weight:700; color:var(--ink-3); margin-top:10px; }

<body>

<div id="map"></div>
<img id="landsdlogo"
     src="https://api.hkmapservice.gov.hk/mapapi/landsdlogo.jpg"
     alt="Lands Department">

<div id="panel">
  <div id="sheetgrip" title="Expand or collapse"></div>
  <div id="geoask" style="display:none"></div>
  <!-- BUS NUMBER FIRST. "When is my bus coming" is the daily question, and
       most riders know their number; it should not sit below the whole trip
       planner. Typing here switches the panel to "route mode" and the trip
       form steps aside — the two are different jobs, and on a phone together
       they are more scrolling than either is worth. -->
  <div class="field" id="routefield">
    <div class="flabelrow">
      <div class="flabel">🚌 查詢巴士路線</div>
      <button class="rsclose" id="route-exit" style="display:none">✕</button>
    </div>
    <div class="frow">
      <button class="rspin" id="route-here">📍</button>
      <input id="route-text" type="text" inputmode="text" autocapitalize="characters"
             placeholder="路線號碼，例如 60M" autocomplete="off">
      <a class="rspin rswalk" id="route-walk" target="_blank" rel="noopener">➤</a>
    </div>
    <ul class="results" id="route-results"></ul>
  </div>
  <!-- Every stop on the chosen route, in order. Filled by renderRouteStops(). -->
  <div id="routestops"></div>
  <div id="livestrip"></div>
  <!-- The name and language button used to sit in a red bar here. The bar
       spent a whole row of a phone screen saying something the user already
       knows, so the name is now only in the title and the language switch
       lives in SETTINGS. -->
  <div id="setview" style="display:none"></div>
  <div id="mtrview" style="display:none"></div>
  <div id="stopview" style="display:none"></div>


  <!-- START: three ways to set it, exactly like DESTINATION below. -->
  <div class="field">
    <!-- Label and favourites share one row: the five slots were a whole line
         of their own before, and on a phone that line was worth more than the
         repetition of showing them under a heading. -->
    <div class="flabelrow">
      <div class="flabel start">● 起點</div>
      <div class="favs" id="start-favs"></div>
    </div>
    <div class="chosen empty" id="start-chosen">未設定</div>
    <button class="addfav" id="start-save" style="display:none">⭐ 加入常用地點</button>
    <div class="frow">
      <input id="start-text" type="text" placeholder="輸入大廈或地點名稱…" autocomplete="off">
      <!-- GPS sits above Search in one column instead of taking its own
           full-width row underneath. -->
      <div class="fcol">
        <button class="btn gpsbtn" id="start-gps" title="我的位置" aria-label="我的位置">📍</button>
        <button class="gobtn" id="start-go">搜尋</button>
      </div>
    </div>
    <div class="btns">
      <button class="btn" id="start-pin">在地圖上點選</button>
    </div>
    <ul class="results" id="start-results"></ul>
  </div>

  <!-- DESTINATION: same three options. -->
  <div class="field">
    <div class="flabelrow">
      <div class="flabel end">■ 目的地</div>
      <div class="favs" id="end-favs"></div>
    </div>
    <div class="chosen empty" id="end-chosen">未設定</div>
    <button class="addfav" id="end-save" style="display:none">⭐ 加入常用地點</button>
    <div class="frow">
      <!-- No "my location" here: you are already at your location, so it can
           only ever be a starting point. The column keeps Search the same
           size and position as the one above. -->
      <input id="end-text" type="text" placeholder="輸入大廈或地點名稱…" autocomplete="off">
      <div class="fcol">
        <button class="gobtn" id="end-go">搜尋</button>
      </div>
    </div>
    <div class="btns">
      <button class="btn" id="end-pin">在地圖上點選</button>
    </div>
    <ul class="results" id="end-results"></ul>
  </div>

  <button id="findbuses" disabled>請先設定起點及目的地</button>
  <label id="shownotrunning"><input type="checkbox" id="notrunning-box"> <span id="notrunning-label"></span></label>
  <div id="favview" style="display:none"></div>
  <div id="compare"></div>
  <div id="journeys"></div>
  <div id="walkinfo"></div>


  <button class="btn" id="clear-all" style="width:100%">全部清除</button>

  <div id="status">正在載入巴士資料…</div>
</div>

<div id="stopdetail"></div>

<!-- "Which way?" for a looked-up bus. Filled by showDirections(). -->
<div id="dirsheet" role="dialog" aria-modal="true"><div class="dircard" id="dircard"></div></div>
<!-- Traffic notice that touches something the rider saved or is looking at. Filled by showAlertSheet(). -->
<div id="alertsheet" role="dialog" aria-modal="true"><div class="dircard" id="alertcard"></div></div>
<!-- Places worth going, and the way there by bus or train. Only on the MAP
     tab; body.mapopen is what turns the whole group on. -->
<div id="spotsheet" role="dialog" aria-modal="true"><div class="dircard" id="spotcard"></div></div>

<div id="maptools">
  <div class="mtsearch">
    <input id="spot-search" type="search" autocomplete="off" enterkeyhint="search">
    <button id="spot-clear" type="button" aria-label="Clear">✕</button>
  </div>
  <!-- Takes a finished journey, and the blue you-are-here dot, back off the
       map. Hidden until there is something to take off, so a clean map is
       never carrying a button about nothing. -->
  <button id="spot-reset" type="button"></button>
  <div id="spotchips"></div>
  <div id="spotresults"></div>
</div>

<!-- Show or hide the railway on the map. -->
<button id="mtrtoggle" type="button">🚇</button>

<!-- Where am I, and what leaves from near here. -->
<button id="maplocate" type="button">📍</button>


<div id="routebanner">
  <button id="rb-close" title="Close">✕</button>
  <div id="rb-trip" style="display:none">
    <div class="tp"><small id="rb-tripfromlabel"></small><span id="rb-tripfrom"></span></div>
    <div class="arrow">→</div>
    <div class="tp"><small id="rb-triptolabel"></small><span id="rb-tripto"></span></div>
    <button id="rb-edit"></button>
  </div>
  <div><span class="rb-route" id="rb-route"></span><span class="rb-company" id="rb-company"></span></div>
  <div class="rb-line"><span class="rb-label">FROM</span> <b id="rb-from"></b></div>
  <div class="rb-line"><span class="rb-label">TO</span> <b id="rb-to"></b></div>
  <div class="rb-note" id="rb-note"></div>
</div>

<nav id="bottombar">
  <!-- 地圖 first, by the owner's decision. It is also the only tab that shows
       a map at all now, so it leads rather than sitting between 收藏 and 設定.
       The app still OPENS on 車站 — "which bus is coming" is the daily
       question — which is why the .on class starts there and not here. -->
  <button class="bnav"    data-nav="map"><span class="bicon">🗺️</span><span class="blabel"></span></button>
  <button class="bnav on" data-nav="stop"><span class="bicon">🚌</span><span class="blabel"></span></button>
  <button class="bnav"    data-nav="mtr"><span class="bicon">🚇</span><span class="blabel"></span></button>
  <button class="bnav"    data-nav="fav"><span class="bicon">⭐</span><span class="blabel"></span></button>
  <button class="bnav"    data-nav="set"><span class="bicon">⚙️</span><span class="blabel"></span></button>
</nav>

<!-- Weather and Observatory warnings, under the bar. Hidden until there is
     something real to show, so a failed fetch costs no screen space. -->
<div id="weatherbar" style="display:none"></div>

<!-- Every message the app has to say goes to #status at the BOTTOM of the
     panel, which on a phone is usually off screen. This mirrors each new
     message here, under the bar, for a few seconds. -->
<div id="toast" role="status" aria-live="polite"></div>

const status = document.getElementById('status');

// Mirror #status into the toast. Dozens of places write status.textContent;
// watching the element means none of them has to know the toast exists.
(function watchStatus() {
  const toast = document.getElementById('toast');
  if (!toast || typeof MutationObserver === 'undefined') return;
  let hideTimer = null, last = '';
  new MutationObserver(() => {
    const text = status.textContent.trim();
    if (!text || text === last) return;
    last = text;
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(hideTimer);
    // Long enough to read at a walking pace; errors linger a little longer.
    hideTimer = setTimeout(() => toast.classList.remove('show'),
                           text.length > 40 ? 6000 : 4000);
  }).observe(status, { childList: true, characterData: true, subtree: true });
})();

// HOW MUCH OF THE MAP IS HIDDEN BEHIND OUR OWN PANELS?
// The map runs edge to edge, but panels float on top of it. Framing a route
// without allowing for them centres things the user cannot see. On a phone
// the panel is a bottom sheet, so the reserved space moves — measuring the
// real elements keeps the numbers right on any screen.
// This app is phone-only, so the bottom-sheet behaviour is always on. The
// function stays so the sheet code below still reads clearly.
function isPhone() { return true; }

// WHAT ACTUALLY COVERS THE MAP FACE.
// This used to reserve room for the panel, because the panel used to sit
// over the map. It does not any more: 地圖 is its own tab and the panel is
// hidden there, so a route framed against a 55%-of-the-screen sheet was
// squeezed into a sliver — Sham Shui Po to Tuen Mun came out at zoom 11,
// the whole territory, with the line off-centre.
//
// What genuinely covers the map is the map tab's own furniture: the search
// box, the clear bar and the chip row at the top, and the 📍 / 🚇 buttons
// at the bottom. Those are only measurable while that tab is open, and a
// journey is usually framed from the results screen — so the last real
// measurement is kept and re-used. The starting figures match a 375px
// phone, so even the very first framing lands close.
let mapChromeTop = 200, mapChromeBottom = 96;

function measureMapChrome() {
  const seen = el => el && el.getBoundingClientRect().height > 0;
  const tools  = document.getElementById('maptools');
  const locate = document.getElementById('maplocate');
  if (seen(tools))  mapChromeTop = Math.round(tools.getBoundingClientRect().bottom) + 12;
  if (seen(locate)) mapChromeBottom =
    Math.round(window.innerHeight - locate.getBoundingClientRect().top) + 12;
}

function mapPadding() {
  const banner = document.getElementById('routebanner');
  // offsetParent is null for a position:fixed element even when it is on
  // screen, so a fixed element would measure as hidden. Its rectangle does
  // not lie, so ask that instead.
  const visible = el => el && el.getBoundingClientRect().height > 0;
  const bannerH = visible(banner) ? banner.offsetHeight : 0;

  // Never let the reserved bands swallow the map: on a short screen an
  // over-large padding makes fitBounds zoom out to nothing. 40% clears the
  // real measurement on a 375x812 phone (283px of top furniture) and only
  // bites on something much shorter.
  const cap = Math.round(Math.max(40, window.innerHeight * 0.4));
  return { paddingTopLeft:     [20, Math.min(mapChromeTop, cap)],
           paddingBottomRight: [20, Math.min(mapChromeBottom + bannerH, cap)] };
}

// ============================================================
// 1b. A CACHE THAT ACTUALLY HOLDS THE BIG FILES
// ============================================================
// sessionStorage caps out around 5 MB and throws the rest away silently, so
// the large network files were being re-downloaded on EVERY page load.
// IndexedDB has no practical size limit and survives closing the browser,
// so the first visit pays the cost and later visits are near-instant.
//
// Each entry is stamped with the day it was fetched. The bus network changes
// once a day, so anything from today is good enough to use as-is.
const CACHE_DB = 'hkfast-cache';
let cacheReady = null;

function openCache() {
  if (cacheReady) return cacheReady;
  cacheReady = new Promise(resolve => {
    const request = indexedDB.open(CACHE_DB, 1);
    request.onupgradeneeded = () => request.result.createObjectStore('files');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => resolve(null);          // carry on without a cache
  });
  return cacheReady;
}

function today() { return new Date().toISOString().slice(0, 10); }

// HOW LONG A STORED ANSWER MAY BE USED.
// Everything in this store is REFERENCE data — route lists, stop positions,
// fare tables, timetables, holidays. Arrival times are never cached, here or
// in the service worker, so nothing a rider actually reads off the screen can
// go stale because of this number.
//
// It used to be one day, which meant every phone re-downloaded about 710 KB
// of KMB open data EVERY DAY, on mobile data, to learn almost nothing: KMB
// changes a route occasionally, not daily. A week cuts that sevenfold. The
// cost is that a route which really did change is at worst a week out of
// date — and its arrival times are live regardless, so the rider is never
// told a bus is coming that is not.
const CACHE_DAYS = 7;

// Whole days between a stored stamp and today. A stamp from the future means
// the clock moved backwards; treat that as expired and fetch again, which is
// the safe direction to be wrong in.
function cacheAgeDays(day) {
  const then = Date.parse(String(day || '') + 'T00:00:00Z');
  if (!isFinite(then)) return Infinity;
  return (Date.parse(today() + 'T00:00:00Z') - then) / 86400000;
}

async function cacheGet(key) {
  try {
    const db = await openCache();
    if (!db) return null;
    return await new Promise(resolve => {
      const request = db.transaction('files').objectStore('files').get(key);
      request.onsuccess = () => {
        const entry = request.result;
        const age = entry ? cacheAgeDays(entry.day) : Infinity;
        resolve(age >= 0 && age < CACHE_DAYS ? entry.value : null);
      };
      request.onerror = () => resolve(null);
    });
  } catch (error) { return null; }
}

async function cachePut(key, value) {
  try {
    const db = await openCache();
    if (!db) return;
    db.transaction('files', 'readwrite').objectStore('files')
      .put({ day: today(), value }, key);
  } catch (error) { /* a full or blocked cache must never break the app */ }
}

let allStops = [], allRoutes = [], ctbRoutes = [];
const CTB_BASE = 'https://rt.data.gov.hk/v2/transport/citybus';

async function loadOnce(cacheKey, url, onDone) {
  const cached = await cacheGet(cacheKey);
  if (cached) { onDone(cached); return; }

  try {
    const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const json = await response.json();
    cachePut(cacheKey, json.data);
    onDone(json.data);
  } catch (error) {
    console.error(cacheKey + ' failed:', error);
    status.textContent = T('someDataFailed') + ' ' + error.message;
  }
}

// ============================================================
// 3. DISTANCE AND WALKING TIME
// ============================================================
// Haversine: STRAIGHT-LINE distance, as a bird flies. Not the walked path.
function metresBetween(lat1, lng1, lat2, lng2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// The nearest stop to a point — over BOTH companies. This walked allStops,
// which is KMB and the railway only, so on Hong Kong Island it answered with
// whatever KMB stop happened to be nearest: for 深水灣泳灘 it named the
// Aberdeen Tunnel 1,240 m away while the Citybus stop 48 m from the beach
// was invisible to it. allPlannableStops is the same list the planner itself
// searches, and including ctbStops can only ever move the answer closer.
function findNearestStop(lat, lng) {
  let best = null, bestMetres = Infinity;
  for (const stop of allPlannableStops()) {
    const m = metresBetween(lat, lng, Number(stop.lat), Number(stop.long));
    if (m < bestMetres) { bestMetres = m; best = stop; }
  }
  return { stop: best, metres: bestMetres };
}

// ASSUMPTIONS, stated openly rather than hidden:
//  * +30% on straight-line distance, because pavements bend around buildings.
//  * 3.5 km/h, slower than the usual 5 km/h adult average, because our main
//    users are older riders. Better to over-estimate than to rush someone.
const DETOUR_FACTOR = 1.3, WALK_KMH = 3.5;

function walkingEstimate(straightMetres) {
  const metres = straightMetres * DETOUR_FACTOR;
  return { metres: Math.round(metres),
           minutes: Math.max(1, Math.round(metres / 1000 / WALK_KMH * 60)) };
}

function arm(which) {

  document.getElementById('start-pin').classList.toggle('armed', armed === 'start');
  document.getElementById('end-pin').classList.toggle('armed', armed === 'end');
  status.textContent = armed

map.on('click', event => {

  setPoint(armed, event.latlng.lat, event.latlng.lng, T('pointOnMap'));
  arm(null);

function setPoint(which, lat, lng, label) {
  const nearest = findNearestStop(lat, lng);
  const point = { lat, lng, label, stop: nearest.stop, stopMetres: nearest.metres };
  if (which === 'start') startPoint = point; else endPoint = point;
  document.getElementById(which + '-results').innerHTML = '';
  redrawJourney();

  // The weather bar names the ends of the trip, so it changes when they do.
  // No fetch here: the readings already in hand cover all of Hong Kong.
  if (typeof renderWeatherBar === 'function' && weatherData) renderWeatherBar();

  // Begin working out what is reachable, quietly, while they type.
  if (which === 'start') computeReachable();
}

function useGps(which) {
  if (!navigator.geolocation) { status.textContent = T('noGeo'); return; }
  status.textContent = T('findingYou');
  navigator.geolocation.getCurrentPosition(
    position => setPoint(which, position.coords.latitude, position.coords.longitude, T('myLocationLabel')),
    error => {
      const reasons = lang === 'zh' ? {
        1:'你已拒絕定位權限，請在瀏覽器設定中允許後再試。',
        2:'現時無法取得你的位置。',
        3:'定位時間過長，請再試一次。' } : {
        1:'You denied location access. Allow it in your browser settings and try again.',
        2:'Your position is unavailable right now.',
        3:'Finding you took too long. Try again.' };
      status.textContent = reasons[error.code] || ('Location error: ' + error.message);
    },
    { enableHighAccuracy:true, timeout:10000 });
}

document.getElementById('start-gps').addEventListener('click', () => useGps('start'));

// ============================================================
// 5. TYPE A PLACE NAME
// ============================================================
// Hong Kong's Lands Department publishes an official Location Search API that
// finds a place by building name, facility name or address. If it is ever
// unavailable, we fall back to searching bus stop names so the app still works.
//
// NOTE: this runs only when the user presses Find or Enter — never on every
// keystroke. Type-ahead would fire a request per letter, which is rude to any
// free service and the fastest way to get an app blocked.
const GEOCODER = 'https://geodata.gov.hk/gs/api/v1.0.0/locationSearch?q=';

// HOW SEARCH-AS-YOU-TYPE WORKS HERE
// Two speeds, deliberately:
//  * Bus stops are already downloaded, so they filter INSTANTLY with every
//    keystroke — no network, no cost, no rate limit to worry about.
//  * The government place lookup runs only after you STOP typing for 600ms.
//    Firing it on every letter would send eight requests for "太子站" and the
//    Lands Department asks that its APIs not be hit hard in short bursts.
let searchTimers = { start: null, end: null };

// MERGING NEARBY DUPLICATE STOPS
// Bus companies often list one physical stop several times — TM167 and TM168
// are both 屯門公園, a few metres apart, because different routes are recorded
// separately. Showing all of them makes the list confusing and the choice
// meaningless: the rider stands in the same place either way.
//
// We merge stops that share a NAME and sit within 15 m of each other.
// 15 m is deliberate: a Hong Kong road is wider than that, so stops on
// OPPOSITE sides stay separate — which matters, because those really are
// different places going in different directions.
const MERGE_RADIUS_M = 15;

// On the map a dot must sit where the pole really is, so 15 m is right there.
// In the SEARCH LIST the opposite is true: "又一城 (SS920)" and "又一城 (SS922)"
// are one place to a rider, and nobody knows which code they want. We merge
// same-named poles far more generously there. Picking the right pole is not
// the rider's job — once a destination is set, the planner looks at every
// stop within walking range of the chosen point and takes whichever one
// actually runs a bus to where they are going.
const SEARCH_MERGE_RADIUS_M = 250;

function mergeNearbyStops(stops, radius) {
  const limit = radius === undefined ? MERGE_RADIUS_M : radius;
  const groups = [];

  for (const stop of stops) {
    const lat = Number(stop.lat), lng = Number(stop.long);
    const name = plainStopName(stop.name_en).toUpperCase();

    // Does this stop belong to a group we have already started?
    let joined = false;
    for (const group of groups) {
      if (group.nameKey !== name) continue;
      if (metresBetween(lat, lng, group.lat, group.lng) > limit) continue;

      group.members.push(stop);
      // Keep the group sitting at the middle of its poles, so any walking
      // distance we show is fair to all of them.
      group.lat += (lat - group.lat) / group.members.length;
      group.lng += (lng - group.lng) / group.members.length;
      joined = true;
      break;
    }

    if (!joined) {
      groups.push({
        nameKey: name, lat, lng,
        name_en: plainStopName(stop.name_en),
        name_tc: plainStopName(stop.name_tc),
        stop: stop.stop, members: [stop]
      });
    }
  }

  return groups;
}

// WHICH STOPS CAN I ACTUALLY GET TO?
// Once a start is chosen, we work out every stop reachable by one bus, or by
// one bus plus one change. Destination suggestions outside that set are
// hidden — offering somewhere no bus goes wastes an older rider's time.
//
// The catch: this needs the whole network file. So we start fetching it the
// moment a start point is set, while the user is still typing. If it has not
// arrived yet we hide NOTHING — an instant list beats a filtered one that
// makes you wait.
let reachableStops = null;      // Set of stop IDs, or null = "don't know yet"

async function computeReachable() {
  reachableStops = null;
  if (!startPoint) return;

  const forPoint = startPoint;          // remember which start this was for
  await buildIndexes();

  // The user may have changed their start while we were downloading.
  if (startPoint !== forPoint) return;

  const near = stopsNear(startPoint.lat, startPoint.lng);
  const firstLegRoutes = new Map();     // routeKey -> earliest boarding seq

  for (const entry of near)
    for (const service of (stopIndex.get(entry.stop.stop) || [])) {
      const existing = firstLegRoutes.get(service.routeKey);
      if (existing === undefined || service.seq < existing)
        firstLegRoutes.set(service.routeKey, service.seq);
    }

  // One bus.
  const reached = new Set();
  for (const [routeKey, boardSeq] of firstLegRoutes)
    for (const entry of (routeIndex.get(routeKey) || []))
      if (entry.seq > boardSeq) reached.add(entry.stopId);

  // One bus, then a change onto another.
  const afterOneLeg = [...reached];
  for (const stopId of afterOneLeg)
    for (const service of (stopIndex.get(stopId) || []))
      for (const entry of (routeIndex.get(service.routeKey) || []))
        if (entry.seq > service.seq) reached.add(entry.stopId);

  reachableStops = reached;
  console.log('Reachable stops from start:', reached.size);

  // If they are already typing a destination, refresh the list now.
  if (document.getElementById('end-text').value) searchLocalStops('end');
}

// ============================================================
// 4b. SIMPLIFIED CHINESE INPUT
// ============================================================
// Every place name in the government data is Traditional, but plenty of
// people type Simplified — 荃湾 rather than 荃灣, 观塘 rather than 觀塘. Without
// this, those searches return nothing at all, which looks like the app is
// broken rather than the keyboard being different.
//
// Both sides are folded to Simplified before comparing, so it works whichever
// way round the person types. Folding one way (Traditional → Simplified) is
// almost always one-to-one; going the other way is not, which is why the
// comparison runs in this direction.
//
// The table below covers only the 531 characters that actually appear in
// Hong Kong stop, station and terminus names AND differ between the two

// CAREFUL: two of the simplified forms in this table (𪨶 and 𫚭, from rare
// Hong Kong place names) sit outside the Basic Multilingual Plane, so
// JavaScript stores each as TWO code units. Indexing with [i] would split
// them and shift every pair after — which silently broke 魚, 鰂, 銅 and 鑼
// while 觀 and 藍 kept working, because they happen to sort earlier.
// Array.from and for...of walk code points, not code units.
const T2S = new Map();
const T2S_CHARS = Array.from(T2S_PAIRS);
for (let i = 0; i < T2S_CHARS.length; i += 2) T2S.set(T2S_CHARS[i], T2S_CHARS[i + 1]);

function toSimple(text) {
  let out = '';
  for (const ch of String(text || '')) out += T2S.get(ch) || ch;
  return out;
}

// Folding 14,000 stop names on every keystroke would be slow, so each name is
// folded once and kept on the stop itself. Performance is a standing rule
// here: a search that lags is a search people stop using.
function simpleName(stop) {
  if (stop._zs === undefined) stop._zs = toSimple(stop.name_tc || '');
  return stop._zs;
}

function rankStops(query) {
  const lower = query.toLowerCase();
  const scored = [];

  // Fold the query once, not once per stop.
  const simple = toSimple(query);

  for (const stop of allStops) {
    const en = (stop.name_en || '').toLowerCase();
    const tc = simpleName(stop);

    let score = -1;
    // Both sides folded: `tc` is the folded name, `simple` the folded query.
    if (en === lower || tc === simple)                     score = 0;   // exact
    else if (en.startsWith(lower) || tc.startsWith(simple)) score = 1;   // starts with
    else if (en.includes(lower) || tc.includes(simple))     score = 2;   // contains
    if (score < 0) continue;

    // A shorter name containing the query is usually the better match:
    // "太子站 (MK187)" beats "太子站, 旺角警署 (MK357)".
    const nameLength = (lang === 'zh' ? tc : en).length;
    scored.push({ stop, score, nameLength });
  }

  scored.sort((a, b) => a.score - b.score || a.nameLength - b.nameLength);
  return scored.slice(0, 40).map(entry => entry.stop);
}

function renderPlaceResults(which, places) {
  const list = document.getElementById(which + '-results');
  list.innerHTML = '';

  // If the OTHER end is already chosen, show how far each option is from it.
  // Four stops all called 友愛邨 are impossible to choose between until you
  // know one is 200 m away and another is 1.4 km.
  const other = which === 'end' ? startPoint : endPoint;

  if (places.length === 0) {
    // Before the stop list has arrived, "no match" is a lie: the app has not
    // looked yet. Say what is actually happening.
    list.innerHTML = '<li>' + T(allStops.length === 0 ? 'dataLoading' : 'noMatch') + '</li>';
    return;
  }

  // Nearest to the other end first — usually the one they mean.
  if (other) {
    places.forEach(place => {
      place.awayM = metresBetween(other.lat, other.lng, place.lat, place.lng);
    });
    places.sort((a, b) => a.awayM - b.awayM);
  }

  if (which === 'end' && reachableStops && startPoint && places.length) {
    const note = document.createElement('li');
    note.style.cssText = 'background:#f0fdf4;color:#166534;font-size:0.94rem;font-weight:700';
    note.textContent = T('onlyReachable');
    list.appendChild(note);
  }

  for (const place of places) {
    const item = document.createElement('li');

    const away = place.awayM === undefined ? '' :
      '<div style="font-size:0.94rem;color:#1e40af;font-weight:700;margin-top:2px">' +
      (place.awayM < 1000
        ? Math.round(place.awayM) + ' m '
        : (place.awayM / 1000).toFixed(1) + ' km ') +
      (which === 'end' ? T('fromStart') : T('fromDest')) + '</div>';

    item.innerHTML = '<span class="badge badge-place">' + place.kind + '</span><b>' +
                     place.name + '</b>' +
                     (place.sub ? '<br><small>' + place.sub + '</small>' : '') + away;
    item.addEventListener('click', () => {
      setPoint(which, place.lat, place.lng, place.name);
      map.setView([place.lat, place.lng], 16);
    });
    list.appendChild(item);
  }
}

// Instant, local, every keystroke.
function searchLocalStops(which) {
  const typed = document.getElementById(which + '-text').value.trim();
  if (typed.length < 1) {
    document.getElementById(which + '-results').innerHTML = '';
    return;
  }

  let matches = rankStops(typed);

  // Hide destinations no bus from the start can reach — but only once we
  // actually know. Until then, show everything rather than make them wait.
  if (which === 'end' && reachableStops && startPoint) {
    const usable = matches.filter(stop => reachableStops.has(stop.stop));
    // If filtering would leave nothing, show the unfiltered list instead:
    // an empty list tells the user nothing useful.
    if (usable.length > 0) matches = usable;
  }

  const places = mergeNearbyStops(matches, SEARCH_MERGE_RADIUS_M).map(group => ({
    kind: 'STOP',
    name: lang === 'zh' ? (group.name_tc || group.name_en) : group.name_en,
    sub:  (lang === 'zh' ? group.name_en : group.name_tc) +
          (group.members.length > 1
            ? ' · ' + T('mergedStops').replace('{n}', group.members.length)
            : ''),
    lat: group.lat, lng: group.lng
  }));

  renderPlaceResults(which, places);
}

// Slower, over the network, only once typing pauses.
async function searchPlaces(which) {
  const typed = document.getElementById(which + '-text').value.trim();
  if (typed.length < 2) return;

  try {
    const response = await fetch(GEOCODER + encodeURIComponent(typed),
                                 { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);

    const json = await response.json();
    const found = (Array.isArray(json) ? json : []).slice(0, 6).map(entry => ({
      kind: 'PLACE',
      name: (lang === 'zh' ? entry.nameZH : entry.nameEN) || entry.nameEN || entry.nameZH || typed,
      sub:  (lang === 'zh' ? entry.addressZH : entry.addressEN) || '',
      lat: Number(entry.y), lng: Number(entry.x)
    })).filter(place => isFinite(place.lat) && isFinite(place.lng));

    if (found.length === 0) return;

    // Buildings and landmarks go ABOVE bus stops: someone typing a mall name
    // wants the mall, and the stop outside it is the second-best answer.
    const stops = mergeNearbyStops(rankStops(typed), SEARCH_MERGE_RADIUS_M).slice(0, 8).map(group => ({
      kind: 'STOP',
      name: lang === 'zh' ? (group.name_tc || group.name_en) : group.name_en,
      sub:  (lang === 'zh' ? group.name_en : group.name_tc) +
            (group.members.length > 1
              ? ' · ' + T('mergedStops').replace('{n}', group.members.length)
              : ''),
      lat: group.lat, lng: group.lng
    }));

    renderPlaceResults(which, [...found, ...stops]);
  } catch (error) {
    // The local stop results are already on screen, so a failure here is
    // invisible to the user — which is exactly what we want.
    console.warn('Place lookup unavailable:', error);
  }
}

function onSearchTyping(which) {
  searchLocalStops(which);                       // instant

  clearTimeout(searchTimers[which]);
  searchTimers[which] = setTimeout(() => searchPlaces(which), 600);   // then the network
}

for (const which of ['start', 'end']) {
  document.getElementById(which + '-text')
    .addEventListener('input', () => onSearchTyping(which));
}

for (const which of ['start', 'end']) {
  document.getElementById(which + '-go')
    .addEventListener('click', () => { searchLocalStops(which); searchPlaces(which); });
  document.getElementById(which + '-text').addEventListener('keydown', event => {
    if (event.key === 'Enter') { searchLocalStops(which); searchPlaces(which); }
  });
}

// 6. DRAW THE JOURNEY
// ============================================================
function redrawJourney() {
  journeyLayer.clearLayers();
  const walkInfo = document.getElementById('walkinfo');

  showChosen('start-chosen', startPoint);
  showChosen('end-chosen', endPoint);

  if (startPoint) drawPoint(startPoint, '#166534', 'A', T('start'));
  if (endPoint)   drawPoint(endPoint, '#991b1b', 'B', T('destination'));

  const findButton = document.getElementById('findbuses');
  findButton.disabled = !(startPoint && endPoint);
  findButton.textContent = findButton.disabled ? T('setBoth') : T('findBuses');

  if (!endPoint) { walkInfo.style.display = 'none'; return; }

  // ONE SET OF INSTRUCTIONS AT A TIME.
  // This block is the hint shown while a trip is being ENTERED: "set this
  // destination and the nearest stop is X". Once real routes are on screen
  // the journey card names the stop the rider actually gets off at, leg by
  // leg, and the two disagree whenever the route alights somewhere better —
  // 深水灣, 香島道 and a 1-minute walk in the card, against the Aberdeen
  // Tunnel and 28 minutes here. A rider following the wrong one ends up
  // walking half an hour, so the guess stands down once the answer exists.
  if (document.getElementById('panel').classList.contains('results')) {
    walkInfo.style.display = 'none';
    return;
  }

  const walk = walkingEstimate(endPoint.stopMetres);
  walkInfo.style.display = 'block';
  walkInfo.innerHTML =
    '<div>' + T('getOffAt') + '</div>' +
    '<div class="big">' + stopName(endPoint.stop) + '</div>' +
    '<div>' + T('thenWalkAbout') + '</div>' +
    '<div class="big">' + walk.minutes + T('min') + ' · ' + walk.metres + ' m</div>' +
    '<div class="warn">' + T('walkWarn') + '</div>';
}

function showChosen(elementId, point) {
  const element = document.getElementById(elementId);
  const which = elementId.split('-')[0];               // 'start' or 'end'
  const saveButton = document.getElementById(which + '-save');

  if (!point) {
    element.textContent = T('notSet');
    element.classList.add('empty');
    if (saveButton) saveButton.style.display = 'none';
    return;
  }

  element.classList.remove('empty');
  element.innerHTML = '<b>' + point.label + '</b>' +
    (point.stop ? '<br><small>' + T('nearestStop') + ': ' + stopName(point.stop) + '</small>' : '');

  // The moment a point is set, offer to save it. Waiting until after a
  // journey search made people type the same place over and over.
  if (saveButton) {
    const alreadySaved = favList(which).some(f => f.label === point.label);
    saveButton.style.display = 'block';
    saveButton.textContent = alreadySaved
      ? T('alreadyFav')
      : T('saveFav') + ' — ' + point.label;
    saveButton.disabled = alreadySaved;
    saveButton.style.opacity = alreadySaved ? '0.6' : '1';
  }
}

function drawPoint(point, colour, letter, text) {
  L.marker([point.lat, point.lng], {
    zIndexOffset: 1000,
    icon: L.divIcon({ className:'', iconSize:null, iconAnchor:[22,22],
      html: '<div class="endwrap' + (letter === 'B' ? ' finish' : '') + '">' +
            '<div class="enddot">' + letter + '</div>' +
            '<div class="endtext">' + text + '<br>' + point.label + '</div></div>' })
  }).addTo(journeyLayer);

  if (!point.stop) return;
  const stopLatLng = [Number(point.stop.lat), Number(point.stop.long)];

  // Dotted, because it is a straight line — not the actual pavement route.
  L.polyline([[point.lat, point.lng], stopLatLng],
             { color:colour, weight:3, dashArray:'2 8' }).addTo(journeyLayer);

  L.circleMarker(stopLatLng, { radius:10, color:colour, weight:4,
    fillColor:'white', fillOpacity:1 })
    .addTo(journeyLayer).bindPopup('<b>' + stopName(point.stop) + '</b><br>' + T('nearestStop'));
}


// ============================================================
// FAVOURITES (up to 12 departures and 12 arrivals)
// ============================================================
// Saved in the browser so they survive closing the tab. If storage is
// blocked or full, the app still works — favourites just do not persist.
// Departures and arrivals are two separate lists. A place you both leave
// from and travel to has to be saved on both sides, which costs a slot in
// each — the trade for never scrolling past somewhere you would only ever
// go TO while choosing where to start.
// The two result sets live side by side. currentPicks always points at
// whichever section is open, so every existing card, map and fare function
// keeps working without knowing the bottom bar exists.
//
// These sit up here, not beside the bar code, because paintBottomBar() runs
// during start-up to label the bar — and a `let` cannot be read before the
// line that declares it has executed.
//
// routeStopsState is here for the same reason: applyLanguage() rebuilds the
// stop list and also runs during start-up. `typeof` is no escape either — on
// a `let` that has not been reached yet it throws rather than returning
// "undefined", so the guard has to be the declaration itself.
let currentPicks = [];
let routeStopsState = null;   // the open stop list, or null
let weatherData = null;       // last Observatory reading — setPoint() reads it
let busPicks = [], railPicks = [], railOptions = [], activeMode = 'bus';

// The same rule once more, for the installing-and-offline section near the
// bottom of this file. renderWeatherBar() reads updateWaiting and
// renderSettings() reads installPrompt, and both of those can be called from
// SETTINGS or from a GPS answer long before the bottom of the file is
// reached — so the declarations are up here where they cannot be beaten to
// it. The code that uses them is all together further down.
let updateWaiting = null;   // registration holding a new version, if any
let installPrompt = null;   // Chrome's install offer, saved until it is wanted
let updateAsked   = false;  // did the rider ask for the new version?

// Rail state lives up here for the same reason as the picks above: loadMtr()
// is called during start-up so stations are searchable immediately, and a
// `let` cannot be assigned before the line declaring it has run. When that
// happened inside an async function the error vanished into an unhandled
// rejection and the stations simply never appeared — no message, no clue.
const MTR_URL = 'mtr.json';
let mtrData = null;        // { lines, stations, fares, lineNames }
let railGraph = null;      // station code -> [{ to, line, minutes }]

// Same rule again: askAboutLocation() runs at start-up, so anything it reads
// must be declared before then. This one was especially sneaky — geoChoice()
// wraps its read in a try/catch for browsers with storage disabled, and that
// catch quietly swallowed the "cannot access before initialization" error.
// The remembered answer came back as null and the app asked every single
// time, with nothing in the console to explain why.
let herePoint = null;                 // where we currently think the user is
const GEO_CHOICE = 'hkfast-geo';

// ---- SAVED DEPARTURES -----------------------------------------------
// A saved ROUTE NUMBER is ambiguous: a KMB route direction has a median of 22
// stops and two thirds of routes run both ways, so "60X" alone cannot say
// which platform or which way. What a commuter actually means is a
// DEPARTURE — this route, from this stop, going that way. That is what gets
// saved, and it is why the star lives on the arrival row, where all three
// facts are already sitting together.
const MAX_DEPARTURES = 6;
let departures = [];

// SAVED STOPS: a pole, kept whole (id, both names, position) so the tab can
// open it without looking anything up.
// TWELVE, not eight: four bubbles to a row and three rows fills exactly one
// grid, and the grid is small enough that twelve of them cost less height
// than eight full-width pills did.
const MAX_STOPS = 12;
let stopFavs = [];
function loadStopFavs() {
  try { stopFavs = JSON.parse(localStorage.getItem('hkfast-stops') || '[]'); } catch (e) { stopFavs = []; }
}
function saveStopFavs() {
  try { localStorage.setItem('hkfast-stops', JSON.stringify(stopFavs)); } catch (e) {}
  if (typeof paintBottomBar === 'function') paintBottomBar();
}
function isSavedStop(stopId) { return stopFavs.some(f => f.stop === stopId); }

// Places people go, for the 車站 tab's 我要去 box — names, not poles, because
// "屯門轉車站" is the thing a rider knows; which pole they leave from depends
// on where they are standing today. Max 12 — one full 4x3 grid — newest first.
const MAX_DESTS = 12;
// A saved destination is either a bare name (how they were stored before
// nicknames existed) or { name, nick }. The NAME is what every search and
// every alert match uses and is never touched by a rename; the NICK is only
// ever shown. Keeping them apart is what lets someone call 屯門公路轉車站
// 「返屋企」 without the app losing track of which place that is.
function destName(d)  { return typeof d === 'string' ? d : String((d && d.name) || ''); }
function destLabel(d) { return (d && d.nick) ? String(d.nick) : destName(d); }
function favLabel(f)  { return (f && f.nick) ? String(f.nick) : stopName(f); }

let stopDests = [];
try {
  stopDests = JSON.parse(localStorage.getItem('hkfast-stopdests') || '[]')
    .map(d => typeof d === 'string' ? d : (d && d.name ? { name: String(d.name), nick: d.nick ? String(d.nick) : '' } : null))
    .filter(d => d && destName(d));
} catch (e) { stopDests = []; }
function saveStopDests() { try { localStorage.setItem('hkfast-stopdests', JSON.stringify(stopDests)); } catch (e) {} }
function isSavedDest(name) { const n = String(name || '').trim(); return stopDests.some(d => destName(d) === n); }
function toggleStopDest(name) {
  name = String(name || '').trim();
  if (!name) return false;
  const at = stopDests.findIndex(d => destName(d) === name);
  if (at >= 0) { stopDests.splice(at, 1); saveStopDests(); return false; }
  if (stopDests.length >= MAX_DESTS) return null;
  stopDests.unshift(name); saveStopDests(); return true;
}
function toggleStopFav(stop) {
  const at = stopFavs.findIndex(f => f.stop === stop.stop);
  if (at >= 0) { stopFavs.splice(at, 1); saveStopFavs(); return false; }
  if (stopFavs.length >= MAX_STOPS) return null;
  stopFavs.unshift({ stop: stop.stop, name_en: stop.name_en, name_tc: stop.name_tc, lat: stop.lat, long: stop.long });
  saveStopFavs();
  return true;
}

// SAVED TRAINS: a station, a line and a direction — the three things the MTR
// screen asks for — kept so the next time is one tap.
const MAX_TRAINS = 6;
let trainFavs = [];
function loadTrainFavs() {
  try { trainFavs = JSON.parse(localStorage.getItem('hkfast-trains') || '[]'); } catch (e) { trainFavs = []; }
}
function saveTrainFavs() {
  try { localStorage.setItem('hkfast-trains', JSON.stringify(trainFavs)); } catch (e) {}
  if (typeof paintBottomBar === 'function') paintBottomBar();
}
function trainFavKey(t) { return t.station + '|' + t.line + '|' + t.dir; }
function isSavedTrain(station, line, dir) {
  const key = station + '|' + line + '|' + dir;
  return trainFavs.some(t => trainFavKey(t) === key);
}
function toggleTrainFav(entry) {
  const key = trainFavKey(entry);
  const at = trainFavs.findIndex(t => trainFavKey(t) === key);
  if (at >= 0) { trainFavs.splice(at, 1); saveTrainFavs(); return false; }
  trainFavs.unshift(entry);
  if (trainFavs.length > MAX_TRAINS) trainFavs.pop();
  saveTrainFavs();
  return true;
}

// Attribute values are built into an HTML string, so anything from the feed
// has to be neutralised before it goes in.
function esc(text) {
  return String(text || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;')
                           .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function departureKey(route, dir, stop) {
  return String(route).toUpperCase() + '|' + (dir || '') + '|' + stop;
}

function isSavedDeparture(route, dir, stop) {
  if (!stop) return false;
  const key = departureKey(route, dir, stop);
  return departures.some(d => departureKey(d.route, d.dir, d.stop) === key);
}

function loadDepartures() {
  try { departures = JSON.parse(localStorage.getItem('hkfast-deps') || '[]'); }
  catch (e) { departures = []; }
}

function saveDepartures() {
  try { localStorage.setItem('hkfast-deps', JSON.stringify(departures)); }
  catch (e) { console.warn('Could not save departures:', e); }
  if (typeof paintBottomBar === 'function') paintBottomBar();
}

function toggleDeparture(entry) {
  const key = departureKey(entry.route, entry.dir, entry.stop);
  const at = departures.findIndex(d => departureKey(d.route, d.dir, d.stop) === key);
  if (at >= 0) { departures.splice(at, 1); saveDepartures(); return false; }

  departures.unshift(entry);
  if (departures.length > MAX_DEPARTURES) departures.pop();
  saveDepartures();
  return true;
}

// Eight per list. The chip row beside each label shows five at a time and
// scrolls to the rest, so everything saved is still reachable from the form —
// a saved place that only existed on the FAVOURITES screen would be missing
// from the row it was saved for.
const MAX_FAVS = 8;
const FAV_SLOTS = 5;        // empty placeholders drawn in the chip row
const FAV_COLOURS = 8;      // one per possible entry in a list

// The same eight colours the CSS uses for .c1–.c8, so a chip in the form and
// its row on the favourites screen are recognisably the same place.
const FAV_COLOUR_HEX = ['#166534', '#1e40af', '#6b21a8', '#9a3412',
                        '#115e59', '#9d174d', '#3f6212', '#92400e'];

let favStart = [];          // places you leave FROM
let favEnd   = [];          // places you travel TO

// Every favourite lookup goes through here, so 'start' and 'end' never get
// mixed up by a stray array reference.
function favList(which) { return which === 'end' ? favEnd : favStart; }

// The lowest colour nobody in THIS list is using. Favourites are added to the
// front, so colouring by position would repaint every chip each time one was
// saved — the green one you reach for would be blue tomorrow. The colour is
// pinned to the place instead, and freed again when it is deleted.
function freeFavColour(which) {
  const taken = new Set(favList(which).map(f => f.c));
  for (let c = 1; c <= FAV_COLOURS; c++) if (!taken.has(c)) return c;
  return 1;
}

const FAV_KEY = { start: 'hkfast-favs-start', end: 'hkfast-favs-end' };

function loadFavourites() {
  const read = key => {
    try { return JSON.parse(localStorage.getItem(key) || '[]'); }
    catch (e) { return []; }
  };

  favStart = read(FAV_KEY.start);
  favEnd   = read(FAV_KEY.end);

  // ONE-TIME MIGRATION. Before this there was a single list usable at either
  // end, so the only faithful split is to put every saved place in both —
  // dropping a favourite from one side because we could not tell which end it
  // was meant for would be losing something the user saved.
  const old = read('hkfast-favs');
  if (old.length && !favStart.length && !favEnd.length) {
    favStart = old.slice(0, MAX_FAVS).map(f => ({ ...f }));
    favEnd   = old.slice(0, MAX_FAVS).map(f => ({ ...f }));
  }

  // SECOND MIGRATION. The trip-planner form these two lists belonged to is
  // gone — the ⭐ buttons that filled them are inside a block the CSS now
  // hides, so nothing can add to them any more and nothing can reach them.
  // Their contents are still places the rider chose to keep, so they move to
  // the 車站 tab's destination list, which is the one list that takes a bare
  // name. A start favourite goes there too: the same argument the split
  // migration above made — somewhere you leave from is nearly always
  // somewhere you come back to, and dropping it to be tidy loses more.
  if (favStart.length || favEnd.length) {
    for (const fav of favEnd.concat(favStart)) {
      const name = String(fav.label || '').trim();
      if (name && !isSavedDest(name) && stopDests.length < MAX_DESTS) stopDests.push(name);
    }
    saveStopDests();
    favStart = [];
    favEnd   = [];
  }

  // Anything saved before colours existed gets one now, per list, so an
  // existing install does not open to a row of identical chips.
  for (const which of ['start', 'end']) {
    favList(which).forEach((fav, i) => {
      if (!fav.c) fav.c = (i % FAV_COLOURS) + 1;
    });
    saveFavourites(which, true);
  }
  renderFavourites();
}

// quiet:true writes without redrawing — used during start-up, before the
// elements the redraw touches necessarily exist.
function saveFavourites(which, quiet) {
  for (const side of (which ? [which] : ['start', 'end'])) {
    try { localStorage.setItem(FAV_KEY[side], JSON.stringify(favList(side))); }
    catch (e) { console.warn('Could not save favourites:', e); }
  }
  if (quiet) return;
  renderFavourites();
  // The ⭐ button reads "already saved" and disables itself. Deleting a place
  // from the favourites screen has to reach that button too, or the place it
  // describes can never be saved again.
  if (typeof startPoint !== 'undefined') showChosen('start-chosen', startPoint);
  if (typeof endPoint   !== 'undefined') showChosen('end-chosen',   endPoint);
  // The top bar carries a count, so it has to hear about this too.
  if (typeof paintBottomBar === 'function') paintBottomBar();
}

function addFavourite(which, point) {
  if (!point) return;
  const list = favList(which);

  // Already saved on this side? Do nothing rather than pile up duplicates.
  // The same place on the other side is a different entry and is fine.
  if (list.some(f => f.label === point.label)) {
    status.textContent = T('alreadyFavMsg').replace('{name}', point.label);
    return;
  }

  list.unshift({ label: point.label, lat: point.lat, lng: point.lng,
                 c: freeFavColour(which) });
  if (list.length > MAX_FAVS) list.pop();       // oldest drops off
  saveFavourites(which);
  status.textContent = T('savedFav').replace('{name}', point.label);
}

function removeFavourite(which, index) {
  favList(which).splice(index, 1);
  saveFavourites(which);
}

// Both lists as one, deduplicated by name — for the places that do not care
// which end a favourite was saved for.
function allFavourites() {
  const out = [];
  for (const fav of favStart.concat(favEnd)) {
    if (!out.some(f => f.label === fav.label)) out.push(fav);
  }
  return out;
}

function renderFavourites() {
  for (const which of ['start', 'end']) {
    const row = document.getElementById(which + '-favs');
    if (!row) continue;
    row.innerHTML = '';

    // This end's own list: the chips beside 起點 are places you leave from,
    // the ones beside 目的地 are places you travel to.
    const list = favList(which);

    // Always at least five places in the row, so the row never changes height
    // and the empty slots say plainly that more can be saved. Beyond five the
    // row scrolls sideways rather than shrinking the chips — all eight stay
    // reachable, and none drops below a size worth aiming at.
    const slots = Math.max(FAV_SLOTS, list.length);
    // Colours still unclaimed, so the empty slots show what is left rather
    // than repeating a colour already in use.
    const spare = [];
    for (let c = 1; c <= FAV_COLOURS; c++) {
      if (!list.some(f => f.c === c)) spare.push(c);
    }

    for (let index = 0; index < slots; index++) {
      const fav = list[index];

      if (!fav) {
        const blank = document.createElement('span');
        blank.className = 'favslot c' + (spare.shift() || 1);
        row.appendChild(blank);
        continue;
      }
      const colour = ' c' + (fav.c || 1);
      // Two initials fit in a small square. The full name is on hover and
      // read out to screen readers, so nothing is lost.
      // Chinese has no spaces, so "first letter of each word" gives one
      // character and everything looks identical. Take two characters instead.
      const clean = fav.label.replace(/\(.*?\)/g, '').trim();
      const initials = /[\u4e00-\u9fff]/.test(clean)
        ? clean.replace(/[^\u4e00-\u9fff]/g, '').slice(0, 2)
        : clean.split(/\s+/).map(word => word[0]).join('').slice(0, 2).toUpperCase();

      const chip = document.createElement('button');
      chip.className = 'favchip' + colour;
      chip.title = fav.label;
      chip.setAttribute('aria-label', 'Use favourite: ' + fav.label);
      chip.innerHTML = initials + '<span class="x">✕</span>';

      chip.addEventListener('click', event => {
        // Tapping the ✕ removes it; tapping anywhere else uses it.
        if (event.target.classList.contains('x')) { removeFavourite(which, index); return; }
        setPoint(which, fav.lat, fav.lng, fav.label);
        map.setView([fav.lat, fav.lng], 16);
      });

      row.appendChild(chip);
    }
  }
}

// ============================================================
// 6b. FIND BUSES FROM START TO DESTINATION
// ============================================================
// This finds DIRECT routes only — one bus, no changing. Journeys needing a
// transfer are not covered yet; that is a much bigger problem and is the
// honest next step rather than something to fake.
//
// How it works, in plain steps:
//   1. Find every bus stop within walking distance of START and of DESTINATION.
//   2. Look up which routes serve each of those stops, and in what order.
//   3. Keep any route that visits a START stop BEFORE a DESTINATION stop.
//      (Order matters — the same route going the other way is no use.)
//   4. Estimate the time and sort the best first.

// ---- OPTIONAL: real road shapes for bus routes ----------------------
// The Transport Department publishes bus route geometry in its
// "Routes and fares of public transport (GeoJSON)" dataset, under the
// resource named "Bus Route (CSDI Portal)":
//   https://data.gov.hk/en-data/dataset/hk-td-tis_23-routes-fares-geojson
//
// Open that page, find that resource, copy its download URL, and paste it
// below. Until then the app joins consecutive bus stops, which follows the
// roads closely for local routes but cuts corners on long express hops.
// Transport Department bus route file: real road geometry AND fares.
// Data dictionary:
// https://static.data.gov.hk/td/routes-fares-geojson/dataspec/ptroutefare_geojson_dataspec.pdf
const TD_BUS_URL = 'https://static.data.gov.hk/td/routes-fares-geojson/JSON_BUS.json';

// ---- FARES ----------------------------------------------------------
// The Transport Department publishes fares only inside Microsoft Access
// (.mdb) files, which a browser cannot read. HK Bus Crawling republishes
// the same government data as JSON, rebuilt daily.
//
// LICENSING NOTE (why this is safe to use):
// The crawler itself is GPL-2.0, but this file is its OUTPUT. GPL-2.0 says
// "the output from the Program is covered only if its contents constitute a
// work based on the Program", and the FSF adds that output "inherits the
// copyright status of the input it was generated from". The input here is
// DATA.GOV.HK open data — free for commercial and non-commercial use with
// attribution. GPL would only apply if we copied their Python code, which
// we have not. We credit both sources, as each asks.
//   Crawler: https://github.com/hkbus/hk-bus-crawling  (cite: HK Bus Crawling@2021)
//
// HOST NOTE: this file is also published at hkbus.github.io, but GitHub Pages
// sends NO Access-Control-Allow-Origin header, so a browser refuses to read
// it and every fare, timetable and Citybus stop silently vanishes. The raw
// host below serves the identical file from the same repository's gh-pages
// branch and does send "Access-Control-Allow-Origin: *".
const HKBUS_URL = 'https://raw.githubusercontent.com/hkbus/hk-bus-crawling/gh-pages/routeFareList.min.json';

// The network file above is 8.2 MB, most of which this app never reads: MTR,
// light rail, ferries, holidays, KMB stop lists we already get from the KMB
// API. LITE_URL is that same data trimmed to what the planner actually uses —
// Citybus, New Lantao Bus and green minibus — and it sits beside this page,
// so it costs no mobile data at all. The network file stays as the fallback
// for anyone running this without the local copy.
const LITE_URL = 'hk-bus-lite.json';

let fareIndex = null;      // "ROUTE|BOUND|TYPE|CO" -> { fares, stops }
let hkbusRoutes = null;    // the raw route list, reused to build the journey index
let serviceInfo = new Map();   // routeKey -> { freq } for working out service hours
let ctbStops = [];         // Citybus stops, reshaped to look like KMB stops

// One number that decides how a value is read, in one place: this file nests
// things differently from the government feeds, so we unwrap it defensively.
function readStopRecord(id, record) {
  if (!record) return null;

  // The trimmed file stores a stop as a bare array — [name EN, name ZH, lat,
  // lng] — because 7,600 of them as objects cost about a third of a megabyte
  // in repeated key names. The network file uses objects. Accept both.
  if (Array.isArray(record)) {
    const lat = Number(record[2]), lng = Number(record[3]);
    if (!isFinite(lat) || !isFinite(lng)) return null;
    return { stop: id, name_en: record[0] || id, name_tc: record[1] || '', lat, long: lng };
  }

  const lat = Number(record.location ? record.location.lat : record.lat);
  const lng = Number(record.location ? record.location.lng : record.long);
  if (!isFinite(lat) || !isFinite(lng)) return null;

  const name = record.name || {};
  return {
    stop: id,
    name_en: name.en || record.name_en || id,
    name_tc: name.zh || record.name_tc || '',
    lat, long: lng
  };
}

// The trimmed file stores each route as short keys to keep it small. Widen it
// back into the shape the rest of this app already expects, so nothing
// downstream has to care which file the data arrived in.
function widenLiteRoutes(list) {
  const out = {};
  (list || []).forEach((row, index) => {
    out['lite' + index] = {
      route: row.r, serviceType: row.t,
      bound: row.b || {}, stops: row.s || {},
      fares: row.f || null, freq: row.q || null
    };
  });
  return out;
}

async function loadFareData() {
  if (fareIndex) return;
  fareIndex = new Map();

  try {
    let data = await cacheGet('hkbus-lite');
    let stopList;

    if (!data) {
      // Local trimmed file first. It is beside this page, so on a phone it
      // costs nothing and finishes before the network file would have begun.
      try {
        const local = await fetch(LITE_URL, { signal: AbortSignal.timeout(20000) });
        if (!local.ok) throw new Error('server said ' + local.status);
        data = await local.json();
      } catch (localError) {
        console.warn('Trimmed file unavailable, downloading the full one:', localError);
        const response = await fetch(HKBUS_URL, { signal: AbortSignal.timeout(60000) });
        if (!response.ok) throw new Error('server said ' + response.status);
        const full = await response.json();
        data = { routes: null, stops: full.stopList || {}, routeList: full.routeList || {} };
      }
      cachePut('hkbus-lite', data);
    }

    hkbusRoutes = data.routes ? widenLiteRoutes(data.routes) : (data.routeList || {});
    stopList = data.stops || {};

    // Citybus, minibus and NLB have no bulk stop download of their own, so
    // their stops travel with this file. Collecting them here is what makes
    // those journeys possible at all.
    const wanted = new Set();
    for (const entry of Object.values(hkbusRoutes)) {
      if (!entry || !entry.stops) continue;
      for (const co of PLANNED_OPERATORS)
        for (const id of (entry.stops[co] || [])) wanted.add(id);
    }

    ctbStops = [];
    for (const id of wanted) {
      const stop = readStopRecord(id, stopList[id]);
      if (stop) ctbStops.push(stop);
    }

    // Fares, keyed per company so KMB 6 and Citybus 6 never collide.
    for (const entry of Object.values(hkbusRoutes)) {
      if (!entry || !entry.route) continue;

      for (const company of Object.keys(entry.bound || {})) {
        const key = String(entry.route).toUpperCase() + '|' + entry.bound[company] +
                    '|' + (entry.serviceType || '1') + '|' + company;

        fareIndex.set(key, {
          fares: entry.fares || [],
          stops: (entry.stops || {})[company] || []
        });

        // Keep the timetable summary so we can tell whether a route is
        // actually running right now. Never let a blank one overwrite a
        // timetable the KMB file already supplied.
        if (entry.freq || !serviceInfo.has(key))
          serviceInfo.set(key, { freq: entry.freq || null });
      }
    }

    console.log('Fare routes indexed:', fareIndex.size, '· Citybus stops:', ctbStops.length);
  } catch (error) {
    console.warn('Fare data unavailable:', error);
  }
}

// ============================================================
// WHAT KIND OF DAY IS IT?
// ============================================================
// Hong Kong bus timetables differ on Sundays and public holidays — fewer
// early buses, different last buses. Treating every day as a weekday means
// quietly wrong service hours for about a fifth of the year.
//
// Public holidays come from 1823 (Digital Policy Office), published on
// DATA.GOV.HK under the same free terms as the bus data. Sundays and public
// holidays count as the same class: the General Holidays Ordinance treats
// Sunday as a general holiday, and moves a clashing holiday to the next day.
// Public holidays come from the General Holidays Ordinance (Cap. 149) lists
// the Government gazettes each year. 1823 publishes them as a live iCal feed,
// but that server sends NO Access-Control-Allow-Origin header, so a browser
// can never read it — not from a file, not from localhost, not from a real
// domain. So the gazetted dates live in a small file beside this page, and
// the feed stays only as a long-shot fallback in case that file is missing.
//
// Sundays and public holidays count as the same class of day: the Ordinance
// treats Sunday as a general holiday and moves a clashing holiday to the next
// free day. dayType() already treats every Sunday as a holiday from the date
