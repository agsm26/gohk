// 9. ROUTE LOOKUP
// ============================================================
const routeInput = document.getElementById('route-text');
const routeList  = document.getElementById('route-results');

// Step 1: type a route number, see which routes match — one row per NUMBER,
// not per direction. Choosing the direction is a separate, clearer step.
// Typing a route number is the signal that the user is looking up a bus, not
// planning a trip. The panel switches over on the first character and stays
// there until the ✕ — a mode that turned itself off again mid-task would be
// worse than one that never turned on.
function enterRouteMode() {
  const panel = document.getElementById('panel');
  panel.classList.remove('favmode', 'setmode', 'mtrmode', 'stopmode');
  document.getElementById('favview').style.display = 'none';
  document.getElementById('setview').style.display = 'none';
  document.getElementById('mtrview').style.display = 'none';
  document.getElementById('stopview').style.display = 'none';
  panel.classList.add('routemode');
  // Looking up a bus belongs under the bus tab. Leaving the old section
  // highlighted would point at a screen that is no longer on display.
  if (activeMode !== 'bus') { activeMode = 'bus'; paintBottomBar(); }
  panel.scrollTop = 0;
}

function leaveRouteMode() {
  const panel = document.getElementById('panel');
  panel.classList.remove('routemode');
  routeInput.value = '';
  routeList.innerHTML = '';
  clearRouteStops();
  routeLayer.clearLayers();
  document.getElementById('routebanner').style.display = 'none';
  journeyMode = false;
  drawStops();
  panel.scrollTop = 0;
  // Route lookup used to BE a tab, so closing it could just leave the panel
  // as it was. It is now a mode of the 巴士 tab, and leaving it with every
  // view hidden would show a blank panel.
  showMode('stop');
}

document.getElementById('route-exit').addEventListener('click', leaveRouteMode);

// ---- 📍 WHICH OF THESE STOPS AM I AT? ----
// The list marks itself when a fix is already to hand, but on a cold open
// there is none, and scrolling thirty-four stops hunting for a name you half
// remember is exactly the job a phone should do.
function markNearestOnRoute() {
  if (!routeStopsState) { status.textContent = T('rsPickRouteFirst'); return; }
  withHere(here => {
    if (!routeStopsState) return;
    const near = nearestRouteStop(here);
    if (!near) { status.textContent = T('stopNoneNear'); return; }
    routeStopsState.boardAt = near.index;
    routeStopsState.alightAt = null;            // a new boarding stop ends the old ride
    routeStopsState.autoBoard = true;
    routeStopsState.autoMetres = near.metres;
    paintStopCounts();
    syncRideWatch();
    scrollToMarkedStop();
    paintWalkLink();
    const stop = routeStopsState.stops[near.index];
    status.textContent = T('rsNearestFound')
      .replace('{s}', plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en))
      .replace('{m}', Math.round(near.metres));
  });
}
document.getElementById('route-here').addEventListener('click', markNearestOnRoute);

// ---- ➤ WALK ME THERE ----
// A real link with a real href, not a scripted window.open: the open has to
// happen on the tap itself, and a fix that arrives a second later would be
// blocked as a popup. So the arrow stays dim until 📍 has found the stop,
// and then it is simply a link the rider taps.
function walkUrl(lat, lng, fromLat, fromLng) {
  // Android and Windows are asked FIRST. The second test below is the usual
  // trick for spotting an iPad, which reports itself as a desktop Mac — but
  // it fires on anything claiming MacIntel with a touch screen, and that
  // includes a phone being emulated on a Mac. Naming the two platforms that
  // certainly are not Apple removes the whole class of misfire.
  const agent = navigator.userAgent || '';
  const onApple = /Android|Windows/i.test(agent) ? false
                : (/iPad|iPhone|iPod|Macintosh/.test(agent) &&
                   (/iPad|iPhone|iPod/.test(agent) || navigator.maxTouchPoints > 1));
  // WHERE THE WALK STARTS.
  // With no origin both apps start from wherever the phone is, which is right
  // for "get me to the stop I am walking to now". The walk OFF the last bus
  // is different: the rider is looking at it before they have got there, so
  // the alighting stop is named as the starting point and the route drawn is
  // the one they will actually take when they step off.
  const hasFrom = isFinite(fromLat) && isFinite(fromLng);
  return onApple
    ? 'https://maps.apple.com/?daddr=' + lat + ',' + lng +
      (hasFrom ? '&saddr=' + fromLat + ',' + fromLng : '') + '&dirflg=w'
    : 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng +
      (hasFrom ? '&origin=' + fromLat + ',' + fromLng : '') + '&travelmode=walking';
}
function paintWalkLink() {
  const link = document.getElementById('route-walk');
  if (!link) return;
  const st = routeStopsState;
  const stop = st && st.boardAt !== null ? st.stops[st.boardAt] : null;
  const lat = stop ? Number(stop.lat) : NaN, lng = stop ? Number(stop.long) : NaN;
  if (!isFinite(lat) || !isFinite(lng)) {
    link.removeAttribute('href');
    link.classList.add('off');
    link.title = T('rsWalkNeedStop');
    return;
  }
  link.href = walkUrl(lat, lng);
  link.classList.remove('off');
  link.title = T('rsWalkTo').replace('{s}', plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en));
}

routeInput.addEventListener('input', () => {
  const typed = routeInput.value.trim().toUpperCase();
  routeList.innerHTML = '';
  if (!typed) return;
  enterRouteMode();

  // Group KMB entries by route number so "60M" appears once, not four times.
  const kmbByNumber = new Map();
  for (const route of allRoutes.filter(r => r.route.toUpperCase().startsWith(typed))) {
    if (!kmbByNumber.has(route.route)) kmbByNumber.set(route.route, []);
    kmbByNumber.get(route.route).push(route);
  }

  const kmbRows = [...kmbByNumber].slice(0, 6);
  const ctbRows = ctbRoutes.filter(r => r.route.toUpperCase().startsWith(typed)).slice(0, 4);

  // Typed the whole number and it is the only match: no list to tap through,
  // straight to "which way?". "60X" is one tap fewer; "6" still shows 6, 6C…
  if (kmbRows.length + ctbRows.length === 1) {
    const only = kmbRows[0] ? { no: kmbRows[0][0], variants: kmbRows[0][1], co: 'KMB' } : { no: ctbRows[0].route, variants: [ctbRows[0]], co: 'CITYBUS' };
    if (only.no.toUpperCase() === typed) { showDirections(only.no, only.variants, only.co); return; }
  }

  for (const [routeNo, variants] of kmbRows) {
    const n = kmbDirections(variants).main.length;
    const item = document.createElement('li');
    item.innerHTML = '<span class="badge badge-kmb">KMB</span>' +
                     '<span class="routeno">' + routeNo + '</span>' +
                     '<span style="color:#4b5563">' + n + ' ' + (n > 1 ? T('directions') : T('direction')) + '</span>';
    item.addEventListener('click', () => showDirections(routeNo, variants, 'KMB'));
    routeList.appendChild(item);
  }
  for (const route of ctbRows) {
    const item = document.createElement('li');
    item.innerHTML = '<span class="badge badge-ctb">CITYBUS</span>' +
                     '<span class="routeno">' + route.route + '</span>' +
                     '<span style="color:#4b5563">2 ' + T('directions') + '</span>';
    item.addEventListener('click', () => showDirections(route.route, [route], 'CITYBUS'));
    routeList.appendChild(item);
  }

  if (!routeList.children.length)
    routeList.innerHTML = '<li>' + T(allRoutes.length === 0 && ctbRoutes.length === 0 ? 'dataLoading' : 'noMatch') + '</li>';
});

// Step 2: which way is the bus going? One sheet, one big button per
// direction, then the stop list. "Outbound" means nothing to most riders, so
// each button says 開往 <terminus>. Peak-hour and special routings are folded
// away behind one line — they are real, but they are not the question.
function kmbDirections(variants) {
  const byBound = new Map();
  for (const v of variants) { if (!byBound.has(v.bound)) byBound.set(v.bound, []); byBound.get(v.bound).push(v); }
  const main = [], special = [];
  for (const list of byBound.values()) {
    const normal = list.find(v => String(v.service_type) === '1') || list[0];
    main.push(normal);
    for (const v of list) if (v !== normal) special.push(v);
  }
  return { main, special };
}

function showDirections(routeNo, variants, company) {
  routeList.innerHTML = '';
  routeInput.blur();                     // keyboard down before the sheet comes up

  let choices = [];                      // { from, to, note, go }
  let extras  = [];
  if (company === 'CITYBUS') {
    const route = variants[0];
    for (const direction of ['outbound', 'inbound']) {
      const from = direction === 'outbound' ? endName(route, 'orig') : endName(route, 'dest');
      const to   = direction === 'outbound' ? endName(route, 'dest') : endName(route, 'orig');
      choices.push({ from, to, note: null, go: () => showCtbRoute(route, direction, from, to) });
    }
  } else {
    const { main, special } = kmbDirections(variants);
    choices = main.map(r => ({ from: endName(r, 'orig'), to: endName(r, 'dest'), note: null, go: () => showKmbRoute(r) }));
    extras  = special.map(r => ({ from: endName(r, 'orig'), to: endName(r, 'dest'), note: T('special'), go: () => showKmbRoute(r) }));
  }

  // TAKING OVER THE PANEL IS THIS FUNCTION'S JOB, not the caller's.
  // It used to be done by the route box's own typing handler, which called
  // enterRouteMode() on every keystroke — so a route opened from anywhere
  // else drew its stop list UNDERNEATH the picker instead of replacing it.
  const goRoute = choice => { goToRouteMode(routeNo); choice.go(); };

  // A circular route has one way to go: no question to ask.
  if (choices.length === 1 && !extras.length) { goRoute(choices[0]); return; }

  const sheet = document.getElementById('dirsheet');
  const card  = document.getElementById('dircard');
  const button = (c, i, cls) =>
    '<button class="dirbtn' + (cls || '') + '" data-dir="' + i + '">' +
    '<b>' + T('towards') + ' <i>' + esc(c.to) + '</i></b>' +
    '<small>' + T('from') + ' ' + esc(c.from) + (c.note ? ' · <span class="dirnote">⚠ ' + esc(c.note) + '</span>' : '') + '</small></button>';
  const all = choices.concat(extras);
  card.innerHTML = '<div class="dirhead"><b>' + esc(routeNo) + '</b><span>' + T('dirTitle') + '</span></div>' +

async function showCtbRoute(route, dir, from, to) {
  routeList.innerHTML = '';
  routeLayer.clearLayers();
  status.textContent = T('loadingRoute').replace('{r}', route.route);
  const key = 'ctb-rs-' + route.route + '-' + dir;

  try {
    let ids = await cacheGet(key);
    if (!ids) {
      const response = await fetch(CTB_BASE + '/route-stop/CTB/' +
        encodeURIComponent(route.route) + '/' + dir, { signal: AbortSignal.timeout(10000) });
      if (!response.ok) throw new Error('server said ' + response.status);
      ids = (await response.json()).data.map(e => e.stop);
      cachePut(key, ids);
    }

    // Citybus has no bulk stop download, so each stop is one request.
    // We fetch five at a time and cache hard, rather than firing 40 at once.
    const stops = [];
    for (let i = 0; i < ids.length; i += 5) {
      const found = await Promise.all(ids.slice(i, i+5).map(getCtbStop));
      stops.push(...found.filter(Boolean));
    }
    paintRoute(route.route, 'Citybus', from, to, stops, '#fb923c', '#9a3412', route.route,
               { co:'CTB', dir: dir === 'outbound' ? 'O' : 'I', serviceType:null,
                 destEn:to, destTc:to });
  } catch (error) {
    status.textContent = T('couldNotLoadRoute').replace('{r}', route.route);
  }
}

async function getCtbStop(stopId) {
  const key = 'ctb-stop-' + stopId;
  const cached = await cacheGet(key);
  if (cached) return cached;
  try {
    const response = await fetch(CTB_BASE + '/stop/' + stopId, { signal: AbortSignal.timeout(10000) });
    if (!response.ok) return null;
    const stop = (await response.json()).data;
    if (!stop || stop.lat === undefined) return null;
    // Reshaped to look exactly like a KMB stop, so nothing downstream cares
    // which company it came from. This is the whole idea of a "normalizer".
    const normalised = { stop:stop.stop, name_en:stop.name_en, name_tc:stop.name_tc,
                         lat:stop.lat, long:stop.long };
    cachePut(key, normalised);
    return normalised;
  } catch (error) { return null; }
}

// ============================================================
// INSTALLING, AND WORKING WITHOUT A CONNECTION
// ============================================================
// Three separate things live here, and they are together because they are
// all about the app as an app rather than about buses:
//
//   1. Registering sw.js, which is what stores the page so it opens with no
//      signal. What it will and will not store — and why the map is blank
//      offline — is written at the top of that file.
//   2. Saying plainly when there is no connection. This app is used at bus
//      stops, in MTR tunnels and inside buildings, so no connection is a
//      normal state, not an error. Half the app still works; the rider is
//      told which half.
//   3. The "add to home screen" button in SETTINGS. Chrome offers this
//      itself, buried in a three-dot menu — not a place to send someone who
//      is new to phones. Caught here and offered as a plain button instead.
//
// WHY THE UPDATE IS A BUTTON AND NOT AUTOMATIC
// A service worker can replace the app the moment a new one is ready. On a
// phone that could wipe the journey someone is halfway through reading, at
// the stop, in the rain. So a new version waits, says so on the top bar, and
// takes over only when it is tapped.

// updateWaiting, installPrompt and updateAsked are declared with the rest of
// the early-read state near the top, because the top bar and SETTINGS can
// both ask for them before this point in the file has run.

// The app is already installed if it is running in its own window — which is
// exactly what "standalone" means. Two spellings: the standard one, and the
// one iOS has used since before the standard existed.
function isInstalled() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || navigator.standalone === true;
}

function offlineChip() {
  const chip = document.createElement('span');
  chip.className = 'wxoff';
  chip.textContent = T('offlineChip');
  chip.title = T('offlineWhat');
  return chip;
}

function updateChip() {
  const button = document.createElement('button');
  button.className = 'wxupdate';
  button.textContent = T('updateReady');
  button.addEventListener('click', () => {
    if (!updateWaiting || !updateWaiting.waiting) return;
    updateAsked = true;
    button.disabled = true;
    // The new worker takes over, and controllerchange below reloads us into
    // it. Reloading here instead would show the OLD page one last time.
    updateWaiting.waiting.postMessage('SKIP_WAITING');
  });
  return button;
}

// Connection state. Both events redraw the top bar, so the notice appears and
// disappears on its own without the rider having to reload anything.
window.addEventListener('offline', () => {
  renderWeatherBar();
  status.textContent = T('offlineWhat');
});

window.addEventListener('online', () => {
  renderWeatherBar();
  status.textContent = T('backOnline');
  // The Observatory could not be reached while we were off; ask again now.
  loadWeather();
});

// Chrome fires this when the app qualifies for installing. Answering it with
// preventDefault() takes the browser's own banner away, which is only worth
// doing because we put a plainer button in SETTINGS in its place.
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  installPrompt = event;
  if (activeMode === 'set') renderSettings();
});

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  if (activeMode === 'set') renderSettings();
});

// REGISTERING THE WORKER
// Only over http(s): opened straight from the file system there is no origin
// to attach a worker to, and calling this there throws. Deferred to the load
// event so that storing the app never competes for the connection with the
// route data the rider is actually waiting for.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(registration => {
      // A new version may already have been sitting there since last time.
      if (registration.waiting && navigator.serviceWorker.controller)
        noteUpdate(registration);

      registration.addEventListener('updatefound', () => {
        const incoming = registration.installing;
        if (!incoming) return;
        incoming.addEventListener('statechange', () => {
          // "installed" with something already in control means this is a
          // REPLACEMENT. Without that second test the very first install —
          // the one that is not an update at all — would announce itself.
          if (incoming.state === 'installed' && navigator.serviceWorker.controller)
            noteUpdate(registration);
        });
      });
    }).catch(error => {
      // Not fatal in the slightest: the app runs exactly as it always did,
      // just without being installable or working offline.
      console.warn('Offline support unavailable:', error.message);
    });

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      // ONLY when the rider asked. A worker claiming the page on its first
      // install also fires this, and reloading there would restart the app
      // out of nowhere on someone's very first visit.
      if (updateAsked) location.reload();
    });
  });
}

function noteUpdate(registration) {
  updateWaiting = registration;
  renderWeatherBar();
}

// ============================================================
// THE BUS STOP TAB — the nearest poles or a saved one, and every bus from it
// ============================================================
// The MTR tab picks the nearest station for you. This one does NOT pick the
// nearest pole: the pole across the road is usually the same distance away
// and runs the other way, and sending someone to the wrong side of a dual
// carriageway is a real mistake. It shows the closest few, with the code
// painted on each pole, and lets the rider choose.
const STOP_NEAR_M = 500;

let stopState = freshStopState();
function freshStopState() {
  return { stop:null, rows:null, noLive:false, loading:false, alert:null,
           fetchedAt:0, locating:false, locateTried:false, destFilter:'', destQuery:'', destPicked:false, indexing:false, group:null };
}

// Which company runs the buses at this pole, from the planner's own index.
function stopCompany(stopId) {
  const keys = (typeof stopIndex !== 'undefined' && stopIndex && stopIndex.get(stopId)) || [];
  const cos = new Set(keys.map(k => String(k.routeKey).split('|')[3]));
  if (cos.has('kmb')) return 'KMB';
  if (cos.has('ctb')) return 'CTB';
  if (cos.size) return [...cos][0].toUpperCase();
  return /^[0-9A-F]{16}$/i.test(stopId) ? 'KMB' : 'CTB';
}
function routesAtStop(stopId) {
  const keys = (typeof stopIndex !== 'undefined' && stopIndex && stopIndex.get(stopId)) || [];
  const seen = new Set(), out = [];
  for (const k of keys) {
    const [route, bound, type, co] = String(k.routeKey).split('|');
    const id = route + '|' + bound + '|' + co;
    if (seen.has(id)) continue;
    seen.add(id);
    out.push({ route, bound, type, co: (co || '').toUpperCase(), seq: k.seq });
  }
  return out;
}
function poleCodeOf(stop) {
  const found = /\(([A-Z]{2}\d{3}[A-Za-z]?)\)\s*$/.exec(stop.name_en || '');
  return found ? found[1] : '';
}
// The far end of a route is its last stop. The trimmed data carries no
// destination names, but it carries every route's stop order, and the last
// stop IS the destination — for all four companies alike, with no fetch.
// Remembered per route and language: the index never changes once built,
// and finding the last stop of a route means walking the whole route.
const terminusMemo = new Map(); let terminusMemoIndex = null;
function routeTerminus(routeKey) {
  const index = (typeof routeIndex !== 'undefined' && routeIndex) || null;
  if (!index) return '';
  if (terminusMemoIndex !== index) { terminusMemo.clear(); terminusMemoIndex = index; }
  const k = lang + '|' + routeKey;
  const hit = terminusMemo.get(k);
  if (hit !== undefined) return hit;
  const entries = index.get(routeKey) || [];
  let name = '';
  if (entries.length) {
    const last = entries.reduce((a, b) => (b.seq > a.seq ? b : a));
    const stop = lookupStop(last.stopId);
    name = stop ? stopName(stop) : '';
  }
  if (name) terminusMemo.set(k, name);      // a miss may just be stops not loaded yet
  return name;
}
function lookupStop(id) {
  return stopMapNow().get(id) || stopFavs.find(x => x.stop === id) || null;
}
// Every route leaving a pole, with where it ends up.
const servingMemo = new Map(); let servingMemoIndex = null;
function routesServing(stopId) {
  const index = (typeof stopIndex !== 'undefined' && stopIndex) || null;
  if (!index) return [];
  if (servingMemoIndex !== index) { servingMemo.clear(); servingMemoIndex = index; }
  const memoKey = lang + '|' + stopId;
  const hit = servingMemo.get(memoKey);
  if (hit) return hit;
  const out = []; const seen = new Set();
  for (const k of (index.get(stopId) || [])) {
    const [route, bound, type, co] = String(k.routeKey).split('|');
    const id = route + '|' + bound + '|' + co;
    if (seen.has(id)) continue;
    seen.add(id);
    out.push({ route, bound, type, co: (co || '').toUpperCase(), key: k.routeKey, seq: k.seq, dest: routeTerminus(k.routeKey) });
  }
  servingMemo.set(memoKey, out);
  return out;
}
// ============================================================
// WHICH WAY THE BUSES LEAVE THIS POLE
// ============================================================
// 屯門公路轉車站 has two banks 536 m apart with the same name, and standing on
// the wrong one means watching your bus go past on the far carriageway.
// Nothing in the feed says which side you are on: not one of the 6,739 KMB
// stop names contains 往, 向 or 方向, and the pole code encodes nothing. What
// the feed DOES carry is every route's stop order, so the facing can be
// measured instead of read.
//
// 800 m, not "the next stop": off both banks here the next stop is called
// 大欖涌, and the first hop from the northbound bank climbs a slip road NORTH
// before the bus turns west. One hop says 北. A kilometre says 西北, which is
// where the bus is actually going.
const FACE_FAR_M  = 800;    // look this far along the route before taking a bearing
const FACE_MIN_M  = 150;    // a tight loop that never gets that far: use the farthest stop
const FACE_AGREE  = 0.70;   // how much the routes must agree before we say anything

function bearingBetween(lat1, lng1, lat2, lng2) {
  const toRad = d => d * Math.PI / 180;
  const dLng = toRad(lng2 - lng1);
  const y = Math.sin(dLng) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLng);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

// One pole's routes as direction vectors. Returned rather than reduced so a
// whole station's bays can be pooled into ONE average — averaging the bays'
// separate answers instead blanks the 屯門公路轉車站 card, because two of its
// thirteen eastbound bays measure a few degrees off the other eleven.
function poleVectors(stopId) {
  const out = { sin: 0, cos: 0, n: 0, octants: [] };
  const me = lookupStop(stopId);
  if (!me) return out;
  const lat = Number(me.lat), lng = Number(me.long);
  if (!isFinite(lat) || !isFinite(lng)) return out;

  for (const r of routesServing(stopId)) {
    let best = null, bestSeq = Infinity, far = null, farM = 0;
    for (const e of (routeIndex.get(r.key) || [])) {
      if (e.seq <= r.seq) continue;                       // only what is ahead of us
      const s = lookupStop(e.stopId); if (!s) continue;
      const m = metresBetween(lat, lng, Number(s.lat), Number(s.long));
      // Track the sequence, not the stop: a stop record carries no .seq, and
      // comparing against one silently takes the first far stop in array order.
      if (m >= FACE_FAR_M && e.seq < bestSeq) { best = s; bestSeq = e.seq; }
      if (m > farM) { farM = m; far = s; }
    }
    const pick = best || (farM >= FACE_MIN_M ? far : null);
    if (!pick) continue;                    // the route ends here, or loops back to it
    const deg = bearingBetween(lat, lng, Number(pick.lat), Number(pick.long));
    const rad = deg * Math.PI / 180;
    out.sin += Math.sin(rad); out.cos += Math.cos(rad); out.n++;
    out.octants.push(Math.round(deg / 45) % 8);
  }
  return out;
}

// Vectors -> one compass point, or -1 for "say nothing".
// Two gates, and both matter. The first is agreement: a pole whose routes fan
// out in every direction has no single facing, and R below 0.70 says so. The
// second is that the answer must be a direction some real bus actually takes
// — without it a pole served by routes at 337° and 37° averages to 北 (16°),
// which is a way no bus leaves, and 往北 would walk the rider to the wrong deck.
function facingOf(v) {
  if (!v.n) return -1;
  if (Math.sqrt(v.sin * v.sin + v.cos * v.cos) / v.n < FACE_AGREE) return -1;
  const mean = (Math.atan2(v.sin, v.cos) * 180 / Math.PI + 360) % 360;
  const octant = Math.round(mean / 45) % 8;
  if (v.octants.includes(octant)) return octant;
  // STRADDLING READINGS ARE NOT DISAGREEMENT.
  // 旺角警署 (MK505) reads SW five times and SE three times — every route
  // leaving it heads south — and the mean of those is 194°, due south. But
  // no single route reads exactly S, and refusing any answer not literally
  // sampled threw the whole thing away and left the pole with no direction
  // at all. The routes agree; it is the octant boundary that does not. Snap
  // to the sampled direction nearest the mean instead of giving up.
  let best = -1, bestGap = Infinity;
  for (const o of v.octants) {
    const gap = Math.abs(((o * 45 - mean + 540) % 360) - 180);
    if (180 - gap < bestGap) { bestGap = 180 - gap; best = o; }
  }
  return best;
}

// Memoised on the STOP DATA, not just the route index. The two arrive from
// different places at different times, and a pole asked before its
// coordinates land has no facing — caching that miss would freeze it blank
// for the rest of the session. routeTerminus guards the same way.
const facingMemo = new Map(); let facingMemoStamp = null;
function poleFacing(stopId) {
  if (!stopIndex) return -1;
  const stamp = dataStamp();
  if (facingMemoStamp !== stamp) { facingMemo.clear(); facingMemoStamp = stamp; }
  const hit = facingMemo.get(stopId);
  if (hit !== undefined) return hit;
  const out = facingOf(poleVectors(stopId));
  if (out >= 0) facingMemo.set(stopId, out);   // a miss may just be stops not loaded yet
  return out;
}

const FACE_KEYS = ['faceN', 'faceNE', 'faceE', 'faceSE', 'faceS', 'faceSW', 'faceW', 'faceNW'];
// The same eight directions spelt out, for the places they are read as a
// sentence rather than as a badge beside a stop name.
const WAY_KEYS  = ['wayN', 'wayNE', 'wayE', 'waySE', 'wayS', 'waySW', 'wayW', 'wayNW'];
function faceHtml(index) {
  return index < 0 ? '' : ' <span class="poledir">' + esc(T(FACE_KEYS[index])) + '</span>';
}
function poleDirHtml(stopId) { return faceHtml(poleFacing(stopId)); }

// A whole station's bays pooled into one answer.
function groupDirHtml(ids) {
  if (!stopIndex || !ids || !ids.length) return '';
  const all = { sin: 0, cos: 0, n: 0, octants: [] };
  for (const id of ids) {
    const v = poleVectors(id);
    all.sin += v.sin; all.cos += v.cos; all.n += v.n;
    for (const o of v.octants) all.octants.push(o);
  }
  return faceHtml(facingOf(all));
}

function poleRoutesLine(stopId, max, destIds) {
  let items;
  if (destIds && destIds.size) {
    // Shortest ride first. Unsorted, this led with whatever the index happened
    // to hold — 屯門公路轉車站 showed "52P, 18 stops" above the 59X that the
    // 🏁 line was actually recommending eight stops away, so the card argued
    // with itself.
    items = reachingRoutes(stopId, destIds)
      .sort((a, b) => a.reach.stopsAway - b.reach.stopsAway)
      .map(x => '<b>' + esc(x.r.route) + '</b> ' +
      T('stopsAwayShort').replace('{n}', x.reach.stopsAway) + (x.r.dest ? ' · ' + T('towards') + esc(x.r.dest) : ''));
  } else {
    const list = Array.isArray(stopId) ? routesServingAny(stopId) : routesServing(stopId);
    items = list.map(r => '<b>' + esc(r.route) + '</b>' + (r.dest ? ' ' + T('towards') + esc(r.dest) : ''));
  }
  if (!items.length) return '';
  const shown = items.slice(0, max || 4);
  const more = items.length - shown.length;
  const sep = destIds && destIds.size ? '<br>' : ' · ';   // one reaching route per line — easier to read
  return '<small class="poleroutes">' + shown.join(sep) + (more > 0 ? sep + T('stopMore').replace('{n}', more) : '') + '</small>';
}
// Does a stop name match what was typed? Exact substring first. Failing
// that, the typed characters in order with gaps allowed — 屯門轉車站 finds
// 屯門公路轉車站, which is how people actually say it. Spaces and punctuation
// are ignored on both sides.
function tidyName(text) { return String(text || '').toLowerCase().replace(/[\s,，()（）\-–—·.]/g, ''); }

// THE SAME NAME, BUT WITH ITS WORDS STILL SEPARATE.
// tidyName throws every space away, which is right for Chinese and for
// forgiving typists — but it is why 「Tai O」 became "taio", which is sitting
// inside "taiombuilding" and "taionbuilding". The app then believed a bus to
// Tai On Street in Sai Wan Ho was a bus to Tai O on Lantau, and offered it.
// This keeps one space between words so a Latin name can be matched whole.
function tidyWords(text) {
  return String(text || '').toLowerCase()
    .replace(/[,，()（）\-–—·.]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// The same name, but with the punctuation that separates one PHRASE from the
// next kept as a bar. KMB writes a pole as "<landmark>, <street> (CODE)", and
// which side of the comma a word sits on is the difference between a place
// and something merely near it.
function tidyPhrases(text) {
  return String(text || '').toLowerCase()
    .replace(/[,，()（）]/g, '|')
    .replace(/[\-–—·.]/g, ' ')
    .replace(/[ \t]+/g, ' ')
    .replace(/\s*\|\s*/g, '|')
    .trim();
}

// Words that can stand in front of a name without changing which place it is.
// "East Gate OF THE University of Hong Kong" is still the University of Hong
// Kong. "Hang Seng University of Hong Kong" is not.
const NAME_LEAD_WORDS = new Set(['the', 'of', 'near', 'outside', 'opposite', 'at', 'by',
                                 'adjacent', 'beside', 'towards', 'to', 'in', 'front',
                                 'entrance', 'exit', 'and', 'a']);

// Does this text contain Latin letters or digits? Only those have word
// boundaries worth honouring; Chinese is written without spaces, so 太子
// must go on matching inside 太子站 exactly as it always has.
function hasLatin(text) { return /[a-z0-9]/i.test(String(text || '')); }

// Is the needle present in the haystack as WHOLE WORDS?
// "tai o" is in "tai o" and in "tai o ferry pier", and is NOT in
// "tai on building" or "tai om tp148" — the letter after it settles it.
function wordsContain(hay, needle) {
  if (!needle) return false;
  let from = 0;
  for (;;) {
    const at = hay.indexOf(needle, from);
    if (at < 0) return false;
    const before = at === 0 ? ' ' : hay[at - 1];

  const hits = mine.filter(s => reachingRoutes(s.stop, destIds).length);
  if (hits.length) return { bays: hits, crossed: false };
  const key = stationKey(stop);
  const lat = Number(stop.lat), lng = Number(stop.long);
  if (!key || !isFinite(lat) || !isFinite(lng)) return { bays: mine, crossed: false };
  const kin = (placeFamilyNow().get(placeKey(stop)) || []).filter(s =>
    stationKey(s) === key &&
    metresBetween(lat, lng, Number(s.lat), Number(s.long)) <= CROSS_STATION_M &&
    reachingRoutes(s.stop, destIds).length);
  return kin.length ? { bays: kin, crossed: true } : { bays: mine, crossed: false };
}
// Dedupe a distance-ordered or search-ordered list into groups. `keep` says
// which poles are allowed at all (the destination filter).
function groupPoles(list, keep, max) {
  const out = [], covered = new Set();
  for (const item of list) {
    const stop = item.stop && item.stop.stop ? item.stop : item;           // {stop, metres} or a stop
    if (covered.has(stop.stop) || !keep(stop)) continue;
    // A bay already shown under an earlier card is not shown twice.
    const group = poleGroup(stop).filter(g => keep(g) && !covered.has(g.stop));
    group.forEach(g => covered.add(g.stop));
    out.push({ group, metres: item.metres });
    if (out.length >= max) break;
  }
  return out;
}
function stopGroupNow() {
  const st = stopState;
  if (!st.stop) return [];
  if (!st.group || (st.group.length === 1 && stopIndex)) st.group = poleGroup(st.stop);
  return st.group;
}
// ============================================================
// HOW SOON THIS POLE ACTUALLY GETS YOU THERE
// ============================================================
// Ranking start stops by "fewest stops away" or "nearest to me" answers a
// question nobody asked. A pole 300 m away whose bus has just gone is worse
// than one 600 m away with a bus due in two minutes, and the rider only
// finds that out after walking to the wrong one. So the picker ranks on
// ARRIVAL: walk there + wait for the next bus + ride to the place.
//
// The wait is the part that decides it and the part that is genuinely live,
// so it comes from KMB's own ETA feed, one call per bay, asked in parallel.
// Answers are cached briefly because the picker redraws on every keystroke
// and must not hit the network again for each letter.
//
// The ride is still MINUTES_PER_STOP × stops — the planner's rough figure.
// The Transport Department's speed-map feed would sharpen it; see
// trafficPenalty below for why it is not wired in.
const ARRIVE_CACHE_MS = 45000;
const ARRIVE_MAX_BAYS = 30;          // an upper bound on one screen's worth
// Only the cards near the top can win, so only they are worth asking about.
const ARRIVE_MAX_GROUPS = 6;
// A Citybus pole costs one request PER ROUTE. Left at twelve on purpose: the
// opened stop screen asks unfiltered because it must list every bus from the
// pole, and trimming that would quietly hide routes. The saving comes from the
// destination filter instead, which the ranking passes and the stop screen
// does not.
const arriveRows = new Map();        // stopId -> { at, rows }
const arriveInFlight = new Set();
let arriveStamp = '';                // the question these answers were for

// Three different answers, and they must not be confused:
//   undefined — we have not asked about this pole yet
//   null      — we asked, and this operator has no live feed at all
//   []        — we asked, the feed answered, nothing is due
function arriveCached(stopId) {
  const hit = arriveRows.get(stopId);
  return (hit && Date.now() - hit.at < ARRIVE_CACHE_MS) ? hit.rows : undefined;
}
// Ordering only, and never shown. A pole with no live feed still has to sit
// somewhere sensible in the list: ranking it on ride time alone would float
// it above buses that are genuinely about to leave, and ranking it at
// Infinity — which is what the app did — buried 4,768 green-minibus and NLB
// poles below every alternative for ever, however good they were.
const NO_FEED_WAIT_MIN = 10;

// ============================================================
// HOW FAST THE ROAD IS MOVING RIGHT NOW
// ============================================================
// The Transport Department's 1st-generation Traffic Speed Map (speedmap.xml)
// is retired — its address 404s and the dataset page says so. It was replaced
// by "Traffic Data of Strategic / Major Roads", which is better for us: not a
// colour per road but a SPEED per detector, 807 of them with coordinates,
// refreshed every minute.
//
// Two halves, and they have to come from two places:
//  * the live speeds, from resource.data.one.gov.hk — 34 KB gzipped, and it
//    sends access-control-allow-origin:*, so the page can fetch it directly;
//  * where each detector IS, from static.data.gov.hk — which sends NO CORS
//    header at all, so a browser cannot read it. That half never changes, so
//    it is bundled beside this file as td-detectors.json instead.
const TD_SPEED_URL = 'https://resource.data.one.gov.hk/td/traffic-detectors/rawSpeedVol-all.xml';
const ROAD_REFRESH_MS = 3 * 60 * 1000;
const ROAD_NEAR_M = 300;          // a detector this close is measuring our road
const ROAD_OCTANT_SLACK = 2;      // within 90° of the way the bus is heading
// Free-flow on a strategic road. Below CLEAR it is dragging; at JAM or under
// it is stopped. Measured against today's feed, whose speeds run p25 63,
// p50 73, p95 96 km/h, so 45 really is slow here rather than merely urban.
const ROAD_CLEAR_KMH = 45, ROAD_JAM_KMH = 20;
// A wholly jammed path takes about twice as long as the timetable thinks.
const ROAD_DRAG = 1.0;

let tdDetectors = null, tdDetGrid = null;
let roadSpeeds = null, roadSpeedsAt = 0, roadSpeedsWhen = '';

async function loadTdDetectors() {
  if (tdDetectors) return tdDetectors;
  try {
    const response = await fetch('./td-detectors.json', { signal: AbortSignal.timeout(15000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const doc = await response.json();
    tdDetectors = (doc.detectors || []).map(d =>
      ({ id: d[0], lat: d[1], lng: d[2], oct: d[3], road_tc: d[4], road_en: d[5] }));
    // Same grid trick the stop list uses, so "which detector is on this road"
    // is a couple of cell look-ups rather than a scan of 807.
    tdDetGrid = new Map();
    for (const d of tdDetectors) {
      const k = Math.floor(d.lat / GRID_DEG) + ',' + Math.floor(d.lng / GRID_DEG);
      if (!tdDetGrid.has(k)) tdDetGrid.set(k, []);
      tdDetGrid.get(k).push(d);
    }
  } catch (error) { console.warn('TD detectors unavailable:', error); tdDetectors = []; tdDetGrid = new Map(); }
  return tdDetectors;
}

// The newest 30-second period in the feed, averaged over the lanes that say
// they are working. An out-of-service loop reads zero, and a zero would look
// exactly like a jam, so `valid` is not optional.
async function loadRoadSpeeds() {
  if (roadSpeeds && Date.now() - roadSpeedsAt < ROAD_REFRESH_MS) return roadSpeeds;
  try {
    const response = await fetch(TD_SPEED_URL, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const doc = new DOMParser().parseFromString(await response.text(), 'text/xml');
    const periods = [...doc.querySelectorAll('period')];
    const last = periods[periods.length - 1];
    const map = new Map();
    if (last) {
      for (const d of last.querySelectorAll('detector')) {
        const id = (d.querySelector('detector_id') || {}).textContent;
        let sum = 0, occ = 0, n = 0;
        for (const lane of d.querySelectorAll('lane')) {
          if (((lane.querySelector('valid') || {}).textContent || '') !== 'Y') continue;
          const sp = Number((lane.querySelector('speed') || {}).textContent);
          const oc = Number((lane.querySelector('occupancy') || {}).textContent);
          if (!isFinite(sp)) continue;
          sum += sp; occ += (isFinite(oc) ? oc : 0); n++;
        }
        if (id && n) map.set(id, { speed: sum / n, occ: occ / n });
      }
      roadSpeedsWhen = ((last.querySelector('period_to') || {}).textContent || '').slice(0, 5);
    }
    roadSpeeds = map; roadSpeedsAt = Date.now();
  } catch (error) {
    console.warn('TD road speeds unavailable:', error);
    if (!roadSpeeds) roadSpeeds = new Map();
    roadSpeedsAt = Date.now();                    // do not hammer a feed that is down
  }
  return roadSpeeds;
}

// 0 = moving freely, 1 = stopped. null when nothing is measuring this spot.
function dragAt(lat, lng, heading) {
  if (!tdDetGrid || !roadSpeeds || !roadSpeeds.size) return null;
  const cy = Math.floor(lat / GRID_DEG), cx = Math.floor(lng / GRID_DEG);
  let best = null, bestM = Infinity;
  for (let y = cy - 1; y <= cy + 1; y++) for (let x = cx - 1; x <= cx + 1; x++) {
    for (const d of (tdDetGrid.get(y + ',' + x) || [])) {
      // A jam on the other carriageway is not our jam. Octants apart, the
      // short way round: 0 is the same heading, 4 is head-on opposite.
      if (heading >= 0) {
        const diff = (d.oct - heading + 8) % 8;
        if (Math.min(diff, 8 - diff) > ROAD_OCTANT_SLACK) continue;
      }
      const live = roadSpeeds.get(d.id);
      if (!live) continue;
      const m = metresBetween(lat, lng, d.lat, d.lng);
      if (m <= ROAD_NEAR_M && m < bestM) { bestM = m; best = { d, live }; }
    }
  }
  if (!best) return null;
  const kmh = best.live.speed;
  if (kmh >= ROAD_CLEAR_KMH) return { drag: 0, kmh, det: best.d };
  if (kmh <= ROAD_JAM_KMH) return { drag: 1, kmh, det: best.d };
  return { drag: (ROAD_CLEAR_KMH - kmh) / (ROAD_CLEAR_KMH - ROAD_JAM_KMH), kmh, det: best.d };
}

// How much the road is holding up THIS ride: the stops it actually passes,
// each asked of the nearest detector facing the same way. Stops with nothing
// measuring them are left out rather than counted as clear — a road we cannot
// see is not a road we know is moving.
const roadDragMemo = new Map();
function roadDrag(routeKey, fromSeq, toSeq) {
  if (!tdDetGrid || !roadSpeeds || !roadSpeeds.size) return null;
  const key = routeKey + '|' + fromSeq + '|' + toSeq + '|' + roadSpeedsAt;
  if (roadDragMemo.has(key)) return roadDragMemo.get(key);
  const path = pathBetween(routeKey, fromSeq, toSeq);
  let sum = 0, n = 0, worst = null;
  for (let i = 0; i < path.length; i++) {
    const a = path[i], b = path[i + 1] || path[i - 1];
    const lat = Number(a.lat), lng = Number(a.long);
    if (!isFinite(lat) || !isFinite(lng)) continue;
    let heading = -1;
    if (b && b !== a) {
      const bearing = bearingBetween(lat, lng, Number(b.lat), Number(b.long));
      heading = Math.round(bearing / 45) % 8;
      if (b === path[i - 1]) heading = (heading + 4) % 8;         // looked backwards
    }
    const hit = dragAt(lat, lng, heading);
    if (!hit) continue;
    sum += hit.drag; n++;
    if (!worst || hit.drag > worst.drag) worst = hit;
  }
  const out = n ? { drag: sum / n, seen: n, worst } : null;
  if (roadDragMemo.size > 400) roadDragMemo.clear();
  roadDragMemo.set(key, out);
  return out;
}

// ROUTES THE TRANSPORT DEPARTMENT HAS A NOTICE OUT ON.
// tdNotices is already loaded and parsed for the alert banner, so this is
// the same evidence, reused at the moment of CHOOSING rather than after
// arriving. A route with an incident against it is pushed down the ranking
// and marked, so a delay is something the rider decides about rather than
// discovers at the kerb.
//
// NOT a road-speed model: TD's speedmap.xml and journeytime.xml both answer
// 404 at the documented address (their server returns its own un-parsed PHP
// error page listing those very paths), and data.gov.hk has no archived
// version of either. Incidents are the live road data actually on offer.
const TRAFFIC_PENALTY_MIN = 8;
// Above this the road is not merely "slow", it is stopped, and that is a
// decision the rider should get to make rather than read about afterwards.
// Half, not more: a leg is measured by whatever detectors happen to sit on
// it — often only two or three — so demanding a large majority of them meant
// the whole of Tuen Mun Road could be at 12 km/h and the app would say
// nothing. Half of what we can see, at ~32 km/h or below, is a real jam.
const ROAD_ASK_DRAG = 0.5;
function routeNotices(routeNo) {
  const r = String(routeNo || '').toUpperCase();
  if (!r || !tdNotices.length) return [];
  return tdNotices.filter(n => n.routes && n.routes.has(r));
}
function trafficPenalty(routeNo) { return routeNotices(routeNo).length ? TRAFFIC_PENALTY_MIN : 0; }

// The best ride off these bays to the place: undefined when we have not
// asked yet, null when we asked and nothing is due, otherwise the winner.
function arriveBest(ids, destIds, walkMin) {
  if (!destIds || !destIds.size) return undefined;
  const now = Date.now();
  let asked = false, noFeed = false, best = null;
  for (const id of ids) {
    const rows = arriveCached(id);
    if (rows === undefined) continue;             // not asked yet
    if (rows === null) { noFeed = true; continue; }   // asked; this operator has no feed
    asked = true;
    for (const row of rows) {
      if (!row.eta) continue;
      const wait = Math.round((new Date(row.eta).getTime() - now) / 60000);
      if (wait < 0) continue;
      const key = routeKeyForRow(row);
      const seq = Number(row.seq) ||
                  (routesServing(row.stop || id).find(r => r.key === key) || {}).seq || 0;
      const reach = routeReaches(key, seq, destIds);
      if (!reach) continue;
      const held = trafficPenalty(row.route);
      // The walk is part of the wait: a bus you cannot reach in time is not
      // the next bus. Anything you would miss is simply not a candidate.
      const walk = walkMin || 0;
      if (wait < walk) continue;
      // The ride, stretched by how the road is ACTUALLY moving over the part
      // of the route this rider will sit through — not the whole line, and
      // not the other carriageway.
      const road = roadDrag(key, seq, seq + reach.stopsAway);
      const ride = reach.stopsAway * MINUTES_PER_STOP * (1 + (road ? road.drag * ROAD_DRAG : 0));
      const total = wait + ride + held;
      if (!best || total < best.total)
        best = { total, wait, walk, held, road, ride, route: row.route, stopsAway: reach.stopsAway, stopId: id };
    }
  }
  if (best) return best;
  // Nothing live, but a pole whose company publishes no times is not the same
  // as a pole where no bus is coming. Score it off the timetable so it can
  // still win, and mark it so the number is never read as a live one.
  if (noFeed) {
    const reach = reachingRoutes(ids, destIds);
    if (reach.length) {
      const near = reach.reduce((a, b) => a.reach.stopsAway <= b.reach.stopsAway ? a : b);
      const ride = near.reach.stopsAway * MINUTES_PER_STOP;
      return { noFeed: true, total: (walkMin || 0) + NO_FEED_WAIT_MIN + ride, ride,
               walk: walkMin || 0, held: 0, road: null,
               route: near.r.route, stopsAway: near.reach.stopsAway, stopId: ids[0] };
    }
  }
  return asked ? best : undefined;
}

// Ask every bay on offer, then redraw. The picker paints immediately with
// what it already knows and re-orders when the times land, so the screen is
// never blocked on the network.
// `bays` is [{ id, routes }] — the pole, and the routes from it that reach the
// place. Anything already answered for, or already in flight, is not asked
// again; a pole whose company has no feed answers null once and stays answered.
async function ensureArrivals(bays, stamp) {
  const roadBefore = roadSpeedsAt;
  // The buses and the road are both needed before the list can be ordered,
  // and neither should wait on the other.
  const road = Promise.all([loadTdDetectors(), loadRoadSpeeds()]);
  const seen = new Set(), want = [];
  for (const bay of bays) {
    const id = bay && bay.id;
    if (!id || seen.has(id)) continue;
    seen.add(id);
    if (arriveCached(id) !== undefined || arriveInFlight.has(id)) continue;
    want.push(bay);
    if (want.length >= ARRIVE_MAX_BAYS) break;
  }
  if (!want.length) { await road; return roadSpeedsAt !== roadBefore && stamp === arriveStamp; }
  want.forEach(bay => arriveInFlight.add(bay.id));
  await road;
  await Promise.all(want.map(async bay => {
    try {
      const stop = findStopById(bay.id);
      // null travels through unchanged: it is the answer "this company
      // publishes no live times", not the absence of an answer.
      const rows = stop ? await fetchPoleRows(stop, bay.routes) : null;
      arriveRows.set(bay.id, { at: Date.now(), rows });
    } catch (error) {
      arriveRows.set(bay.id, { at: Date.now(), rows: [] });   // asked, nothing to say
    } finally { arriveInFlight.delete(bay.id); }
  }));
  return stamp === arriveStamp;      // still the same question?
}
// The poles of a group, each with the routes that get the rider there.
function baysToAsk(stops, destIds) {
  return stops.map(st => ({ id: st.stop,
    routes: new Set(reachingRoutes(st.stop, destIds).map(x => x.r.route)) }));
}

// What the ranking decided, said in one line: the bus, when it goes, and
// when it puts you there. ⚠ when the Transport Department has a notice out
// on that route — the reason it may have been pushed down the list.
// Which cards must ask before they open, and what they must say.
function askAttrs(best) {
  if (!best) return '';
  const jam = best.road && best.road.drag >= ROAD_ASK_DRAG && best.road.worst;
  if (!best.held && !jam) return '';
  let out = ' data-held-route="' + esc(best.route) + '"';
  if (jam) {
    const w = best.road.worst;
    out += ' data-slow-road="' + esc(lang === 'zh' ? w.det.road_tc : w.det.road_en) +
           '" data-slow-kmh="' + Math.round(w.kmh) + '"';
  }
  return out;
}

function arriveTagHtml(best) {
  if (!best) return '';
  // No live feed: say so, and give the stop count rather than a clock time.
  // An estimated arrival printed as "12:47" is a promise the data cannot keep.
  if (best.noFeed)
    return '<small class="arrivetag nofeed">⏱ ' +
      esc(T('stopNoFeedEta').replace('{r}', best.route).replace('{n}', best.stopsAway)) + '</small>';
  const at = new Date(Date.now() + best.total * 60000);
  const hhmm = at.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  // "in 0 minutes" is not something anyone says: a bus at the stop now gets
  // its own wording rather than the countdown template with a zero in it.
  const line = best.wait === 0
    ? T('stopArriveDue').replace('{r}', best.route).replace('{t}', hhmm)
    : T('stopArriveBy').replace('{r}', best.route).replace('{w}', best.wait + T('min')).replace('{t}', hhmm);
  // The road, when it is the reason the number looks worse than the
  // timetable would suggest. Named and measured, so it can be judged.
  let road = '';
  if (best.road && best.road.drag >= 0.3 && best.road.worst) {
    const w = best.road.worst;
    const where = (lang === 'zh' ? w.det.road_tc : w.det.road_en).split(/\s*-\s*/)[0];
    road = '<small class="roadslow">🐌 ' +
      esc(T('stopRoadSlow').replace('{s}', where).replace('{k}', Math.round(w.kmh))) + '</small>';
  }
  return '<small class="arrivetag' + (best.held ? ' held' : '') + '">🏁 ' + esc(line) +
    (best.held ? ' <b>⚠</b>' : '') + '</small>' + road;
}

// The destination typed on the picker, as stop ids — null when none typed.
function destIdsNow() {
  const q = String(stopState.destQuery || '').trim();
  if (!q) return null;
  return stopIdsMatching(q);
}
// Does this route, from this pole onwards, stop at any of these places?
function routeReaches(routeKey, fromSeq, destIds) {
  const entries = (typeof routeIndex !== 'undefined' && routeIndex && routeIndex.get(routeKey)) || [];
  let best = null;
  for (const e of entries) {
    if (e.seq > fromSeq && destIds.has(e.stopId) && (!best || e.seq < best.seq)) best = e;
  }
  return best ? { stopsAway: best.seq - fromSeq, stopId: best.stopId } : null;
}
// The routeKey for a live arrival row: exact match on service type first,
// then any variant of the same route and direction.
function routeKeyForRow(row) {
  const co = String(row.co || 'KMB').toLowerCase();
  const dir = row.dir || 'O';
  const exact = row.route + '|' + dir + '|' + (row.service_type || '1') + '|' + co;
  if (typeof routeIndex !== 'undefined' && routeIndex && routeIndex.has(exact)) return exact;
  const head = row.route + '|' + dir + '|';
  for (const k of (routeIndex ? routeIndex.keys() : [])) if (k.startsWith(head) && k.endsWith('|' + co)) return k;
  return exact;
}

function findStopById(id) { return lookupStop(id); }

function openStopView() {
  const panel = document.getElementById('panel');
  const view  = document.getElementById('stopview');
  panel.classList.remove('favmode', 'setmode', 'mtrmode', 'routemode');
  for (const id of ['favview', 'setview', 'mtrview']) document.getElementById(id).style.display = 'none';
  view.style.display = 'block';
  panel.classList.add('stopmode');
  panel.scrollTop = 0;
  // The planner builds the route index the first time a trip is searched.
  // This tab reads the same index, so it has to be built here too — without
  // it no pole can say where its buses go and the destination search has
  // nothing to walk. Cached after the first time, so this is a one-off wait.
  if (!stopIndex && !stopState.indexing) {
    stopState.indexing = true;
    buildIndexes().catch(error => console.warn('Index unavailable:', error))
      .then(() => { stopState.indexing = false; if (activeMode === 'stop') renderStopView(); });
  }
  if (!stopState.stop && !herePoint && navigator.geolocation && geoChoice() === 'yes'
      && !stopState.locating && !stopState.locateTried) {
    stopState.locateTried = true;
    stopLocate();
  }
  renderStopView();
  if (stopState.stop && !stopState.rows && !stopState.loading) stopLoadRows();
}

function stopLocate() {
  if (!navigator.geolocation) { status.textContent = T('noGeo'); return; }
  stopState.locating = true; renderStopView();
  status.textContent = T('findingYou');
  navigator.geolocation.getCurrentPosition(
    position => {
      herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
      stopState.locating = false; renderStopView();
    },
    () => { stopState.locating = false; status.textContent = T('locationFailed'); renderStopView(); },
    { enableHighAccuracy:true, timeout:10000 });
}

// Run something once we know where the rider is. Already located: straight
// through. Otherwise ask the phone first, and remember that they said yes —
// tapping a location pin IS saying yes, so it would be rude to ask again.
function withHere(then) {
  if (herePoint) { then(herePoint); return; }
  if (!navigator.geolocation) { status.textContent = T('noGeo'); return; }
  rememberGeoChoice('yes');
  // Only redraw the picker when the picker is what the rider is looking at.
  // The pin on a route screen uses this too, and there the stop view is
  // hidden — redrawing it would be work nobody sees.
  const paint = () => { if (activeMode === 'stop') renderStopView(); };
  stopState.locating = true; paint();
  status.textContent = T('findingYou');
  navigator.geolocation.getCurrentPosition(
    position => {
      // accuracy comes along for the ride: the map draws it as a circle so a
      // rider indoors is told the phone is unsure rather than shown a
      // confident dot on the wrong side of the building. Everything else
      // reads lat/lng and is untouched by the extra field.
      herePoint = { lat: position.coords.latitude, lng: position.coords.longitude,
                    accuracy: position.coords.accuracy };
      stopState.locating = false;
      paint();
      then(herePoint);
    },
    () => { stopState.locating = false; status.textContent = T('locationFailed'); paint(); },
    { enableHighAccuracy: true, timeout: 10000 });
}

// The closest pole to a point, ignoring rail stations — this is the bus tab.
// How far to look for a stop that can actually get the rider where they said.
// Wider than the everyday nearby list, because "no bus from here" is a heavy
// thing to tell someone and it should not be said while a stop that works
// sits five minutes up the road.
const START_REACH_M = 1000;

function nearestPoleTo(here) {
  const near = stopsNear(here.lat, here.lng, STOP_NEAR_M).filter(n => !n.stop.isStation);
  return near.length ? near[0].stop : null;
}

function stopSetStop(stop, groupStops) {
  const group = groupStops && groupStops.length > 1 ? groupStops : poleGroup(stop);
  stopState = Object.assign(freshStopState(), { locateTried: true, stop, group, destQuery: stopState.destQuery, destPicked: stopState.destPicked, indexing: stopState.indexing });
  renderStopView();
  stopLoadRows();
}

// One tap on a saved stop is this screen with the stop already chosen.
function stopOpenSaved(sf, noFilter, group) {
  // The place typed above stays with you: it becomes the 往… filter here —
  // unless this stop has no bus there at all, in which case filtering by it
  // would open an empty screen. Show everything the stop does have instead.
  // destQuery is what the rider typed and must survive — going back to the
  // picker has to still say 屯門市中心. destFilter is the narrowing applied to
  // THIS stop's rows, and that is the only thing dropped.
  const dest = String(stopState.destQuery || '').trim();
  // `group` is the other bank of the same station, when that is where the
  // bus the rider wants actually leaves from. Open THAT, not the saved pole.
  const bays = (group && group.length) ? group : poleGroup(sf);
  stopState = Object.assign(freshStopState(), { locateTried: true, stop: bays[0], group: bays,
                                                destQuery: dest, destFilter: noFilter ? '' : dest,
                                                destPicked: stopState.destPicked, indexing: stopState.indexing });
  if (activeMode !== 'stop') { showMode('stop'); return; }
  renderStopView(); stopLoadRows();
}

// One tap on a saved destination is the 車站 tab with 我要去 already filled in
// and the picker open, so the next tap is the stop you are standing at. No
// stop is chosen here on purpose: which pole you leave from depends on where
// you are today, which is the whole reason a destination is stored as a name.
function stopOpenDest(name) {
  name = String(name || '').trim();
  stopState = Object.assign(freshStopState(), { locateTried: stopState.locateTried,
                                                destQuery: name, destPicked: true,
                                                indexing: stopState.indexing });
  if (activeMode !== 'stop') { showMode('stop'); return; }
  renderStopView();
}

// ============================================================
// GREEN MINIBUS LIVE TIMES
// ============================================================
// 4,478 poles — a third of the network — had no arrival times at all, because
// fetchPoleRows only ever knew KMB and Citybus. The government does publish
// them, and better than Citybus does: ONE request returns every route at the
// stop, it accepts the very stop ids this app already holds, and it sends
// access-control-allow-origin:*.
//
// The catch is that the feed names routes by a numeric route_id (2006408),
// not by the number painted on the minibus ("1"). Only /route/{region}/{code}
// resolves that, one request per route, which is no good at the roadside — so
// the 779 ids are resolved once, offline, and bundled as gmb-routes.json.
// Checked against the whole network: all 476 GMB route numbers we carry are
// covered.
const GMB_ETA_URL = 'https://data.etagmb.gov.hk/eta/stop/';
let gmbRoutes = null;
async function loadGmbRoutes() {
  if (gmbRoutes) return gmbRoutes;
  try {
    const response = await fetch('./gmb-routes.json', { signal: AbortSignal.timeout(15000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    gmbRoutes = (await response.json()).routes || {};
  } catch (error) { console.warn('GMB route map unavailable:', error); gmbRoutes = {}; }
  return gmbRoutes;
}
// WHICH DIRECTION THIS SIGHTING BELONGS TO.
// Guessing that route_seq 1 means outbound would be a guess; the stop's own
// position in the route is not. Our index already knows, for every GMB route
// through this pole, which bound it was travelling and at what seq — so the
// sighting is matched on that and the direction comes out of our own data.
function gmbKeyFor(stopId, code, stopSeq) {
  const keys = ((typeof stopIndex !== 'undefined' && stopIndex && stopIndex.get(stopId)) || [])
    .filter(k => { const parts = String(k.routeKey).split('|');
                   return parts[3] === 'gmb' && parts[0] === code; });
  return keys.find(k => k.seq === stopSeq) || keys[0] || null;
}
async function fetchGmbRows(stop) {
  await loadGmbRoutes();
  const response = await fetch(GMB_ETA_URL + encodeURIComponent(stop.stop),
                               { signal: AbortSignal.timeout(10000) });
  if (!response.ok) throw new Error('server said ' + response.status);
  const data = (await response.json()).data || [];
  const rows = [];
  for (const entry of data) {
    const info = gmbRoutes[String(entry.route_id)];
    if (!info || !entry.eta || !entry.eta.length) continue;
    const seq = Number(entry.stop_seq) || 0;
    const hit = gmbKeyFor(stop.stop, info.c, seq);
    const dir = hit ? String(hit.routeKey).split('|')[1] : 'O';
    const dest = (info.d || {})[String(entry.route_seq)] || {};
    for (const e of entry.eta) {
      if (!e.timestamp) continue;
      rows.push({ route: info.c, dir, service_type: '1', seq, eta: e.timestamp,
                  dest_tc: dest.tc || '', dest_en: dest.en || '',
                  rmk_tc: e.remarks_tc || '', rmk_en: e.remarks_en || '' });
    }
  }
  return rows;
}

// Live rows for one pole: an array, or null when its company has no feed.
// `wantRoutes` narrows the Citybus half. Citybus answers PER ROUTE, so a pole
// with a dozen routes costs a dozen requests — and the ranking only ever cares
// about the routes that actually reach where the rider said they are going.
// Asking about the rest was most of the cost of a search: a 淺水灣 ranking
// pass issued 112 requests, nearly all of them about buses going elsewhere.
async function fetchPoleRows(stop, wantRoutes) {
  const co = stopCompany(stop.stop);
  let rows = null;
  if (co === 'KMB') {
    const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + stop.stop,
                                 { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    rows = (await response.json()).data || [];
  } else if (co === 'CTB') {
    // Citybus answers per route, so ask for each route the index says stops here.
    let routes = [...new Set(routesAtStop(stop.stop).filter(r => r.co === 'CTB').map(r => r.route))];
    if (wantRoutes && wantRoutes.size) routes = routes.filter(r => wantRoutes.has(r));
    routes = routes.slice(0, 12);
    const lists = await Promise.all(routes.map(async route => {
      try {
        const response = await fetch(CTB_BASE + '/eta/CTB/' + stop.stop + '/' + encodeURIComponent(route),
                                     { signal: AbortSignal.timeout(10000) });
        return response.ok ? ((await response.json()).data || []) : [];
      } catch (error) { return []; }
    }));
    rows = lists.flat();
  } else if (co === 'GMB') {
    rows = await fetchGmbRows(stop);
  }
  return rows === null ? null : rows.map(row => Object.assign({}, row,
    { stop: stop.stop, stopName_en: stop.name_en, stopName_tc: stop.name_tc, co: row.co || co }));
}

async function stopLoadRows(force) {
  const stop = stopState.stop;
  if (!stop) return;
  if (!force && stopState.rows && Date.now() - stopState.fetchedAt < 30000) return;
  stopState.loading = true; stopState.alert = null; renderStopView();
  // One screen for every bay of the group: ask each, and show each bay's
  // buses the moment they arrive instead of waiting for the slowest bay.
  const group = stopGroupNow();
  const results = new Array(group.length).fill(null);
  const settled = new Array(group.length).fill(false);
  const paintSoFar = () => {
    if (stopState.stop !== stop) return;
    const live = results.filter(Array.isArray);
    if (!live.length) return;
    stopState.rows = live.flat();
    const rowsBox = document.getElementById('stop-rows');
    if (rowsBox) rowsBox.innerHTML = stopRowsHtml();
  };
  await Promise.all(group.map((s, i) => fetchPoleRows(s)
    .then(r => { results[i] = r; }, () => { results[i] = undefined; })
    .then(() => { settled[i] = true; if (settled.some(x => !x)) paintSoFar(); })));
  if (stopState.stop !== stop) return;                   // moved on meanwhile
  const failed = results.filter(r => r === undefined).length;
  if (failed === results.length) {
    stopState.rows = []; stopState.alert = T('etaOffline');
  } else {
    const live = results.filter(Array.isArray);
    stopState.noLive = !live.length;
    stopState.rows = live.flat();
  }
  stopState.fetchedAt = Date.now(); stopState.loading = false;
  const rowsBox = document.getElementById('stop-rows');
  if (rowsBox && document.activeElement && document.activeElement.id === 'stop-filter') rowsBox.innerHTML = stopRowsHtml();
  else renderStopView();
  // Any remark on a row here that says delayed, diverted or suspended.
  noteBusRemarks(stopState.rows || [], group.map(g => g.stop), route => T('alertOnScreen').replace('{s}', route));
  refreshAlerts();
}

// The picker in two halves. The top holds the 我要去 box (with the location
// card above it); the rest is everything that changes as the place is typed.
// A keystroke redraws only the rest, so the box under the rider's finger is
// never rebuilt — rebuilding it on every letter broke the keyboard's word
// composition on the phone and made typing feel slow.
function stopPickerParts() {
  const st = stopState;
  // The typed destination, if any, narrows every list on this screen to
  // poles that have a direct bus there — and each pole's line to just those
  // buses. A pole that cannot take you where you said is not an option.
  const destIds = destIdsNow();
  const filtering = !!(destIds && destIds.size);
  const keep = stop => !filtering || reachingRoutes(stop.stop, destIds).length > 0;
  const poleButton = (group, metres, best) => {
    const stop = group[0];
    const chip = group.length > 1 ? T('stopBays').replace('{n}', group.length) : poleCodeOf(stop);
    return '<button data-stop-id="' + esc(stop.stop) + '"' +
      askAttrs(best) +
      '><span class="pickmain">📍 ' + esc(stopName(stop)) +
      (chip ? ' <span class="polecode">' + esc(chip) + '</span>' : '') +
      groupDirHtml(group.map(g => g.stop)) +
      arriveTagHtml(best) +
      poleRoutesLine(group.map(g => g.stop), 4, filtering ? destIds : null) + '</span>' +
      (metres != null ? '<span class="mtrdist">' + Math.round(metres) + ' m</span>' : '') + '</button>';
  };

  let top = '', rest = '', star = '';
  if (st.locating) return { top: '<div class="favempty">' + T('findingYou') + '</div>', rest, star };

  if (navigator.geolocation && !herePoint && geoChoice() !== 'no' && geoChoice() !== 'yes') {
    top += '<div class="mtrgeo"><div class="geotitle">' + T('stopGeoTitle') + '</div>' +
           '<div class="geobody">' + T('stopGeoBody') + '</div>' +
           '<div class="geobtns"><button class="geoyes" data-stop-act="geo-yes">' + T('geoYes') + '</button>' +
           '<button class="geono" data-stop-act="geo-no">' + T('geoNo') + '</button></div></div>';
  }
  // No 我的位置 bar here any more. It was a whole row at the top of the
  // landing screen doing what the 📍 on the left of each search box now does,
  // and doing it less precisely — the bar only fetched a fix, while the pins
  // fetch one AND act on it. The card above still runs on a first visit,
  // because asking in our own words before the browser's own prompt appears
  // is the one thing a pin cannot do.
  if (st.indexing || !stopIndex) top += '<div class="rshint">' + T('stopIndexing') + '</div>';

  // Where are you going? The star saves the place once it names real stops.
  const destTyped = String(st.destQuery || '').trim();
  const destSaved = destTyped && isSavedDest(destTyped);
  const canSaveDest = destTyped && (destSaved || filtering);
  star = canSaveDest
    ? '<button class="rsstar' + (destSaved ? ' on' : '') + '" data-stop-act="deststar" title="' + esc(T(destSaved ? 'stopDestUnstar' : 'stopDestStar')) +
      '" aria-label="' + esc(T(destSaved ? 'stopDestUnstar' : 'stopDestStar')) + '">' + (destSaved ? '★' : '☆') + '</button>'
    : '';
  // A pin on the left of each box, so "where I am" never has to be typed.
  // On 我要去 it fills the box with the stop you are standing at — which is
  // what makes the ★ beside it useful: stand somewhere once, save it, and it
  // is a one-tap destination for ever after.
  const pin = act => '<button class="rspin" data-stop-act="' + act + '" title="' + esc(T('useMyLocation')) +
                     '" aria-label="' + esc(T('useMyLocation')) + '">📍</button>';
  // Always there, so the row never changes shape as you type — greyed when
  // there is nothing to clear. A control that appears and disappears under
  // the thumb is one you learn not to trust.
  const clearBtn = (act, on) => '<button class="rsclear' + (on ? '' : ' off') + '" data-stop-act="' + act +
    '" title="' + esc(T('clearBox')) + '" aria-label="' + esc(T('clearBox')) + '">✕</button>';

  // THE ROW READS LEFT TO RIGHT LIKE A SENTENCE.
  // The two things that ACT on the place — find it near me, keep it under my
  // own name — sit together on the left where the thumb already is, and the
  // ✕ that empties the box sits at the far right where a clear always is.
  // The star used to be marooned on the right, next to nothing it related to.
  top += '<div class="frow labelled"><span class="rowlabel">' + T('stopDestLabel') + '</span>' +
         pin('here-dest') +
         '<span id="stop-dest-star">' + star + '</span>' +
         '<input id="stop-dest" type="text" placeholder="' + esc(T('stopDestPhShort')) + '"' +
         ' aria-label="' + esc(T('stopDestPh')) + '" autocomplete="off" value="' + esc(st.destQuery || '') + '">' +
         clearBtn('clear-dest', !!(st.destQuery || '').trim()) + '</div>' +
         '<div id="stop-dest-results"></div>';

  if (stopDests.length) {
    // One tap sets the place; tapping the lit one again clears it.
    rest += '<div class="mtrsub">' + T('stopDestSaved') + '</div><div class="favgrid">' +
      stopDests.slice(0, MAX_DESTS).map(d => { const n = destName(d), on = n === destTyped;
        return '<button class="favbub' + (on ? ' on' : '') + '" data-stop-act="dest" data-name="' + esc(n) + '">' +
               '<span class="fbname">' + (on ? '★ ' : '') + esc(destLabel(d)) + '</span></button>'; }).join('') +
      '</div>';
  }
  // The starting stop: type it, or tap one saved. The nearest poles come
  // last — they are the fallback when you have not said where you are.
  rest += '<div class="frow labelled sectionbreak"><span class="rowlabel">' + T('stopStartLabel') + '</span>' +
          pin('here-start') +
          '<input id="stop-search" type="text" placeholder="' + esc(T('stopSearchPhShort')) + '"' +
          ' aria-label="' + esc(T('stopSearchPh')) + '" autocomplete="off">' +
          clearBtn('clear-start', false) + '</div>' +
          '<div class="mtrpick" id="stop-search-results"></div>';
  // Saved poles as one-tap pills, same shape as the saved places above.
  // YOUR SAVED STOPS, ALWAYS SHOWN — but greyed when they cannot get you
  // where you just said you were going. Hiding them was tried and was worse:
  // a favourite that vanishes reads as lost, not as unsuitable. Dimmed, it
  // still says "this is yours" while saying "not for this trip".
  //
  // Reachability is judged over the whole GROUP of bays, not the one saved
  // pole, because tapping the pill opens the group. Judging the single pole
  // would grey out a stop that works the moment you tap it.
  //
  // It stays TAPPABLE. A dead button is a dead end — an older rider taps it,
  // nothing happens, and the app looks broken. Tapping a greyed one opens it
  // WITHOUT the destination filter, which is the same thing the greyed
  // station cards in the search above already do.
  const savedShown = stopFavs.slice(0, MAX_STOPS);
  if (savedShown.length) {
    rest += '<div class="mtrsub">' + T('stopSavedPicks') + '</div><div class="favgrid">' +
      savedShown.map(f => {
        const found = reachingBays(f, filtering ? destIds : null);
        const ids = found.bays.map(g => g.stop);
        const reaches = !filtering || reachingRoutes(ids, destIds).length > 0;
        // Both halves of the answer are marked, not just the bad half. Greying
        // the wrong ones tells you where NOT to go; lighting the right ones
        // tells you where to go, which is the question actually being asked.
        // Same amber as the chosen destination above, so one glance down the
        // screen reads "here → there" in one colour.
        const mark = !filtering ? '' : (reaches ? ' ok' : ' dim');
        // ONE LINE OF CONTEXT, AND THE MOST IMPORTANT ONE.
        // The pill used to carry the pole code, the compass direction, and
        // a warning when there was one. At a quarter of the screen's width
        // all three ellipsise each other away, so they are ranked instead:
        // "no direct bus" and "cross the road" can send somebody to the
        // wrong kerb, so they win; otherwise the direction, which is what
        // separates two stops of the same name. The pole code is on the
        // stop's own screen, one tap away, at a size that can be read.
        const meta = !reaches ? esc(T('stopNoDirect'))
                   : found.crossed ? esc(T('stopCrossOver'))
                   : (found.crossed ? groupDirHtml(ids) : poleDirHtml(f.stop));
        return '<button class="favbub' + mark + (found.crossed ? ' cross' : '') +
          '" data-stop-act="fav" data-index="' +
          stopFavs.indexOf(f) + '"' + (found.crossed ? ' data-stop-group="' + esc(ids.join(',')) + '"' : '') +
          (reaches ? '' : ' data-nofilter="1"') + '>' +
          '<span class="fbname">' + (filtering && reaches ? '✓ ' : '') + esc(favLabel(f)) + '</span>' +
          (meta ? '<span class="fbmeta">' + meta + '</span>' : '') +
          '</button>';
      }).join('') + '</div>';
  }
  if (st.destQuery && destIds && !destIds.size)
    rest += '<div class="favempty">' + T('stopDestNoName').replace('{d}', esc(st.destQuery)) + '</div>';
  if (filtering) rest += '<div class="rshint">' + T('stopShowingTo').replace('{d}', esc(st.destQuery)) + '</div>';
  if (herePoint) {
    const nearAll = stopsNear(herePoint.lat, herePoint.lng, filtering ? 600 : STOP_NEAR_M).filter(n => !n.stop.isStation);
    let near = groupPoles(nearAll, keep, filtering ? 6 : 4);
    // Nearest-first is the right answer only when nowhere has been named.
    // With a destination set, the question is which of these puts you there
    // soonest — and the walk counts twice over, because it is both time
    // spent and buses missed while you spend it.
    if (filtering) {
      for (const n of near) {
        n.walk = walkingEstimate(n.metres || 0).minutes;
        n.eta = arriveBest(n.group.map(g => g.stop), destIds, n.walk);
      }
      const rank = n => (n.eta && n.eta.total !== undefined) ? n.eta.total : Infinity;
      near = near.slice().sort((a, b) => rank(a) - rank(b) || (a.metres || 0) - (b.metres || 0));
      const stamp = 'near|' + st.destQuery;
      arriveStamp = stamp;
      ensureArrivals(near.slice(0, ARRIVE_MAX_GROUPS).flatMap(n => baysToAsk(n.group, destIds)), stamp)
        .then(fresh => { if (fresh && arriveStamp === stamp) stopScheduleRefresh(); });
    }
    if (near.length)
      rest += '<div class="mtrsub sectionbreak">' + T('stopNearby') + '</div><div class="mtrpick">' + near.map(n => poleButton(n.group, n.metres, n.eta)).join('') + '</div>';
    else
      rest += '<div class="favempty">' + (filtering ? T('stopNearNoneTo').replace('{d}', esc(st.destQuery)) : T('stopNoneNear')) + '</div>';
  }
  return { top, rest, star };
}

// A keystroke in 我要去: one redraw per frame, of the lower half only. The
// start-stop box keeps whatever was typed in it, and its results follow.
let stopRefreshPending = 0;
function stopScheduleRefresh() {
  if (stopRefreshPending) return;
  // A short timer, not an animation frame: frames stop in a backgrounded
  // tab, and the redraw would then wait until the tab was looked at again.
  stopRefreshPending = setTimeout(() => {
    stopRefreshPending = 0;
    const rest = document.getElementById('stop-rest');
    if (!rest || stopState.stop) { renderStopView(); return; }
    const parts = stopPickerParts();
    const startBox = document.getElementById('stop-search');
    const startTyped = startBox ? startBox.value : '';
    rest.innerHTML = parts.rest;
    const starBox = document.getElementById('stop-dest-star');
    if (starBox && starBox.innerHTML !== parts.star) starBox.innerHTML = parts.star;
    if (startTyped) { const again = document.getElementById('stop-search'); if (again) { again.value = startTyped; stopRenderSearch(startTyped); } }
    stopRenderDest(stopState.destQuery);
  }, 16);
}

function renderStopView() {
  const view = document.getElementById('stopview');
  if (!view) return;
  const st = stopState;
  let html = '';   // no heading: the tab is the heading, and the space is worth more

  if (!st.stop) {
    const parts = stopPickerParts();
    view.innerHTML = '<div id="stop-top">' + parts.top + '</div><div id="stop-rest">' + parts.rest + '</div>';
    if (st.destQuery) stopRenderDest(st.destQuery);
    return;
  }

  // ---- 2. THE STOP ----
  // THE TITLE GOES ABOVE THE STOP, NOT ABOVE THE BOX.
  // It used to sit directly on top of the 只顯示往… field, which made it read
  // as that field's label — so the field looked like "search the buses from
  // this stop" when it is really a filter on where they are GOING. Same words,
  // one place higher, and the screen reads: what this is, which stop, then
  // the narrowing. Nothing now labels the box except the box's own wording.
  html += '<div class="mtrsub stoptitle">' + T('stopRoutesHere') + '</div>';
  const stop = st.stop;
  const group = stopGroupNow();
  const groupIds = group.map(g => g.stop);
  const here = herePoint ? Math.round(metresBetween(herePoint.lat, herePoint.lng, Number(stop.lat), Number(stop.long))) : null;
  const saved = isSavedStop(stop.stop);
  const code = poleCodeOf(stop);
  const chip = group.length > 1 ? T('stopBays').replace('{n}', group.length) : code;
  html += '<div class="mtrsta"><div class="mtrname">🚏 ' + esc(stopName(stop)) +
          (chip ? ' <span class="polecode">' + esc(chip) + '</span>' : '') +
          groupDirHtml(group.map(x => x.stop)) +
          (here !== null ? '<small>' + T('mtrAway').replace('{m}', here) + '</small>' : '') + '</div>' +
          // Save / unsave is one small star beside 更改 — the full-width
          // 已收藏 bar it replaces was a whole line saying something the
          // rider already knew, on the screen where every line counts.
          '<button class="' + (saved ? 'rsstar on' : 'rsstar') + '" data-stop-act="star" title="' + esc(T(saved ? 'stopSavedBtn' : 'stopSaveBtn')) +
          '" aria-label="' + esc(T(saved ? 'stopSavedBtn' : 'stopSaveBtn')) + '">' + (saved ? '★' : '☆') + '</button>' +
          '<button class="refreshbtn" data-stop-act="change">' + T('mtrChange') + '</button></div>';

  // ---- 3. EVERY BUS FROM IT, narrowed to a direction if asked ----
  // The filter and the refresh share one row: the box says what it does, the
  // button sits beside it rather than under a heading that is no longer here.
