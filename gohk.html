  // Its own screen: nearest station, line, direction, next trains. The trip
  // planner's train results are one tap away at the bottom of it.
  if (mode === 'mtr') {
    activeMode = 'mtr';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('favmode', 'setmode', 'stopmode', 'mapmode');
    favView.style.display = 'none';
    setView.style.display = 'none';
    stopView.style.display = 'none';
    openMtrView();
    paintBottomBar();
    return;
  }

  // ---- MAP ----
  // THE MAP HAS ITS OWN TAB NOW.
  // It used to be the backdrop to every screen, reachable only by dragging
  // the sheet down off whatever you were reading — so it was both underfoot
  // and hard to find. A rider looking up a bus does not want a map behind the
  // times, and a rider who wants the map wants all of it. One tap, whole
  // screen, and nothing else competing for it.
  if (mode === 'map') {
    activeMode = 'map';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('favmode', 'setmode', 'mtrmode', 'stopmode');
    favView.style.display = 'none';
    setView.style.display = 'none';
    mtrView.style.display = 'none';
    stopView.style.display = 'none';
    panel.classList.add('mapmode');
    document.body.classList.add('mapopen');
    // Leaflet sized itself against a panel that was covering it; it has to be
    // told the shape changed or it draws the tiles for the old rectangle.
    setTimeout(() => {
      map.invalidateSize();
      drawStops();
      openMapLayer();
      // Open on the rider, not on the whole territory — but only the FIRST
      // time. Someone who panned to Sha Tin and came back to check a bus is
      // owed Sha Tin again, not a map that keeps snapping home.
      if (herePoint && !mapCentredOnce) {
        mapCentredOnce = true;
        map.setView([herePoint.lat, herePoint.lng], Math.max(map.getZoom(), 15));
      }
    }, 60);
    paintBottomBar();
    return;
  }

  // ---- SETTINGS ----
  // Same rules as favourites: reachable at any time, takes the whole panel.
  if (mode === 'set') {
    activeMode = 'set';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('favmode', 'mtrmode', 'stopmode', 'mapmode');
    favView.style.display = 'none';
    mtrView.style.display = 'none';
    stopView.style.display = 'none';
    panel.classList.add('setmode');
    setView.style.display = 'block';
    renderSettings();
    paintBottomBar();
    return;
  }

  panel.classList.remove('favmode', 'setmode', 'mtrmode', 'stopmode', 'mapmode');
  favView.style.display = 'none';
  setView.style.display = 'none';
  mtrView.style.display = 'none';
  stopView.style.display = 'none';
  compare.style.display = '';
  box.style.display = '';
  activeMode = mode;
  currentPicks = (mode === 'mtr' ? railPicks : busPicks);
  paintBottomBar();

  // The saved buses or stations, with live times, before anything else —
  // unless the rider asked the map a direct question, in which case the
  // answer comes first and this stays out of the way.
  if (routeFromMap) document.getElementById('livestrip').innerHTML = '';
  else renderLiveStrip(mode);

  // Nothing searched yet, or nothing found for this mode: the useful thing
  // to show is the form, not an empty list. Tapping a section is then a way
  // back to planning rather than a dead end.
  if (currentPicks.length === 0) {
    setResultsMode(false);
    status.textContent = T(mode === 'mtr' ? 'noTrain' : 'noBus');
    return;
  }

  setResultsMode(true);
  buildCompareStrip(currentPicks);
  selectOption(currentPicks[0]);
  // Start at the top. Resetting before the cards are built leaves the old
  // scroll position in place once they arrive.
  document.getElementById('panel').scrollTop = 0;
  currentPicks.forEach(pick => loadNextBus(pick));
}

// The settings screen. Redrawn on open and after a language change, so it
// is built from T() every time rather than patched in place.
function renderSettings() {
  const view = document.getElementById('setview');
  if (!view) return;
  view.innerHTML =
    '<div class="favhead">⚙️ ' + T('settings') + '</div>' +
    '<div class="setrow setrow-stack">' +
      '<span class="setlabel">' + T('settingLanguage') + '</span>' +
      '<div class="sizebtns">' +
        [['tc','langTC'],['sc','langSC'],['en','langEN']].map(([k,t]) =>
          '<button class="sizebtn' + ((lang === 'en' ? 'en' : script) === k ? ' on' : '') + '" data-lang="' + k + '">' + T(t) + '</button>').join('') +
      '</div>' +
    '</div>' +
    // Three sizes, the current one filled in. Buttons, not a slider: a slider
    // is the one control older thumbs reliably struggle with.
    '<div class="setrow setrow-stack">' +
      '<span class="setlabel">' + T('textSize') + '</span>' +
      '<div class="sizebtns">' +
        [['normal','textNormal'],['large','textLarge'],['xlarge','textXLarge']].map(([k,t]) =>
          '<button class="sizebtn' + (textScale === k ? ' on' : '') + '" data-textsize="' + k + '">' +
            T(t) + '</button>').join('') +
      '</div>' +
    '</div>' +
    // Senior mode: on or off, and the rule it follows, in plain words.
    '<div class="setrow setrow-stack">' +
      '<span class="setlabel">' + T('settingElderly') + '</span>' +
      '<div class="sizebtns">' +
        [['1','elderOn'],['0','elderOff']].map(([k,t]) =>
          '<button class="sizebtn' + ((elderly ? '1' : '0') === k ? ' on' : '') + '" data-elderly="' + k + '">' + T(t) + '</button>').join('') +
      '</div>' +
      '<div class="setnote">' + T('elderNote') + '</div>' +
    '</div>' +
    installRow() +
    '<div class="setnote">' + T('settingsNote') + '</div>';
}

// ADD TO HOME SCREEN. Three states, and only two of them are worth a row:
// offered (the browser has said the app qualifies), already installed, or
// neither — on a desktop, or in a browser that does not do this, where a
// button that cannot work would read as a broken app.
function installRow() {
  if (installPrompt) {
    return '<div class="setrow">' +
             '<span class="setlabel">' + T('settingInstall') + '</span>' +
             '<button class="gobtn" id="installbtn" style="min-width:110px">' +
               T('install') + '</button>' +
           '</div>' +
           '<div class="setnote">' + T('installNote') + '</div>';
  }
  if (isInstalled()) {
    return '<div class="setrow">' +
             '<span class="setlabel">' + T('settingInstall') + '</span>' +
             '<span class="setlabel" style="flex:0 0 auto;color:#166534">' +
               T('installedAlready') + '</span>' +
           '</div>';
  }
  return '';
}

// The favourites screen. The chips in the form show two characters because
// they sit in a row; here there is room for the whole name and for saying
// plainly what each button does.
// ============================================================
// THE LIVE STRIP
// ============================================================
// Opening a section should answer the question that section is about, before
// anything is typed. Tapping 巴士 asks "when is my bus?", so the saved buses
// and their countdowns sit at the top. Tapping 港鐵 asks "when is my train?",
// so the saved stations sit there instead, with both directions, because at
// a platform the only remaining question is which way.
// ============================================================
// LOCATION, ASKED FOR PROPERLY
// ============================================================
// The browser's own permission box gives no reason, and a box with no reason
// gets refused. So the app asks first, in its own words, and only calls the
// browser once someone has said yes. The answer is remembered, because being
// asked the same question every morning is its own kind of rude.
function geoChoice() {
  try { return localStorage.getItem(GEO_CHOICE); } catch (e) { return null; }
}
function rememberGeoChoice(answer) {
  try { localStorage.setItem(GEO_CHOICE, answer); } catch (e) {}
}

function askAboutLocation() {
  const box = document.getElementById('geoask');
  if (!box) return;

  if (!navigator.geolocation || geoChoice() === 'no') { box.style.display = 'none'; return; }
  if (geoChoice() === 'yes') { box.style.display = 'none'; findMeThenNearby(); return; }

  box.style.display = 'block';
  box.innerHTML =
    '<div class="geotitle">' + T('geoTitle') + '</div>' +
    '<div class="geobody">' + T('geoBody') + '</div>' +
    '<div class="geobtns">' +
      '<button class="geoyes" id="geo-yes">' + T('geoYes') + '</button>' +
      '<button class="geono"  id="geo-no">'  + T('geoNo')  + '</button>' +
    '</div>';

  document.getElementById('geo-yes').addEventListener('click', () => {
    rememberGeoChoice('yes');
    box.style.display = 'none';
    findMeThenNearby();
  });
  document.getElementById('geo-no').addEventListener('click', () => {
    rememberGeoChoice('no');
    box.style.display = 'none';
  });
}

function findMeThenNearby() {
  if (!navigator.geolocation) return;
  status.textContent = T('findingYou');
  navigator.geolocation.getCurrentPosition(
    position => {
      herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
      map.setView([herePoint.lat, herePoint.lng], 16);
      status.textContent = T('foundYou');
      if (activeMode === 'bus') renderLiveStrip('bus');
      if (activeMode === 'mtr') openMtrView();
      if (activeMode === 'stop') renderStopView();
    },
    error => { status.textContent = T('locationFailed'); },
    { enableHighAccuracy:true, timeout:10000 });
}

// What can I catch from right here? With a median of 25 bus stops within
// 400 m of any given stop in Hong Kong, the useful answer is the nearest few
// stops merged together, not every pole in the neighbourhood.
const NEARBY_RADIUS_M = 400;
const NEARBY_STOPS = 4;

// Poles only merge here if they are practically touching. The search list
// merges at 250 m because there "又一城" is one place; standing in the street
// it is not — the pole across the road runs the other way, and sending
// someone to the wrong side of a dual carriageway is a real mistake.
const SAME_POLE_M = 25;

async function renderNearbyBuses(into) {
  if (!herePoint || allStops.length === 0) return;

  const close = allStops
    .filter(stop => !stop.isStation)
    .map(stop => ({ stop, metres: metresBetween(herePoint.lat, herePoint.lng,
                                                Number(stop.lat), Number(stop.long)) }))
    .filter(entry => entry.metres <= NEARBY_RADIUS_M)
    .sort((a, b) => a.metres - b.metres);

  if (close.length === 0) { appendHTML(into, '<div class="livehint">' + T('noStopsNear') + '</div>'); return; }

  // NOT merged. The whole point here is to send someone to one specific pole,
  // and a card listing five codes cannot do that. One card, one pole, one
  // number painted on it.
  const groups = close.slice(0, NEARBY_STOPS)
    .map(entry => ({ ...entry.stop, members: [entry.stop], lat: Number(entry.stop.lat),
                     lng: Number(entry.stop.long) }));
  const walkTo = group => Math.round(metresBetween(herePoint.lat, herePoint.lng, group.lat, group.lng));

  // The pole code is normally hidden because "又一城 (SS920)" means nothing
  // when you are choosing a destination. Here it means everything: it is
  // painted on the pole, and it is how you know you are at the right one.
  const poleCode = group => {
    const codes = group.members.map(m => {
      const found = /\(([A-Z]{2}\d{3}[A-Za-z]?)\)\s*$/.exec(m.name_en || '');
      return found ? found[1] : null;
    }).filter(Boolean);
    return codes.length ? codes.join(' / ') : '';
  };

  appendHTML(into, '<div class="livehead">📍 ' + T('nearbyBuses') + '</div>' +
    groups.map((group, i) => {
      const code = poleCode(group);
      return '<div class="livecard nearby">' +
        '<div class="livetitle">' + esc(stopName(group)) +
          (code ? '<span class="polecode">' + esc(code) + '</span>' : '') + '</div>' +
        '<div class="livesub">' + T('walkThere') + ' ' + walkTo(group) + T('metresAway') + '</div>' +
        '<div class="livetimes" id="near-' + i + '">…</div>' +
      '</div>';
    }).join(''));

  groups.forEach((group, i) => loadNearbyEta(group, 'near-' + i));
}

async function loadNearbyEta(group, id) {
  const cell = document.getElementById(id);
  if (!cell) return;
  try {
    const lists = await Promise.all(group.members.map(async member => {
      try {
        const response = await fetch(
          'https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + member.stop,
          { signal: AbortSignal.timeout(10000) });
        if (!response.ok) return [];
        return (await response.json()).data || [];
      } catch (error) { return []; }
    }));

    const now = Date.now();
    const soonest = new Map();          // route -> { minutes, dest }
    for (const row of lists.flat()) {
      if (!row.eta) continue;
      const minutes = Math.round((new Date(row.eta).getTime() - now) / 60000);
      if (minutes < 0) continue;
      const key = row.route + '|' + (row.dest_en || '');
      if (!soonest.has(key) || soonest.get(key).minutes > minutes)
        soonest.set(key, { minutes, route: row.route,
                           dest: lang === 'zh' ? (row.dest_tc || row.dest_en) : row.dest_en });
    }
    if (!document.getElementById(id)) return;

    const rows = [...soonest.values()].sort((a, b) => a.minutes - b.minutes).slice(0, 5);
    if (rows.length === 0) { cell.textContent = T('noneDue'); cell.classList.add('quiet'); return; }

    cell.classList.remove('quiet');
    cell.innerHTML = rows.map(r =>
      '<div class="nearrow"><span class="nearroute">' + esc(r.route) + '</span>' +
      '<span class="neardest">' + esc(r.dest || '') + '</span>' +
      '<span class="nearmin">' + (r.minutes === 0 ? T('due') : r.minutes + T('min')) + '</span></div>'
    ).join('');
  } catch (error) {
    cell.textContent = T('etaOffline');
    cell.classList.add('quiet');
  }
}

function whichLinesServe(code) {
  if (!mtrData) return [];
  const found = [];
  for (const [line, variants] of Object.entries(mtrData.lines))
    if (variants.some(stops => stops.includes(code)) && !found.includes(line)) found.push(line);
  return found;
}

// A saved place counts as a station when it sits on top of one. Storing the
// code at save time would be neater, but this also picks up stations saved
// before the app knew about them. Reads the saved STARTING STOPS, which is
// where saved places live now — 太子站 saved as a bus stop should offer the
// train from 太子 too, because to the rider it is one place.
function savedStations() {
  if (!mtrData) return [];
  const out = [];
  for (const fav of stopFavs) {
    let best = null, bestMetres = Infinity;
    for (const [code, s] of Object.entries(mtrData.stations)) {
      const m = metresBetween(fav.lat, fav.long, s[2], s[3]);
      if (m < bestMetres) { bestMetres = m; best = code; }
    }
    if (best && bestMetres <= 200 && !out.some(x => x.code === best))
      out.push({ code: best, label: stopName(fav) });
  }
  return out.slice(0, 3);
}

// innerHTML += re-parses the WHOLE container, replacing every existing node.
// Any element already handed to an in-flight fetch becomes detached, so the
// arrival times arrive and get written to a node nobody can see. Append into
// a fresh wrapper instead.
function appendHTML(parent, html) {
  const box = document.createElement('div');
  box.innerHTML = html;
  parent.appendChild(box);
  return box;
}

function liveCard(title, subtitle, id, attrs, footer) {
  return '<div class="livecard' + (attrs ? ' tap' : '') + '"' + (attrs || '') + '>' +
           '<div class="livetitle">' + esc(title) + '</div>' +

           (footer ? '<div class="livefoot">' + footer + '</div>' : '') +

// ADDING A BUS BY NUMBER
// ============================================================
// The star on a map popup pins a route to ONE pole, which is right when you
// always board at the same place. But "my bus is the 60X towards Tuen Mun" is
// how people actually think, and that holds whether they are at home or at
// work. A route saved this way carries no stop: at display time the app finds
// the nearest stop on that route to wherever they are standing.
function renderAddRoute(into) {
  const wrap = document.createElement('div');
  wrap.className = 'addroute';

  const button = document.createElement('button');
  button.className = 'addroutebtn';
  button.textContent = '＋ ' + T('addRoute');

  const panel = document.createElement('div');
  panel.className = 'addroutepanel';
  panel.style.display = 'none';
  panel.innerHTML =
    '<div class="frow">' +
      '<input id="addroute-text" type="text" inputmode="text" autocomplete="off" ' +
        'placeholder="' + T('routePlaceholderShort') + '">' +
    '</div>' +
    '<div class="addroutehint">' + T('pickDirection') + '</div>' +
    '<div id="addroute-results"></div>';

  button.addEventListener('click', () => {
    const open = panel.style.display !== 'none';
    panel.style.display = open ? 'none' : 'block';
    button.classList.toggle('on', !open);
    if (!open) { const box = document.getElementById('addroute-text'); if (box) box.focus(); }
  });

  wrap.appendChild(button);
  wrap.appendChild(panel);
  into.appendChild(wrap);

  const input = panel.querySelector('#addroute-text');
  const list  = panel.querySelector('#addroute-results');

  const draw = () => {
    const typed = input.value.trim().toUpperCase();
    list.innerHTML = '';
    if (typed.length < 1) return;

    // Every variant of the number is a separate direction, and the terminus
    // name is what tells them apart in a way a rider recognises.
    const matches = allRoutes
      .filter(r => String(r.route).toUpperCase().startsWith(typed))
      .slice(0, 12);

    if (matches.length === 0) {
      list.innerHTML = '<div class="livehint">' + T('noRouteFound') + '</div>';
      return;
    }

    for (const r of matches) {
      const already = departures.some(d =>
        String(d.route).toUpperCase() === String(r.route).toUpperCase() && d.dir === r.bound);
      const item = document.createElement('button');
      item.className = 'addrouteitem' + (already ? ' on' : '');
      item.innerHTML =
        '<span class="ariroute">' + esc(r.route) + '</span>' +
        '<span class="aridest">' + T('towards') + ' ' +
          esc(lang === 'zh' ? (r.dest_tc || r.dest_en) : r.dest_en) + '</span>' +
        '<span class="aritick">' + (already ? '★' : '＋') + '</span>';

      item.addEventListener('click', () => {
        toggleDeparture({
          route: r.route, dir: r.bound, serviceType: r.service_type, co: 'KMB',
          stop: null,                       // resolved from where you are
          stopName_en: '', stopName_tc: '',
          dest_en: r.dest_en, dest_tc: r.dest_tc
        });
        renderFavouriteList();
      });
      list.appendChild(item);
    }
  };

  input.addEventListener('input', draw);
}

// A route saved without a stop needs one before it can have a time. Find the
// closest stop on that route to where the person is now.
const routeStopCache = new Map();

async function stopsOnRoute(dep) {
  const dir = dep.dir === 'O' ? 'outbound' : 'inbound';
  const key = 'kmb-rs-' + dep.route + '-' + dir + '-' + (dep.serviceType || 1);
  if (routeStopCache.has(key)) return routeStopCache.get(key);

  let refs = await cacheGet(key);
  if (!refs) {
    const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' +
      encodeURIComponent(dep.route) + '/' + dir + '/' + encodeURIComponent(dep.serviceType || 1),
      { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    refs = (await response.json()).data || [];
    cachePut(key, refs);
  }
  routeStopCache.set(key, refs);
  return refs;
}

async function resolveNearestStop(dep) {
  if (dep.stop) return dep.stop;
  if (!herePoint) return null;

  const refs = await stopsOnRoute(dep);
  const byId = new Map(allStops.map(s => [s.stop, s]));
  let best = null, bestMetres = Infinity;
  for (const ref of refs) {
    const stop = byId.get(ref.stop);
    if (!stop) continue;
    const m = metresBetween(herePoint.lat, herePoint.lng, Number(stop.lat), Number(stop.long));
    if (m < bestMetres) { bestMetres = m; best = stop; }
  }
  return best ? best.stop : null;
}

// RENAMING A SAVED PLACE.
// Only the LABEL changes. The stop id, the real stop name and the text every
// search and traffic-alert match runs on are left exactly as they were, so
// calling a stop 「返屋企」 can never stop the app finding it. Clearing the box
// puts the real name back.
function startRename(row, list, index, isStart, real, label) {
  const wrap = document.createElement('div');
  wrap.className = 'fprename';

  const input = document.createElement('input');
  input.type = 'text';
  input.value = label;
  input.maxLength = 24;
  input.setAttribute('aria-label', T('renameTitle'));
  input.placeholder = real;

  const save = document.createElement('button');
  save.className = 'fpsave';
  save.textContent = T('renameSave');

  const cancel = document.createElement('button');
  cancel.className = 'fpcancel';
  cancel.textContent = '✕';
  cancel.title = T('cancel');
  cancel.setAttribute('aria-label', T('cancel'));

  const commit = () => {
    const nick = String(input.value || '').trim().slice(0, 24);
    // The rider typed the real name back, or emptied the box: drop the
    // nickname rather than storing a copy of what we already know.
    const keep = (nick && nick !== real) ? nick : '';
    if (isStart) {
      list[index] = Object.assign({}, list[index], { nick: keep });
      saveStopFavs();
    } else {
      list[index] = keep ? { name: real, nick: keep } : real;
      saveStopDests();
    }
    renderFavouriteList();
    status.textContent = keep ? T('renameDone').replace('{n}', keep) : T('renameCleared').replace('{n}', real);
  };

  save.addEventListener('click', commit);
  cancel.addEventListener('click', renderFavouriteList);
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') { event.preventDefault(); commit(); }
    if (event.key === 'Escape') renderFavouriteList();
  });

  wrap.appendChild(input); wrap.appendChild(save); wrap.appendChild(cancel);
  row.replaceWith(wrap);
  input.focus();
  input.select();
}

function renderFavouriteList() {
  const view = document.getElementById('favview');
  view.innerHTML = '';

  // Headings are built as elements, never with innerHTML +=. Appending to
  // innerHTML re-parses the WHOLE container, which silently replaces every
  // child node and throws away the handlers already attached to them.
  const heading = (icon, text, note) => {
    const div = document.createElement('div');
    div.className = 'favhead';
    div.textContent = icon + ' ' + text + ' ';
    if (note) {
      const span = document.createElement('span');
      span.className = 'favcount';
      span.textContent = note;
      div.appendChild(span);
    }
    view.appendChild(div);
    return div;
  };

  // ---- THE TWO PLACE LISTS ----
  // Eight starting stops and eight destinations — and they are THE SAME two
  // lists the 車站 tab fills, not a second copy. There used to be a separate
  // pair here belonging to the old trip-planner form, so a place saved on the
  // 車站 tab was invisible on this screen and this screen sat permanently at
  // 0/8. The planner's form is hidden for good and its ⭐ buttons with it, so
  // there is nothing left for a second pair to hold. One list, saved once,
  // shown on both screens.
  const placeSection = kind => {
    const isStart = kind === 'start';
    const list = isStart ? stopFavs : stopDests;
    const cap  = isStart ? MAX_STOPS : MAX_DESTS;
    heading(isStart ? '🟢' : '🔴', T(isStart ? 'favFrom' : 'favTo'),
            list.length + '/' + cap);

    const box = document.createElement('div');
    view.appendChild(box);

    if (list.length === 0) {
      appendHTML(box, '<div class="favempty">' +
                      esc(T(isStart ? 'noFavStart' : 'noFavEnd')) + '</div>');
      return;
    }

    list.forEach((entry, index) => {
      // A saved start is a whole pole record; a saved destination is just the
      // name, because which pole you leave from depends on where you stand.
      // Either may carry a nickname, and the nickname is all the rider sees.
      const real  = isStart ? stopName(entry) : destName(entry);
      const label = isStart ? favLabel(entry) : destLabel(entry);
      const named = label !== real;              // renamed by the rider

      const row = document.createElement('div');
      row.className = 'favplace';

      // The whole row is the button. A separate "open" bar underneath read
      // more clearly but doubled the height, and sixteen of those is a screen
      // nobody reaches the bottom of.
      const open = document.createElement('button');
      open.className = 'fpopen';
      const code = isStart ? poleCodeOf(entry) : '';
      // innerHTML, not appendHTML: that helper wraps what it is given in a
      // div, which would leave the button one flex child instead of three and
      // strand the arrow beside the name rather than out at the right edge.
      // A renamed stop keeps its real name underneath in small type: 「返屋企」
      // is what you remember, 屯門公路轉車站 is what is painted on the pole, and
      // at the roadside you need both.
      // Two lines, because the row now carries a rename button as well as a
      // delete one and a name squeezed between four things is unreadable on a
      // 375px phone. The rider's own word gets the whole width; the pole code
      // and the facing sit under it, with the real name in front of them when
      // the place has been renamed — at the roadside you need both.
      // Pole code and facing FIRST, the real name after it. Both are on one
      // line and the line will run out of room on a 375px phone, so what
      // survives the ellipsis has to be the part that gets you to the right
      // kerb — TM744 往東 — not the name you have already replaced.
      const dir = isStart ? poleDirHtml(entry.stop) : '';
      const meta = (code ? '<span class="polecode">' + esc(code) + '</span>' : '') + dir +
                   (named ? ((code || dir) ? ' · ' : '') + esc(real) : '');
      open.innerHTML = '<span class="fpbody">' +
                         '<span class="fpname">' + esc(label) + '</span>' +
                         (meta ? '<span class="fpmeta">' + meta + '</span>' : '') +
                       '</span>' +
                       '<span class="fparrow">›</span>';
      open.title = T(isStart ? 'favStopOpen' : 'favDestOpen');
      // The stored string, never the one on screen: in 简体 the two differ and
      // the search that follows has to match the data.
      open.addEventListener('click', () =>
        isStart ? stopOpenSaved(entry) : stopOpenDest(destName(entry)));
      row.appendChild(open);

      // RENAME. The row turns into a text box in place rather than opening a
      // dialog: one fewer screen to understand, and the name being changed
      // stays visible while it is typed.
      const rename = document.createElement('button');
      rename.className = 'fpedit';
      rename.textContent = '✎';
      rename.title = T('renameTitle');
      rename.setAttribute('aria-label', T('renameTitle') + ' ' + label);
      rename.addEventListener('click', () => startRename(row, list, index, isStart, real, label));
      row.appendChild(rename);

      const del = document.createElement('button');
      del.className = 'fpdel';
      del.textContent = '✕';
      del.setAttribute('aria-label', 'Remove ' + name);
      del.setAttribute('aria-label', T('removeLabel') + ' ' + label);
      del.addEventListener('click', () => {
        if (isStart) { stopFavs.splice(index, 1); saveStopFavs(); }
        else         { stopDests.splice(index, 1); saveStopDests(); }
        renderFavouriteList();
        paintBottomBar();
      });
      row.appendChild(del);

      box.appendChild(row);
    });
  };

  placeSection('start');
  placeSection('end');

  // ---- SAVED DEPARTURES: no tap at all ----
  const depHead = heading('🚌', T('favRoutes'), departures.length + '/' + MAX_DEPARTURES);
  if (departures.length > 0) {
    const refresh = document.createElement('button');
    refresh.className = 'refreshbtn';
    refresh.textContent = T('refresh');
    refresh.style.marginLeft = 'auto';
    refresh.addEventListener('click', () => {
      departures.forEach((dep, i) => {
        const cell = document.getElementById('depeta-' + i);
        if (cell) { cell.textContent = '…'; cell.classList.remove('quiet'); }
        loadDepartureEta(dep, i);
      });
      status.textContent = T('refreshing');
    });
    depHead.style.display = 'flex'; depHead.style.alignItems = 'center';
    depHead.appendChild(refresh);
  }
  const deps = document.createElement('div');
  deps.id = 'depslist';
  view.appendChild(deps);

  renderAddRoute(deps);

  if (departures.length === 0) {
    appendHTML(deps, '<div class="favempty">' + T('noDepsLong') + '</div>');
  }

  departures.forEach((dep, index) => {
    const row = document.createElement('div');
    row.className = 'deprow';
    const stopName = lang === 'zh' ? (dep.stopName_tc || dep.stopName_en) : dep.stopName_en;
    const destName = lang === 'zh' ? (dep.dest_tc || dep.dest_en) : dep.dest_en;

    row.innerHTML =
      '<div class="depmain">' +
        '<span class="deproute">' + esc(dep.route) + '</span>' +
        '<span class="depdest">' + T('towards') + ' ' + esc(destName || '') + '</span>' +
      '</div>' +
      '<div class="depstop" id="depstop-' + index + '">' +
        (stopName ? esc(plainStopName(stopName)) : T('nearestStopToYou')) + '</div>' +
      '<div class="depeta" id="depeta-' + index + '">…</div>';

    const del = document.createElement('button');
    del.className = 'go-del depdel'; del.textContent = '✕';
    del.setAttribute('aria-label', 'Remove ' + dep.route);
    del.addEventListener('click', () => {
      departures.splice(index, 1); saveDepartures(); renderFavouriteList();
    });
    row.appendChild(del);

    // The saved bus knows its route and direction, so the whole line of stops
    // is one tap away — which is where the rider counts to their own stop.
    const openRoute = document.createElement('button');
    openRoute.className = 'depopen';
    openRoute.textContent = '🚌 ' + T('favBusRoute');
    openRoute.addEventListener('click', () => openSavedDepartureRoute(dep));
    row.appendChild(openRoute);

    deps.appendChild(row);
  });

  departures.forEach((dep, index) => loadDepartureEta(dep, index));

  // ---- SAVED TRAINS ----
  heading('🚇', T('favTrains'), trainFavs.length + '/' + MAX_TRAINS);
  const trains = document.createElement('div');
  view.appendChild(trains);
  if (trainFavs.length === 0) {
    appendHTML(trains, '<div class="favempty">' + T('noTrainsLong') + '</div>');
  } else if (!mtrData) {
    appendHTML(trains, '<div class="favempty">' + T('loading') + '</div>');
  } else {
    trainFavs.forEach((t, index) => {
      const row = document.createElement('div');
      row.className = 'deprow';
      row.style.borderLeft = '8px solid ' + (MTR_LINE_COLOURS[t.line] || '#999');
      row.innerHTML =
        '<div class="depmain"><span class="deproute">' + esc(stationName(t.station)) + '</span>' +
          '<span class="depdest">' + esc(railLineName(t.line)) + ' · ' + T('towards') + ' ' + esc(stationName(t.dest)) + '</span></div>' +
        '<div class="depeta" id="trainfav-eta-' + index + '">…</div>';
      const del = document.createElement('button');
      del.className = 'go-del depdel'; del.textContent = '✕';
      del.setAttribute('aria-label', 'Remove ' + stationName(t.station));
      del.addEventListener('click', () => { trainFavs.splice(index, 1); saveTrainFavs(); renderFavouriteList(); });
      row.appendChild(del);
      const open = document.createElement('button');
      open.className = 'depopen';
      open.textContent = '🚇 ' + T('favTrainOpen');
      open.addEventListener('click', () => mtrOpenSaved(t));
      row.appendChild(open);
      trains.appendChild(row);
    });
    trainFavs.forEach((t, index) => loadTrainFavEta(t, index));
  }

  // The saved stops that used to be repeated here are now the 常用起點
  // list at the top of this screen — the same eight, shown once.
}

// Open the whole line for a saved bus. The saved entry already knows the
// route, the direction and the company, so this only has to find the matching
// timetable record and hand it to the code that draws a route.
function openSavedDepartureRoute(dep) {
  const wanted = String(dep.route).toUpperCase();

  if (dep.co === 'CTB') {
    const route = ctbRoutes.find(r => String(r.route).toUpperCase() === wanted);
    if (!route) { status.textContent = T('routeNotFound').replace('{r}', dep.route); return; }
    const direction = dep.dir === 'I' ? 'inbound' : 'outbound';
    const from = direction === 'outbound' ? endName(route, 'orig') : endName(route, 'dest');
    const to   = direction === 'outbound' ? endName(route, 'dest') : endName(route, 'orig');
    goToRouteMode(dep.route);
    showCtbRoute(route, direction, from, to);
    return;
  }

  // KMB. Match the direction, and the service type when the saved entry knows
  // it — the same number can run a different set of stops at peak hours.
  const bound = dep.dir === 'I' ? 'I' : 'O';
  const candidates = allRoutes.filter(r =>
    String(r.route).toUpperCase() === wanted && r.bound === bound);
  const route = candidates.find(r => String(r.service_type) === String(dep.serviceType))
             || candidates.find(r => String(r.service_type) === '1')
             || candidates[0];

  if (!route) { status.textContent = T('routeNotFound').replace('{r}', dep.route); return; }
  goToRouteMode(dep.route);
  showKmbRoute(route);
}

// Leave whatever screen we were on and hand the panel to the route lookup,
// with the number filled in so the search box matches what is on screen.
function goToRouteMode(routeNo) {
  document.getElementById('routebanner').classList.remove('tripmode');
  const panel = document.getElementById('panel');
  panel.classList.remove('favmode', 'setmode', 'mtrmode', 'stopmode');
  document.getElementById('favview').style.display = 'none';
  document.getElementById('setview').style.display = 'none';
  document.getElementById('mtrview').style.display = 'none';
  document.getElementById('stopview').style.display = 'none';
  activeMode = 'bus';
  paintBottomBar();
  document.getElementById('route-text').value = routeNo;
  enterRouteMode();
}

// The point of saving a departure is to see the countdown without asking for
// it, so these fire the moment the screen opens.
async function loadDepartureEta(dep, index) {
  const cell = document.getElementById('depeta-' + index);
  if (!cell) return;
  try {
    // A route saved by number carries no stop, so find the nearest one on
    // that route to where the person is standing.
    const stopId = await resolveNearestStop(dep);
    if (!stopId) {
      cell.textContent = T('needLocation');
      cell.classList.add('quiet');
      return;
    }
    if (!dep.stop) {
      // A countdown with no place attached is just a number, so name the stop.
      const found = allStops.find(s => s.stop === stopId);
      const label = document.getElementById('depstop-' + index);
      if (found && label) label.textContent = plainStopName(stopName(found));
    }

    const response = await fetch(
      'https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + stopId,
      { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);

    const now = Date.now();
    const minutes = ((await response.json()).data || [])
      .filter(row => String(row.route).toUpperCase() === String(dep.route).toUpperCase()
                  && (!dep.dir || row.dir === dep.dir) && row.eta)
      .map(row => Math.round((new Date(row.eta).getTime() - now) / 60000))
      .filter(n => n >= 0)
      .slice(0, 3);

    if (!document.getElementById('depeta-' + index)) return;   // screen changed
    cell.textContent = minutes.length
      ? minutes.map(n => n === 0 ? T('due') : n + T('min')).join(', ')
      : T('noneDue');
    cell.classList.toggle('quiet', minutes.length === 0);
  } catch (error) {
    cell.textContent = T('etaOffline');
    cell.classList.add('quiet');
  }
}

// ============================================================
// SLIDING BETWEEN SECTIONS
// ============================================================
// Left to right moves one section back, right to left moves one on — the
// same order as the buttons along the top.
//
// WHY IT ONLY WORKS FROM THE EDGES. The middle of this app is full of things
// that already slide sideways: the MTR station strip, the rows of saved
// buses, the destination chips. A swipe anywhere on the screen would fight
// every one of them, and the loser would usually be the one the rider meant.
// The outer 44px of each side belongs to no such control, so a slide that
// STARTS there is unambiguous. It also has to travel 60px and be clearly more
// sideways than up-down before it counts — an older thumb resting on the edge
// of a phone while scrolling must never be able to change the screen by
// accident.
// Must stay in the same order as the buttons in #bottombar, or a slide goes
// somewhere the rider did not point at.
const TAB_ORDER  = ['map', 'stop', 'mtr', 'fav', 'set'];
const SWIPE_MIN  = 60;   // px it must travel before the section changes
const SWIPE_SLOP = 40;   // px of up-down movement that abandons it
const PULL_MIN   = 70;   // px of downward drag, from the top, that refreshes

// THE SWIPE NOW WORKS FROM ANYWHERE.
// It used to have to START within 44 px of a screen edge, to keep it clear of
// the sideways-scrolling strips inside the app. That band is also exactly
// where Android and iOS put their own back gesture, so the OS won a race the
// rider never knew they were in and the swipe read as broken.
//
// The strips are dodged by asking directly instead: if the finger came down
// inside something that can actually scroll sideways, that thing gets the
// gesture. Nothing else has to be guessed at.
function inSideScroller(el) {
  for (let n = el; n && n !== document.body; n = n.parentElement) {
    if (n.scrollWidth > n.clientWidth + 4) {
      const ox = getComputedStyle(n).overflowX;
      if (ox === 'auto' || ox === 'scroll') return true;
    }
  }
  return false;
}

let swipe = null;

function swipeToTab(step) {
  // Route mode is not in the order; it belongs to the 巴士 tab, so a slide
  // out of it starts from there.
  const from = activeMode === 'bus' ? 'stop' : activeMode;
  const at = TAB_ORDER.indexOf(from);
  const to = TAB_ORDER[(at < 0 ? 0 : at) + step];
  if (!to) return;                       // already at one end: nothing to do
  showMode(to);
  // A section that simply appears leaves the rider wondering whether they
  // pressed something. The panel slides in from the side it came from, once,
  // for a fifth of a second.
  const panel = document.getElementById('panel');
  panel.classList.remove('slidefromleft', 'slidefromright');
  void panel.offsetWidth;                // restart the animation
  panel.classList.add(step > 0 ? 'slidefromright' : 'slidefromleft');
}

document.addEventListener('touchstart', event => {
  swipe = null;
  if (event.touches.length !== 1) return;
  // Not while a sheet is up, and not while a search box has the keyboard.
  if (document.querySelector('#dirsheet.open, #alertsheet.open')) return;
  if (event.target.closest('input, textarea, select')) return;
  // The map tab is a map: dragging it is panning, and panning wins.
  if (activeMode === 'map' || event.target.closest('#map')) return;
  if (inSideScroller(event.target)) return;
  const touch = event.touches[0];
  const panel = document.getElementById('panel');
  // A pull only counts as a refresh when the list is already at its top —
  // otherwise it is an ordinary scroll and must stay one.
  const atTop = !panel || panel.scrollTop <= 0;
  swipe = { x: touch.clientX, y: touch.clientY, atTop, pulled: false };
}, { passive: true });

document.addEventListener('touchmove', event => {
  if (!swipe || event.touches.length !== 1) return;
  const touch = event.touches[0];
  const dx = touch.clientX - swipe.x;
  const dy = touch.clientY - swipe.y;

  // ---- PULL DOWN TO REFRESH ----
  // Downward, from the top of a list, and clearly more down than sideways.
  if (swipe.atTop && dy > 0 && Math.abs(dy) > Math.abs(dx)) {
    if (dy >= PULL_MIN && !swipe.pulled) {
      swipe.pulled = true;
      showPullHint();
      refreshCurrentView();
    }
    return;
  }

  // ---- SIDEWAYS TO CHANGE SECTION ----
  if (Math.abs(dy) > SWIPE_SLOP && Math.abs(dy) > Math.abs(dx)) { swipe = null; return; }
  if (Math.abs(dx) < SWIPE_MIN) return;
  // Right means back a section, left means on to the next — the way a stack
  // of cards moves under the thumb, and the same order as the buttons.
  const step = dx > 0 ? -1 : 1;
  if (!swipe.decided) {
    swipe.decided = true;
    // Stops the browser treating the rest of this drag as a back-gesture or
    // a scroll. Only possible because this listener is not passive.
    if (event.cancelable) event.preventDefault();
    swipeToTab(step);
  }
}, { passive: false });

document.addEventListener('touchend', () => { swipe = null; }, { passive: true });
document.addEventListener('touchcancel', () => { swipe = null; }, { passive: true });

// A pull that produced nothing visible reads as a pull that did not work, so
// it always says something even when the answer arrives instantly.
function showPullHint() {
  status.textContent = T('pullRefreshing');
  const bar = document.getElementById('weatherbar');
  if (bar) { bar.classList.add('refreshing'); setTimeout(() => bar.classList.remove('refreshing'), 900); }
}
// Whatever this section is showing, ask for it again.
function refreshCurrentView() {
  if (activeMode === 'stop') {
    if (stopState.stop) { arriveRows.clear(); stopLoadRows(true); }
    else { renderStopView(); }
  } else if (activeMode === 'mtr') {
    mtrLoadBlocks(true);
  } else if (activeMode === 'fav') {
    renderFavouriteList();
  } else if (activeMode === 'map') {
    map.invalidateSize(); drawStops();
  }
  loadWeather();
  checkAlerts();
}

let chosenNumber = 1;

// Show the detail card for ONE option only. Stacking all three meant
// scrolling past a card you have already rejected to reach the next.
function showCardFor(pick) {
  const box = document.getElementById('journeys');
  box.innerHTML = '';
  box.appendChild(makeCard(pick));
  loadNextBus(pick);
}

function selectOption(pick) {
  chosenNumber = pick.number;
  showCardFor(pick);

  document.querySelectorAll('.ctile').forEach(tile => {
    tile.classList.toggle('on', Number(tile.dataset.number) === pick.number);
  });

  journeyMode = true;
  stopLayer.clearLayers();          // hide the general bus stop dots

  drawOneOption(pick);
}

// Draw ALL options, but only the chosen one is bold. The others stay on the
// map as thin faded lines so the user can see what they are choosing between
// without three loud lines fighting each other.
function drawOneOption(chosenPick) {
  if (!startPoint || !endPoint) return;
  routeLayer.clearLayers();
  detailLayer.clearLayers();
  document.getElementById('stopdetail').style.display = 'none';

  // Replace the big labelled START / DESTINATION pins with small quiet dots.
  // Only ONE thing on the map should be labelled "A": the stop you board at.
  journeyLayer.clearLayers();
  L.circleMarker([startPoint.lat, startPoint.lng], { radius:7, color:'white',
    weight:3, fillColor:'#166534', fillOpacity:1 }).addTo(journeyLayer)
    .bindPopup('<b>' + T('start') + '</b><br>' + startPoint.label);
  L.circleMarker([endPoint.lat, endPoint.lng], { radius:7, color:'white',
    weight:3, fillColor:'#991b1b', fillOpacity:1 }).addTo(journeyLayer)
    .bindPopup('<b>' + T('destination') + '</b><br>' + endPoint.label);

  const latLngOf = stop => [Number(stop.lat), Number(stop.long)];
  const all = [[startPoint.lat, startPoint.lng], [endPoint.lat, endPoint.lng]];

  // --- 1. The unselected options: thin, pale, in the background ---
  for (const pick of currentPicks) {
    if (pick.number === chosenPick.number) continue;

    pick.journey.legs.forEach(leg => {
      const shape = shapeForLeg(leg);
      L.polyline(shape, { color: '#9ca3af', weight: 3, opacity: .35 }).addTo(routeLayer);
    });
  }

  // --- 2. The selected option: bold, with every station marked ---
  const journey = chosenPick.journey;
  const colour = chosenPick.colour;

  L.polyline([[startPoint.lat, startPoint.lng], latLngOf(journey.legs[0].on)],
             { color: '#166534', weight: 5, dashArray: '3 9' }).addTo(routeLayer);

  journey.legs.forEach((leg, legIndex) => {
    const shape = shapeForLeg(leg);

    // A white halo under the coloured line makes it stand out from the map.
    L.polyline(shape, { color: 'white', weight: 13, opacity: .9 }).addTo(routeLayer);
    L.polyline(shape, { color: colour, weight: 7, opacity: 1 }).addTo(routeLayer);
    all.push(...shape);

    // Every station this bus calls at, as its own dot, joined by the line.
    const stations = (leg.path && leg.path.length > 1) ? leg.path : [leg.on, leg.off];
    stations.forEach((station, index) => {
      const isEnd = index === 0 || index === stations.length - 1;
      L.circleMarker(latLngOf(station), {
        radius: isEnd ? 9 : 6,
        color: 'white', weight: isEnd ? 4 : 2,
        fillColor: colour, fillOpacity: 1
      }).addTo(routeLayer)
        .bindPopup('<b>' + station.name_en + '</b><br><small>' +
                   (station.name_tc || '') + '</small><br>Stop ' + (index + 1) +
                   ' of ' + stations.length + ' on bus ' + leg.route);
    });

    // Labels alternate left and right so consecutive markers do not cover
    // each other. Without this the START pin disappears under GET ON.
    const onSide  = legIndex % 2 === 0 ? 'right' : 'left';
    const offSide = legIndex % 2 === 0 ? 'left'  : 'right';

    const isFirst = legIndex === 0;
    const isLast  = legIndex === journey.legs.length - 1;

    addStopLabel(latLngOf(leg.on),
                 isFirst ? 'A' : (legIndex + 1),
                 T('getOn') + ' ' + leg.route,
                 stopName(leg.on), false, onSide, 900,
                 () => zoomToStopDetail(leg.on, isFirst ? startPoint : journey.legs[legIndex-1].off,
                                        leg, true));

    addStopLabel(latLngOf(leg.off),
                 isLast ? 'B' : '↓',
                 T('getOff') + ' ' + leg.route,
                 stopName(leg.off), true, offSide, 890,
                 () => zoomToStopDetail(leg.off, isLast ? endPoint : journey.legs[legIndex+1].on,
                                        leg, false));
  });

  const lastLeg = journey.legs[journey.legs.length - 1];
  L.polyline([latLngOf(lastLeg.off), [endPoint.lat, endPoint.lng]],
             { color: '#991b1b', weight: 5, dashArray: '3 9' }).addTo(routeLayer);

  map.fitBounds(L.latLngBounds(all), mapPadding());

  document.getElementById('rb-route').textContent = journey.legs.map(l => l.route).join(' → ');
  const companies = [...new Set(journey.legs.map(l => coName(l.co)))];
  document.getElementById('rb-company').textContent =
    companies.join(' + ') + ' · ' + T('option') + ' ' + chosenPick.number;
  document.getElementById('rb-from').textContent = stopName(journey.legs[0].on);
  document.getElementById('rb-to').textContent = stopName(lastLeg.off);
  // The fare belongs here too: this banner is what stays on screen while
  // the rider walks to the stop, so it should answer "how much" as well.
  const bannerFare = journeyFareText(journey);
  document.getElementById('rb-note').textContent =
    T('aboutMin').replace('{n}', journey.total) +
    (bannerFare === '\u2014' ? '' : '  \u00b7  ' + bannerFare);
  const banner = document.getElementById('routebanner');
  banner.classList.remove('ctb');
  // THE BANNER SAYS THE TRIP, THE CARD SAYS THE JOURNEY.
  // It used to repeat the route, both terminals and the total underneath the
  // card that already carried all four — six rows of duplicate pinned over
  // the bottom of a 55dvh panel, which left the "one big box" showing its
  // first two figures and nothing else. In journey mode it keeps only what
  // the card CANNOT show: which trip this is, and the way to change it.
  banner.classList.add('tripmode');
  banner.style.display = 'block';   // the tripmode rule hides it; route mode needs it
  reserveRoomForBanner();
}

// The line for one bus leg. We prefer whichever version has MORE points,
// because more points means a line that bends with the road instead of
// cutting straight across the map.
// One stop label. "side" decides whether the text sits to the left or the
// right of the dot, which is how we stop labels overlapping each other.
function addStopLabel(latlng, dotText, title, name, finish, side, z, onClick) {
  const wrap = '<div class="endwrap' + (finish ? ' finish' : '') +
               (side === 'left' ? ' flip' : '') + '">' +
               '<div class="enddot">' + dotText + '</div>' +
               '<div class="endtext">' + title + '<br>' + name + '</div></div>';

  const marker = L.marker(latlng, { zIndexOffset: z,
    icon: L.divIcon({ className: '', iconSize: null,
      iconAnchor: side === 'left' ? [258, 22] : [22, 22], html: wrap })
  }).addTo(routeLayer);

  if (onClick) marker.on('click', onClick);
  return marker;
}

// ZOOM IN ON ONE END OF THE JOURNEY
// Standing at a stop, the question is not "where is this on the map" but
// "which side of the street, and how do I walk there". So we zoom close
// enough to see the pavement and draw the walking line.
function zoomToStopDetail(stop, fromPoint, leg, isBoarding) {
  const stopLatLng = [Number(stop.lat), Number(stop.long)];
  const fromLatLng = [fromPoint.lat, fromPoint.lng];

  detailLayer.clearLayers();
  const colour = isBoarding ? '#166534' : '#991b1b';

  L.polyline([fromLatLng, stopLatLng],
             { color: colour, weight: 5, dashArray: '4 8' }).addTo(detailLayer);

  // A BIG ARROW sitting ABOVE the stop and pointing down at it. The exact
  // spot stays completely uncovered — which is the whole point, since the
  // rider is trying to see which side of the road to stand on.
  L.marker(stopLatLng, { zIndexOffset: 1200, interactive: false,
    icon: L.divIcon({ className: '', iconSize: null, iconAnchor: [26, 92],
      html: '<div class="bigarrow" style="color:' + colour + '">&#9660;</div>' })
  }).addTo(detailLayer);

  L.circleMarker(stopLatLng, { radius: 26, color: colour, weight: 4,
    fill: false, dashArray: '5 6' }).addTo(detailLayer);
  L.circleMarker(stopLatLng, { radius: 8, color: 'white', weight: 3,
    fillColor: colour, fillOpacity: 1 }).addTo(detailLayer);

  const walk = walkingEstimate(metresBetween(fromPoint.lat, fromPoint.lng,
                                             Number(stop.lat), Number(stop.long)));

  // The details go in a FIXED panel at the top-right. Being fixed, it can
  // never drift over the stop no matter how the map moves.
  const panel = document.getElementById('stopdetail');
  panel.className = isBoarding ? 'boarding' : 'alighting';
  panel.style.display = 'block';

  // ---- HAND THE WALK TO THE PHONE'S OWN MAP ----
  // This app can draw a straight line and count the metres. It does not know
  // the footbridges, the subways, the one-way pavements or — at a railway
  // station — which exit comes out on the right side. The map app on the
  // phone knows all of it, so the walk is handed over rather than guessed at.
  //
  // A real <a href>, not a scripted open: the open has to happen on the tap
  // itself or the phone treats it as a pop-up and blocks it.
  const goHref = isBoarding
    // To the stop: no origin, so the map starts from wherever they are now.
    ? walkUrl(Number(stop.lat), Number(stop.long))
    // Off the bus: they are reading this BEFORE they get there, so the walk
    // is drawn from the stop they will step off at, not from where they sit.
    : walkUrl(endPoint.lat, endPoint.lng, Number(stop.lat), Number(stop.long));
  const goText = isBoarding
    ? T('sdWalkHere')
    : T('sdWalkDest').replace('{d}', esc(plainStopName(endPoint.label || '')));

  // ---- WHICH EXIT (railway stations only) ----
  // A station is not a bus stop: coming out of the wrong end of 尖東 is a ten
  // minute walk back. The direction is worked out here and is always true;
  // the exit LETTER is asked of the government gazetteer at the moment the
  // card opens, and is shown only if it comes back — this app has no exit
  // data of its own and will not invent one.
  const isRail = leg && leg.co === 'mtr';
  let exitLine = '';
  if (!isBoarding && isRail) {
    const face = Math.round(bearingBetween(Number(stop.lat), Number(stop.long),
                                           endPoint.lat, endPoint.lng) / 45) % 8;
    exitLine = '<div class="sd-exit" id="sd-exit">' +
               T('sdExitDir').replace('{d}', esc(T(WAY_KEYS[face]))) + '</div>';
  }

  panel.innerHTML =
    '<button id="sd-close">&#10005;</button>' +
    '<div class="sd-head">' +
      (isRail
        ? (isBoarding ? T('boardHereRail').replace('{route}', esc(leg.route)) : T('alightHereRail'))
        : (isBoarding ? T('boardHereDetail').replace('{route}', esc(leg.route))
                      : T('alightHereDetail').replace('{route}', esc(leg.route)))) + '</div>' +
    '<div class="sd-stop">' + stopName(stop) + '</div>' +
    '<div class="sd-sub">' + (lang === 'zh' ? stop.name_en : (stop.name_tc || '')) + '</div>' +
    '<div class="sd-line">' +
      (isBoarding ? T('towards') + ' <b>' + stopName(leg.off) + '</b>'
                  : T('thenWalkTo') + ' <b>' + esc(endPoint.label) + '</b>') + '</div>' +
    '<div class="sd-walk">&#128694; ' + walk.minutes + T('min') + ' &middot; ' + walk.metres + ' m</div>' +
    exitLine +
    '<a class="sd-go" href="' + esc(goHref) + '" target="_blank" rel="noopener">' + goText + '</a>' +
    // "Check you are on the correct side of the road" is a bus stop's problem.
    // Inside a station the question is which sign to follow, so it says that.
    '<div class="sd-note">' +
      T(!isRail ? 'checkSide' : isBoarding ? 'checkGates' : 'checkPlatform') + '</div>';

  if (!isBoarding && isRail) fillStationExit(stop, endPoint, 'sd-exit');

  document.getElementById('sd-close').addEventListener('click', () => {
    panel.style.display = 'none';
    detailLayer.clearLayers();
  });

  // Frame both points clear of the left panel, the right panel and the
  // bottom banner. The map's centre is not the screen's centre.
  map.fitBounds(L.latLngBounds([stopLatLng, fromLatLng]), {
    ...mapPadding(),
    maxZoom: 18
  });
}

// WHICH EXIT, ASKED OF THE GOVERNMENT GAZETTEER — NEVER GUESSED.
// This app has no exit data. What it has is the same locationSearch endpoint
// the map tab's place box already uses, whose answers are the Lands
// Department's own gazetteer, and that gazetteer names station exits.
//
// Three things have to be true before a letter is put on the screen, because
// sending an older rider out of the wrong end of 尖東 is a ten-minute walk
// back with luggage:
//   1. the name really does read as an exit ("Exit B2", 「出口 B2」);
//   2. it sits within 400 m of the station we are actually leaving, so an
//      exit belonging to some other station can never be borrowed;
//   3. of the ones that qualify, the nearest to the destination wins.
// Anything less and the line is left as the compass direction, which is
// computed here and is always true.
const stationExitCache = new Map();
const EXIT_NEAR_STATION_M = 400;

function exitLetterOf(name) {
  const text = String(name || '');
  const en = text.match(/\bExits?\s*([A-Z]\d{0,2}[A-Z]?)\b/i);
  if (en) return en[1].toUpperCase();
  const zh = text.match(/([A-Z]\d{0,2}[A-Z]?)\s*號?出口/i) || text.match(/出口\s*([A-Z]\d{0,2}[A-Z]?)/i);
  return zh ? zh[1].toUpperCase() : null;
}

async function fillStationExit(stop, dest, lineId) {
  const line = document.getElementById(lineId || 'sd-exit');
  if (!line || !dest) return;
  const key = stop.stop + '|' + dest.lat.toFixed(4) + ',' + dest.lng.toFixed(4);
  const paint = letter => {
    // The card may have been closed, or the screen redrawn on another stop,
    // while the gazetteer was thinking. Only ever write into the element we
    // started with — an id can be reused by the next thing drawn.
    const now = document.getElementById(lineId || 'sd-exit');
    if (!now || now !== line || !letter) return;
    now.classList.add('found');
    now.textContent = T('sdExitIs').replace('{e}', letter);
  };
  if (stationExitCache.has(key)) { paint(stationExitCache.get(key)); return; }

  const stationLat = Number(stop.lat), stationLng = Number(stop.long);
  const asked = [stop.name_en, stop.name_tc].filter(Boolean);
  let best = null, bestMetres = Infinity;
  try {
    for (const name of asked) {
      const query = /[A-Za-z]/.test(name) ? name + ' Station Exit' : name + '站 出口';
      const response = await fetch(GEOCODER + encodeURIComponent(query),
                                  { signal: AbortSignal.timeout(9000) });
      if (!response.ok) continue;
      const rows = await response.json();
      for (const row of (Array.isArray(rows) ? rows : [])) {
        const letter = exitLetterOf(row.nameEN) || exitLetterOf(row.nameZH);
        if (!letter) continue;
        const lat = Number(row.y), lng = Number(row.x);
        if (!isFinite(lat) || !isFinite(lng)) continue;
        if (metresBetween(stationLat, stationLng, lat, lng) > EXIT_NEAR_STATION_M) continue;
        const toDest = metresBetween(lat, lng, dest.lat, dest.lng);
        if (toDest < bestMetres) { bestMetres = toDest; best = letter; }
      }
      if (best) break;          // the first language that answers is enough
    }
  } catch (error) {
    // No connection, or the gazetteer is down. The direction line already on
    // screen is the answer in that case; it needs no apology.
    console.warn('Station exits unavailable:', error.message);
  }
  stationExitCache.set(key, best);
  paint(best);
}

function shapeForLeg(leg) {
  const latLngOf = stop => [Number(stop.lat), Number(stop.long)];
  const viaStops = (leg.path && leg.path.length > 1)
    ? leg.path.map(latLngOf) : [latLngOf(leg.on), latLngOf(leg.off)];

  const official = officialShape(leg.route, leg.on, leg.off);
  if (official && official.length > viaStops.length) { shapeHits++; return official; }
  shapeMisses++;
  return viaStops;
}




// When is the next bus for this option? This is the question someone
// standing at the stop actually has, so it goes on the card itself.
// MTR's own real-time feed. Documented at opendata.mtr.com.hk (Next Train API
// v1.7) and served from the same government real-time platform as the bus
// ETAs. It answers per LINE and STATION, not per stop, which is why it needs
// its own path rather than joining the bus loop above.
const MTR_ETA_URL = 'https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php';

// The feed splits trains into UP and DOWN. Rather than guess which is which,
// look at where the trains are headed: the direction whose destination lies
// beyond our alighting station, along the line's own running order, is ours.
function railDirectionKey(lineCode, fromCode, toCode, block) {
  const variants = (mtrData.lines || {})[lineCode] || [];
  const order = variants.find(v => v.includes(fromCode) && v.includes(toCode)) || variants[0] || [];
  const from = order.indexOf(fromCode), to = order.indexOf(toCode);
  if (from < 0 || to < 0) return null;
  const forward = to > from;

  for (const key of ['UP', 'DOWN']) {
    const trains = block[key];
    if (!Array.isArray(trains) || trains.length === 0) continue;
    const dest = order.indexOf(trains[0].dest);
    if (dest < 0 || dest === from) continue;   // a train terminating here takes nobody anywhere
    if (forward ? dest > from : dest < from) return key;
  }
  return null;
}

async function loadTrainTimes(pick, line) {
  const leg = pick.journey.legs[0];
  const tile = document.getElementById('ceta-' + pick.number);
  const setBoth = (text, cssClass) => {
    line.className = cssClass || 'jnext';
    line.textContent = text;
    if (tile) tile.textContent = text;
  };

  try {
    const url = MTR_ETA_URL + '?line=' + encodeURIComponent(leg.lineCode) +
                '&sta=' + encodeURIComponent(leg.on.stop) +
                '&lang=' + (lang === 'zh' ? 'TC' : 'EN');
    const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const data = await response.json();

    // status 0 means a service alert or a suspended station. That is real news
    // for a rider, so show MTR's own words rather than a countdown.
    if (data.status === 0) return setBoth(data.message || T('trainAlert'), 'jnext warn');

    const block = (data.data || {})[leg.lineCode + '-' + leg.on.stop];
    if (!block) throw new Error('no block for this station');

    const key = railDirectionKey(leg.lineCode, leg.on.stop, leg.off.stop, block);
    const trains = (key && block[key] ? block[key] : []).filter(t => t.valid !== 'N');
    if (trains.length === 0) throw new Error('no trains listed');

    const minutes = trains.slice(0, 3)
      .map(t => usableWait(t.ttnt))
      .filter(n => n !== null)
      .map(n => n === 0 ? T('due') : n + ' ' + T('min'));
    if (minutes.length === 0) throw new Error('no usable times');

    setBoth(T('nextTrain') + ' ' + minutes.join(', '));
  } catch (error) {
    // The feed is down, blocked, or this station is not covered. Say the one
    // thing that stays true about the MTR rather than showing an error.
    console.warn('Live train times unavailable:', error);
    setBoth(T('trainsFrequent'));
    if (tile) tile.textContent = T('frequentShort');
  }
}

async function loadNextBus(pick) {
  const line = document.getElementById('next-' + pick.number);
  if (!line) return;

  const leg = pick.journey.legs[0];

  // Trains have their own feed, keyed by line and station.
  if (leg.co === 'mtr') {
    line.className = 'jnext';
    line.textContent = T('trainsFrequent');
    const tile = document.getElementById('ceta-' + pick.number);
    if (tile) tile.textContent = T('frequentShort');
    loadTrainTimes(pick, line);
    return;
  }

  // WHICH BUSES ACTUALLY HELP FROM THIS STOP?
  // Standing at a stop, you do not care about "the 58M" — you care about the
  // next bus that gets you where you are going. Several routes from the same
  // stop may do that, so we show them all, soonest first.
  const usefulRoutes = new Set([leg.route]);
  for (const other of (currentPicks || [])) {
    const otherLeg = other.journey.legs[0];
    if (otherLeg.on.stop === leg.on.stop) usefulRoutes.add(otherLeg.route);
  }

  try {
    // Every operator publishes arrivals differently. KMB asks for the stop
    // alone; Citybus and NLB want stop AND route. Green minibus uses a
    // separate service altogether, which we do not have wired up — so rather
    // than show a wrong time, we say plainly that live times are unavailable.
    if (leg.co === 'gmb') {
      line.className = 'jnext waiting';
      line.textContent = T('noLiveMinibus');
      const gmbTile = document.getElementById('ceta-' + pick.number);
      if (gmbTile) gmbTile.textContent = '—';
      return;
    }

    let url;
    if (leg.co === 'ctb')      url = CTB_BASE + '/eta/CTB/' + leg.on.stop + '/' + encodeURIComponent(leg.route);
    else if (leg.co === 'nlb') url = null;              // NLB needs its own API too
    else                       url = 'https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + leg.on.stop;

    if (!url) {
      line.className = 'jnext waiting';
      line.textContent = T('liveUnavailable') + ' ' + leg.route;
      const noTile = document.getElementById('ceta-' + pick.number);
      if (noTile) noTile.textContent = '—';
      return;
    }

    const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);

    const entries = (await response.json()).data || [];
    const now = Date.now();

    const arrivals = entries
      .filter(entry => usefulRoutes.has(entry.route) && entry.eta)
      .map(entry => ({
        route: entry.route,
        minutes: Math.round((new Date(entry.eta).getTime() - now) / 60000)
      }))
      .filter(arrival => arrival.minutes >= 0)
      .sort((a, b) => a.minutes - b.minutes)
      .slice(0, 4);

    if (arrivals.length === 0) {
      line.className = 'jnext waiting';
      line.textContent = T('noBusDue');
      const emptyTile = document.getElementById('ceta-' + pick.number);
      if (emptyTile) emptyTile.textContent = '—';
      return;
    }

    const soonest = arrivals[0];
    const clock = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });

    const tileEta = document.getElementById('ceta-' + pick.number);
    if (tileEta) {
      tileEta.textContent = soonest.route + ' ' +
        (soonest.minutes === 0 ? T('dueNow') : soonest.minutes + T('min'));
    }

    // If the soonest useful bus is NOT this card's route, say so plainly —
    // that is exactly the information someone at the stop needs.
    const differentRoute = soonest.route !== leg.route;

    line.className = 'jnext';
    line.innerHTML =
      (differentRoute
        ? '<div style="font-size:0.94rem;color:#fde68a;font-weight:700;margin-bottom:4px">' +
          T('sooner') + '</div>'
        : '') +
      T('next') + ' ' + soonest.route + ' ' + T('inTime') +
      ' <span class="mins">' +
      (soonest.minutes === 0 ? T('dueNow') : soonest.minutes + T('min')) + '</span>' +
      (arrivals.length > 1
        ? '<div style="font-size:1rem;font-weight:600;margin-top:5px">' + T('then') + ' ' +
          arrivals.slice(1).map(a => a.route + ' ' + a.minutes + T('min')).join(' · ') + '</div>'
        : '') +
      '<div style="font-size:0.94rem;font-weight:600;opacity:.8;margin-top:4px">' +
        T('checked') + ' ' + clock + '</div>';
  } catch (error) {
    line.className = 'jnext waiting';
    line.textContent = T('liveUnavailable') + ' ' + leg.route;
  }
}

// 7. BROWSABLE BUS STOPS
// ============================================================
// While a journey is on screen, the browsable stop dots are just clutter —
// the user has already chosen. They come back when the journey is cleared.
let journeyMode = false;

// THE MAP'S OWN STOP DOTS ARE OFF.
// From zoom 15 every bus stop in view was drawn as a red dot, and in Kowloon
// that is hundreds of them at once — they buried the places this tab exists
// to show, and a dot cannot say its own name or when its next bus is. Stops
// are now reached by the things that CAN: a place's own card ("buses from
// this stop"), the 你在這裡 card, and the 巴士 tab. One line to bring back.
const SHOW_STOP_DOTS = false;

function drawStops() {
  stopLayer.clearLayers();
  if (!SHOW_STOP_DOTS) return;
  if (journeyMode) return;
  if (allStops.length === 0 || map.getZoom() < 15) return;

  // Only the stops on screen, then merged so one physical stop is one dot.
  const area = map.getBounds();
  const visible = allStops.filter(stop => !stop.isStation &&
    area.contains([Number(stop.lat), Number(stop.long)]));

  for (const group of mergeNearbyStops(visible)) {
    const marker = L.circleMarker([group.lat, group.lng], {
      radius:9, color:'#991b1b', weight:3, fillColor:'#ef4444', fillOpacity:0.9
    }).addTo(stopLayer);

    marker.bindPopup(stopHeader(group) + '<div class="eta-note">' + T('checkingBus') + '</div>');

    // A merged dot shows arrivals from EVERY stop code at that spot —
    // which is what the rider standing there actually wants to know.
    marker.on('popupopen', () => loadMergedArrivals(group, marker));
  }
}
map.on('moveend', drawStops);

window.addEventListener('resize', () => {
  clearTimeout(window._resizeTimer);
  window._resizeTimer = setTimeout(() => {
    map.invalidateSize(); drawStops();
    if (typeof fitLocateButton === 'function') fitLocateButton();
  }, 200);
});


// ============================================================
// 8. ARRIVAL TIMES
// ============================================================
function stopHeader(stop) {
  const main = plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en);
  const sub  = plainStopName(lang === 'zh' ? stop.name_en : (stop.name_tc || ''));
  return '<b>' + main + '</b><br><small>' + sub + '</small><hr style="margin:6px 0">';
}

// Fetch arrivals for every stop code merged into one dot, then show them
// together as a single list, sorted soonest first.
async function loadMergedArrivals(group, marker) {
  try {
    const results = await Promise.all(group.members.map(async member => {
      try {
        const response = await fetch(
          'https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + member.stop,
          { signal: AbortSignal.timeout(10000) });
        if (!response.ok) return [];
        const rows = (await response.json()).data || [];
        // The feed does not say which stop it answered for, and a saved
        // departure is meaningless without one. Stamp it on here.
        return rows.map(row => Object.assign({}, row,
          { stop: member.stop, stopName_en: member.name_en, stopName_tc: member.name_tc }));
      } catch (error) { return []; }
    }));

    const clock = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    marker.setPopupContent(stopHeader(group) + formatArrivals(results.flat()) +
      '<div class="eta-note" style="margin-top:6px">' + T('checked') + ' ' + clock + '</div>');
  } catch (error) {
    marker.setPopupContent(stopHeader(group) +
      '<div class="eta-note">' + T('liveUnavailable') + '</div>');
  }
}

async function loadKmbArrivals(stop, marker) {
  try {
    const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + stop.stop,
                                 { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const json = await response.json();
    const rows = (json.data || []).map(row => Object.assign({}, row,
      { stop: stop.stop, stopName_en: stop.name_en, stopName_tc: stop.name_tc }));
    const clock = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    marker.setPopupContent(stopHeader(stop) + formatArrivals(rows) +
      '<div class="eta-note" style="margin-top:6px">' + T('updatedAt').replace('{t}', clock) + '</div>');
  } catch (error) {
    marker.setPopupContent(stopHeader(stop) +
      '<div class="eta-note">' + T('couldNotLoadArrivals') + '</div>');
  }
}

function formatArrivals(entries, opts) {
  if (!entries || entries.length === 0) return '<div class="eta-note">' + T('noBusesListed') + '</div>';
  const now = Date.now(), byRoute = new Map();
  let anySched = false;

  for (const entry of entries) {
    if (!entry.eta) continue;
    const minutes = Math.round((new Date(entry.eta).getTime() - now) / 60000);
    if (minutes < 0) continue;
    const label = entry.route + '|' + (entry.dest_en || '');
    // Keep one whole entry per route: it carries the direction, service type
    // and seq we need to price the ride from THIS stop.
    // TRACKED, OR MERELY TIMETABLED?
    // KMB marks a departure it is not actually tracking 原定班次 / "Scheduled
    // Bus", and 29% of the times this app shows are that. They arrive with a
    // clock time like any other, so the screen presented a guess and a
    // measurement in identical green — the one thing an arrival board must
    // never do. Marked per TIME, not per row: a route usually has some of
    // each, which is the commonest case of the three.
    const sched = /原定班次|Scheduled/i.test((entry.rmk_tc || '') + ' ' + (entry.rmk_en || ''));
    if (!byRoute.has(label)) byRoute.set(label, { minutes: [], sample: entry });
    const bucket = byRoute.get(label).minutes;
    const seen = bucket.find(x => x.m === minutes);
    // Two bays reporting one bus: one time. If either sighting is tracked,
    // the bus is tracked — real data outranks the timetable.
    if (seen) { if (!sched) seen.sched = false; }
    else bucket.push({ m: minutes, sched });
  }
  if (byRoute.size === 0) return '<div class="eta-note">' + T('noBusDue') + '</div>';
  for (const group of byRoute.values()) group.minutes.sort((a, b) => a.m - b.m);

  // Soonest first: by arrival at the place when one is set, otherwise by the
  // next bus. A bus due in 18 minutes that arrives last belongs last.
  const items = [];
  for (const [label, group] of byRoute) {
    const route = label.split('|')[0];
    const sample = group.sample;
    // In the reader's language. The row was keyed on dest_en to keep one row
    // per direction, and then showed that same English name to everyone.
    const dest = esc(lang === 'zh' ? (sample.dest_tc || sample.dest_en || '')
                                   : (sample.dest_en || sample.dest_tc || ''));
    const fare = stopFare(sample.route, sample.dir, sample.service_type, sample.seq, sample.co);
    const fareTag = fare === null ? ''
      : '<span class="eta-fare">' + fareText(fare) + '</span>';

    // A star per row. This row already IS a route, a direction and a stop,
    // so one tap saves all three — no follow-up questions, which is the
    // whole reason a saved departure beats a saved route number.
    const saved = isSavedDeparture(sample.route, sample.dir, sample.stop);
    const star = sample.stop
      ? '<button class="eta-star' + (saved ? ' on' : '') + '"' +
        ' data-star="1"' +
        ' data-route="' + sample.route + '"' +
        ' data-dir="' + (sample.dir || '') + '"' +
        ' data-type="' + (sample.service_type || '1') + '"' +
        ' data-co="' + (sample.co || 'KMB') + '"' +
        ' data-stop="' + sample.stop + '"' +
        ' data-sen="' + esc(sample.stopName_en || '') + '"' +
        ' data-stc="' + esc(sample.stopName_tc || '') + '"' +
        ' data-den="' + esc(sample.dest_en || '') + '"' +
        ' data-dtc="' + esc(sample.dest_tc || '') + '"' +
        ' title="' + T('saveDeparture') + '">' + (saved ? '★' : '☆') + '</button>'
      : '';

    // WHICH POLE THIS BUS LEAVES FROM.
    // Only when the screen is showing several. A station like 太子站,旺角花墟
    // is eleven poles on both sides of Prince Edward Road, and merging them
    // into one card is only honest if the row then says where to stand. The
    // facing comes from the same measurement the search cards use.
    let poleTag = '';
    if (opts && opts.multiPole && sample.stop) {
      const at = findStopById(sample.stop);
      const code = at ? poleCodeOf(at) : '';
      const face = poleFacing(sample.stop);
      if (code || face >= 0) {
        poleTag = '<span class="eta-pole">' + (code ? esc(code) : '') +
                  (face >= 0 ? (code ? ' ' : '') + esc(T(FACE_KEYS[face])) : '') + '</span>';
      }
    }

    // With a place set on the 車站 tab: how many stops, and roughly when the
    // first bus gets there. MINUTES_PER_STOP is the planner's own rough figure.
    let arriveTag = '';
    const stopsAway = opts && opts.arrive ? opts.arrive.get(routeKeyForRow(sample)) : undefined;
    if (stopsAway !== undefined) {
      const at = new Date(now + (group.minutes[0].m + stopsAway * MINUTES_PER_STOP) * 60000);
      const hhmm = at.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
      // THE ANSWER, AT THE SIZE OF AN ANSWER.
      // "when do I get there" is the whole reason the rider opened this
      // screen, and it was set in the smallest type on the row — smaller than
      // the countdown, smaller than the fare. Part of what crowded it out was
      // repeating the destination on every single line, when the list already
      // says 只顯示往 … 的巴士 once at the top. Dropping that repetition buys
      // the room to set the clock time large.
      arriveTag = '<span class="eta-arrive">🏁 ' +
        T('etaArrive').replace('{t}', '<b class="eta-when">' + hhmm + '</b>')
                      .replace('{n}', stopsAway) + '</span>';
    }
    const shown = group.minutes.slice(0, 3);
    if (shown.some(x => x.sched)) anySched = true;
    const sortKey = stopsAway !== undefined ? group.minutes[0].m + stopsAway * MINUTES_PER_STOP : group.minutes[0].m;
    items.push({ sortKey, html:
      '<div class="eta-row">' + star + '<span class="eta-route">' + route + '</span>' +
      '<span class="eta-dest">' + dest + '</span>' + fareTag + poleTag +
      '<span class="eta-times">' +
      shown.map(x => x.sched
        ? '<span class="sched">' + esc(T('etaAbout')) + (x.m === 0 ? T('due') : x.m + T('min')) + '</span>'
        : (x.m === 0 ? T('due') : x.m + T('min'))).join(', ') +
      '</span>' + arriveTag + '</div>' });
  }
  items.sort((a, b) => a.sortKey - b.sortKey);
  // ONE legend for the screen, not one per row. Three-fifths of all rows carry
  // a timetabled time, so repeating the sentence on each of them would bury
  // the times it is meant to explain.
  return items.map(x => x.html).join('') +
    (anySched ? '<div class="schednote">' + esc(T('etaSchedNote')) + '</div>' : '');
}
