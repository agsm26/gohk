}
document.getElementById('alertsheet').addEventListener('click', event => {
  if (event.target.closest('[data-name-ok]'))     { commitDestName(String(stopState.destQuery || '').trim()); return; }
  if (event.target.closest('[data-name-remove]')) { removeDestName(String(stopState.destQuery || '').trim()); return; }
  if (event.target.closest('[data-name-cancel]')) { closeAlertSheet(); return; }
  if (event.target.closest('[data-held-go]')) { closeAlertSheet(); const go = heldGo; heldGo = null; if (go) go(); return; }
  if (event.target.closest('[data-held-back]')) { closeAlertSheet(); heldGo = null; return; }
  if (event.target.id === 'alertsheet' || event.target.closest('[data-alert-ok]')) { closeAlertSheet(); heldGo = null; }
});

// ============================================================
// WEATHER — Hong Kong Observatory open data
// ============================================================
// Two calls: the current report (temperature per weather station, plus any
// warning headline) and the warning summary. Both are public, both are
// free, and neither is worth blocking the app for — if the Observatory is
// unreachable the bar simply does not appear.
//
// Fetched once on open and refreshed every 10 minutes, never faster: this
// app's rule is no background chatter, and the Observatory updates hourly.
const HKO_BASE = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php';
const WEATHER_REFRESH_MS = 10 * 60 * 1000;

// The station table, the 9 km "near enough" limit and the look-up that
// used them are gone with the temperature chips. They answered one
// question — which Observatory reading describes THIS stop — and nothing
// left on the bar asks it.

async function loadWeather() {
  const langParam = lang === 'zh' ? (script === 'sc' ? 'sc' : 'tc') : 'en';
  try {
    const [report, warnings] = await Promise.all([
      fetch(HKO_BASE + '?dataType=rhrread&lang=' + langParam,
            { signal: AbortSignal.timeout(10000) }).then(r => r.ok ? r.json() : null),
      fetch(HKO_BASE + '?dataType=warnsum&lang=' + langParam,
            { signal: AbortSignal.timeout(10000) }).then(r => r.ok ? r.json() : null)
        .catch(() => null)
    ]);
    if (!report) throw new Error('no report');
    weatherData = { report, warnings };
    renderWeatherBar();
  } catch (error) {
    // Quietly absent rather than an error the rider cannot act on. The bus
    // times are the job; the weather is a courtesy.
    console.warn('Weather unavailable:', error.message);
    // The bar is redrawn anyway: unreachable usually means no connection,
    // and THAT is worth saying — it explains the missing live times too.
    renderWeatherBar();
  }
}

// The bar answers one question: what do I need to know before I set off?
// A rainstorm signal is one answer to it; having no connection is another,
// and so is a new version of the app waiting to be used. So all three share
// this one strip rather than each taking its own line of a phone screen.
function renderWeatherBar() {
  const bar = document.getElementById('weatherbar');
  if (!bar) return;
  bar.innerHTML = '';

  const parts = [];
  if (updateWaiting) parts.push(updateChip());
  if (!navigator.onLine) parts.push(offlineChip());
  if (weatherData) parts.push(...weatherParts());
  const near = tdNotices.length ? nearbyNotices() : [];
  if (near.length) parts.push(tickerChip(near));
  if (currentAlerts.length) parts.push(alertChip());
  bar.classList.toggle('hasalert', currentAlerts.length > 0 || near.length > 0);

  if (parts.length === 0) { hideWeatherBar(); return; }
  for (const part of parts) bar.appendChild(part);
  showWeatherBar();
}

// The weather half, as elements. Split out from the bar itself so that no
// connection and no weather are two different things: the Observatory being
// unreachable must not be able to hide the notice explaining why it is.
function weatherParts() {
  const parts = [];

  // ---- WARNINGS FIRST ----
  const warnings = weatherData.warnings || {};
  for (const key of Object.keys(warnings)) {
    const warning = warnings[key];
    if (!warning || !warning.name) continue;
    const code = String(warning.code || '');
    // Rainstorm black/red and typhoon 8+ are the ones that stop buses.
    const severe = /^(WRAINB|WRAINR|TC8|TC9|TC10)/.test(code) || /BLACK|RED/i.test(code);
    const amber  = /^(WRAINA|TC3)/.test(code) || /AMBER/i.test(code);
    // `type` carries the specific signal — "一號戒備信號", "紅色暴雨警告信號" —
    // while `name` is only the family it belongs to. Signal 1 and Signal 8
    // are both "熱帶氣旋警告信號"; only one of them stops the buses, so the
    // specific one is what goes on the bar.
    const tag = document.createElement('span');
    tag.className = 'wxwarn' + (severe ? '' : amber ? ' amber' : ' notice');
    tag.textContent = '⚠ ' + (warning.type || warning.name);
    parts.push(tag);
  }

  // ---- AND NOTHING ELSE ----
  // Three temperature readings used to follow: where the rider is, and each
  // end of the trip. They cost a whole 50px strip across the top of every
  // screen, permanently, and 29 degrees has never changed anyone's mind about
  // which bus to catch. The owner asked for them out, and they are out, along
  // with the two helpers that existed only to build them.
  //
  // The WARNINGS above stay. A red rainstorm or a No.8 signal is the one
  // thing here that decides whether you travel at all -- and when there is no
  // warning, no traffic notice, nothing offline and no update waiting, the
  // bar has no parts, hides itself, and the screen below starts at the top.
  return parts;
}


// The bar is fixed, so everything below has to be told how tall it is.
// Measured, never assumed: it grows with the number of warnings.
function showWeatherBar() {
  const bar = document.getElementById('weatherbar');
  bar.style.display = 'flex';
  document.documentElement.style.setProperty('--wxh', bar.offsetHeight + 'px');
}

function hideWeatherBar() {
  const bar = document.getElementById('weatherbar');
  bar.style.display = 'none';
  document.documentElement.style.setProperty('--wxh', '0px');
}

// ============================================================
// THE STOP LIST
// ============================================================
// The map answers "where"; a rider on the bus is asking "how many more?".
// This is that answer: every stop in order, numbered, with the live times
// and a star on each one.
//
// Times are fetched as rows come into view, never all at once. A long route
// is fifty stops, and fifty simultaneous requests to a government API is
// both slow for the user and rude to the service.
function clearRouteStops() {
  if (routeStopsState && routeStopsState.observer) routeStopsState.observer.disconnect();
  if (routeStopsState && routeStopsState.watchId != null && navigator.geolocation)
    navigator.geolocation.clearWatch(routeStopsState.watchId);
  routeStopsState = null;
  const box = document.getElementById('routestops');
  if (box) box.innerHTML = '';
}

// The timetable row for the route on screen. serviceInfo is keyed
// ROUTE|BOUND|TYPE|CO. Citybus files its 70 circular routes under a
// two-letter bound ("962|IO|1|ctb") that a single-letter direction can never
// match, so those are tried too.
function serviceInfoFor(context) {
  if (!context) return null;
  const route = String(context.routeNo || '').toUpperCase();
  let co = String(context.co || 'kmb').toLowerCase();
  if (co === 'lwb') co = 'kmb';
  const type = String(context.serviceType || '1');
  const dir = context.dir;
  const tries = [route + '|' + dir + '|' + type + '|' + co,
                 route + '|' + dir + '|1|' + co,
                 route + '|IO|' + type + '|' + co, route + '|OI|' + type + '|' + co,
                 route + '|IO|1|' + co,            route + '|OI|1|' + co];
  for (const key of tries) {
    const hit = serviceInfo.get(key);
    if (hit && hit.freq) return hit;
  }
  return null;
}

// A summary as words. A single scheduled departure is ONE time, not a range:
// 82B's four morning runs read "07:15、07:25、07:40、08:05", never
// "07:15–07:15".
function svcSpan(sum) {
  if (sum.allDay) return T('svcAllDay');
  return sum.arcs.map(a => a.len === 1 ? svcClock(a.from)
                                       : svcClock(a.from) + '–' + svcClock(a.from + a.len - 1))
                 .join('、');
}
function svcHeadway(sum) {
  if (sum.hwMin) return ' · ' + (sum.hwMin === sum.hwMax
    ? T('svcEvery').replace('{a}', sum.hwMin)
    : T('svcEveryRange').replace('{a}', sum.hwMin).replace('{b}', sum.hwMax));
  // Every window was a single departure, so the count IS the timetable.
  if (sum.singles.length > 1) return ' · ' + T('svcDepartures').replace('{n}', sum.singles.length);
  return '';
}

// WHAT THIS ROUTE COSTS AND WHEN IT RUNS.
// Both come off the phone — the fare table and the timetable are in the two
// JSON files beside this page — so this block is drawn before a single
// arrival time has been fetched, and it is still there with no signal.
//
// The fare shown is the fare for boarding at the FIRST stop, which is the
// number printed on the bus. It is not labelled "up to": on route 23 the
// fare goes UP mid-route, so "up to" would be a lie. Every rider's own fare
// sits on their own row further down, and both come from stopFare(), so the
// two can never disagree.
function routeInfoBlock(context) {
  const box = document.createElement('div');
  box.className = 'rsinfo';
  const lines = [];

  const fare = stopFare(context.routeNo, context.dir, context.serviceType, 1, context.co);
  if (fare !== null) lines.push('<span class="rsi">💰 ' + T('fullFare') + ' ' + fareText(fare) + '</span>');

  const info = serviceInfoFor(context);
  const today = info ? patternsForToday(info.freq) : { masks: [], state: 'noData' };
  const summary = today.masks.length ? svcSummary(info.freq, today.masks) : null;

  if (today.state === 'closed' || today.state === 'closedPh') {
    lines.push('<span class="rsi warn">🕘 ' +
               T(today.state === 'closedPh' ? 'svcClosedPh' : 'svcClosedToday') + '</span>');
  } else if (summary) {
    let line = '🕘 ' + T(today.state === 'phUnknown' ? 'svcUsual' : 'svcToday') + ' ' +
               svcSpan(summary) + svcHeadway(summary);
    lines.push('<span class="rsi">' + esc(line) + '</span>');
    if (summary.night) lines.push('<span class="rsi">🌙 ' + T('svcNight') + '</span>');
  }

  if (!lines.length) return null;
  box.innerHTML = lines.join('');

  // Every other day pattern, folded away. A rider who wants Sunday hours on a
  // Tuesday can ask for them; nobody has to scroll past them who does not.
  const all = info ? Object.keys(info.freq || {}).map(Number).filter(n => isFinite(n) && n > 0) : [];
  if (all.length) {
    const more = document.createElement('button');
    more.className = 'rsmore';
    more.textContent = T('svcMore');
    const detail = document.createElement('div');
    detail.className = 'rsdetail';
    detail.style.display = 'none';
    // Masks that read the same have to be shown together. Route 82B files an
    // extra 07:25 departure under mask 31 on top of mask 287's timetable, and
    // both say "星期一至五" — two rows under one heading is a puzzle, not a
    // timetable, so their windows are pooled into a single line.
    const byLabel = new Map();
    for (const mask of all.sort((a, b) => a - b)) {
      const label = maskLabel(mask);
      (byLabel.get(label) || byLabel.set(label, []).get(label)).push(mask);
    }
    detail.innerHTML = [...byLabel].map(([label, masks]) => {
      const sum = svcSummary(info.freq, masks);
      if (!sum) return '';
      return '<div class="rsdrow"><b>' + esc(label) + '</b> ' +
             esc(svcSpan(sum) + svcHeadway(sum)) + '</div>';
    }).join('');
    more.addEventListener('click', () => {
      const open = detail.style.display !== 'none';
      detail.style.display = open ? 'none' : 'block';
      more.textContent = T(open ? 'svcMore' : 'svcLess');
    });
    box.appendChild(more);
    box.appendChild(detail);
  }
  return box;
}

function renderRouteStops(context, stops) {
  clearRouteStops();
  const box = document.getElementById('routestops');
  if (!box || !stops.length) return;

  setTimeout(refreshAlerts, 0);           // the route on screen is now watched
  routeStopsState = { context, stops, boardAt: null, alightAt: null, autoBoard: false,
                      watchId: null, observer: null, inFlight: 0, queue: [] };

  const head = document.createElement('div');
  head.className = 'rshead';
  const title = document.createElement('div');
  title.className = 'rstitle';
  title.textContent = context.routeNo + '  ' + context.from + ' → ' + context.to;
  const sub = document.createElement('small');
  sub.textContent = T('stopsOnRoute').replace('{n}', stops.length);
  title.appendChild(sub);
  const close = document.createElement('button');
  close.className = 'rsclose';
  close.textContent = '✕';
  close.title = T('rsClose');
  close.setAttribute('aria-label', T('rsClose'));
  close.addEventListener('click', clearRouteStops);
  // Times are fetched once. A rider waiting at the stop for five minutes is
  // looking at a number that is five minutes old, so they can ask again —
  // by hand, which keeps the app's no-timers rule.
  const refresh = document.createElement('button');
  refresh.className = 'refreshbtn';
  refresh.textContent = T('refresh');
  refresh.addEventListener('click', () => {
    if (!routeStopsState) return;
    const keep = { context: routeStopsState.context, stops: routeStopsState.stops,
                   boardAt: routeStopsState.boardAt, alightAt: routeStopsState.alightAt,
                   autoBoard: routeStopsState.autoBoard };
    const panel = document.getElementById('panel');
    const scrollWas = panel ? panel.scrollTop : 0;
    renderRouteStops(keep.context, keep.stops);
    if (routeStopsState) { Object.assign(routeStopsState, { boardAt: keep.boardAt, alightAt: keep.alightAt, autoBoard: keep.autoBoard }); paintStopCounts(); syncRideWatch(); }
    if (panel) panel.scrollTop = scrollWas;
    status.textContent = T('refreshing');
  });
  // Title and ✕ on the first line, 更新班次 beneath. Finding your stop lives
  // on the search bar now, beside the route number, where every other 📍 in
  // this app already is.
  const acts = document.createElement('div');
  acts.className = 'rsacts';
  acts.appendChild(refresh);
  head.appendChild(title); head.appendChild(close); head.appendChild(acts);
  box.appendChild(head);

  const hint = document.createElement('div');
  hint.className = 'rshint';
  hint.textContent = T('rsHint');
  box.appendChild(hint);

  const info = routeInfoBlock(context);
  if (info) box.appendChild(info);

  // CITYBUS FARES AND HOURS ARRIVE LATE, ON PURPOSE.
  // They live in hk-bus-lite.json, which at 487 KB over the wire is the
  // single biggest thing this app can download — bigger than the app itself
  // — and a KMB rider never needs a byte of it. So it is fetched only when a
  // Citybus or NLB route is actually opened, and only the first time in a
  // session. The stop list and its live times are already on screen by then;
  // when the file lands, this one block redraws and nothing else moves.
  const routeCo = String(context.co || '').toLowerCase();
  if ((routeCo === 'ctb' || routeCo === 'nlb') && !fareIndex) {
    loadFareData().then(() => {
      // The rider may have closed the route or opened another one while a
      // half-megabyte was coming down. Only redraw what is still on screen.
      if (!routeStopsState || routeStopsState.context !== context) return;
      const live = document.getElementById('routestops');
      if (!live) return;
      const fresh = routeInfoBlock(context);
      if (!fresh) return;
      const current = live.querySelector('.rsinfo');
      if (current) current.replaceWith(fresh);
      else {
        // There was no block at all before, because there was nothing to put
        // in it. It goes where it would have gone: under the hint.
        const hint = live.querySelector('.rshint');
        if (hint) hint.insertAdjacentElement('afterend', fresh);
      }
    }).catch(error => console.warn('Citybus fares unavailable:', error));
  }

  // The ride banner: filled in once both marks are set, hidden otherwise.
  const ride = document.createElement('div');
  ride.id = 'rsride'; ride.className = 'rsride'; ride.style.display = 'none';
  box.appendChild(ride);

  stops.forEach((stop, index) => {
    const row = document.createElement('div');
    row.className = 'rsrow';
    row.dataset.index = index;

    const num = document.createElement('div');
    num.className = 'rsnum';
    num.textContent = index + 1;

    const pick = document.createElement('button');
    pick.className = 'rspick';
    const name = document.createElement('div');
    name.className = 'rsname';
    name.textContent = plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en)
                                                   : stop.name_en);
    const note = document.createElement('div');       // count or boarding tag
    const eta  = document.createElement('div');
    eta.className = 'rseta quiet';
    eta.textContent = T('rsCheckingEta');
    pick.appendChild(name); pick.appendChild(note); pick.appendChild(eta);

    // First tap: where you get on. A later stop: where you get off. Tapping a
    // mark again clears it; tapping an earlier stop moves the boarding mark.
    pick.addEventListener('click', () => {
      const st = routeStopsState;
      st.autoBoard = false;
      if (st.boardAt === null || index < st.boardAt) {
        st.boardAt = index;
        if (st.alightAt !== null && st.alightAt <= index) st.alightAt = null;
      } else if (index === st.boardAt) {
        st.boardAt = null; st.alightAt = null;
      } else if (index === st.alightAt) {
        st.alightAt = null;
      } else {
        st.alightAt = index;
      }
      paintStopCounts();
      syncRideWatch();
      paintWalkLink();
      const lat = Number(stop.lat), lng = Number(stop.long);
      if (isFinite(lat) && isFinite(lng)) map.setView([lat, lng], 17);
    });

    const star = document.createElement('button');
    star.className = 'rsstar';
    star.textContent = '☆';
    star.setAttribute('aria-label', T('rsStarLabel'));
    // ONE STAR, BOTH LISTS.
    // This used to save only a DEPARTURE — this bus, this way, from this stop
    // — while its own label and the hint above both said 收藏車站, "save the
    // station". So a rider starred a station here and then could not find it
    // under 你收藏的起點車站, because it had never been put there. It now saves
    // the stop as well, which is what the words on the button have always
    // promised.
    //
    // Unstarring drops the departure only. The saved stop stays: it may well
    // have been saved deliberately from somewhere else, and quietly deleting
    // one of a rider's eight starting points to undo a different action is
    // not a trade worth making. It is one tap to remove in 收藏.
    star.addEventListener('click', () => {
      const added = toggleDeparture({
        route: context.routeNo, dir: context.dir, serviceType: context.serviceType,
        co: context.co, stop: stop.stop,
        stopName_en: stop.name_en, stopName_tc: stop.name_tc,
        dest_en: context.destEn, dest_tc: context.destTc
      });
      star.textContent = added ? '★' : '☆';
      star.classList.toggle('on', added);

      const here = plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en);
      if (!added) {
        status.textContent = T('departureRemoved').replace('{r}', context.routeNo);
        return;
      }
      if (isSavedStop(stop.stop)) {
        status.textContent = T('rsStarSavedBus').replace('{r}', context.routeNo).replace('{s}', here);
      } else if (toggleStopFav({ stop: stop.stop, name_en: stop.name_en, name_tc: stop.name_tc,
                                 lat: stop.lat, long: stop.long }) === null) {
        // The starting-stop list is full. The bus is saved either way; say so
        // rather than letting the station silently not appear again.
        status.textContent = T('rsStarStopFull').replace('{r}', context.routeNo);
      } else {
        status.textContent = T('rsStarSavedBoth').replace('{r}', context.routeNo).replace('{s}', here);
      }
      paintBottomBar();
    });
    if (isSavedDeparture(context.routeNo, context.dir, stop.stop)) {
      star.textContent = '★';
      star.classList.add('on');
    }

    row.appendChild(num); row.appendChild(pick); row.appendChild(star);
    row.etaCell = eta;
    row.noteCell = note;
    box.appendChild(row);
  });

  // Standing within a short walk of a stop on this route, you are almost
  // certainly getting on there. Mark it, and say why it was marked.
  if (routeStopsState.boardAt === null && herePoint) {
    const near = nearestRouteStop(herePoint);
    // Within RS_AUTO_BOARD_M you are at the stop. Further out, up to a real
    // walk, it is still "your nearest stop on this route" — marked, scrolled
    // to, and labelled with the distance so nobody thinks they are there.
    if (near && near.metres <= RS_NEAREST_MARK_M) {
      routeStopsState.boardAt = near.index;
      routeStopsState.autoBoard = true;
      routeStopsState.autoMetres = near.metres;
    }
  }

  paintStopCounts();
  paintWalkLink();
  watchForVisibleRows();

  const panel = document.getElementById('panel');
  if (!panel) return;

  if (panel.classList.contains('routemode')) {
    // In route mode the list is already the only thing under the search box,
    // and the box is sticky — scrolling would slide the list's own heading
    // underneath it. Unless a stop was marked for the rider: then that row
    // is what they need, and it may be forty stops down.
    panel.scrollTop = 0;
    if (routeStopsState.autoBoard) scrollToMarkedStop();
    // The blue banner says route, from, to and stop count; so does the header
    // three lines above. On a phone the duplicate costs a third of the screen,
    // and the list is what the rider came for.
    document.getElementById('routebanner').style.display = 'none';
  } else {
    // Built below the whole entry form, so without this it appears off the
    // bottom of the sheet and looks as though nothing happened.
    panel.scrollTop = Math.max(0, box.offsetTop - panel.offsetTop - 8);
  }
}

// How far each stop is from the one the rider marked. Only stops AFTER the
// mark get a count — a stop already behind you is not "3 away", it is gone.
function paintStopCounts() {
  if (!routeStopsState) return;
  const box = document.getElementById('routestops');
  const board = routeStopsState.boardAt, alight = routeStopsState.alightAt;

  for (const row of box.querySelectorAll('.rsrow')) {
    const index = Number(row.dataset.index);
    row.classList.toggle('board', board !== null && index === board);
    row.classList.toggle('alight', alight !== null && index === alight);
    row.classList.toggle('after', board !== null && index > board && (alight === null || index < alight));

    const note = row.noteCell;
    note.className = '';
    note.textContent = '';
    if (board === null) continue;

    if (index === board) {
      note.className = 'rsboardtag';
      const st = routeStopsState;
      note.textContent = !st.autoBoard ? T('rsBoarding')
        : (st.autoMetres > RS_AUTO_BOARD_M ? T('rsBoardNear').replace('{m}', Math.round(st.autoMetres)) : T('rsBoardAuto'));
    } else if (alight !== null && index === alight) {
      note.className = 'rsalighttag';
      note.textContent = T('rsAlight');
    } else if (alight !== null && index > alight) {
      note.className = 'rseta quiet';
      note.textContent = T('rsAfterAlight');
    } else if (index > board) {
      const away = index - board;
      note.className = 'rscount';
      note.textContent = away === 1 ? T('rsOneStopAway')
                                    : T('rsStopsAway').replace('{n}', away);
    }
    // Nothing at all for the stops BEFORE the boarding mark. 「在上車站之前」
    // said only what the row was not, on every row above the one that
    // mattered, and it pushed the name and the times apart for no gain.
  }
  paintRideBanner();
}

const RS_AUTO_BOARD_M = 250;    // "standing at the stop", give or take a road
const RS_NEAREST_MARK_M = 1500; // beyond this the nearest stop is not "yours"
const RS_RIDE_NEAR_M  = 600;    // a moving bus is "at" the nearest stop

function rsStopName(index) {
  const stop = routeStopsState && routeStopsState.stops[index];
  if (!stop) return '';
  return plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en);
}

// The stop on this route closest to a point.
// Bring the marked stop into view. On a 31-stop route it can be a long way
// down, and a mark the rider cannot see is a mark that did not happen.
function scrollToMarkedStop() {
  if (!routeStopsState || routeStopsState.boardAt === null) return;
  const panel = document.getElementById('panel');
  const box = document.getElementById('routestops');
  if (!panel || !box) return;
  const row = box.querySelector('.rsrow[data-index="' + routeStopsState.boardAt + '"]');
  if (!row) return;
  const field = document.getElementById('routefield');
  const offset = panel.classList.contains('routemode') && field ? field.offsetHeight : 0;
  panel.scrollTop = Math.max(0, row.offsetTop - offset - 12);
}

function nearestRouteStop(point) {
  if (!routeStopsState || !point) return null;
  let best = null;
  routeStopsState.stops.forEach((stop, index) => {
    const lat = Number(stop.lat), lng = Number(stop.long);
    if (!isFinite(lat) || !isFinite(lng)) return;
    const metres = metresBetween(point.lat, point.lng, lat, lng);
    if (!best || metres < best.metres) best = { index, metres };
  });
  return best;
}

// "How many more?" — answered from where the phone is, not from a guess.
function paintRideBanner() {
  const st = routeStopsState;
  const el = document.getElementById('rsride');
  if (!st || !el) return;
  if (st.boardAt === null || st.alightAt === null) { el.style.display = 'none'; el.innerHTML = ''; return; }

  const total = st.alightAt - st.boardAt;
  let html = '<div class="rsridehead">🚌 ' + esc(rsStopName(st.boardAt)) + ' → ▼ ' + esc(rsStopName(st.alightAt)) +
             ' · ' + (total === 1 ? T('rsOneStop') : T('rsStops').replace('{n}', total)) + '</div>';
  if (!herePoint) {
    html += '<div class="rsridesub">' + T('rsNeedLocation') + '</div>';
  } else {
    const near = nearestRouteStop(herePoint);
    if (!near || near.metres > RS_RIDE_NEAR_M) {
      html += '<div class="rsridesub">' + T('rsNotOnRoute') + '</div>';
    } else {
      const remaining = st.alightAt - near.index;
      if (remaining <= 0)      html += '<div class="rsridebig arrived">' + T('rsArrived') + '</div>';
      else if (remaining === 1) html += '<div class="rsridebig soon">' + T('rsNextStop') + '</div>';
      else                      html += '<div class="rsridebig">' + T('rsRemaining').replace('{n}', remaining) + '</div>';
      html += '<div class="rsridesub">' + T('rsNearNow').replace('{s}', esc(rsStopName(near.index))) + '</div>';
    }
  }
  el.innerHTML = html;
  el.style.display = 'block';
}

// Watch the phone's position only while a ride is marked and the list is
// open. It is the phone talking to its own GPS — no network, no timer of
// ours — and it is cleared the moment the list closes.
function syncRideWatch() {
  const st = routeStopsState;
  const wanted = !!(st && st.boardAt !== null && st.alightAt !== null && navigator.geolocation);
  if (wanted && st.watchId == null) {
    st.watchId = navigator.geolocation.watchPosition(
      position => {
        herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
        paintRideBanner();
      },
      () => {},
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
  } else if (!wanted && st && st.watchId != null) {
    navigator.geolocation.clearWatch(st.watchId);
    st.watchId = null;
  }
}

// Fetch times only for the rows actually on screen, four at a time.
function watchForVisibleRows() {
  const box = document.getElementById('routestops');
  if (!box || !routeStopsState) return;

  const pump = () => {
    while (routeStopsState && routeStopsState.inFlight < 4 && routeStopsState.queue.length) {
      const row = routeStopsState.queue.shift();
      routeStopsState.inFlight++;
      loadStopEta(row).finally(() => {
        if (!routeStopsState) return;
        routeStopsState.inFlight--;
        pump();
      });
    }
  };

  const rows = [...box.querySelectorAll('.rsrow')];

  // No IntersectionObserver (older browser): just load them in order rather
  // than showing "checking…" for ever.
  if (typeof IntersectionObserver === 'undefined') {
    routeStopsState.queue = rows;
    pump();
    return;
  }

  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      observer.unobserve(entry.target);        // each stop is asked for once
      routeStopsState.queue.push(entry.target);
    }
    pump();
  }, { root: document.getElementById('panel'), rootMargin: '200px' });

  for (const row of rows) observer.observe(row);
  routeStopsState.observer = observer;

  // The observer is an optimisation, not the mechanism. It does not fire at
  // all while the tab is in the background, and a rider who opens a route and
  // switches away for ten seconds would come back to a list still saying
  // "checking…". The first stops are wanted in every case, so they are asked
  // for outright and the observer is left to cover the rest.
  for (const row of rows.slice(0, 6)) {
    observer.unobserve(row);
    routeStopsState.queue.push(row);
  }
  pump();
}

async function loadStopEta(row) {
  if (!routeStopsState) return;
  const { context, stops } = routeStopsState;
  const stop = stops[Number(row.dataset.index)];
  const cell = row.etaCell;
  if (!stop || !cell) return;

  try {
    let minutes = [];
    if (context.co === 'CTB') {
      const response = await fetch(CTB_BASE + '/eta/CTB/' + stop.stop + '/' +
        encodeURIComponent(context.routeNo), { signal: AbortSignal.timeout(10000) });
      if (!response.ok) throw new Error(response.status);
      minutes = etaMinutes((await response.json()).data, context.dir, null);
    } else {
      const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' +
        stop.stop, { signal: AbortSignal.timeout(10000) });
      if (!response.ok) throw new Error(response.status);
      const rows = ((await response.json()).data || [])
        .filter(r => String(r.route).toUpperCase() === String(context.routeNo).toUpperCase());
      minutes = etaMinutes(rows, context.dir, context.serviceType);
    }

    if (!routeStopsState) return;                 // list closed while waiting
    if (minutes.length === 0) {
      cell.className = 'rseta quiet';
      cell.textContent = T('rsNoEta');
      return;
    }
    cell.className = 'rseta';
    cell.textContent = minutes.slice(0, 3)
      .map(m => (m <= 0 ? T('due') : m + T('min'))).join(' · ');
  } catch (error) {
    if (!routeStopsState) return;
    cell.className = 'rseta quiet';
    cell.textContent = T('rsEtaFailed');
  }
}

// Minutes from now, for this direction only, soonest first.
function etaMinutes(rows, dir, serviceType) {
  const now = Date.now();
  return (rows || [])
    .filter(r => r.eta)
    .filter(r => !dir || !r.dir || r.dir === dir)
    .filter(r => !serviceType || String(r.service_type) === String(serviceType))
    .map(r => Math.round((new Date(r.eta).getTime() - now) / 60000))
    .filter(m => m >= 0)
    .sort((a, b) => a - b);
}

function paintRoute(routeNo, company, from, to, stops, fill, edge, ctbRouteNo, context) {
  // Same rule as choosing a journey: once a route is on screen, the general
  // bus stop dots are clutter. They come back when the route is closed.
  journeyMode = true;
  stopLayer.clearLayers();

  const points = [];
  for (const stop of stops) {
    const lat = Number(stop.lat), lng = Number(stop.long);
    if (!isFinite(lat) || !isFinite(lng)) continue;
    points.push([lat, lng]);

    const marker = L.circleMarker([lat, lng], { radius:9, color:edge, weight:3,
      fillColor:fill, fillOpacity:0.9 }).addTo(routeLayer);
    marker.bindPopup(stopHeader(stop) + '<div class="eta-note">' + T('loadingArrivals') + '</div>');
    marker.on('popupopen', () => ctbRouteNo
      ? loadCtbArrivals(stop, marker, ctbRouteNo)
      : loadKmbArrivals(stop, marker));
  }
  if (points.length === 0) { status.textContent = T('noStopLocations'); return; }

  L.polyline(points, { color:fill, weight:4, opacity:0.6, dashArray:'6 6' }).addTo(routeLayer);
  markEnds(points, from, to);
  map.fitBounds(L.latLngBounds(points), mapPadding());

  document.getElementById('rb-route').textContent = routeNo;
  document.getElementById('rb-company').textContent = company;
  document.getElementById('rb-from').textContent = from;
  document.getElementById('rb-to').textContent = to;
  document.getElementById('rb-note').textContent =
    T('stopsOnRoute').replace('{n}', points.length);
  const banner = document.getElementById('routebanner');
  banner.classList.toggle('ctb', company === 'Citybus');
  banner.style.display = 'block';
  status.textContent = T('stopsOnRoute').replace('{n}', points.length);

  // The list in the panel, alongside the dots on the map.
  if (context) renderRouteStops(Object.assign({ routeNo, from, to }, context), stops);
}

async function loadCtbArrivals(stop, marker, routeNo) {
  try {
    const response = await fetch(CTB_BASE + '/eta/CTB/' + stop.stop + '/' + encodeURIComponent(routeNo),
                                 { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    marker.setPopupContent(stopHeader(stop) + formatArrivals((await response.json()).data));
  } catch (error) {
    marker.setPopupContent(stopHeader(stop) +
      '<div class="eta-note">' + T('couldNotLoadArrivals') + '</div>');
  }
}

function markEnds(points, fromName, toName) {
  if (points.length < 2) return;
  const make = (latlng, letter, word, finish) => L.marker(latlng, { zIndexOffset:900,
    icon: L.divIcon({ className:'', iconSize:null, iconAnchor:[22,22],
      html:'<div class="endwrap' + (finish ? ' finish' : '') + '">' +
           '<div class="enddot">' + letter + '</div>' +
           '<div class="endtext">' + word + '<br>' + fromToText(word, fromName, toName) +
           '</div></div>' }) }).addTo(routeLayer);
  make(points[0], 'A', 'START', false);
  make(points[points.length-1], 'B', 'END', true);
}
function fromToText(word, fromName, toName) { return word === 'START' ? fromName : toName; }


// ============================================================
// 10. CLEAR EVERYTHING
// ============================================================
document.getElementById('clear-all').addEventListener('click', () => {
  setResultsMode(false);
  startPoint = null; endPoint = null; arm(null);
  routeLayer.clearLayers();
  journeyMode = false;
  drawStops();
  document.getElementById('routebanner').style.display = 'none';
  document.getElementById('journeys').innerHTML = '';
  document.getElementById('compare').innerHTML = '';
  clearRouteStops();
  for (const id of ['start-text','end-text','route-text']) document.getElementById(id).value = '';
  for (const id of ['start-results','end-results','route-results']) document.getElementById(id).innerHTML = '';
  redrawJourney();
  status.textContent = T('cleared');
});

// The big ✕ on the banner means "I'm done with this trip". It clears both
// points and returns the panel to the entry form, ready for a new search.
document.getElementById('rb-close').addEventListener('click', resetTrip);

function resetTrip() {
  startPoint = null; endPoint = null; arm(null);
  // The stored results describe a trip that no longer exists. Only
  // currentPicks was cleared, so tapping 巴士 afterwards restored the old
  // busPicks and rebuilt their cards against a startPoint that is now null —
  // makeCard reads startPoint.stop and the whole screen threw. Long-standing,
  // and easy to reach now that a journey is one tap from the map.
  currentPicks = []; busPicks = []; railPicks = []; railOptions = [];

  document.getElementById('routebanner').style.display = 'none';
  document.getElementById('stopdetail').style.display = 'none';
  routeLayer.clearLayers();
  detailLayer.clearLayers();
  journeyLayer.clearLayers();

  document.getElementById('journeys').innerHTML = '';
  document.getElementById('compare').innerHTML = '';
  clearRouteStops();
  for (const id of ['start-text','end-text','route-text'])
    document.getElementById(id).value = '';
  for (const id of ['start-results','end-results','route-results'])
    document.getElementById(id).innerHTML = '';

  setResultsMode(false);
  journeyMode = false;
  drawStops();
  redrawJourney();
  status.textContent = T('cleared');
}

// ============================================================
// LAST OF ALL
// ============================================================
// The Observatory, once now and then every ten minutes. Two small requests
// that never block anything: if they fail the bar simply stays hidden.
//
// This runs at the very bottom, not with the other start-up calls, because
// its constants are declared further down the file than those calls are —
// and `const` cannot be read before the line declaring it has run. Starting
// it here is the fix; moving the whole weather section up would be the other.
// Drawn once before the first request goes out, so that opening the app with
// no signal says so straight away instead of after a ten-second timeout.
renderWeatherBar();
loadWeather();
setInterval(loadWeather, WEATHER_REFRESH_MS);
// 简体: names from the feeds are Traditional; convert them as they land.
if (typeof MutationObserver !== 'undefined') {
  new MutationObserver(muts => {
    if (script !== 'sc') return;
    for (const m of muts) {
      if (m.type === 'characterData') scConvertTree(m.target);
      else for (const n of m.addedNodes) scConvertTree(n);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
  scConvertTree(document.body);
}
// ============================================================
// THE STOP SCREEN KEEPS ITSELF HONEST
// ============================================================
// Standing at the kerb watching "3 分鐘" is the thing this app is FOR, and
// that number never moved: the weather and the traffic notices refreshed on
// timers, the arrivals did not. The countdown was arithmetic done once, at
// render, and then left to rot — only the 更新於 stamp quietly betrayed it.
//
// Two different jobs, and only one of them costs anything:
//   * the repaint is free. The minutes are (eta − now), so redrawing the rows
//     ages them correctly using times we already hold, no network at all.
//   * the refetch is the expensive half, and stopLoadRows already refuses to
//     run when what it holds is under 30 s old. Ticking faster than that
//     sharpens the countdown without buying more data.
//
// Guards, in order of how much they matter: nothing happens when the screen
// is not on show (a pocketed phone must cost nothing), nothing happens while
// a decision sheet is open, and the refetch stands down while the rider is
// typing in the 往… box so the list cannot move under their finger. The
// repaint is still safe then — it rewrites #stop-rows, never the input.
const STOP_TICK_MS = 15000;
// A phone left face-up on a table is not a rider. After this long with no
// touch the screen goes quiet until it is touched again.
const STOP_IDLE_MS = 15 * 60 * 1000;
let stopLastTouch = Date.now();
for (const evt of ['pointerdown', 'keydown', 'focus'])
  window.addEventListener(evt, () => { stopLastTouch = Date.now(); }, true);

function stopTick() {
  if (activeMode !== 'stop' || !stopState.stop) return;
  if (document.hidden) return;
  if (Date.now() - stopLastTouch > STOP_IDLE_MS) return;
  if (document.querySelector('#dirsheet.open, #alertsheet.open')) return;
  const rowsBox = document.getElementById('stop-rows');
  if (rowsBox) rowsBox.innerHTML = stopRowsHtml();
  const typing = document.activeElement && document.activeElement.id === 'stop-filter';
  if (!typing) stopLoadRows();
}
setInterval(stopTick, STOP_TICK_MS);

// Traffic notices: on open, every five minutes, and whenever the app comes
// back to the front — the moment a rider is about to set off.
checkAlerts();
setInterval(checkAlerts, ALERT_REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  checkAlerts();
  stopLastTouch = Date.now();   // coming back to the app is an interaction
  stopTick();                   // and the times on screen are already stale
});

// ============================================================
// PLACES WORTH GOING — the tourist layer on the MAP tab
// ============================================================
// A visitor's question is not "when is the next 60X" but "how do I get to the
// Peak", and until now the app had no idea such a place existed. This layer
// answers it with the government's own lists — 655 places from nine open
// datasets — and then hands the question straight back to the machinery that
// already knows about buses.
//
// WHY THE DATA IS BUNDLED rather than fetched live: none of these endpoints
// sends an access-control-allow-origin header, so a browser cannot read them
// at all. It is also the right answer for a visitor, who is very likely on
// expensive roaming data or none: 39 KB gzipped, stored by the service worker
// on first open, and the map then works with no signal.
//
// SOURCES (all data.gov.hk / CSDI, all free to use):
//   Culture, Sports and Tourism Bureau  major attractions
//   Leisure and Cultural Services Dept  museums, parks and zoos, beaches
//   Antiquities and Monuments Office    declared monuments, heritage trails
//   Agriculture, Fisheries and Cons.    country and marine parks, viewing
//                                       points, visitor centres, Wetland Park
//   Planning Department                 strategic viewing points
//   Home and Youth Affairs Bureau       Chinese Temples Committee temples
const SPOTS_URL = 'attractions.json';

// HOTELS AND GUESTHOUSES — every licensed one in Hong Kong.
// Source: Home Affairs Department, "List of licensed hotels and guesthouses",
// via CSDI / data.gov.hk, updated 4 Sep 2026. 1,683 premises with the name in
// both languages, the address, the district and the telephone number. It is
// the licence register, so it is complete and official — and it includes the
// small guesthouses a big travel site will never show you.
//
// Kept in its OWN file and fetched only when somebody asks for hotels: at
// 104 KB over the wire it is half the size of the attractions file again, and
// a rider looking up a bus should never pay for it.
const HOTELS_URL = 'hotels.json';
let hotelsLoading = null;
let hotelsLoaded = false;

async function loadHotels() {
  if (hotelsLoaded) return;
  if (hotelsLoading) return hotelsLoading;
  hotelsLoading = (async () => {
    try {
      await loadSpots();                       // hotels are appended to the same list
      const response = await fetch(HOTELS_URL, { signal: AbortSignal.timeout(20000) });
      if (!response.ok) throw new Error('server said ' + response.status);
      const json = await response.json();
      const base = spots.length;
      for (const [n, h] of (json.items || []).entries())
        spots.push(Object.assign({ i: base + n }, h));
      hotelsLoaded = true;
    } catch (error) {
      console.warn('Hotels unavailable:', error);
      hotelsLoaded = true;                     // asked and answered
    }
    hotelsLoading = null;
  })();
  return hotelsLoading;
}
let spots = null;              // null = not loaded, [] = tried and empty
let spotsLoading = null;
let spotFilter = '';           // '' = every category the zoom allows
let spotQuery = '';
let spotIndexing = false;
let hereMarker = null, hereRing = null;

async function loadSpots() {
  if (spots) return spots;
  if (spotsLoading) return spotsLoading;
  spotsLoading = (async () => {
    try {
      const response = await fetch(SPOTS_URL, { signal: AbortSignal.timeout(20000) });
      if (!response.ok) throw new Error('server said ' + response.status);
      const json = await response.json();
      spots = (json.items || []).map((s, i) => Object.assign({ i }, s));
    } catch (error) {
      console.warn('Places unavailable:', error);
      spots = [];              // asked and answered: do not ask again this session
    }
    spotsLoading = null;
    return spots;
  })();
  return spotsLoading;
}

// Nine categories, each with its own pin. The order is the order of the chips
// and, deliberately, the order of interest to someone here for a week.
const SPOT_CATS = [
  { c:'sight',    icon:'⭐', colour:'#b45309', key:'spotSight' },
  { c:'museum',   icon:'🏛', colour:'#7c3aed', key:'spotMuseum' },
  { c:'monument', icon:'🏯', colour:'#9a3412', key:'spotMonument' },
  { c:'temple',   icon:'⛩', colour:'#b91c1c', key:'spotTemple' },
  { c:'heritage', icon:'🚩', colour:'#be123c', key:'spotHeritage' },
  { c:'park',     icon:'🌳', colour:'#15803d', key:'spotPark' },
  { c:'beach',    icon:'🏖', colour:'#0369a1', key:'spotBeach' },
  { c:'view',     icon:'🔭', colour:'#0f766e', key:'spotView' },
  { c:'nature',   icon:'⛰', colour:'#4d7c0f', key:'spotNature' },
  { c:'hotel',    icon:'🛏', colour:'#1d4ed8', key:'spotHotel' },
];
const SPOT_CAT = new Map(SPOT_CATS.map(c => [c.c, c]));

// FROM WHICH ZOOM EACH KIND APPEARS.
// All 655 at once is a screen of confetti, and the interesting ones lose. So
// the headline sights are there from the whole-territory view and the 118
// heritage-trail plaques only once the rider is standing in the street they
// are on. Choosing a category from the chips overrides all of this — asking
// for temples means temples, wherever you happen to be looking.
const SPOT_TIER = { sight:11, museum:13, nature:13, beach:13,
                    monument:14, park:14, temple:14, view:14, heritage:15,
                    // 1,683 of them, most on one street in Tsim Sha Tsui:
                    // shown only when the hotel chip is chosen, never in the
                    // everything view, or they bury the rest of Hong Kong.
                    hotel:99 };
const SPOT_MAX_PINS = 240;     // beyond this the map is unreadable anyway
const SPOT_LABEL_ZOOM = 16;
const SPOT_TRANSPORT_M = 800;  // the same walk the planner asks of anyone else
const SPOT_RAIL_M = 1200;      // a station is worth a longer walk than a pole
// WHEN THERE IS NOTHING WITHIN A NORMAL WALK.
// 110 of the 655 places have no stop within 800 m, and they are real places
// people go: the Tai Tam reservoir dams, the hilltop viewing points, Cape
// D'Aguilar. "No bus stop within a short walk" is a dead end at all of them,
// while "the nearest stop is 1.4 km away" is the answer the visitor came for.
// So we look again, further out, and say plainly that it is far.
const SPOT_FAR_M = 2500;
const SPOT_NEAR_ME_M = 1500;

function spotName(s)    { return (lang === 'zh' ? (s.t || s.e) : (s.e || s.t)) || ''; }
function spotSub(s)     { return (lang === 'zh' ? (s.e || '') : (s.t || '')) || ''; }
function spotAddress(s) { return (lang === 'zh' ? (s.at || s.ae) : (s.ae || s.at)) || ''; }
function spotHours(s)   { return (lang === 'zh' ? (s.ht || s.he) : (s.he || s.ht)) || ''; }
function spotSite(s)    { return (lang === 'zh' ? (s.wt || s.we) : (s.we || s.wt)) || ''; }
function spotTrail(s)   { return (lang === 'zh' ? (s.gt || s.ge) : (s.ge || s.gt)) || ''; }
function spotKind(s)    { const c = SPOT_CAT.get(s.c); return c ? T(c.key) : ''; }
function spotIconOf(s)  { return (SPOT_CAT.get(s.c) || { icon:'📍' }).icon; }

function metresShort(m) {
  return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m';
}

// ---------------------------------------------------------------- the pins
const spotLayer = L.layerGroup().addTo(map);

function spotIcon(s, withLabel) {
  const cat = SPOT_CAT.get(s.c) || { icon:'📍', colour:'#334155' };
  const label = withLabel ? '<span class="spotlabel">' + esc(spotName(s)) + '</span>' : '';
  return L.divIcon({
    className: 'spotpin-wrap',
    html: '<div class="spotpinbox"><span class="spotpin" style="--pin:' + cat.colour + '">' +
          cat.icon + '</span>' + label + '</div>',
    iconSize: [140, withLabel ? 52 : 30],
    iconAnchor: [70, 15],
  });
}

function drawSpots() {
  spotLayer.clearLayers();
  if (activeMode !== 'map' || journeyMode) return;
  if (!spots || !spots.length) return;

  if (spotFilter === 'none') return;          // the rider asked for a clear map
  const zoom = map.getZoom(), area = map.getBounds(), centre = map.getCenter();
  const wanted = [];
  for (const s of spots) {
    if (spotFilter && s.c !== spotFilter) continue;
    if (!spotFilter && zoom < (SPOT_TIER[s.c] || 14)) continue;
    if (!area.contains([s.y, s.x])) continue;
    wanted.push(s);
  }
  // Over the cap, the places nearest the middle of the screen are the ones
  // the rider is actually looking at.
  if (wanted.length > SPOT_MAX_PINS) {
    wanted.sort((a, b) => metresBetween(centre.lat, centre.lng, a.y, a.x) -
                          metresBetween(centre.lat, centre.lng, b.y, b.x));
    wanted.length = SPOT_MAX_PINS;
  }
  const withLabel = zoom >= SPOT_LABEL_ZOOM;
  for (const s of wanted) {
    L.marker([s.y, s.x], { icon: spotIcon(s, withLabel), title: spotName(s), riseOnHover: true })
      .addTo(spotLayer)
      .on('click', () => openSpotSheet(s));
  }
}

// ------------------------------------------------------------ the chip row
function renderSpotChips() {
  const box = document.getElementById('spotchips');
  if (!box) return;
  let html = '<button class="spotchip' + (spotFilter ? '' : ' on') +
             '" data-cat="">' + T('spotAll') + '</button>' +
             // Somebody reading the streets, or looking for their own bus
             // stop, wants the pins out of the way. One tap, and back.
             '<button class="spotchip' + (spotFilter === 'none' ? ' on' : '') +
             '" data-cat="none">🚫 ' + T('spotNone') + '</button>';
  for (const cat of SPOT_CATS) {
    html += '<button class="spotchip' + (spotFilter === cat.c ? ' on' : '') +
            '" data-cat="' + cat.c + '">' + cat.icon + ' ' + T(cat.key) + '</button>';
  }
  box.innerHTML = html;
  const search = document.getElementById('spot-search');
  if (search) search.placeholder = T('spotSearch');
  paintMapReset();
}

// ------------------------------------------------- taking the map back
// A JOURNEY OUTLIVES THE SCREEN THAT DREW IT.
// The route, the A and B pins and the 上車 / 目的地 labels are drawn straight
// onto the map, and until now nothing ever took them off: the ✕ in the search
// box only emptied the search box, and the ✕ that DOES clear a trip lives on
// the blue banner, which the map tab never shows. So a rider who had once
// planned a trip to 屯門市中心 was still looking at it days later, over
// whatever they were trying to find now, with no way to say "enough".
function mapHasOverlay() {
  return journeyLayer.getLayers().length > 0 ||
         routeLayer.getLayers().length > 0 ||
         detailLayer.getLayers().length > 0 ||
         !!hereMarker;
}

// The button only exists when there is something for it to do. A clear map
// carrying a red 清除 button invites the question "clear what?".
function paintMapReset() {
  const button = document.getElementById('spot-reset');
  if (!button) return;
  button.textContent = T('mapReset');
  button.classList.toggle('on', mapHasOverlay());
}

function resetMapView() {
  // resetTrip is what the banner's ✕ already does: the drawn route, the
  // pins, the stored options and the two ends of the trip, all together.
  // Anything less leaves the map and the 巴士 tab disagreeing about whether
  // a journey exists.
  resetTrip();
  if (hereMarker) { map.removeLayer(hereMarker); hereMarker = null; }
  if (hereRing)   { map.removeLayer(hereRing);   hereRing = null; }
  const locate = document.getElementById('maplocate');
  if (locate) locate.classList.remove('on', 'busy');
  // A search list still floating over the map is not a cleared map.
  const input = document.getElementById('spot-search');
  if (input) input.value = '';
  spotQuery = ''; spotPlaces = []; spotPlacesFor = '';
  renderSpotResults();
  closeSpotSheet();
  paintMapReset();
  status.textContent = T('mapResetDone');
}

// ---------------------------------------------------------- search by name
// Deliberately plain: a visitor types "peak" or "廟" and wants a list, not a
// ranking. Matches EITHER language, because the name on the sign and the name
// in the guidebook are very often not the same one.
function spotHits(query) {
  const needle = String(query || '').trim().toLowerCase();
  if (!needle || !spots) return [];
  const hits = [];
  for (const s of spots) {
    const hay = ((s.e || '') + ' ' + (s.t || '')).toLowerCase();
    if (hay.indexOf(needle) >= 0) hits.push(s);
    if (hits.length >= 60) break;
  }
  // A name that STARTS with what was typed comes first: "peak" leads with
  // The Peak, not with Peak Tram Lower Terminus.
  hits.sort((a, b) => (spotName(a).toLowerCase().indexOf(needle) === 0 ? 0 : 1) -
                      (spotName(b).toLowerCase().indexOf(needle) === 0 ? 0 : 1));
  return hits.slice(0, 12);
}

// STOPS AND STATIONS AS DESTINATIONS.
// Typing "IFC" finds seven poles around the same complex, and seven near
// identical rows is not an answer. The planner only ever needs ONE point per
// place — it works out the stops at both ends itself — so the matches are
// clustered by distance and each cluster becomes a single destination. The
// clustering is by DISTANCE, not name, because names repeat across Hong Kong:
// the four 水邊村 stops are 29 km apart and are four different places.
const SPOT_HIT_MERGE_M = 500;
// How much faster the train has to be before the map opens on it rather than
// on the bus. A few minutes either way is not worth overriding a bus app's
// own preference for buses; half an hour is.
const RAIL_WINS_BY_MIN = 5;

function spotStopHits(query) {
  const typed = String(query || '').trim().toLowerCase();
  if (typed.length < 2) return [];
  const matched = (stopsNamed(query).all || []).slice();
  for (const st of allStops) {
    if (!st.isStation) continue;
    if (((st.name_en || '') + ' ' + (st.name_tc || '')).toLowerCase().indexOf(typed) >= 0)
      matched.push(st);
  }
  if (!matched.length) return [];

  const clusters = [];
  for (const st of matched) {
    const lat = Number(st.lat), lng = Number(st.long);
    if (!isFinite(lat) || !isFinite(lng)) continue;
    let home = null;
    for (const c of clusters)
      if (metresBetween(lat, lng, c.lat, c.lng) <= SPOT_HIT_MERGE_M) { home = c; break; }
    if (home) {
      home.members.push(st);
      home.lat += (lat - home.lat) / home.members.length;
      home.lng += (lng - home.lng) / home.members.length;
    } else {
      clusters.push({ lat, lng, members: [st] });
    }
  }
  clusters.sort((a, b) => b.members.length - a.members.length);

  return clusters.slice(0, 3).map(c => {
    // The shortest name that actually contains what was typed: "IFC MALL",
    // not "Man Cheung Street, near Two International Finance Centre Mall".
    const naming = c.members.filter(st =>
      ((st.name_en || '') + ' ' + (st.name_tc || '')).toLowerCase().indexOf(typed) >= 0);
    const pick = (naming.length ? naming : c.members)
      .slice().sort((a, b) => stopName(a).length - stopName(b).length)[0];
    return { name: plainStopName(stopName(pick)), lat: c.lat, lng: c.lng,
             station: !!pick.isStation, n: c.members.length };
  });
}

// PLACES THE APP DOES NOT KNOW ABOUT.
// A visitor types "IFC", or the name of their hotel, and neither is a tourist
// attraction nor a bus stop — but the government's own gazetteer knows both.
// This is the same endpoint the trip planner's address boxes already use, so
// a name that works there works here.
let spotPlaces = [], spotPlacesFor = '', spotPlaceTimer = null;

async function lookupSpotPlaces(query) {
  const typed = String(query || '').trim();
  if (typed.length < 2) { spotPlaces = []; spotPlacesFor = ''; return; }
  try {
    const response = await fetch(GEOCODER + encodeURIComponent(typed),
                                 { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const json = await response.json();
    spotPlaces = (Array.isArray(json) ? json : []).slice(0, 6).map(entry => ({
      name: (lang === 'zh' ? entry.nameZH : entry.nameEN) || entry.nameEN || entry.nameZH || typed,
      sub:  (lang === 'zh' ? entry.addressZH : entry.addressEN) || '',
      lat: Number(entry.y), lng: Number(entry.x),
    })).filter(place => isFinite(place.lat) && isFinite(place.lng));
    spotPlacesFor = typed;
  } catch (error) {
    // The bundled matches are already on screen, so a failure here costs the
    // rider nothing they can see.
    console.warn('Place lookup unavailable:', error);
    spotPlaces = []; spotPlacesFor = '';
  }
}

// FROM WHERE YOU ARE STANDING TO THERE, BY BUS OR BY TRAIN.
// Nothing new is worked out here. The trip planner already compares direct
// buses, one change, and the railway, with fares and walking — it only ever
// lacked a way to be asked the question from the map. So we fill in its two
// ends and press its own button.
function planFromHere(lat, lng, label) {
  withHere(here => {
    status.textContent = T('spotPlanning');
    closeSpotSheet();
    routeFromMap = true;
    setPoint('start', here.lat, here.lng, T('myLocationLabel'));
    setPoint('end', Number(lat), Number(lng), label || '');
    findBuses().then(() => {
      // OPEN ON WHICHEVER ACTUALLY GETS THEM THERE.
      // findBuses always lands on the bus when there is one, which is the
      // right default for a screen whose question is "which bus" — but the
      // map's question is "how do I get there", and Kwai Fong to IFC is a
      // 71-minute two-bus ride against an 18-minute train. Showing the bus
      // there is not an answer. The other mode is still one tap away, and
      // nothing outside this map flow changes.
      const best = list => Math.min.apply(null, list.filter(n => isFinite(n)));
      const byBus  = best(busPicks.map(pick => pick.journey && pick.journey.total));
      const byRail = best(railOptions.map(option => option.total));
      if (isFinite(byRail) && (!isFinite(byBus) || byRail + RAIL_WINS_BY_MIN < byBus)) {
        activeMode = 'mtr';
        paintBottomBar();
        // showRailResults does not touch the strip, and showMode('bus') has
        // just filled it. Clear it here or the rail answer opens under a
        // list of buses that has nothing to do with the question.
        document.getElementById('livestrip').innerHTML = '';
        showRailResults();
      }
    });
  });
}

function renderSpotResults() {
  const box = document.getElementById('spotresults');
  if (!box) return;
  if (!spotQuery.trim()) { box.innerHTML = ''; return; }
  if (!spots) {
    box.innerHTML = '<div class="spotwait" style="padding:10px 12px">' + T('spotLoading') + '</div>';
    return;
  }
  const hits = spotHits(spotQuery);
  const typed = spotQuery.trim();
  // Gazetteer answers count only while they still belong to what is typed.
  const places = spotPlacesFor === typed ? spotPlaces : [];

  let html = '';
  if (hits.length) {
    html += '<div class="spothead-sm">' + T('spotVisitHead') + '</div>';
    html += hits.map(s =>
      '<button class="spothit" data-spot="' + s.i + '">' +
        '<b>' + spotIconOf(s) + ' ' + esc(spotName(s)) + '</b>' +
        '<small>' + esc([spotKind(s), spotSub(s)].filter(Boolean).join(' · ')) + '</small>' +
      '</button>').join('');
  }
  const stopHits = spotStopHits(spotQuery);
  if (stopHits.length) {
    html += '<div class="spothead-sm">' + T('spotStopsHead') + '</div>';
    html += stopHits.map(hit =>
      '<button class="spothit" data-goto="' + hit.lat + ',' + hit.lng + '"' +
        ' data-label="' + esc(hit.name) + '">' +
        '<b>' + (hit.station ? '\u{1F687}' : '\u{1F68C}') + ' ' + esc(hit.name) + '</b>' +
        '<small>' + esc([hit.n > 1 ? T('spotNearbyStops').replace('{n}', hit.n) : '',
                         T('spotRouteFromYou')].filter(Boolean).join(' · ')) + '</small>' +
      '</button>').join('');
  }
  if (places.length) {
    html += '<div class="spothead-sm">' + T('spotPlacesHead') + '</div>';
    // A gazetteer hit is not a place we can describe, so it goes straight to
    // the thing the rider wanted it for: the way there.
    html += places.map(place =>
      '<button class="spothit" data-goto="' + place.lat + ',' + place.lng + '"' +
        ' data-label="' + esc(place.name) + '">' +
        '<b>\u{1F9ED} ' + esc(place.name) + '</b>' +
        '<small>' + esc([place.sub, T('spotRouteFromYou')].filter(Boolean).join(' · ')) + '</small>' +
      '</button>').join('');
  }
  box.innerHTML = html ||
    '<div class="spotwait" style="padding:10px 12px">' + T('spotNoHits') + '</div>';
}

function spotById(i) { return (spots || []).find(s => s.i === Number(i)) || null; }

// Fly to a place and open it. Zoom 17, so that when the sheet is closed the
// stops around it are already on screen and the walk is obvious.
function goToSpot(s) {
  if (!s) return;
  map.setView([s.y, s.x], Math.max(map.getZoom(), 17));
  openSpotSheet(s);
}

// --------------------------------------------------------- the place sheet
let spotSheetFor = null;

function openSpotSheet(s) {
  if (!s) return;
  spotSheetFor = s;
  const card = document.getElementById('spotcard');
  if (!card) return;
  card.innerHTML = '<div class="sheetgrip" aria-hidden="true"></div>' + spotCardHtml(s);
  const sheet = document.getElementById('spotsheet');
  sheet.classList.add('open');
  card.style.transform = '';
  loadSpotTransport(s);
}

// SWIPE THE CARD DOWN TO PUT IT AWAY.
// Tapping a pin covers the map with the answer, and the way to get back was
// a ✕ or a tap on the dimmed strip above it. On a phone the natural thing is
// to push the card off the bottom, so that works too: the card follows the
// finger, and past a third of its height — or on a quick flick — it goes.
// Anything shorter springs back, so a half-swipe never loses the place.
(function enableSheetSwipe() {
  const sheet = document.getElementById('spotsheet');
  const card = document.getElementById('spotcard');
  if (!sheet || !card) return;
  let startY = 0, startAt = 0, dragging = false, moved = 0;

  card.addEventListener('touchstart', event => {
    if (event.touches.length !== 1) return;
    // Only from the top of the card, and only when its own list is scrolled
    // to the top — otherwise this would fight reading the bus times inside.
    if (card.scrollTop > 0) return;
    startY = event.touches[0].clientY;
    startAt = Date.now();
    dragging = true; moved = 0;
    card.style.transition = 'none';
  }, { passive: true });

  card.addEventListener('touchmove', event => {
    if (!dragging || event.touches.length !== 1) return;
    moved = event.touches[0].clientY - startY;
    if (moved <= 0) { card.style.transform = ''; return; }   // upward: leave it alone
    if (event.cancelable) event.preventDefault();
    card.style.transform = 'translateY(' + moved + 'px)';
  }, { passive: false });

  const settle = () => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform .18s ease-out';
    const quickFlick = moved > 60 && (Date.now() - startAt) < 300;
    if (moved > card.offsetHeight / 3 || quickFlick) {
      card.style.transform = 'translateY(110%)';
      setTimeout(() => { closeSpotSheet(); card.style.transition = ''; card.style.transform = ''; }, 170);
    } else {
      card.style.transform = '';
    }
  };
  card.addEventListener('touchend', settle, { passive: true });
  card.addEventListener('touchcancel', settle, { passive: true });
})();

function closeSpotSheet() {
  spotSheetFor = null;
  const sheet = document.getElementById('spotsheet');
  if (sheet) sheet.classList.remove('open');
}

function spotCardHtml(s) {
  const sub = spotSub(s), address = spotAddress(s), hours = spotHours(s);
  const site = spotSite(s), trail = spotTrail(s);
  const desc = lang === 'zh' ? (s.dt || '') : (s.d || s.dt || '');

  let meta = '';
  if (trail)   meta += '<div><span class="k">' + T('spotTrail') + ':</span> ' + esc(trail) + '</div>';
  if (address) meta += '<div><span class="k">' + T('spotAddress') + ':</span> ' + esc(address) + '</div>';
  if (hours)   meta += '<div><span class="k">' + T('spotHours') + ':</span> ' + esc(hours) + '</div>';
  // A guesthouse is worth ringing before you walk to it, so the licence
  // register's telephone number is a tappable link rather than text.
  if (s.p) meta += '<div><span class="k">' + T('spotPhone') + ':</span> ' +
                   '<a href="tel:' + esc(String(s.p).replace(/[^0-9+]/g, '')) + '">' + esc(s.p) + '</a></div>';
  // How far it is from the rider, once the rider has said where that is.
  if (herePoint) {
    const away = metresBetween(herePoint.lat, herePoint.lng, s.y, s.x);
    meta += '<div><span class="k">' + T('spotFromYou').replace('{d}', metresShort(away)) + '</span></div>';
  }
  if (site) meta += '<div><a href="' + esc(site) + '" target="_blank" rel="noopener">' +
                    T('spotSite') + ' ↗</a></div>';

  // The way there, beside the name rather than under the stop list — and
  // drawn now, not when the stops finish loading, because it is the answer
  // most riders opened this card for. The short label is all that fits at
  // this size; the full sentence is still what a screen reader says.
  const takeMe =
    '<button class="sh-go" data-act="spot-route" data-y="' + s.y + '" data-x="' + s.x +
      '" data-label="' + esc(spotName(s)) + '" aria-label="' + esc(T('spotRouteFromYou')) + '">' +
      '<span class="sh-go-i" aria-hidden="true">\u{1F9ED}</span>' +
      '<span>' + esc(T('spotTakeShort')) + '</span>' +
    '</button>';

  return '<div class="spothead">' +
           '<span class="sh-icon">' + spotIconOf(s) + '</span>' +
           '<span class="sh-name"><b>' + esc(spotName(s)) + '</b>' +
             (sub ? '<small>' + esc(sub) + '</small>' : '') +
             '<span class="spotkind">' + esc(spotKind(s)) + '</span>' +
           '</span>' + takeMe +
         '</div>' +
         (meta ? '<div class="spotmeta">' + meta + '</div>' : '') +
         (desc ? '<div class="spotdesc">' + esc(desc) + '</div>' : '') +
         '<div class="spotgohead">' + T('spotGetting') + '</div>' +
         '<div id="spotgo"><div class="spotwait">' + T('spotFinding') + '</div></div>' +
         '<button class="spotshut" data-act="spot-close">' + T('spotClose') + '</button>';
}

// ---------------------------------------------- how you actually get there
// The whole point of the layer. Everything below is the app's EXISTING
// knowledge of stops, clusters and live times, pointed at a place instead of
// at a pole. Nothing here re-implements any of it.

// EVERYTHING THE ANSWER DEPENDS ON, BEFORE THE ANSWER IS GIVEN.
// The bus tab builds only the KMB index, because that is all it needs to
// answer "which bus is coming". A place is different: The Peak, Stanley,
// Repulse Bay and Aberdeen are Citybus territory, and with only the KMB list
// loaded the app told a visitor standing at the Peak Tram terminus that there
// was no bus stop within a short walk — nearly a kilometre of Mid-Levels
// stops being the closest thing it could see.
//
// Citybus stops arrive in hk-bus-lite.json, which until now only the trip
// planner ever asked for. loadFareData fills ctbStops and hkbusRoutes;
// addOperatorsToIndexes is idempotent and folds those routes into an index
// that may already have been built KMB-only. The stop grid and the id map
// both rebuild themselves off dataStamp, which counts ctbStops.
async function ensureSpotNetwork() {
  await Promise.all([
    loadFareData().catch(error => console.warn('Citybus stops unavailable:', error)),
    loadMtr().catch(error => console.warn('Rail unavailable:', error)),
  ]);
  await buildIndexes().catch(error => console.warn('Index unavailable:', error));
  if (stopIndex) addOperatorsToIndexes();
}

// The nearest bus stops as STOPS rather than as poles. poleGroup is the same
// clustering the bus tab uses, so a five-bay interchange is offered once, by
// the name on the sign, instead of five times over.
function stopGroupsNear(lat, lng, howMany, radius) {
  const near = stopsNear(lat, lng, radius || SPOT_TRANSPORT_M).filter(n => !n.stop.isStation);
  const groups = [], claimed = new Set();
  for (const n of near) {
    if (claimed.has(n.stop.stop)) continue;
    const bays = poleGroup(n.stop);
    for (const bay of bays) claimed.add(bay.stop);
    groups.push({ stop: n.stop, bays, metres: n.metres });
    if (groups.length >= (howMany || 3)) break;
  }
  return groups;
}

// One rail button.
function railWayHtml(entry) {
  const st = railStop(entry.code);
  if (!st) return '';
  const walk = walkingEstimate(entry.metres);
  return '<button class="spotway rail" data-act="spot-rail" data-code="' + esc(entry.code) + '">' +
           '<b>🚇 ' + esc(stopName(st)) + '</b><small>' +
           T('spotWalkFrom').replace('{m}', walk.minutes).replace('{d}', walk.metres) +
           ' · ' + T('spotOpenRail') + '</small></button>';
}

// One bus-stop button. `eta` is undefined while we are still asking, null when
// the operator publishes nothing, otherwise the line of next departures.
function busWayHtml(group, eta) {
  const walk = walkingEstimate(group.metres);
  // WHICH WAY THIS ONE GOES. Ocean Park has two poles of the same name 87 m
  // apart, one facing west and one north; offered as two identical buttons
  // they are a coin toss. The direction is what tells them apart, and the
  // pole code is what is painted on the actual post at the kerb.
  const facing = groupDirHtml(group.bays.map(bay => bay.stop));
  const code = poleCodeOf(group.stop);
  let live = '';
  if (eta === undefined) live = '';
  else if (eta === null) live = '<span class="wayeta" style="color:var(--ink-3)">' + T('spotNoLive') + '</span>';
  else if (eta === '')   live = '<span class="wayeta" style="color:var(--ink-3)">' + T('spotNoDue') + '</span>';
  else live = '<span class="wayeta">' + eta + '</span>';
  return '<button class="spotway bus" data-act="spot-stop" data-id="' + esc(group.stop.stop) + '">' +
           '<b>🚌 ' + esc(stopName(group.stop)) + '</b>' + facing +
           '<small>' + T('spotWalkFrom').replace('{m}', walk.minutes).replace('{d}', walk.metres) +
           (code ? ' · ' + esc(code) : '') +
           ' · ' + T('spotOpenStop') + '</small>' + live +
         '</button>';
}

// Ask each stop for its live times, then repaint. Never blocks the buttons:
// the walk is worth knowing before the buses are.
async function fillWayEtas(groups, repaint) {
  const etaByStop = new Map();
  await Promise.all(groups.map(async group => {
    try {
      const rows = await fetchPoleRows(group.stop);
      // null from fetchPoleRows means "this operator publishes no live times".
      // Rows that carry no usable eta mean "nothing is due". Saying the first
      // when we mean the second tells a visitor the app is broken when in
      // fact the answer is simply that no bus is coming.
      etaByStop.set(group.stop.stop, rows === null ? null : (spotEtaLine(rows) || ''));
    } catch (error) { etaByStop.set(group.stop.stop, null); }
  }));
  repaint(etaByStop);
}

async function loadSpotTransport(s) {
  // The route index is what turns a pole id into "which buses, going where",
  // and the Citybus list is what puts half of Hong Kong Island on the map at
  // all. The map tab may never have needed either, so load them now — both
  // are cached after the first time, and the sheet paints without waiting.
  if (!spotIndexing && (!stopIndex || !ctbStops.length)) {
    spotIndexing = true;
    ensureSpotNetwork().then(() => {
      spotIndexing = false;
      if (spotSheetFor === s) loadSpotTransport(s);
    });
  }

  const box = () => (spotSheetFor === s ? document.getElementById('spotgo') : null);
  if (!box()) return;

  // A station is worth a longer walk than a bus stop: it runs every few
  // minutes and a visitor can read the line map without knowing any Chinese.
  const rails = railStationsNear(s.y, s.x, SPOT_RAIL_M);
  let groups = stopGroupsNear(s.y, s.x, 3);
  let far = false;
  if (!groups.length && !rails.length) {
    groups = stopGroupsNear(s.y, s.x, 2, SPOT_FAR_M);
    far = groups.length > 0;
  }

  if (!rails.length && !groups.length) {
    const target = box();
    if (target) target.innerHTML = '<div class="spotwait">' + T('spotNoTransport') + '</div>';
    return;
  }

  const paint = etaByStop => {
    const target = box();
    if (!target) return;
    let html = rails.slice(0, 2).map(railWayHtml).join('');
    if (far) html += '<div class="spotwait">' + T('spotFarNote') + '</div>';
    for (const group of groups) html += busWayHtml(group, etaByStop && etaByStop.get(group.stop.stop));
    // The journey button is not here any more — it is up beside the name,
    // where it is on screen without scrolling. What stays is the other way
    // of asking: hand the nearest stop's NAME to the bus tab as "where I
    // want to go", exactly as a rider typing it in themselves would have.
    if (groups.length) {
      // The name in the language the rider is reading: handing "OCEAN PARK" to
      // someone using the app in Chinese makes the destination box look like
      // it was filled in by somebody else. stopsNamed matches either language.
      html += '<button class="spotalt" data-act="spot-dest" data-name="' +
              esc(stopName(groups[0].stop)) + '">' + T('spotBusesHere') + '</button>';
    }
    target.innerHTML = html;
  };

  paint(null);
  await fillWayEtas(groups, paint);
}

// The next three buses off a stop, as ONE line. Not the full arrivals table:
// this is a "yes, buses really do come here" reassurance, and the stop's own
// screen — with every route, direction and remark — is one tap away.
function spotEtaLine(rows) {
  const now = Date.now(), soonest = new Map();
  for (const row of rows || []) {
    if (!row || !row.eta) continue;
    const wait = Math.round((new Date(row.eta).getTime() - now) / 60000);
    if (!isFinite(wait) || wait < 0 || wait > 90) continue;
    const route = String(row.route || '').trim();
    if (!route) continue;
    if (!soonest.has(route) || soonest.get(route) > wait) soonest.set(route, wait);
  }
  if (!soonest.size) return null;
  return [...soonest.entries()].sort((a, b) => a[1] - b[1]).slice(0, 3)
    .map(pair => '<span class="r">' + esc(pair[0]) + '</span> ' +
                 (pair[1] <= 0 ? T('due') : pair[1] + T('min')))
    .join(' · ');
}

// ------------------------------------------------------------- where am I
// "Where am I, and what leaves from near here" is the other half of a
// visitor's problem, and it is one button.
function mapLocate() {
  const button = document.getElementById('maplocate');
  if (button) button.classList.add('busy');
  withHere(point => {
    if (button) { button.classList.remove('busy'); button.classList.add('on'); }
    showHere(point);
  });
  // withHere goes quiet on failure, so the spinner is cleared on a timer too
  // rather than being left spinning at someone who is not being found.
  setTimeout(() => { if (button) button.classList.remove('busy'); }, 12000);
}

function showHere(point) {
  const accuracy = Number(point.accuracy) || 0;
  if (hereMarker) { map.removeLayer(hereMarker); hereMarker = null; }
  if (hereRing)   { map.removeLayer(hereRing);   hereRing = null; }
  hereMarker = L.marker([point.lat, point.lng], {
    icon: L.divIcon({ className:'spotpin-wrap', html:'<div class="herepin"></div>',
                      iconSize:[26, 26], iconAnchor:[13, 13] }),
    zIndexOffset: 1000, title: T('hereTitle'),
  }).addTo(map);
  // The circle is the phone's own accuracy figure, drawn honestly: a rider
  // indoors is told the app is unsure rather than shown a confident dot.
  if (accuracy > 0) {
    hereRing = L.circle([point.lat, point.lng], { radius: accuracy, color:'#1e3a8a',
      weight:1, fillColor:'#1e3a8a', fillOpacity:0.12 }).addTo(map);
  }
  map.setView([point.lat, point.lng], Math.max(map.getZoom(), 16));
  mapCentredOnce = true;
  drawSpots();
  paintMapReset();          // there is now a dot to take back off
  openHereSheet(point);
}

function openHereSheet(point) {
  spotSheetFor = null;
  const card = document.getElementById('spotcard');
  if (!card) return;
  const accuracy = Math.round(Number(point.accuracy) || 0);
  card.innerHTML =
    '<div class="spothead"><span class="sh-icon">📍</span>' +
      '<span class="sh-name"><b>' + T('hereTitle') + '</b>' +
      (accuracy ? '<small>' + T('hereAccuracy').replace('{m}', accuracy) + '</small>' : '') +
      '</span></div>' +
    '<div class="spotgohead">' + T('hereSpots') + '</div>' +
    '<div id="herego"><div class="spotwait">' + T('spotFinding') + '</div></div>' +
    '<button class="spotshut" data-act="spot-close">' + T('spotClose') + '</button>';
  document.getElementById('spotsheet').classList.add('open');
  loadHereTransport(point);
}

async function loadHereTransport(point) {
  if (!spotIndexing && (!stopIndex || !ctbStops.length)) {
    spotIndexing = true;
    ensureSpotNetwork().then(() => {
      spotIndexing = false;
      if (document.getElementById('herego')) loadHereTransport(point);
    });
  }
  const box = () => document.getElementById('herego');
  if (!box()) return;

  const rails = railStationsNear(point.lat, point.lng, SPOT_RAIL_M);
  const groups = stopGroupsNear(point.lat, point.lng, 3);
  const nearSpots = (spots || [])
    .map(s => ({ s, metres: metresBetween(point.lat, point.lng, s.y, s.x) }))
    .filter(x => x.metres <= SPOT_NEAR_ME_M)
    .sort((a, b) => a.metres - b.metres)
    .slice(0, 4);

  const paint = etaByStop => {
    const target = box();
    if (!target) return;
    // WHAT IS AROUND YOU COMES FIRST.
    // Someone who has just tapped "where am I" is asking about the place they
    // are standing in, not about a timetable. The stops follow, because the
    // second question is how to leave.
    let html = '';
    for (const x of nearSpots) {
      const walk = walkingEstimate(x.metres);
      html += '<button class="spotway" data-act="spot-open" data-spot="' + x.s.i + '">' +
                '<b>' + spotIconOf(x.s) + ' ' + esc(spotName(x.s)) + '</b><small>' +
                T('spotWalkFrom').replace('{m}', walk.minutes).replace('{d}', walk.metres) +
                ' · ' + esc(spotKind(x.s)) + '</small></button>';
    }
    html += '<div class="spotgohead">' + T('hereNearby') + '</div>';
    if (!rails.length && !groups.length) html += '<div class="spotwait">' + T('spotNoTransport') + '</div>';
    html += rails.slice(0, 2).map(railWayHtml).join('');
    for (const group of groups) html += busWayHtml(group, etaByStop && etaByStop.get(group.stop.stop));
    target.innerHTML = html;
  };

  paint(null);
  await fillWayEtas(groups, paint);
}

// ----------------------------------------------------------- the railway
// THE MTR, DRAWN ON THE MAP, ON A SWITCH.
// A visitor works out Hong Kong by its railway first — it is the one network
