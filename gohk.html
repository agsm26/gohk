  ['九龍天文台','Kowloon',22.3022,114.1741]
];

// Beyond this, a reading is not "near" anything. Better to say nothing about
// that end than to print a temperature from the other side of Hong Kong.
const WEATHER_NEAR_METRES = 9000;

// Look-up that accepts whichever name the feed used.
function hkoStationAt(place) {
  const name = String(place || '').trim();
  for (const row of HKO_STATIONS) {
    if (row[0] === name || row[1] === name) return [row[2], row[3]];
  }
  return null;
}

async function loadWeather() {
  const langParam = lang === 'zh' ? (script === 'sc' ? 'sc' : 'tc') : 'en';
  try {
    const [report, warnings] = await Promise.all([
      fetch(HKO_BASE + '?dataType=rhrread&lang=' + langParam,
            { signal: AbortSignal.timeout(10000) }).then(r => r.ok ? r.json() : null),
      fetch(HKO_BASE + '?dataType=warnsum&lang=' + langParam,
            { signal: AbortSignal.timeout(10000) }).then(r => r.ok ? r.json() : null)
        .catch(() => null)
    ]);
    if (!report) throw new Error('no report');
    weatherData = { report, warnings };
    renderWeatherBar();
  } catch (error) {
    // Quietly absent rather than an error the rider cannot act on. The bus
    // times are the job; the weather is a courtesy.
    console.warn('Weather unavailable:', error.message);
    // The bar is redrawn anyway: unreachable usually means no connection,
    // and THAT is worth saying — it explains the missing live times too.
    renderWeatherBar();
  }
}

// Nearest Observatory station to a point, with its temperature. Returns null
// when the closest reading is too far to describe that place honestly — the
// Observatory does not have a thermometer on every street.
function weatherNear(point) {
  if (!point || !weatherData) return null;
  const readings = (weatherData.report.temperature || {}).data || [];
  let best = null, bestMetres = Infinity;
  for (const reading of readings) {
    const at = hkoStationAt(reading.place);
    if (!at) continue;
    const metres = metresBetween(point.lat, point.lng, at[0], at[1]);
    if (metres < bestMetres) { bestMetres = metres; best = reading; }
  }
  return bestMetres <= WEATHER_NEAR_METRES ? best : null;
}

// The bar answers one question: what do I need to know before I set off?
// A rainstorm signal is one answer to it; having no connection is another,
// and so is a new version of the app waiting to be used. So all three share
// this one strip rather than each taking its own line of a phone screen.
function renderWeatherBar() {
  const bar = document.getElementById('weatherbar');
  if (!bar) return;
  bar.innerHTML = '';

  const parts = [];
  if (updateWaiting) parts.push(updateChip());
  if (!navigator.onLine) parts.push(offlineChip());
  if (weatherData) parts.push(...weatherParts());
  const near = tdNotices.length ? nearbyNotices() : [];
  if (near.length) parts.push(tickerChip(near));
  if (currentAlerts.length) parts.push(alertChip());
  bar.classList.toggle('hasalert', currentAlerts.length > 0 || near.length > 0);

  if (parts.length === 0) { hideWeatherBar(); return; }
  for (const part of parts) bar.appendChild(part);
  showWeatherBar();
}

// The weather half, as elements. Split out from the bar itself so that no
// connection and no weather are two different things: the Observatory being
// unreachable must not be able to hide the notice explaining why it is.
function weatherParts() {
  const parts = [];

  // ---- WARNINGS FIRST ----
  const warnings = weatherData.warnings || {};
  for (const key of Object.keys(warnings)) {
    const warning = warnings[key];
    if (!warning || !warning.name) continue;
    const code = String(warning.code || '');
    // Rainstorm black/red and typhoon 8+ are the ones that stop buses.
    const severe = /^(WRAINB|WRAINR|TC8|TC9|TC10)/.test(code) || /BLACK|RED/i.test(code);
    const amber  = /^(WRAINA|TC3)/.test(code) || /AMBER/i.test(code);
    // `type` carries the specific signal — "一號戒備信號", "紅色暴雨警告信號" —
    // while `name` is only the family it belongs to. Signal 1 and Signal 8
    // are both "熱帶氣旋警告信號"; only one of them stops the buses, so the
    // specific one is what goes on the bar.
    const tag = document.createElement('span');
    tag.className = 'wxwarn' + (severe ? '' : amber ? ' amber' : ' notice');
    tag.textContent = '⚠ ' + (warning.type || warning.name);
    parts.push(tag);
  }

  const item = (label, text) => {
    const span = document.createElement('span');
    span.className = 'wxitem';
    const l = document.createElement('span');
    l.className = 'wxlabel'; l.textContent = label;
    const v = document.createElement('span');
    v.className = 'wxtemp'; v.textContent = text;
    span.appendChild(l); span.appendChild(v);
    return span;
  };

  // ---- WHERE THE RIDER IS ----
  const here = herePoint ? weatherNear(herePoint) : null;
  const icon = (weatherData.report.icon || [])[0];
  if (here) {
    parts.push(item(weatherIcon(icon) + ' ' + plainStopName(here.place),
                    here.value + '°'));
  } else {
    // No location yet: the Observatory headquarters reading stands for
    // "Hong Kong", which is what a general forecast means anyway.
    const readings = (weatherData.report.temperature || {}).data || [];
    const general = readings.find(d => d.place === '香港天文台'
                                    || d.place === 'Hong Kong Observatory')
                 || readings[0];
    if (general) parts.push(item(weatherIcon(icon) + ' ' + T('wxHere'), general.value + '°'));
  }

  // ---- EACH END OF THE TRIP ----
  const atStart = weatherNear(startPoint);
  const atEnd   = weatherNear(endPoint);
  if (atStart) parts.push(item('🟢 ' + plainStopName(atStart.place), atStart.value + '°'));
  if (atEnd)   parts.push(item('🔴 ' + plainStopName(atEnd.place),   atEnd.value + '°'));

  return parts;
}

// A rough face for the Observatory's icon number. Only the broad groups
// matter here — the exact icon is on their own site.
function weatherIcon(code) {
  const n = Number(code);
  if (!isFinite(n)) return '🌡';
  if (n >= 60 && n <= 65) return '🌧';
  if (n >= 70 && n <= 78) return '🌙';
  if (n === 80 || n === 83 || n === 84) return '🌫';
  if (n >= 90) return '🌡';
  if (n <= 51) return '☀️';
  return '⛅';
}

// The bar is fixed, so everything below has to be told how tall it is.
// Measured, never assumed: it grows with the number of warnings.
function showWeatherBar() {
  const bar = document.getElementById('weatherbar');
  bar.style.display = 'flex';
  document.documentElement.style.setProperty('--wxh', bar.offsetHeight + 'px');
}

function hideWeatherBar() {
  const bar = document.getElementById('weatherbar');
  bar.style.display = 'none';
  document.documentElement.style.setProperty('--wxh', '0px');
}

// ============================================================
// THE STOP LIST
// ============================================================
// The map answers "where"; a rider on the bus is asking "how many more?".
// This is that answer: every stop in order, numbered, with the live times
// and a star on each one.
//
// Times are fetched as rows come into view, never all at once. A long route
// is fifty stops, and fifty simultaneous requests to a government API is
// both slow for the user and rude to the service.
function clearRouteStops() {
  if (routeStopsState && routeStopsState.observer) routeStopsState.observer.disconnect();
  if (routeStopsState && routeStopsState.watchId != null && navigator.geolocation)
    navigator.geolocation.clearWatch(routeStopsState.watchId);
  routeStopsState = null;
  const box = document.getElementById('routestops');
  if (box) box.innerHTML = '';
}

// The timetable row for the route on screen. serviceInfo is keyed
// ROUTE|BOUND|TYPE|CO. Citybus files its 70 circular routes under a
// two-letter bound ("962|IO|1|ctb") that a single-letter direction can never
// match, so those are tried too.
function serviceInfoFor(context) {
  if (!context) return null;
  const route = String(context.routeNo || '').toUpperCase();
  let co = String(context.co || 'kmb').toLowerCase();
  if (co === 'lwb') co = 'kmb';
  const type = String(context.serviceType || '1');
  const dir = context.dir;
  const tries = [route + '|' + dir + '|' + type + '|' + co,
                 route + '|' + dir + '|1|' + co,
                 route + '|IO|' + type + '|' + co, route + '|OI|' + type + '|' + co,
                 route + '|IO|1|' + co,            route + '|OI|1|' + co];
  for (const key of tries) {
    const hit = serviceInfo.get(key);
    if (hit && hit.freq) return hit;
  }
  return null;
}

// A summary as words. A single scheduled departure is ONE time, not a range:
// 82B's four morning runs read "07:15、07:25、07:40、08:05", never
// "07:15–07:15".
function svcSpan(sum) {
  if (sum.allDay) return T('svcAllDay');
  return sum.arcs.map(a => a.len === 1 ? svcClock(a.from)
                                       : svcClock(a.from) + '–' + svcClock(a.from + a.len - 1))
                 .join('、');
}
function svcHeadway(sum) {
  if (sum.hwMin) return ' · ' + (sum.hwMin === sum.hwMax
    ? T('svcEvery').replace('{a}', sum.hwMin)
    : T('svcEveryRange').replace('{a}', sum.hwMin).replace('{b}', sum.hwMax));
  // Every window was a single departure, so the count IS the timetable.
  if (sum.singles.length > 1) return ' · ' + T('svcDepartures').replace('{n}', sum.singles.length);
  return '';
}

// WHAT THIS ROUTE COSTS AND WHEN IT RUNS.
// Both come off the phone — the fare table and the timetable are in the two
// JSON files beside this page — so this block is drawn before a single
// arrival time has been fetched, and it is still there with no signal.
//
// The fare shown is the fare for boarding at the FIRST stop, which is the
// number printed on the bus. It is not labelled "up to": on route 23 the
// fare goes UP mid-route, so "up to" would be a lie. Every rider's own fare
// sits on their own row further down, and both come from stopFare(), so the
// two can never disagree.
function routeInfoBlock(context) {
  const box = document.createElement('div');
  box.className = 'rsinfo';
  const lines = [];

  const fare = stopFare(context.routeNo, context.dir, context.serviceType, 1, context.co);
  if (fare !== null) lines.push('<span class="rsi">💰 ' + T('fullFare') + ' ' + fareText(fare) + '</span>');

  const info = serviceInfoFor(context);
  const today = info ? patternsForToday(info.freq) : { masks: [], state: 'noData' };
  const summary = today.masks.length ? svcSummary(info.freq, today.masks) : null;

  if (today.state === 'closed' || today.state === 'closedPh') {
    lines.push('<span class="rsi warn">🕘 ' +
               T(today.state === 'closedPh' ? 'svcClosedPh' : 'svcClosedToday') + '</span>');
  } else if (summary) {
    let line = '🕘 ' + T(today.state === 'phUnknown' ? 'svcUsual' : 'svcToday') + ' ' +
               svcSpan(summary) + svcHeadway(summary);
    lines.push('<span class="rsi">' + esc(line) + '</span>');
    if (summary.night) lines.push('<span class="rsi">🌙 ' + T('svcNight') + '</span>');
  }

  if (!lines.length) return null;
  box.innerHTML = lines.join('');

  // Every other day pattern, folded away. A rider who wants Sunday hours on a
  // Tuesday can ask for them; nobody has to scroll past them who does not.
  const all = info ? Object.keys(info.freq || {}).map(Number).filter(n => isFinite(n) && n > 0) : [];
  if (all.length) {
    const more = document.createElement('button');
    more.className = 'rsmore';
    more.textContent = T('svcMore');
    const detail = document.createElement('div');
    detail.className = 'rsdetail';
    detail.style.display = 'none';
    // Masks that read the same have to be shown together. Route 82B files an
    // extra 07:25 departure under mask 31 on top of mask 287's timetable, and
    // both say "星期一至五" — two rows under one heading is a puzzle, not a
    // timetable, so their windows are pooled into a single line.
    const byLabel = new Map();
    for (const mask of all.sort((a, b) => a - b)) {
      const label = maskLabel(mask);
      (byLabel.get(label) || byLabel.set(label, []).get(label)).push(mask);
    }
    detail.innerHTML = [...byLabel].map(([label, masks]) => {
      const sum = svcSummary(info.freq, masks);
      if (!sum) return '';
      return '<div class="rsdrow"><b>' + esc(label) + '</b> ' +
             esc(svcSpan(sum) + svcHeadway(sum)) + '</div>';
    }).join('');
    more.addEventListener('click', () => {
      const open = detail.style.display !== 'none';
      detail.style.display = open ? 'none' : 'block';
      more.textContent = T(open ? 'svcMore' : 'svcLess');
    });
    box.appendChild(more);
    box.appendChild(detail);
  }
  return box;
}

function renderRouteStops(context, stops) {
  clearRouteStops();
  const box = document.getElementById('routestops');
  if (!box || !stops.length) return;

  setTimeout(refreshAlerts, 0);           // the route on screen is now watched
  routeStopsState = { context, stops, boardAt: null, alightAt: null, autoBoard: false,
                      watchId: null, observer: null, inFlight: 0, queue: [] };

  const head = document.createElement('div');
  head.className = 'rshead';
  const title = document.createElement('div');
  title.className = 'rstitle';
  title.textContent = context.routeNo + '  ' + context.from + ' → ' + context.to;
  const sub = document.createElement('small');
  sub.textContent = T('stopsOnRoute').replace('{n}', stops.length);
  title.appendChild(sub);
  const close = document.createElement('button');
  close.className = 'rsclose';
  close.textContent = '✕';
  close.title = T('rsClose');
  close.setAttribute('aria-label', T('rsClose'));
  close.addEventListener('click', clearRouteStops);
  // Times are fetched once. A rider waiting at the stop for five minutes is
  // looking at a number that is five minutes old, so they can ask again —
  // by hand, which keeps the app's no-timers rule.
  const refresh = document.createElement('button');
  refresh.className = 'refreshbtn';
  refresh.textContent = T('refresh');
  refresh.addEventListener('click', () => {
    if (!routeStopsState) return;
    const keep = { context: routeStopsState.context, stops: routeStopsState.stops,
                   boardAt: routeStopsState.boardAt, alightAt: routeStopsState.alightAt,
                   autoBoard: routeStopsState.autoBoard };
    const panel = document.getElementById('panel');
    const scrollWas = panel ? panel.scrollTop : 0;
    renderRouteStops(keep.context, keep.stops);
    if (routeStopsState) { Object.assign(routeStopsState, { boardAt: keep.boardAt, alightAt: keep.alightAt, autoBoard: keep.autoBoard }); paintStopCounts(); syncRideWatch(); }
    if (panel) panel.scrollTop = scrollWas;
    status.textContent = T('refreshing');
  });
  // Title and ✕ on the first line, 更新班次 beneath. Finding your stop lives
  // on the search bar now, beside the route number, where every other 📍 in
  // this app already is.
  const acts = document.createElement('div');
  acts.className = 'rsacts';
  acts.appendChild(refresh);
  head.appendChild(title); head.appendChild(close); head.appendChild(acts);
  box.appendChild(head);

  const hint = document.createElement('div');
  hint.className = 'rshint';
  hint.textContent = T('rsHint');
  box.appendChild(hint);

  const info = routeInfoBlock(context);
  if (info) box.appendChild(info);

  // The ride banner: filled in once both marks are set, hidden otherwise.
  const ride = document.createElement('div');
  ride.id = 'rsride'; ride.className = 'rsride'; ride.style.display = 'none';
  box.appendChild(ride);

  stops.forEach((stop, index) => {
    const row = document.createElement('div');
    row.className = 'rsrow';
    row.dataset.index = index;

    const num = document.createElement('div');
    num.className = 'rsnum';
    num.textContent = index + 1;

    const pick = document.createElement('button');
    pick.className = 'rspick';
    const name = document.createElement('div');
    name.className = 'rsname';
    name.textContent = plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en)
                                                   : stop.name_en);
    const note = document.createElement('div');       // count or boarding tag
    const eta  = document.createElement('div');
    eta.className = 'rseta quiet';
    eta.textContent = T('rsCheckingEta');
    pick.appendChild(name); pick.appendChild(note); pick.appendChild(eta);

    // First tap: where you get on. A later stop: where you get off. Tapping a
    // mark again clears it; tapping an earlier stop moves the boarding mark.
    pick.addEventListener('click', () => {
      const st = routeStopsState;
      st.autoBoard = false;
      if (st.boardAt === null || index < st.boardAt) {
        st.boardAt = index;
        if (st.alightAt !== null && st.alightAt <= index) st.alightAt = null;
      } else if (index === st.boardAt) {
        st.boardAt = null; st.alightAt = null;
      } else if (index === st.alightAt) {
        st.alightAt = null;
      } else {
        st.alightAt = index;
      }
      paintStopCounts();
      syncRideWatch();
      paintWalkLink();
      const lat = Number(stop.lat), lng = Number(stop.long);
      if (isFinite(lat) && isFinite(lng)) map.setView([lat, lng], 17);
    });

    const star = document.createElement('button');
    star.className = 'rsstar';
    star.textContent = '☆';
    star.setAttribute('aria-label', T('rsStarLabel'));
    // ONE STAR, BOTH LISTS.
    // This used to save only a DEPARTURE — this bus, this way, from this stop
    // — while its own label and the hint above both said 收藏車站, "save the
    // station". So a rider starred a station here and then could not find it
    // under 你收藏的起點車站, because it had never been put there. It now saves
    // the stop as well, which is what the words on the button have always
    // promised.
    //
    // Unstarring drops the departure only. The saved stop stays: it may well
    // have been saved deliberately from somewhere else, and quietly deleting
    // one of a rider's eight starting points to undo a different action is
    // not a trade worth making. It is one tap to remove in 收藏.
    star.addEventListener('click', () => {
      const added = toggleDeparture({
        route: context.routeNo, dir: context.dir, serviceType: context.serviceType,
        co: context.co, stop: stop.stop,
        stopName_en: stop.name_en, stopName_tc: stop.name_tc,
        dest_en: context.destEn, dest_tc: context.destTc
      });
      star.textContent = added ? '★' : '☆';
      star.classList.toggle('on', added);

      const here = plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en);
      if (!added) {
        status.textContent = T('departureRemoved').replace('{r}', context.routeNo);
        return;
      }
      if (isSavedStop(stop.stop)) {
        status.textContent = T('rsStarSavedBus').replace('{r}', context.routeNo).replace('{s}', here);
      } else if (toggleStopFav({ stop: stop.stop, name_en: stop.name_en, name_tc: stop.name_tc,
                                 lat: stop.lat, long: stop.long }) === null) {
        // The starting-stop list is full. The bus is saved either way; say so
        // rather than letting the station silently not appear again.
        status.textContent = T('rsStarStopFull').replace('{r}', context.routeNo);
      } else {
        status.textContent = T('rsStarSavedBoth').replace('{r}', context.routeNo).replace('{s}', here);
      }
      paintBottomBar();
    });
    if (isSavedDeparture(context.routeNo, context.dir, stop.stop)) {
      star.textContent = '★';
      star.classList.add('on');
    }

    row.appendChild(num); row.appendChild(pick); row.appendChild(star);
    row.etaCell = eta;
    row.noteCell = note;
    box.appendChild(row);
  });

  // Standing within a short walk of a stop on this route, you are almost
  // certainly getting on there. Mark it, and say why it was marked.
  if (routeStopsState.boardAt === null && herePoint) {
    const near = nearestRouteStop(herePoint);
    // Within RS_AUTO_BOARD_M you are at the stop. Further out, up to a real
    // walk, it is still "your nearest stop on this route" — marked, scrolled
    // to, and labelled with the distance so nobody thinks they are there.
    if (near && near.metres <= RS_NEAREST_MARK_M) {
      routeStopsState.boardAt = near.index;
      routeStopsState.autoBoard = true;
      routeStopsState.autoMetres = near.metres;
    }
  }

  paintStopCounts();
  paintWalkLink();
  watchForVisibleRows();

  const panel = document.getElementById('panel');
  if (!panel) return;

  if (panel.classList.contains('routemode')) {
    // In route mode the list is already the only thing under the search box,
    // and the box is sticky — scrolling would slide the list's own heading
    // underneath it. Unless a stop was marked for the rider: then that row
    // is what they need, and it may be forty stops down.
    panel.scrollTop = 0;
    if (routeStopsState.autoBoard) scrollToMarkedStop();
    // The blue banner says route, from, to and stop count; so does the header
    // three lines above. On a phone the duplicate costs a third of the screen,
    // and the list is what the rider came for.
    document.getElementById('routebanner').style.display = 'none';
  } else {
    // Built below the whole entry form, so without this it appears off the
    // bottom of the sheet and looks as though nothing happened.
    panel.scrollTop = Math.max(0, box.offsetTop - panel.offsetTop - 8);
  }
}

// How far each stop is from the one the rider marked. Only stops AFTER the
// mark get a count — a stop already behind you is not "3 away", it is gone.
function paintStopCounts() {
  if (!routeStopsState) return;
  const box = document.getElementById('routestops');
  const board = routeStopsState.boardAt, alight = routeStopsState.alightAt;

  for (const row of box.querySelectorAll('.rsrow')) {
    const index = Number(row.dataset.index);
    row.classList.toggle('board', board !== null && index === board);
    row.classList.toggle('alight', alight !== null && index === alight);
    row.classList.toggle('after', board !== null && index > board && (alight === null || index < alight));

    const note = row.noteCell;
    note.className = '';
    note.textContent = '';
    if (board === null) continue;

    if (index === board) {
      note.className = 'rsboardtag';
      const st = routeStopsState;
      note.textContent = !st.autoBoard ? T('rsBoarding')
        : (st.autoMetres > RS_AUTO_BOARD_M ? T('rsBoardNear').replace('{m}', Math.round(st.autoMetres)) : T('rsBoardAuto'));
    } else if (alight !== null && index === alight) {
      note.className = 'rsalighttag';
      note.textContent = T('rsAlight');
    } else if (alight !== null && index > alight) {
      note.className = 'rseta quiet';
      note.textContent = T('rsAfterAlight');
    } else if (index > board) {
      const away = index - board;
      note.className = 'rscount';
      note.textContent = away === 1 ? T('rsOneStopAway')
                                    : T('rsStopsAway').replace('{n}', away);
    }
    // Nothing at all for the stops BEFORE the boarding mark. 「在上車站之前」
    // said only what the row was not, on every row above the one that
    // mattered, and it pushed the name and the times apart for no gain.
  }
  paintRideBanner();
}

const RS_AUTO_BOARD_M = 250;    // "standing at the stop", give or take a road
const RS_NEAREST_MARK_M = 1500; // beyond this the nearest stop is not "yours"
const RS_RIDE_NEAR_M  = 600;    // a moving bus is "at" the nearest stop

function rsStopName(index) {
  const stop = routeStopsState && routeStopsState.stops[index];
  if (!stop) return '';
  return plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en);
}

// The stop on this route closest to a point.
// Bring the marked stop into view. On a 31-stop route it can be a long way
// down, and a mark the rider cannot see is a mark that did not happen.
function scrollToMarkedStop() {
  if (!routeStopsState || routeStopsState.boardAt === null) return;
  const panel = document.getElementById('panel');
  const box = document.getElementById('routestops');
  if (!panel || !box) return;
  const row = box.querySelector('.rsrow[data-index="' + routeStopsState.boardAt + '"]');
  if (!row) return;
  const field = document.getElementById('routefield');
  const offset = panel.classList.contains('routemode') && field ? field.offsetHeight : 0;
  panel.scrollTop = Math.max(0, row.offsetTop - offset - 12);
}

function nearestRouteStop(point) {
  if (!routeStopsState || !point) return null;
  let best = null;
  routeStopsState.stops.forEach((stop, index) => {
    const lat = Number(stop.lat), lng = Number(stop.long);
    if (!isFinite(lat) || !isFinite(lng)) return;
    const metres = metresBetween(point.lat, point.lng, lat, lng);
    if (!best || metres < best.metres) best = { index, metres };
  });
  return best;
}

// "How many more?" — answered from where the phone is, not from a guess.
function paintRideBanner() {
  const st = routeStopsState;
  const el = document.getElementById('rsride');
  if (!st || !el) return;
  if (st.boardAt === null || st.alightAt === null) { el.style.display = 'none'; el.innerHTML = ''; return; }

  const total = st.alightAt - st.boardAt;
  let html = '<div class="rsridehead">🚌 ' + esc(rsStopName(st.boardAt)) + ' → ▼ ' + esc(rsStopName(st.alightAt)) +
             ' · ' + (total === 1 ? T('rsOneStop') : T('rsStops').replace('{n}', total)) + '</div>';
  if (!herePoint) {
    html += '<div class="rsridesub">' + T('rsNeedLocation') + '</div>';
  } else {
    const near = nearestRouteStop(herePoint);
    if (!near || near.metres > RS_RIDE_NEAR_M) {
      html += '<div class="rsridesub">' + T('rsNotOnRoute') + '</div>';
    } else {
      const remaining = st.alightAt - near.index;
      if (remaining <= 0)      html += '<div class="rsridebig arrived">' + T('rsArrived') + '</div>';
      else if (remaining === 1) html += '<div class="rsridebig soon">' + T('rsNextStop') + '</div>';
      else                      html += '<div class="rsridebig">' + T('rsRemaining').replace('{n}', remaining) + '</div>';
      html += '<div class="rsridesub">' + T('rsNearNow').replace('{s}', esc(rsStopName(near.index))) + '</div>';
    }
  }
  el.innerHTML = html;
  el.style.display = 'block';
}

// Watch the phone's position only while a ride is marked and the list is
// open. It is the phone talking to its own GPS — no network, no timer of
// ours — and it is cleared the moment the list closes.
function syncRideWatch() {
  const st = routeStopsState;
  const wanted = !!(st && st.boardAt !== null && st.alightAt !== null && navigator.geolocation);
  if (wanted && st.watchId == null) {
    st.watchId = navigator.geolocation.watchPosition(
      position => {
        herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
        paintRideBanner();
      },
      () => {},
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
  } else if (!wanted && st && st.watchId != null) {
    navigator.geolocation.clearWatch(st.watchId);
    st.watchId = null;
  }
}

// Fetch times only for the rows actually on screen, four at a time.
function watchForVisibleRows() {
  const box = document.getElementById('routestops');
  if (!box || !routeStopsState) return;

  const pump = () => {
    while (routeStopsState && routeStopsState.inFlight < 4 && routeStopsState.queue.length) {
      const row = routeStopsState.queue.shift();
      routeStopsState.inFlight++;
      loadStopEta(row).finally(() => {
        if (!routeStopsState) return;
        routeStopsState.inFlight--;
        pump();
      });
    }
  };

  const rows = [...box.querySelectorAll('.rsrow')];

  // No IntersectionObserver (older browser): just load them in order rather
  // than showing "checking…" for ever.
  if (typeof IntersectionObserver === 'undefined') {
    routeStopsState.queue = rows;
    pump();
    return;
  }

  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      observer.unobserve(entry.target);        // each stop is asked for once
      routeStopsState.queue.push(entry.target);
    }
    pump();
  }, { root: document.getElementById('panel'), rootMargin: '200px' });

  for (const row of rows) observer.observe(row);
  routeStopsState.observer = observer;

  // The observer is an optimisation, not the mechanism. It does not fire at
  // all while the tab is in the background, and a rider who opens a route and
  // switches away for ten seconds would come back to a list still saying
  // "checking…". The first stops are wanted in every case, so they are asked
  // for outright and the observer is left to cover the rest.
  for (const row of rows.slice(0, 6)) {
    observer.unobserve(row);
    routeStopsState.queue.push(row);
  }
  pump();
}

async function loadStopEta(row) {
  if (!routeStopsState) return;
  const { context, stops } = routeStopsState;
  const stop = stops[Number(row.dataset.index)];
  const cell = row.etaCell;
  if (!stop || !cell) return;

  try {
    let minutes = [];
    if (context.co === 'CTB') {
      const response = await fetch(CTB_BASE + '/eta/CTB/' + stop.stop + '/' +
        encodeURIComponent(context.routeNo), { signal: AbortSignal.timeout(10000) });
      if (!response.ok) throw new Error(response.status);
      minutes = etaMinutes((await response.json()).data, context.dir, null);
    } else {
      const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' +
        stop.stop, { signal: AbortSignal.timeout(10000) });
      if (!response.ok) throw new Error(response.status);
      const rows = ((await response.json()).data || [])
        .filter(r => String(r.route).toUpperCase() === String(context.routeNo).toUpperCase());
      minutes = etaMinutes(rows, context.dir, context.serviceType);
    }

    if (!routeStopsState) return;                 // list closed while waiting
    if (minutes.length === 0) {
      cell.className = 'rseta quiet';
      cell.textContent = T('rsNoEta');
      return;
    }
    cell.className = 'rseta';
    cell.textContent = minutes.slice(0, 3)
      .map(m => (m <= 0 ? T('due') : m + T('min'))).join(' · ');
  } catch (error) {
    if (!routeStopsState) return;
    cell.className = 'rseta quiet';
    cell.textContent = T('rsEtaFailed');
  }
}

// Minutes from now, for this direction only, soonest first.
function etaMinutes(rows, dir, serviceType) {
  const now = Date.now();
  return (rows || [])
    .filter(r => r.eta)
    .filter(r => !dir || !r.dir || r.dir === dir)
    .filter(r => !serviceType || String(r.service_type) === String(serviceType))
    .map(r => Math.round((new Date(r.eta).getTime() - now) / 60000))
    .filter(m => m >= 0)
    .sort((a, b) => a - b);
}

function paintRoute(routeNo, company, from, to, stops, fill, edge, ctbRouteNo, context) {
  // Same rule as choosing a journey: once a route is on screen, the general
  // bus stop dots are clutter. They come back when the route is closed.
  journeyMode = true;
  stopLayer.clearLayers();

  const points = [];
  for (const stop of stops) {
    const lat = Number(stop.lat), lng = Number(stop.long);
    if (!isFinite(lat) || !isFinite(lng)) continue;
    points.push([lat, lng]);

    const marker = L.circleMarker([lat, lng], { radius:9, color:edge, weight:3,
      fillColor:fill, fillOpacity:0.9 }).addTo(routeLayer);
    marker.bindPopup(stopHeader(stop) + '<div class="eta-note">' + T('loadingArrivals') + '</div>');
    marker.on('popupopen', () => ctbRouteNo
      ? loadCtbArrivals(stop, marker, ctbRouteNo)
      : loadKmbArrivals(stop, marker));
  }
  if (points.length === 0) { status.textContent = T('noStopLocations'); return; }

  L.polyline(points, { color:fill, weight:4, opacity:0.6, dashArray:'6 6' }).addTo(routeLayer);
  markEnds(points, from, to);
  map.fitBounds(L.latLngBounds(points), mapPadding());

  document.getElementById('rb-route').textContent = routeNo;
  document.getElementById('rb-company').textContent = company;
  document.getElementById('rb-from').textContent = from;
  document.getElementById('rb-to').textContent = to;
  document.getElementById('rb-note').textContent =
    T('stopsOnRoute').replace('{n}', points.length);
  const banner = document.getElementById('routebanner');
  banner.classList.toggle('ctb', company === 'Citybus');
  banner.style.display = 'block';
  status.textContent = T('stopsOnRoute').replace('{n}', points.length);

  // The list in the panel, alongside the dots on the map.
  if (context) renderRouteStops(Object.assign({ routeNo, from, to }, context), stops);
}

async function loadCtbArrivals(stop, marker, routeNo) {
  try {
    const response = await fetch(CTB_BASE + '/eta/CTB/' + stop.stop + '/' + encodeURIComponent(routeNo),
                                 { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    marker.setPopupContent(stopHeader(stop) + formatArrivals((await response.json()).data));
  } catch (error) {
    marker.setPopupContent(stopHeader(stop) +
      '<div class="eta-note">' + T('couldNotLoadArrivals') + '</div>');
  }
}

function markEnds(points, fromName, toName) {
  if (points.length < 2) return;
  const make = (latlng, letter, word, finish) => L.marker(latlng, { zIndexOffset:900,
    icon: L.divIcon({ className:'', iconSize:null, iconAnchor:[22,22],
      html:'<div class="endwrap' + (finish ? ' finish' : '') + '">' +
           '<div class="enddot">' + letter + '</div>' +
           '<div class="endtext">' + word + '<br>' + fromToText(word, fromName, toName) +
           '</div></div>' }) }).addTo(routeLayer);
  make(points[0], 'A', 'START', false);
  make(points[points.length-1], 'B', 'END', true);
}
function fromToText(word, fromName, toName) { return word === 'START' ? fromName : toName; }


// ============================================================
// 10. CLEAR EVERYTHING
// ============================================================
document.getElementById('clear-all').addEventListener('click', () => {
  setResultsMode(false);
  startPoint = null; endPoint = null; arm(null);
  routeLayer.clearLayers();
  journeyMode = false;
  drawStops();
  document.getElementById('routebanner').style.display = 'none';
  document.getElementById('journeys').innerHTML = '';
  document.getElementById('compare').innerHTML = '';
  clearRouteStops();
  for (const id of ['start-text','end-text','route-text']) document.getElementById(id).value = '';
  for (const id of ['start-results','end-results','route-results']) document.getElementById(id).innerHTML = '';
  redrawJourney();
  status.textContent = T('cleared');
});

// The big ✕ on the banner means "I'm done with this trip". It clears both
// points and returns the panel to the entry form, ready for a new search.
document.getElementById('rb-close').addEventListener('click', resetTrip);

function resetTrip() {
  startPoint = null; endPoint = null; arm(null);
  currentPicks = [];

  document.getElementById('routebanner').style.display = 'none';
  document.getElementById('stopdetail').style.display = 'none';
  routeLayer.clearLayers();
  detailLayer.clearLayers();
  journeyLayer.clearLayers();

  document.getElementById('journeys').innerHTML = '';
  document.getElementById('compare').innerHTML = '';
  clearRouteStops();
  for (const id of ['start-text','end-text','route-text'])
    document.getElementById(id).value = '';
  for (const id of ['start-results','end-results','route-results'])
    document.getElementById(id).innerHTML = '';

  setResultsMode(false);
  journeyMode = false;
  drawStops();
  redrawJourney();
  status.textContent = T('cleared');
}

// ============================================================
// LAST OF ALL
// ============================================================
// The Observatory, once now and then every ten minutes. Two small requests
// that never block anything: if they fail the bar simply stays hidden.
//
// This runs at the very bottom, not with the other start-up calls, because
// its constants are declared further down the file than those calls are —
// and `const` cannot be read before the line declaring it has run. Starting
// it here is the fix; moving the whole weather section up would be the other.
// Drawn once before the first request goes out, so that opening the app with
// no signal says so straight away instead of after a ten-second timeout.
renderWeatherBar();
loadWeather();
setInterval(loadWeather, WEATHER_REFRESH_MS);
// 简体: names from the feeds are Traditional; convert them as they land.
if (typeof MutationObserver !== 'undefined') {
  new MutationObserver(muts => {
    if (script !== 'sc') return;
    for (const m of muts) {
      if (m.type === 'characterData') scConvertTree(m.target);
      else for (const n of m.addedNodes) scConvertTree(n);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
  scConvertTree(document.body);
}
// Traffic notices: on open, every five minutes, and whenever the app comes
// back to the front — the moment a rider is about to set off.
checkAlerts();
setInterval(checkAlerts, ALERT_REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkAlerts(); });
// Open on 車站. The trip planner is one tap away under 巴士.
showMode('stop');
</script>
