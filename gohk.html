  perTransferWalk:   4,    // walking BETWEEN buses is the worst walking
  perRideMinute:     1     // sitting on the bus is the cheapest minute
};

function effortScore(journey) {
  const walkMinutes = journey.walkOn.minutes + journey.walkOff.minutes;
  const transferWalkMinutes = journey.transferWalk ? journey.transferWalk.minutes : 0;
  const transfers = journey.legs.length - 1;

  return walkMinutes * EFFORT.perWalkMinute
       + transferWalkMinutes * EFFORT.perTransferWalk
       + transfers * EFFORT.perTransfer
       + journey.total * EFFORT.perRideMinute;
}

// Total time on foot — the number an older rider most wants to know.
function totalWalkMinutes(journey) {
  return journey.walkOn.minutes + journey.walkOff.minutes +
         (journey.transferWalk ? journey.transferWalk.minutes : 0);
}
// Two speeds, because one number cannot describe both. A local bus stopping
// every 300 m is slow; an express on the highway is not. We pick by distance.
const BUS_KMH_LOCAL   = 17;
const BUS_KMH_EXPRESS = 32;

// Time from the distance measured ALONG the chain of stops — road distance,
// near enough — rather than the straight line, which cut across the harbour.
function rideMinutesForPath(path) {
  const km = pathMetres(path) / 1000;
  const speed = km > 8 ? BUS_KMH_EXPRESS : BUS_KMH_LOCAL;
  return Math.max(1, Math.round(km / speed * 60));
}

function routeNumberOf(routeKey) { return routeKey.split('|')[0]; }

// Every stop the bus calls at between boarding and alighting, in order.
// Bus stops sit on roads, so joining them follows the real corridor closely —
// far better than one straight line across the map.
const stopById = new Map();
function refreshStopById() {
  stopById.clear();
  for (const stop of allStops) stopById.set(stop.stop, stop);
  for (const stop of ctbStops) stopById.set(stop.stop, stop);   // Citybus too
}

// Every stop we can plan a journey with, both companies together.
function allPlannableStops() {
  return ctbStops.length ? allStops.concat(ctbStops) : allStops;
}
// The same map, rebuilt only when the stop lists change — so a lookup after
// the KMB list lands late is still a map hit, never a scan of 7,000 stops.
let stopMapStamp = '';
function stopMapNow() {
  const stamp = dataStamp();
  if (stamp !== stopMapStamp) { refreshStopById(); stopMapStamp = stamp; }
  return stopById;
}
// Bus stops only (no rail stations), as one cached list.
let plannableMemo = null, plannableStamp = '';
function plannableStops() {
  const stamp = dataStamp();
  if (!plannableMemo || plannableStamp !== stamp) { plannableMemo = allPlannableStops().filter(s => !s.isStation); plannableStamp = stamp; }
  return plannableMemo;
}

function pathBetween(routeKey, fromSeq, toSeq) {
  const entries = (routeIndex.get(routeKey) || [])
    .filter(entry => entry.seq >= fromSeq && entry.seq <= toSeq)
    .sort((a, b) => a.seq - b.seq);

  const path = [];
  for (const entry of entries) {
    const stop = stopById.get(entry.stopId);
    if (stop) path.push(stop);
  }
  return path;
}

// Distance ALONG that chain of stops — the road distance, near enough.
function pathMetres(path) {
  let total = 0;
  for (let i = 1; i < path.length; i++)
    total += metresBetween(Number(path[i-1].lat), Number(path[i-1].long),
                           Number(path[i].lat),   Number(path[i].long));
  return total;
}

// Off by default: normally you want buses you can actually catch. But if the
// timetable data is wrong, the user needs a way to see everything.
let showNotRunning = false;

let searchRunning = false;

async function findBuses() {
  if (!startPoint || !endPoint) return;
  if (searchRunning) return;                 // ignore double taps
  searchRunning = true;

  const box = document.getElementById('journeys');
  box.innerHTML = '<div class="jcard">' + T('working') + '</div>';
  journeyMode = false;
  drawStops();

  try {
    // The HK Bus Crawling file carries Citybus stops and route orders, so it
    // must arrive BEFORE we build the journey index. Road shapes are only
    // decoration, so those still load in the background.
    await Promise.all([loadFareData(), loadHolidays(), loadMtr()]);
    await buildIndexes();
    refreshStopById();

    const extras = loadTdBusFile();

    // Those downloads take time. The user may have pressed "Clear everything"
    // while we waited. Re-check rather than trusting what was true before.
    if (!startPoint || !endPoint) {
      box.innerHTML = '';
      status.textContent = T('searchCancelled');
      return;
    }
    status.textContent = T('lookingFor');

    const fromStops = stopsNear(startPoint.lat, startPoint.lng);
    const toStops   = stopsNear(endPoint.lat, endPoint.lng);

    if (fromStops.length === 0 || toStops.length === 0) {
      box.innerHTML = '<div class="jcard">' +
        T('noNearbyStops').replace('{m}', WALK_LIMIT_M) + '</div>';
      status.textContent = T('noNearby');
      return;
    }

    // Where can we board, and where can we get off?
    const boardable = new Map();
    for (const near of fromStops)
      for (const service of (stopIndex.get(near.stop.stop) || [])) {
        const existing = boardable.get(service.routeKey);
        if (!existing || near.metres < existing.metres)
          boardable.set(service.routeKey, { stop: near.stop, metres: near.metres, seq: service.seq });
      }

    const alightable = new Map();
    for (const near of toStops)
      for (const service of (stopIndex.get(near.stop.stop) || [])) {
        const existing = alightable.get(service.routeKey);
        if (!existing || near.metres < existing.metres)
          alightable.set(service.routeKey, { stop: near.stop, metres: near.metres, seq: service.seq });
      }

    const journeys = [];
    let hiddenNotRunning = 0;

    // ---- DIRECT: one bus all the way ----
    for (const [routeKey, board] of boardable) {
      const alight = alightable.get(routeKey);
      if (!alight || alight.seq <= board.seq) continue;   // wrong direction

      if (!showNotRunning && !isRunningNow(routeKey)) { hiddenNotRunning++; continue; }

      const walkOn = walkingEstimate(board.metres), walkOff = walkingEstimate(alight.metres);
      const path = pathBetween(routeKey, board.seq, alight.seq);

      journeys.push({
        legs: [{ route: routeNumberOf(routeKey), on: board.stop, off: alight.stop,
                 stops: alight.seq - board.seq, path,
                 bound: routeKey.split('|')[1], serviceType: routeKey.split('|')[2],
                 co: routeKey.split('|')[3] || 'kmb' }],
        walkOn, walkOff, transferWalk: null, fares: 1,
        total: walkOn.minutes + rideMinutesForPath(path) + walkOff.minutes
      });
    }

    // ---- ONE CHANGE: bus, then another bus ----
    for (const [keyA, board] of boardable) {
      if (!showNotRunning && !isRunningNow(keyA)) continue;

      const ahead = new Map();
      for (const entry of (routeIndex.get(keyA) || [])) {
        if (entry.seq <= board.seq) continue;
        const existing = ahead.get(entry.stopId);
        if (existing === undefined || entry.seq < existing) ahead.set(entry.stopId, entry.seq);
      }
      if (ahead.size === 0) continue;

      for (const [keyB, alight] of alightable) {
        if (routeNumberOf(keyA) === routeNumberOf(keyB)) continue;
        if (!showNotRunning && !isRunningNow(keyB)) continue;

        let best = null;
        for (const entry of (routeIndex.get(keyB) || [])) {
          if (entry.seq >= alight.seq) continue;

          let changeOff = null, changeOn = null, walkM = 0;
          if (ahead.has(entry.stopId)) {
            changeOff = changeOn = stopById.get(entry.stopId);
          } else {
            const target = stopById.get(entry.stopId);
            if (!target) continue;
            for (const aheadStopId of ahead.keys()) {
              const candidate = stopById.get(aheadStopId);
              if (!candidate) continue;
              const m = metresBetween(Number(candidate.lat), Number(candidate.long),
                                      Number(target.lat), Number(target.long));
              if (m <= TRANSFER_WALK_M) { changeOff = candidate; changeOn = target; walkM = m; break; }
            }
          }
          if (!changeOff) continue;

          const changeSeqA = ahead.get(changeOff.stop);
          const pathA = pathBetween(keyA, board.seq, changeSeqA);
          const pathB = pathBetween(keyB, entry.seq, alight.seq);
          const minutes = rideMinutesForPath(pathA) + rideMinutesForPath(pathB) + TRANSFER_PENALTY_MIN;

          if (!best || minutes < best.minutes)
            best = { minutes, changeOff, changeOn, walkM, pathA, pathB,
                     legAStops: changeSeqA - board.seq, legBStops: alight.seq - entry.seq };
        }
        if (!best) continue;

        // Both legs must be long enough to be worth the trouble.
        if (pathMetres(best.pathA) < MIN_USEFUL_LEG_M ||
            pathMetres(best.pathB) < MIN_USEFUL_LEG_M) continue;

        const walkOn = walkingEstimate(board.metres), walkOff = walkingEstimate(alight.metres);
        const transferWalk = best.walkM > 0 ? walkingEstimate(best.walkM) : null;

        journeys.push({
          legs: [
            { route: routeNumberOf(keyA), on: board.stop, off: best.changeOff,
              stops: best.legAStops, path: best.pathA,
              bound: keyA.split('|')[1], serviceType: keyA.split('|')[2],
              co: keyA.split('|')[3] || 'kmb' },
            { route: routeNumberOf(keyB), on: best.changeOn, off: alight.stop,
              stops: best.legBStops, path: best.pathB,
              bound: keyB.split('|')[1], serviceType: keyB.split('|')[2],
              co: keyB.split('|')[3] || 'kmb' }
          ],
          walkOn, walkOff, transferWalk, fares: 2,
          total: walkOn.minutes + best.minutes + walkOff.minutes +
                 (transferWalk ? transferWalk.minutes : 0)
        });
      }
    }

    // ---- BY TRAIN ----
    // Trains are worked out here but kept in their own list, never mixed into
    // the bus pool. Someone who wants the MTR wants the MTR; burying it as
    // card two of three, or hiding it because three buses scored better,
    // makes them hunt for it. The tabs let them just ask.
    railOptions = (!showNotRunning && !railRunningNow())
      ? []
      : railJourneys(startPoint.lat, startPoint.lng, endPoint.lat, endPoint.lng);

    if (journeys.length === 0 && railOptions.length === 0) {
      box.innerHTML = '<div class="jcard"><b>' + T('noJourney') + '</b><br>' +
        T('noJourneyBody') + '</div>';
      status.textContent = T('nothingFound');
      return;
    }

    // ---- PICK THE THREE ----
    // They told us where they are standing, so journeys leaving from THEIR
    // stop come first. Walking further is a choice, never the default.
    const chosenStopId = startPoint.stop ? startPoint.stop.stop : null;

    const fromYourStop = journeys
      .filter(journey => chosenStopId && journey.legs[0].on.stop === chosenStopId)
      .sort((a, b) => a.total - b.total);

    // When two journeys are within 5 minutes, prefer the one with fewer buses.
    // Saving four minutes is not worth an extra change for most people, and
    // certainly not for an older rider with luggage.
    const byTime = [...journeys].sort((a, b) => {
      if (Math.abs(a.total - b.total) <= 5) return a.legs.length - b.legs.length;
      return a.total - b.total;
    });
    // Gentlest = least total effort, not simply fewest changes.
    const byEffort = [...journeys].sort((a, b) => effortScore(a) - effortScore(b));
    const byWalking = [...journeys].sort((a, b) =>
      totalWalkMinutes(a) - totalWalkMinutes(b) || a.total - b.total);

    // Cheapest first, ignoring journeys whose fare we could not work out —
    // a "cheapest" card with an unknown price would be meaningless.
    const byFare = journeys
      .filter(journey => journeyFare(journey) !== null)
      .sort((a, b) => journeyFare(a) - journeyFare(b) || a.total - b.total);

    // WHY THIS IS NOT JUST "TAKE THE TOP OF EACH LIST"
    // If the same journey is both the gentlest AND the fastest, handing the
    // "FASTEST" label to the runner-up produces a card that says FASTEST
    // above a slower time than the card beside it. The label would be lying.
    // So a journey that wins several categories carries several titles, and
    // any remaining cards are honestly labelled as alternatives.
    const fingerprint = journey =>
      journey.legs[0].on.stop + '>' + journey.legs.map(l => l.route).join('>');

    // Journeys leaving from the stop the user actually chose, easiest first.
    const gentlestFromOwnStop = [...fromYourStop].sort((a, b) => effortScore(a) - effortScore(b));
    const boardName = startPoint.stop ? stopName(startPoint.stop) : '';

    const categories = [
      { list: gentlestFromOwnStop, title: T('easiestYourStop'),
        why: boardName ? T('boardAt') + ' ' + boardName + ' ' + T('leastEffort') : T('gentleWhy'),
        colour: '#166534' },
      { list: byEffort,  title: T('gentlest'),     why: T('gentleWhy'), colour: '#6b21a8' },
      { list: byTime,    title: T('fastest'),      why: T('fastWhy'),   colour: '#1e40af' },
      { list: byWalking, title: T('leastWalking'), why: T('walkWhy'),   colour: '#92400e' },
      { list: byFare,    title: T('cheapest'),     why: T('cheapWhy'),  colour: '#115e59' }
    ];

    // Which journey wins each category, and which titles it earns.
    const winners = new Map();     // fingerprint -> { journey, titles[], why, colour }

    for (const category of categories) {
      const best = category.list[0];
      if (!best) continue;

      const id = fingerprint(best);
      if (winners.has(id)) {
        winners.get(id).titles.push(category.title);      // same journey wins again
      } else {
        winners.set(id, { journey: best, titles: [category.title],
                          why: category.why, colour: category.colour });
      }
    }

    const picks = [...winners.values()].map(entry => ({
      journey: entry.journey,
      title: entry.titles.join(' · '),        // e.g. "GENTLEST · FASTEST"
      why: entry.why,
      colour: entry.colour
    }));

    // If that leaves fewer than three cards, offer genuinely different
    // alternatives — labelled as alternatives, not as a superlative.
    const shown = new Set([...winners.keys()]);
    for (const journey of byTime) {
      if (picks.length >= 3) break;
      const id = fingerprint(journey);
      if (shown.has(id)) continue;
      shown.add(id);
      picks.push({ journey, title: T('another'), why: T('anotherWhy'), colour: '#4b5563' });
    }

    // Always list them fastest first, so the times read in a sensible order.
    picks.sort((a, b) => a.journey.total - b.journey.total);

    // If the options differ in price, note how much each costs above the
    // cheapest — the number people actually compare.
    const prices = picks.map(pick => journeyFare(pick.journey)).filter(f => f !== null);
    if (prices.length > 1) {
      const lowest = Math.min(...prices);
      for (const pick of picks) {
        const fare = journeyFare(pick.journey);
        if (fare !== null && fare > lowest) pick.extraCost = fare - lowest;
      }
    }

    picks.forEach((pick, index) => { pick.number = index + 1; });

    busPicks = picks;
    railPicks = buildRailPicks(railOptions);

    setResultsMode(true);            // the form has done its job — hide it
    sheetToResults();
    // Open on whichever tab actually has something in it.
    if (busPicks.length) showMode('bus');
    else { activeMode = 'mtr'; paintBottomBar(); showRailResults(); }

    // Live arrival times for the FIRST bus of each option. Only three
    // requests — one per option — not one per stop on the map.
    picks.forEach(pick => loadNextBus(pick));

    // When the shapes and fares arrive, quietly refresh what is on screen.
    extras.then(() => {
      if (currentPicks !== picks) return;        // user has moved on
      buildCompareStrip(picks);
      const stillChosen = picks.find(p => p.number === chosenNumber) || picks[0];
      showCardFor(stillChosen);
      picks.forEach(pick => loadNextBus(pick));
      const chosen = picks.find(p => p.number === 1);
      if (chosen) drawOneOption(chosen);
    });

    if (fromYourStop.length === 0 && startPoint.stop) {
      box.insertAdjacentHTML('afterbegin',
        '<div style="background:#fef3c7;border:2px solid #f59e0b;border-radius:8px;' +
        'padding:12px;margin-bottom:10px;font-size:1rem;line-height:1.45">' +
        '<b>' + T('noBusFromStop').replace('{stop}', stopName(startPoint.stop)) + '</b> ' +
        T('goesToDest') + '</div>');
    }

    // Say plainly which timetable these results assume. On a holiday that is
    // the difference between catching a bus and standing at an empty stop.
    const kind = dayType();
    if (kind !== 'weekday') {
      const name = holidayName();
      box.insertAdjacentHTML('afterbegin',
        '<div style="background:#fef3c7;border:2px solid #f59e0b;border-radius:8px;' +
        'padding:11px 13px;margin-bottom:10px;font-size:1rem;font-weight:700;line-height:1.45">' +
        (kind === 'holiday'
          ? T('holidayToday').replace('{name}', name ? ' (' + name + ')' : '')
          : T('saturdayToday')) + '</div>');
    }

    if (hiddenNotRunning > 0) {
      box.insertAdjacentHTML('beforeend',
        '<div style="background:#eff6ff;border:2px solid #93c5fd;border-radius:8px;' +
        'padding:10px 12px;margin-top:10px;font-size:1rem;line-height:1.45">' +
        T('hiddenNotRunning').replace('{n}', hiddenNotRunning) + '</div>');
    }

    box.insertAdjacentHTML('beforeend',
      '<div style="font-size:0.94rem;color:#92400e;line-height:1.45;margin-top:6px">' +
      T('pleaseRead').replace('{t}', TRANSFER_PENALTY_MIN) +
      '<br><br>' + T('credits') + '</div>');

    // Offer to save these points now that the user has seen a real result.
    const addRow = document.createElement('div');
    for (const [which, point] of [['start', startPoint], ['end', endPoint]]) {
      const button = document.createElement('button');
      button.className = 'addfav';
      button.textContent = T(which === 'start' ? 'saveStart' : 'saveEnd')
                             .replace('{name}', point.label);
      button.addEventListener('click', () => addFavourite(which, point));
      addRow.appendChild(button);
    }
    box.appendChild(addRow);

    status.textContent = T('optionsFound').replace('{n}', picks.length);
  } catch (error) {
    box.innerHTML = '<div class="jcard">' + T('couldNotWork') + ' ' + error.message +
                    '<br><br>' + T('checkInternet') + '</div>';
    status.textContent = T('searchFailed');
    console.error(error);
  } finally {
    searchRunning = false;                 // never let the flag stick
  }
}

document.getElementById('notrunning-box').addEventListener('change', event => {
  showNotRunning = event.target.checked;
  if (startPoint && endPoint) findBuses();      // redo the search straight away
});

document.getElementById('findbuses').addEventListener('click', findBuses);


// PHONE: three sheet heights — peeking, normal, tall. Tapping the grip
// cycles them, so the map can always be brought back into view.
// Smallest to largest. The empty string is "no class", which in results mode
// means the full screen — that is where we want to land by default.
const SHEET_STATES = ['peek', 'tall', ''];
let sheetState = 2;

function applySheet() {
  const panel = document.getElementById('panel');
  panel.style.maxHeight = '';          // drop any height left by a drag
  panel.classList.remove('peek', 'tall');
  const state = SHEET_STATES[sheetState];
  if (state) panel.classList.add(state);
}

// DRAGGING THE SHEET
// People reach for a sheet and pull it, so dragging has to work. A short
// tap still cycles the three heights, because on a small screen a precise
// drag is hard for older hands.
(function setUpSheetDrag() {
  const grip  = document.getElementById('sheetgrip');
  const panel = document.getElementById('panel');

  let startY = 0, startHeight = 0, dragging = false, moved = 0;

  const heightNow = () => panel.getBoundingClientRect().height;

  grip.addEventListener('pointerdown', event => {
    if (!isPhone()) return;
    if (!panel.classList.contains('results')) return;   // no map behind it yet
    dragging = true;
    moved = 0;
    startY = event.clientY;
    startHeight = heightNow();

    // While dragging we set the height directly, so drop the class limits.
    panel.classList.remove('peek', 'tall');
    panel.style.transition = 'none';
    grip.setPointerCapture(event.pointerId);
  });

  grip.addEventListener('pointermove', event => {
    if (!dragging) return;

    // Dragging UP (a smaller clientY) should make the sheet TALLER.
    const delta = startY - event.clientY;
    moved = Math.max(moved, Math.abs(delta));

    const wanted = startHeight + delta;
    const smallest = 110;
    const largest  = window.innerHeight * 0.9;

    panel.style.maxHeight = Math.min(largest, Math.max(smallest, wanted)) + 'px';
  });

  function endDrag(event) {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = '';

    // A short press with almost no movement is a tap: cycle the heights.
    if (moved < 8) {
      panel.style.maxHeight = '';
      sheetState = (sheetState + 1) % SHEET_STATES.length;
      applySheet();
    }
    setTimeout(() => map.invalidateSize(), 220);
    if (event && event.pointerId !== undefined) {
      try { grip.releasePointerCapture(event.pointerId); } catch (e) {}
    }
  }

  grip.addEventListener('pointerup', endDrag);
  grip.addEventListener('pointercancel', endDrag);
})();

// After results arrive on a phone, open the sheet to the full screen so all
// three options are readable at once. The grip pulls it back down.
function sheetToResults() {
  if (!isPhone()) return;
  sheetState = 2;
  applySheet();
  document.getElementById('panel').scrollTop = 0;
}


// Switch the panel between "entering a trip" and "reading the results".
// The blue route banner floats over the bottom of the sheet. Whatever it
// covers is invisible, and the last line of a journey card was landing
// underneath. Measure it and pad the sheet by exactly that much — measuring
// beats a guessed constant, because the banner's height changes with the
// length of the stop names inside it.
// The nav bar is NOT counted here: it sits above the sheet now, and the
// sheet's own max-height already stops short of it.
function reserveRoomForBanner() {
  const panel  = document.getElementById('panel');
  const banner = document.getElementById('routebanner');
  const shown  = el => el && el.offsetParent !== null;

  const height = (shown(banner) ? banner.offsetHeight : 0) + 24;
  panel.style.paddingBottom = height + 'px';
}

function setResultsMode(on) {
  const panel = document.getElementById('panel');
  panel.classList.toggle('results', on);

  // The bar stays put on every screen. Leaving the results should never mean
  // losing the way back to them.

  const trip = document.getElementById('rb-trip');

  if (!on) {
    trip.style.display = 'none';
    panel.style.paddingBottom = '';        // back to the CSS default
    // Back to the entry form: clear any height left over from dragging.
    panel.style.maxHeight = '';
    panel.classList.remove('peek', 'tall');
    sheetState = 2;
    if (isPhone()) setTimeout(() => map.invalidateSize(), 220);
    return;
  }

  document.getElementById('rb-tripfromlabel').textContent = T('start');
  document.getElementById('rb-tripfrom').textContent = startPoint ? startPoint.label : '';
  document.getElementById('rb-triptolabel').textContent = T('destination');
  document.getElementById('rb-tripto').textContent = endPoint ? endPoint.label : '';
  document.getElementById('rb-edit').textContent = T('changeTrip');
  trip.style.display = 'flex';
}

// Wired once, not on every render — re-adding a listener each time would
// make one tap fire it several times over.
document.getElementById('rb-edit').addEventListener('click', () => {
  setResultsMode(false);
  document.getElementById('panel').scrollTop = 0;
});

// One place that knows what each operator is called and how it is coloured.
const OPERATORS = {
  kmb: { en:'KMB',     zh:'九巴',   css:'kmb' },
  ctb: { en:'CITYBUS', zh:'城巴',   css:'ctb' },
  nlb: { en:'NLB',     zh:'嶼巴',   css:'nlb' },
  gmb: { en:'MINIBUS', zh:'小巴',   css:'gmb' },
  mtr: { en:'MTR',     zh:'港鐵',   css:'mtr' }
};

function coName(co) {
  const entry = OPERATORS[co] || OPERATORS.kmb;
  return lang === 'zh' ? entry.zh : entry.en;
}

function coClass(co) { return (OPERATORS[co] || OPERATORS.kmb).css; }


// A one-glance comparison of all the options. The detail lives in the cards
// below; this is purely "which one do I want?" — the numbers people weigh:
// how long, how much, which bus, how far to walk, and when is the next one.
function buildCompareStrip(picks) {
  const strip = document.getElementById('compare');
  strip.innerHTML = '';

  for (const pick of picks) {
    const journey = pick.journey;
    const fare = journeyFare(journey);

    const tile = document.createElement('div');
    tile.className = 'ctile';
    tile.dataset.number = pick.number;
    tile.style.borderColor = pick.colour;

    tile.innerHTML =
      '<div class="cnum" style="background:' + pick.colour + '">' + pick.number + '</div>' +
      // The tile is a summary, so it carries the FIRST title only. Three
      // superlatives chained together wrapped to three lines of 12px text —
      // unreadable, and it pushed the rest of the tile off the top. The full
      // list still appears on the detail card below.
      '<div class="ctitle" style="color:' + pick.colour + '">' +
        pick.title.split(' · ')[0] + '</div>' +
      '<div class="ctime">' + journey.total + '<span class="cunit">' + T('min') + '</span></div>' +
      '<div class="cbus">' + journey.legs.map(l => l.lineCode || l.route).join(' → ') + '</div>' +
      (fare !== null ? '<div class="cfare">' + fareText(fare) + '</div>' : '') +
      '<div class="cwalk">🚶 ' + totalWalkMinutes(journey) + T('min') + '</div>' +
      '<div class="ceta" id="ceta-' + pick.number + '">…</div>';

    tile.addEventListener('click', () => selectOption(pick));
    strip.appendChild(tile);
  }
}

function makeCard(pick) {
  const journey = pick.journey;
  const card = document.createElement('div');
  card.className = 'jcard';
  card.dataset.number = pick.number;
  card.style.borderColor = pick.colour;

  const boardsAtChosen = startPoint.stop && journey.legs[0].on.stop === startPoint.stop.stop;
  const extraCost = pick.extraCost
    ? '<div class="jextra">' + T('costsMore').replace('{n}', pick.extraCost.toFixed(1)) + '</div>'
    : '';

  // The two numbers people actually decide on, made the biggest thing here.
  let inner =
    '<div class="jnum" style="background:' + pick.colour + '">' + pick.number + '</div>' +
    '<div class="jtop" style="color:' + pick.colour + '">' + pick.title + '</div>' +
    // Four figures, four equal cells, each with its label underneath so a
    // number and its unit can never be split across lines.
    '<div class="jheadline">' +
      '<div class="jcell"><span class="jbig">' + journey.total + '</span>' +
        '<span class="junit">' + T('totalTime') + '</span></div>' +
      '<div class="jcell"><span class="jbig" style="color:#166534">' + journeyFareText(journey) +
        '</span><span class="junit">' + T('totalFare') + '</span></div>' +
      '<div class="jcell"><span class="jbig" style="color:#92400e">' + totalWalkMinutes(journey) +
        '</span><span class="junit">' + T('totalWalk') + '</span></div>' +
      '<div class="jcell"><span class="jbig" style="color:#4b5563">' + journey.legs.length +
        '</span><span class="junit">' +
        (journey.legs[0].co === 'mtr' ? T('totalTrains') : T('totalBuses')) + '</span></div>' +
    '</div>' +
    '<div class="jwhy">' + pick.why + '</div>' + extraCost;

  // Green minibuses carry 19 people and do not take standees. For an older
  // rider that is worth knowing before they plan around one.
  if (journey.legs.some(leg => leg.co === 'gmb')) {
    inner += '<div class="jwarn" style="background:#faf5ff;color:#6b21a8">' +
             T('minibusNote') + '</div>';
  }

  const walkTotal = totalWalkMinutes(journey);
  if (walkTotal >= 12) {
    inner += '<div class="jwarn">' + T('lotsWalking').replace('{n}', walkTotal) + '</div>';
  }
  if (journey.legs.length > 1) {
    // Changing platform inside a station is not the same as getting off one
    // bus and finding another in the street, and it should not read as if
    // it were.
    inner += '<div class="jwarn" style="background:#fef3c7;color:#92400e">' +
             T(journey.legs[0].co === 'mtr' ? 'mustChangeTrain' : 'mustChange') + '</div>';
  }

  inner += boardsAtChosen
    ? '<div class="jdet" style="color:#166534;font-weight:700">' + T('boardHere') + ' <b>' +
      stopName(journey.legs[0].on) + '</b></div>'
    : '<div class="jdet">' + T('walkTo') + ' ' + journey.walkOn.minutes + ' ' + T('minTo') + ' <b>' +
      stopName(journey.legs[0].on) + '</b></div>';

  journey.legs.forEach((leg, index) => {
    const isTrain = leg.co === 'mtr';
    // One train fare covers the whole ride, changes included, so it is shown
    // once on the first leg rather than repeated on each.
    const legFare = isTrain
      ? (index === 0 ? journeyFare(journey) : null)
      : fareForLeg(leg.route, leg.bound, leg.serviceType, leg.on.stop, leg.co);

    inner += '<div class="jbus">' + (isTrain ? '🚇 ' : '🚌 ') + leg.route +
             '<span class="cotag ' + coClass(leg.co) + '">' + coName(leg.co) + '</span>' +
             (legFare !== null
               ? '<span class="legfare">' + fareText(legFare) + '</span>'
               : '') + '</div>' +
             '<div class="jdet">' + T('rideTo') + ' <b>' + stopName(leg.off) + '</b>' +
             ' <span style="color:#4b5563">(' + leg.stops + ' ' +
             T(isTrain ? 'stations' : 'stops') + ')</span></div>';

    if (index === 0 && journey.legs.length > 1) {
      // Hong Kong runs Bus-Bus Interchange schemes where the second fare is
      // free or discounted. The rules are NOT published in any API we use,
      // so we flag the possibility instead of inventing a price.
      const changeStop = (leg.off.name_en || '') + (leg.off.name_tc || '');
      if (/轉車站|INTERCHANGE|BBI/i.test(changeStop)) {
        inner += '<div class="jwarn" style="background:#eff6ff;color:#1e40af">' +
                 T('bbiNote') + '</div>';
      }

      inner += '<div class="jdet" style="color:#9a3412;font-weight:700">' +
               T(journey.legs[1] && journey.legs[1].co === 'mtr' && leg.co === 'mtr'
                 ? 'changeTrain' : 'changeBus') +
               (journey.transferWalk
                 ? ' — ' + T('walkTo') + ' ' + journey.transferWalk.minutes + ' ' +
                   T('minTo') + ' ' + stopName(journey.legs[1].on)
                 : ' ' + T('here')) + '</div>';
    }
  });

  inner += '<div class="jdet">' + T('thenWalk') + ' ' + journey.walkOff.minutes +
           ' ' + T('toDest') + '</div>' +
           '<div class="jnext waiting" id="next-' + pick.number + '">' + T('checkingBus') + '</div>' +
           '<div class="jzoom">' +
             '<button class="zoombtn on">🔍 ' + T('showBoarding') + '</button>' +
             '<button class="zoombtn off">🔍 ' + T('showAlighting') + '</button>' +
           '</div>' +
           '';

  card.innerHTML = inner;

  const firstLeg = journey.legs[0], lastLeg2 = journey.legs[journey.legs.length - 1];

  card.querySelector('.zoombtn.on').addEventListener('click', event => {
    event.stopPropagation();                     // don't also re-select the card
    selectOption(pick);
    zoomToStopDetail(firstLeg.on, startPoint, firstLeg, true);
  });

  card.querySelector('.zoombtn.off').addEventListener('click', event => {
    event.stopPropagation();
    selectOption(pick);
    zoomToStopDetail(lastLeg2.off, endPoint, lastLeg2, false);
  });

  return card;
}

// Show ONE route at a time. Three lines drawn together always tangle where
// they share a road, which is exactly what we are trying to avoid.

// Train options get plain, honest labels. The bus side earns superlatives by
// comparing dozens of routes; with at most three train options, calling one
// of them "CHEAPEST" out of three would be dressing up a thin list.
function buildRailPicks(options) {
  return (options || []).map((journey, index) => ({
    journey, number: index + 1,
    title: index === 0 ? T('bestTrain') : T('another'),
    why: index === 0 ? T('bestTrainWhy') : T('anotherWhy'),
    colour: '#991b1b'
  }));
}

// The bar is only useful once there is something to switch between, so it
// appears with the results and hides again on the entry form.
function paintBottomBar() {
  const bar = document.getElementById('bottombar');
  // Settings carries no count: there is nothing to have none of, and "(0)"
  // beside it would read as a section not worth opening.
  // "(0)" on a section that has simply not been searched yet reads as a
  // fault. The count appears once there are results to count.
  const withCount = (label, n) => n > 0 ? label + ' (' + n + ')' : label;
  const labels = { mtr: withCount(T('tabMtr'), railPicks.length),
                   fav: T('tabFav') + ' (' +
                        (stopFavs.length + stopDests.length + departures.length + trainFavs.length) + ')',
                   stop: T('tabStop'), set: T('tabSet') };

  // Looking up a route number is no longer a tab of its own — it is what the
  // 巴士 tab's own search box does — so route mode lights the 巴士 button
  // rather than nothing at all.
  const lit = activeMode === 'bus' ? 'stop' : activeMode;

  for (const button of bar.querySelectorAll('.bnav')) {
    const name = button.dataset.nav;
    button.querySelector('.blabel').textContent = labels[name];
    // Nothing is ever disabled. The bar is how you move around the app, and
    // a dead button is a dead end — an empty section still has something
    // worth saying, and favourites is where you learn how to fill it.
    button.classList.toggle('on', name === lit);
  }
}

function showMode(mode) {
  const panel   = document.getElementById('panel');
  const favView = document.getElementById('favview');
  const setView = document.getElementById('setview');
  const mtrView = document.getElementById('mtrview');
  const stopView = document.getElementById('stopview');
  const compare = document.getElementById('compare');
  const box     = document.getElementById('journeys');

  // Whichever section is being opened, it starts at its own first line.
  // Landing halfway down a list you have just asked to see reads as a
  // broken screen, and on a phone the scroll needed to fix it is the whole
  // reason the section felt hard to use.
  panel.scrollTop = 0;
  // Tapping a section in the bar is leaving the route lookup, whether or not
  // the ✕ was used.
  panel.classList.remove('routemode');

  // ---- FAVOURITES ----
  // Reachable from anywhere, including before a search has been run, so it
  // takes the panel rather than sitting under a results list that may not
  // exist yet.
  if (mode === 'fav') {
    activeMode = 'fav';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('setmode', 'mtrmode', 'stopmode');
    setView.style.display = 'none';
    mtrView.style.display = 'none';
    stopView.style.display = 'none';
    panel.classList.add('favmode');
    favView.style.display = 'block';
    renderFavouriteList();
    paintBottomBar();
    return;
  }

  // ---- BUS STOPS ----
  // The nearest poles or a saved one, and every bus leaving from it.
  if (mode === 'stop') {
    activeMode = 'stop';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('favmode', 'setmode', 'mtrmode');
    favView.style.display = 'none';
    setView.style.display = 'none';
    mtrView.style.display = 'none';
    openStopView();
    paintBottomBar();
    return;
  }

  // ---- MTR ----
  // Its own screen: nearest station, line, direction, next trains. The trip
  // planner's train results are one tap away at the bottom of it.
  if (mode === 'mtr') {
    activeMode = 'mtr';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('favmode', 'setmode', 'stopmode');
    favView.style.display = 'none';
    setView.style.display = 'none';
    stopView.style.display = 'none';
    openMtrView();
    paintBottomBar();
    return;
  }

  // ---- SETTINGS ----
  // Same rules as favourites: reachable at any time, takes the whole panel.
  if (mode === 'set') {
    activeMode = 'set';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('favmode', 'mtrmode', 'stopmode');
    favView.style.display = 'none';
    mtrView.style.display = 'none';
    stopView.style.display = 'none';
    panel.classList.add('setmode');
    setView.style.display = 'block';
    renderSettings();
    paintBottomBar();
    return;
  }

  panel.classList.remove('favmode', 'setmode', 'mtrmode', 'stopmode');
  favView.style.display = 'none';
  setView.style.display = 'none';
  mtrView.style.display = 'none';
  stopView.style.display = 'none';
  compare.style.display = '';
  box.style.display = '';
  activeMode = mode;
  currentPicks = (mode === 'mtr' ? railPicks : busPicks);
  paintBottomBar();

  // The saved buses or stations, with live times, before anything else.
  renderLiveStrip(mode);

  // Nothing searched yet, or nothing found for this mode: the useful thing
  // to show is the form, not an empty list. Tapping a section is then a way
  // back to planning rather than a dead end.
  if (currentPicks.length === 0) {
    setResultsMode(false);
    status.textContent = T(mode === 'mtr' ? 'noTrain' : 'noBus');
    return;
  }

  setResultsMode(true);
  buildCompareStrip(currentPicks);
  selectOption(currentPicks[0]);
  // Start at the top. Resetting before the cards are built leaves the old
  // scroll position in place once they arrive.
  document.getElementById('panel').scrollTop = 0;
  currentPicks.forEach(pick => loadNextBus(pick));
}

// The settings screen. Redrawn on open and after a language change, so it

          '<button class="sizebtn' + (textScale === k ? ' on' : '') + '" data-textsize="' + k + '">' +
            T(t) + '</button>').join('') +

// ADD TO HOME SCREEN. Three states, and only two of them are worth a row:
// offered (the browser has said the app qualifies), already installed, or
// neither — on a desktop, or in a browser that does not do this, where a
// button that cannot work would read as a broken app.
function installRow() {
  if (installPrompt) {
    return '<div class="setrow">' +
             '<span class="setlabel">' + T('settingInstall') + '</span>' +
             '<button class="gobtn" id="installbtn" style="min-width:110px">' +
               T('install') + '</button>' +
           '</div>' +
           '<div class="setnote">' + T('installNote') + '</div>';
  }
  if (isInstalled()) {
    return '<div class="setrow">' +
             '<span class="setlabel">' + T('settingInstall') + '</span>' +
             '<span class="setlabel" style="flex:0 0 auto;color:#166534">' +
               T('installedAlready') + '</span>' +
           '</div>';

// The favourites screen. The chips in the form show two characters because
// they sit in a row; here there is room for the whole name and for saying
// plainly what each button does.
// ============================================================
// THE LIVE STRIP
// ============================================================
// Opening a section should answer the question that section is about, before
// anything is typed. Tapping 巴士 asks "when is my bus?", so the saved buses
// and their countdowns sit at the top. Tapping 港鐵 asks "when is my train?",
// so the saved stations sit there instead, with both directions, because at
// a platform the only remaining question is which way.
// ============================================================
// LOCATION, ASKED FOR PROPERLY
// ============================================================
// The browser's own permission box gives no reason, and a box with no reason
// gets refused. So the app asks first, in its own words, and only calls the
// browser once someone has said yes. The answer is remembered, because being
// asked the same question every morning is its own kind of rude.
function geoChoice() {
  try { return localStorage.getItem(GEO_CHOICE); } catch (e) { return null; }
}
function rememberGeoChoice(answer) {
  try { localStorage.setItem(GEO_CHOICE, answer); } catch (e) {}
}

function askAboutLocation() {
  const box = document.getElementById('geoask');
  if (!box) return;

  if (!navigator.geolocation || geoChoice() === 'no') { box.style.display = 'none'; return; }
  if (geoChoice() === 'yes') { box.style.display = 'none'; findMeThenNearby(); return; }

  box.style.display = 'block';
  box.innerHTML =
    '<div class="geotitle">' + T('geoTitle') + '</div>' +
    '<div class="geobody">' + T('geoBody') + '</div>' +
    '<div class="geobtns">' +
      '<button class="geoyes" id="geo-yes">' + T('geoYes') + '</button>' +
      '<button class="geono"  id="geo-no">'  + T('geoNo')  + '</button>' +
    '</div>';

  document.getElementById('geo-yes').addEventListener('click', () => {
    rememberGeoChoice('yes');
    box.style.display = 'none';
    findMeThenNearby();
  });
  document.getElementById('geo-no').addEventListener('click', () => {
    rememberGeoChoice('no');
    box.style.display = 'none';
  });
}

function findMeThenNearby() {
  if (!navigator.geolocation) return;
  status.textContent = T('findingYou');
  navigator.geolocation.getCurrentPosition(
    position => {
      herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
      map.setView([herePoint.lat, herePoint.lng], 16);
      status.textContent = T('foundYou');
      if (activeMode === 'bus') renderLiveStrip('bus');
      if (activeMode === 'mtr') openMtrView();
      if (activeMode === 'stop') renderStopView();
    },
    error => { status.textContent = T('locationFailed'); },
    { enableHighAccuracy:true, timeout:10000 });
}

// What can I catch from right here? With a median of 25 bus stops within
// 400 m of any given stop in Hong Kong, the useful answer is the nearest few
// stops merged together, not every pole in the neighbourhood.
const NEARBY_RADIUS_M = 400;
const NEARBY_STOPS = 4;

// Poles only merge here if they are practically touching. The search list
// merges at 250 m because there "又一城" is one place; standing in the street
// it is not — the pole across the road runs the other way, and sending
// someone to the wrong side of a dual carriageway is a real mistake.
const SAME_POLE_M = 25;

async function renderNearbyBuses(into) {
  if (!herePoint || allStops.length === 0) return;

  const close = allStops
    .filter(stop => !stop.isStation)
    .map(stop => ({ stop, metres: metresBetween(herePoint.lat, herePoint.lng,
                                                Number(stop.lat), Number(stop.long)) }))
    .filter(entry => entry.metres <= NEARBY_RADIUS_M)
    .sort((a, b) => a.metres - b.metres);

  if (close.length === 0) { appendHTML(into, '<div class="livehint">' + T('noStopsNear') + '</div>'); return; }

  // NOT merged. The whole point here is to send someone to one specific pole,
  // and a card listing five codes cannot do that. One card, one pole, one
  // number painted on it.
  const groups = close.slice(0, NEARBY_STOPS)
    .map(entry => ({ ...entry.stop, members: [entry.stop], lat: Number(entry.stop.lat),
                     lng: Number(entry.stop.long) }));
  const walkTo = group => Math.round(metresBetween(herePoint.lat, herePoint.lng, group.lat, group.lng));

  // The pole code is normally hidden because "又一城 (SS920)" means nothing
  // when you are choosing a destination. Here it means everything: it is
  // painted on the pole, and it is how you know you are at the right one.
  const poleCode = group => {
    const codes = group.members.map(m => {
      const found = /\(([A-Z]{2}\d{3}[A-Za-z]?)\)\s*$/.exec(m.name_en || '');
      return found ? found[1] : null;
    }).filter(Boolean);
    return codes.length ? codes.join(' / ') : '';
  };

  appendHTML(into, '<div class="livehead">📍 ' + T('nearbyBuses') + '</div>' +
    groups.map((group, i) => {
      const code = poleCode(group);
      return '<div class="livecard nearby">' +
        '<div class="livetitle">' + esc(stopName(group)) +
          (code ? '<span class="polecode">' + esc(code) + '</span>' : '') + '</div>' +
        '<div class="livesub">' + T('walkThere') + ' ' + walkTo(group) + T('metresAway') + '</div>' +
        '<div class="livetimes" id="near-' + i + '">…</div>' +
      '</div>';
    }).join(''));

  groups.forEach((group, i) => loadNearbyEta(group, 'near-' + i));
}

async function loadNearbyEta(group, id) {
  const cell = document.getElementById(id);
  if (!cell) return;
  try {
    const lists = await Promise.all(group.members.map(async member => {
      try {
        const response = await fetch(
          'https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + member.stop,
          { signal: AbortSignal.timeout(10000) });
        if (!response.ok) return [];
        return (await response.json()).data || [];
      } catch (error) { return []; }
    }));

    const now = Date.now();
    const soonest = new Map();          // route -> { minutes, dest }
    for (const row of lists.flat()) {
      if (!row.eta) continue;
      const minutes = Math.round((new Date(row.eta).getTime() - now) / 60000);
      if (minutes < 0) continue;
      const key = row.route + '|' + (row.dest_en || '');
      if (!soonest.has(key) || soonest.get(key).minutes > minutes)
        soonest.set(key, { minutes, route: row.route,
                           dest: lang === 'zh' ? (row.dest_tc || row.dest_en) : row.dest_en });
    }
    if (!document.getElementById(id)) return;

    const rows = [...soonest.values()].sort((a, b) => a.minutes - b.minutes).slice(0, 5);
    if (rows.length === 0) { cell.textContent = T('noneDue'); cell.classList.add('quiet'); return; }

    cell.classList.remove('quiet');
    cell.innerHTML = rows.map(r =>
      '<div class="nearrow"><span class="nearroute">' + esc(r.route) + '</span>' +
      '<span class="neardest">' + esc(r.dest || '') + '</span>' +
      '<span class="nearmin">' + (r.minutes === 0 ? T('due') : r.minutes + T('min')) + '</span></div>'
    ).join('');
  } catch (error) {
    cell.textContent = T('etaOffline');
    cell.classList.add('quiet');
  }
}

function whichLinesServe(code) {
  if (!mtrData) return [];
  const found = [];
  for (const [line, variants] of Object.entries(mtrData.lines))
    if (variants.some(stops => stops.includes(code)) && !found.includes(line)) found.push(line);
  return found;
}

// A saved place counts as a station when it sits on top of one. Storing the
// code at save time would be neater, but this also picks up stations saved
// before the app knew about them. Reads the saved STARTING STOPS, which is
// where saved places live now — 太子站 saved as a bus stop should offer the
// train from 太子 too, because to the rider it is one place.
function savedStations() {
  if (!mtrData) return [];
  const out = [];
  for (const fav of stopFavs) {
    let best = null, bestMetres = Infinity;
    for (const [code, s] of Object.entries(mtrData.stations)) {
      const m = metresBetween(fav.lat, fav.long, s[2], s[3]);
      if (m < bestMetres) { bestMetres = m; best = code; }
    }
    if (best && bestMetres <= 200 && !out.some(x => x.code === best))
      out.push({ code: best, label: stopName(fav) });
  }
  return out.slice(0, 3);
}

// innerHTML += re-parses the WHOLE container, replacing every existing node.
// Any element already handed to an in-flight fetch becomes detached, so the
// arrival times arrive and get written to a node nobody can see. Append into
// a fresh wrapper instead.
function appendHTML(parent, html) {
  const box = document.createElement('div');
  box.innerHTML = html;
  parent.appendChild(box);
  return box;
}

function liveCard(title, subtitle, id, attrs, footer) {
  return '<div class="livecard' + (attrs ? ' tap' : '') + '"' + (attrs || '') + '>' +
           '<div class="livetitle">' + esc(title) + '</div>' +
           (subtitle ? '<div class="livesub">' + esc(subtitle) + '</div>' : '') +
           '<div class="livetimes" id="' + id + '">…</div>' +
           (footer ? '<div class="livefoot">' + footer + '</div>' : '') +
         '</div>';
}

// The saved-bus cards are rebuilt on every redraw, so one listener on the
// strip rather than one per card.
document.getElementById('livestrip').addEventListener('click', event => {
  const card = event.target.closest('[data-dep]');
  if (!card) return;
  const dep = departures[Number(card.dataset.dep)];
  if (dep) openSavedDepartureRoute(dep);
});

function renderLiveStrip(mode) {
  const strip = document.getElementById('livestrip');
  if (!strip) return;
  strip.innerHTML = '';
  if (mode === 'fav') return;

  if (mode === 'bus') {
    if (departures.length === 0) {
      // Nothing saved yet, so what is nearby is the more useful answer and
      // the saving hint moves out of the way to the bottom.
      strip.innerHTML = '';
      renderNearbyBuses(strip);
      return;
    }
    // A pill each: number → terminus, nothing else. The times, the stop and
    // the whole route are one tap away; here the list only has to be short.
    strip.innerHTML = '<div class="livehead">🚌 ' + T('myBusesNow') + '</div><div class="destchips">' +
      departures.map((dep, i) => {
        const dest = lang === 'zh' ? (dep.dest_tc || dep.dest_en) : dep.dest_en;
        return '<button class="destchip" data-dep="' + i + '">' + esc(dep.route) + ' → ' + esc(plainStopName(dest || '')) + '</button>';
      }).join('') + '</div>';
    renderNearbyBuses(strip);
    return;
  }

}

// ============================================================
// ADDING A BUS BY NUMBER
// ============================================================
// The star on a map popup pins a route to ONE pole, which is right when you
// always board at the same place. But "my bus is the 60X towards Tuen Mun" is
// how people actually think, and that holds whether they are at home or at
// work. A route saved this way carries no stop: at display time the app finds
// the nearest stop on that route to wherever they are standing.
function renderAddRoute(into) {
  const wrap = document.createElement('div');
  wrap.className = 'addroute';

  const button = document.createElement('button');
  button.className = 'addroutebtn';
  button.textContent = '＋ ' + T('addRoute');

  const panel = document.createElement('div');
  panel.className = 'addroutepanel';
  panel.style.display = 'none';
  panel.innerHTML =
    '<div class="frow">' +
      '<input id="addroute-text" type="text" inputmode="text" autocomplete="off" ' +
        'placeholder="' + T('routePlaceholderShort') + '">' +
    '</div>' +
    '<div class="addroutehint">' + T('pickDirection') + '</div>' +
    '<div id="addroute-results"></div>';

  button.addEventListener('click', () => {
    const open = panel.style.display !== 'none';
    panel.style.display = open ? 'none' : 'block';
    button.classList.toggle('on', !open);
    if (!open) { const box = document.getElementById('addroute-text'); if (box) box.focus(); }
  });

  wrap.appendChild(button);
  wrap.appendChild(panel);
  into.appendChild(wrap);

  const input = panel.querySelector('#addroute-text');
  const list  = panel.querySelector('#addroute-results');

  const draw = () => {
    const typed = input.value.trim().toUpperCase();
    list.innerHTML = '';
    if (typed.length < 1) return;

    // Every variant of the number is a separate direction, and the terminus
    // name is what tells them apart in a way a rider recognises.
    const matches = allRoutes
      .filter(r => String(r.route).toUpperCase().startsWith(typed))
      .slice(0, 12);

    if (matches.length === 0) {
      list.innerHTML = '<div class="livehint">' + T('noRouteFound') + '</div>';
      return;
    }

    for (const r of matches) {
      const already = departures.some(d =>
        String(d.route).toUpperCase() === String(r.route).toUpperCase() && d.dir === r.bound);
      const item = document.createElement('button');
      item.className = 'addrouteitem' + (already ? ' on' : '');
      item.innerHTML =
        '<span class="ariroute">' + esc(r.route) + '</span>' +
        '<span class="aridest">' + T('towards') + ' ' +
          esc(lang === 'zh' ? (r.dest_tc || r.dest_en) : r.dest_en) + '</span>' +
        '<span class="aritick">' + (already ? '★' : '＋') + '</span>';

      item.addEventListener('click', () => {
        toggleDeparture({
          route: r.route, dir: r.bound, serviceType: r.service_type, co: 'KMB',
          stop: null,                       // resolved from where you are
          stopName_en: '', stopName_tc: '',
          dest_en: r.dest_en, dest_tc: r.dest_tc
        });
        renderFavouriteList();
      });
      list.appendChild(item);
    }
  };

  input.addEventListener('input', draw);
}

// A route saved without a stop needs one before it can have a time. Find the
// closest stop on that route to where the person is now.
const routeStopCache = new Map();

async function stopsOnRoute(dep) {
  const dir = dep.dir === 'O' ? 'outbound' : 'inbound';
  const key = 'kmb-rs-' + dep.route + '-' + dir + '-' + (dep.serviceType || 1);
  if (routeStopCache.has(key)) return routeStopCache.get(key);

  let refs = await cacheGet(key);
  if (!refs) {
    const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' +
      encodeURIComponent(dep.route) + '/' + dir + '/' + encodeURIComponent(dep.serviceType || 1),
      { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    refs = (await response.json()).data || [];
    cachePut(key, refs);
  }
  routeStopCache.set(key, refs);
  return refs;
}

async function resolveNearestStop(dep) {
  if (dep.stop) return dep.stop;
  if (!herePoint) return null;

  const refs = await stopsOnRoute(dep);
  const byId = new Map(allStops.map(s => [s.stop, s]));
  let best = null, bestMetres = Infinity;
  for (const ref of refs) {
    const stop = byId.get(ref.stop);
    if (!stop) continue;
    const m = metresBetween(herePoint.lat, herePoint.lng, Number(stop.lat), Number(stop.long));
    if (m < bestMetres) { bestMetres = m; best = stop; }
  }
  return best ? best.stop : null;
}

// RENAMING A SAVED PLACE.
// Only the LABEL changes. The stop id, the real stop name and the text every
// search and traffic-alert match runs on are left exactly as they were, so
// calling a stop 「返屋企」 can never stop the app finding it. Clearing the box
// puts the real name back.
function startRename(row, list, index, isStart, real, label) {
  const wrap = document.createElement('div');
  wrap.className = 'fprename';

  const input = document.createElement('input');
  input.type = 'text';
  input.value = label;
  input.maxLength = 24;
  input.setAttribute('aria-label', T('renameTitle'));
  input.placeholder = real;

  const save = document.createElement('button');
  save.className = 'fpsave';
  save.textContent = T('renameSave');

  const cancel = document.createElement('button');
  cancel.className = 'fpcancel';
  cancel.textContent = '✕';
  cancel.title = T('cancel');
  cancel.setAttribute('aria-label', T('cancel'));

  const commit = () => {
    const nick = String(input.value || '').trim().slice(0, 24);
    // The rider typed the real name back, or emptied the box: drop the
    // nickname rather than storing a copy of what we already know.
    const keep = (nick && nick !== real) ? nick : '';
    if (isStart) {
      list[index] = Object.assign({}, list[index], { nick: keep });
      saveStopFavs();
    } else {
      list[index] = keep ? { name: real, nick: keep } : real;
      saveStopDests();
    }
    renderFavouriteList();
    status.textContent = keep ? T('renameDone').replace('{n}', keep) : T('renameCleared').replace('{n}', real);
  };

  save.addEventListener('click', commit);
  cancel.addEventListener('click', renderFavouriteList);
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') { event.preventDefault(); commit(); }
    if (event.key === 'Escape') renderFavouriteList();
  });

  wrap.appendChild(input); wrap.appendChild(save); wrap.appendChild(cancel);
  row.replaceWith(wrap);
  input.focus();
  input.select();
}

function renderFavouriteList() {
  const view = document.getElementById('favview');
  view.innerHTML = '';

  // Headings are built as elements, never with innerHTML +=. Appending to
  // innerHTML re-parses the WHOLE container, which silently replaces every
  // child node and throws away the handlers already attached to them.
  const heading = (icon, text, note) => {
    const div = document.createElement('div');
    div.className = 'favhead';
    div.textContent = icon + ' ' + text + ' ';
    if (note) {
      const span = document.createElement('span');
      span.className = 'favcount';
      span.textContent = note;
      div.appendChild(span);
    }
    view.appendChild(div);
    return div;
  };

  // ---- THE TWO PLACE LISTS ----
  // Eight starting stops and eight destinations — and they are THE SAME two
  // lists the 車站 tab fills, not a second copy. There used to be a separate
  // pair here belonging to the old trip-planner form, so a place saved on the
  // 車站 tab was invisible on this screen and this screen sat permanently at
  // 0/8. The planner's form is hidden for good and its ⭐ buttons with it, so
  // there is nothing left for a second pair to hold. One list, saved once,
  // shown on both screens.
  const placeSection = kind => {
    const isStart = kind === 'start';
    const list = isStart ? stopFavs : stopDests;
    const cap  = isStart ? MAX_STOPS : MAX_DESTS;
    heading(isStart ? '🟢' : '🔴', T(isStart ? 'favFrom' : 'favTo'),
            list.length + '/' + cap);

    const box = document.createElement('div');
    view.appendChild(box);

    if (list.length === 0) {
      appendHTML(box, '<div class="favempty">' +
                      esc(T(isStart ? 'noFavStart' : 'noFavEnd')) + '</div>');
      return;
    }

    list.forEach((entry, index) => {
      // A saved start is a whole pole record; a saved destination is just the
      // name, because which pole you leave from depends on where you stand.
      // Either may carry a nickname, and the nickname is all the rider sees.
      const real  = isStart ? stopName(entry) : destName(entry);
      const label = isStart ? favLabel(entry) : destLabel(entry);
      const named = label !== real;              // renamed by the rider

      const row = document.createElement('div');
      row.className = 'favplace';

      // The whole row is the button. A separate "open" bar underneath read
      // more clearly but doubled the height, and sixteen of those is a screen
      // nobody reaches the bottom of.
      const open = document.createElement('button');
      open.className = 'fpopen';
      const code = isStart ? poleCodeOf(entry) : '';
      // innerHTML, not appendHTML: that helper wraps what it is given in a
      // div, which would leave the button one flex child instead of three and
      // strand the arrow beside the name rather than out at the right edge.
      // A renamed stop keeps its real name underneath in small type: 「返屋企」
      // is what you remember, 屯門公路轉車站 is what is painted on the pole, and
      // at the roadside you need both.
      // Two lines, because the row now carries a rename button as well as a
      // delete one and a name squeezed between four things is unreadable on a
      // 375px phone. The rider's own word gets the whole width; the pole code
      // and the facing sit under it, with the real name in front of them when
      // the place has been renamed — at the roadside you need both.
      // Pole code and facing FIRST, the real name after it. Both are on one
      // line and the line will run out of room on a 375px phone, so what
      // survives the ellipsis has to be the part that gets you to the right
      // kerb — TM744 往東 — not the name you have already replaced.
      const dir = isStart ? poleDirHtml(entry.stop) : '';
      const meta = (code ? '<span class="polecode">' + esc(code) + '</span>' : '') + dir +
                   (named ? ((code || dir) ? ' · ' : '') + esc(real) : '');
      open.innerHTML = '<span class="fpbody">' +
                         '<span class="fpname">' + esc(label) + '</span>' +
                         (meta ? '<span class="fpmeta">' + meta + '</span>' : '') +
                       '</span>' +
                       '<span class="fparrow">›</span>';
      open.title = T(isStart ? 'favStopOpen' : 'favDestOpen');
      // The stored string, never the one on screen: in 简体 the two differ and
      // the search that follows has to match the data.
      open.addEventListener('click', () =>
        isStart ? stopOpenSaved(entry) : stopOpenDest(destName(entry)));
      row.appendChild(open);

      // RENAME. The row turns into a text box in place rather than opening a
      // dialog: one fewer screen to understand, and the name being changed
      // stays visible while it is typed.
      const rename = document.createElement('button');
      rename.className = 'fpedit';
      rename.textContent = '✎';
      rename.title = T('renameTitle');
      rename.setAttribute('aria-label', T('renameTitle') + ' ' + label);
      rename.addEventListener('click', () => startRename(row, list, index, isStart, real, label));
      row.appendChild(rename);

      const del = document.createElement('button');
      del.className = 'fpdel';
      del.textContent = '✕';
      del.setAttribute('aria-label', 'Remove ' + name);
      del.setAttribute('aria-label', T('removeLabel') + ' ' + label);
      del.addEventListener('click', () => {
        if (isStart) { stopFavs.splice(index, 1); saveStopFavs(); }
        else         { stopDests.splice(index, 1); saveStopDests(); }
        renderFavouriteList();
        paintBottomBar();
      });
      row.appendChild(del);

      box.appendChild(row);
    });
  };

  placeSection('start');
  placeSection('end');

  // ---- SAVED DEPARTURES: no tap at all ----
  const depHead = heading('🚌', T('favRoutes'), departures.length + '/' + MAX_DEPARTURES);
  if (departures.length > 0) {
    const refresh = document.createElement('button');
    refresh.className = 'refreshbtn';
    refresh.textContent = T('refresh');
    refresh.style.marginLeft = 'auto';
    refresh.addEventListener('click', () => {
      departures.forEach((dep, i) => {
        const cell = document.getElementById('depeta-' + i);
        if (cell) { cell.textContent = '…'; cell.classList.remove('quiet'); }
        loadDepartureEta(dep, i);
      });
      status.textContent = T('refreshing');
    });
    depHead.style.display = 'flex'; depHead.style.alignItems = 'center';
    depHead.appendChild(refresh);
  }
  const deps = document.createElement('div');
  deps.id = 'depslist';
  view.appendChild(deps);

  renderAddRoute(deps);

  if (departures.length === 0) {
    appendHTML(deps, '<div class="favempty">' + T('noDepsLong') + '</div>');
  }

  departures.forEach((dep, index) => {
    const row = document.createElement('div');
    row.className = 'deprow';
    const stopName = lang === 'zh' ? (dep.stopName_tc || dep.stopName_en) : dep.stopName_en;
    const destName = lang === 'zh' ? (dep.dest_tc || dep.dest_en) : dep.dest_en;

    row.innerHTML =
      '<div class="depmain">' +
        '<span class="deproute">' + esc(dep.route) + '</span>' +
        '<span class="depdest">' + T('towards') + ' ' + esc(destName || '') + '</span>' +
      '</div>' +
      '<div class="depstop" id="depstop-' + index + '">' +
        (stopName ? esc(plainStopName(stopName)) : T('nearestStopToYou')) + '</div>' +
      '<div class="depeta" id="depeta-' + index + '">…</div>';

    const del = document.createElement('button');
    del.className = 'go-del depdel'; del.textContent = '✕';
    del.setAttribute('aria-label', 'Remove ' + dep.route);
    del.addEventListener('click', () => {
      departures.splice(index, 1); saveDepartures(); renderFavouriteList();
    });
    row.appendChild(del);

    // The saved bus knows its route and direction, so the whole line of stops
    // is one tap away — which is where the rider counts to their own stop.
    const openRoute = document.createElement('button');
    openRoute.className = 'depopen';
    openRoute.textContent = '🚌 ' + T('favBusRoute');
    openRoute.addEventListener('click', () => openSavedDepartureRoute(dep));
    row.appendChild(openRoute);

    deps.appendChild(row);
  });

  departures.forEach((dep, index) => loadDepartureEta(dep, index));

  // ---- SAVED TRAINS ----
  heading('🚇', T('favTrains'), trainFavs.length + '/' + MAX_TRAINS);
  const trains = document.createElement('div');
  view.appendChild(trains);
  if (trainFavs.length === 0) {
    appendHTML(trains, '<div class="favempty">' + T('noTrainsLong') + '</div>');
  } else if (!mtrData) {
    appendHTML(trains, '<div class="favempty">' + T('loading') + '</div>');
  } else {
    trainFavs.forEach((t, index) => {
      const row = document.createElement('div');
      row.className = 'deprow';
      row.style.borderLeft = '8px solid ' + (MTR_LINE_COLOURS[t.line] || '#999');
      row.innerHTML =
        '<div class="depmain"><span class="deproute">' + esc(stationName(t.station)) + '</span>' +
          '<span class="depdest">' + esc(railLineName(t.line)) + ' · ' + T('towards') + ' ' + esc(stationName(t.dest)) + '</span></div>' +
        '<div class="depeta" id="trainfav-eta-' + index + '">…</div>';
      const del = document.createElement('button');
      del.className = 'go-del depdel'; del.textContent = '✕';
      del.setAttribute('aria-label', 'Remove ' + stationName(t.station));
      del.addEventListener('click', () => { trainFavs.splice(index, 1); saveTrainFavs(); renderFavouriteList(); });
      row.appendChild(del);
      const open = document.createElement('button');
      open.className = 'depopen';
      open.textContent = '🚇 ' + T('favTrainOpen');
      open.addEventListener('click', () => mtrOpenSaved(t));
      row.appendChild(open);
      trains.appendChild(row);
    });
    trainFavs.forEach((t, index) => loadTrainFavEta(t, index));
  }

  // The saved stops that used to be repeated here are now the 常用起點
  // list at the top of this screen — the same eight, shown once.
}

// Open the whole line for a saved bus. The saved entry already knows the
// route, the direction and the company, so this only has to find the matching
// timetable record and hand it to the code that draws a route.
function openSavedDepartureRoute(dep) {
  const wanted = String(dep.route).toUpperCase();

  if (dep.co === 'CTB') {
    const route = ctbRoutes.find(r => String(r.route).toUpperCase() === wanted);
    if (!route) { status.textContent = T('routeNotFound').replace('{r}', dep.route); return; }
    const direction = dep.dir === 'I' ? 'inbound' : 'outbound';
    const from = direction === 'outbound' ? endName(route, 'orig') : endName(route, 'dest');
    const to   = direction === 'outbound' ? endName(route, 'dest') : endName(route, 'orig');
    goToRouteMode(dep.route);
    showCtbRoute(route, direction, from, to);
    return;
  }

  // KMB. Match the direction, and the service type when the saved entry knows
  // it — the same number can run a different set of stops at peak hours.
  const bound = dep.dir === 'I' ? 'I' : 'O';
  const candidates = allRoutes.filter(r =>
    String(r.route).toUpperCase() === wanted && r.bound === bound);
  const route = candidates.find(r => String(r.service_type) === String(dep.serviceType))
             || candidates.find(r => String(r.service_type) === '1')
             || candidates[0];

  if (!route) { status.textContent = T('routeNotFound').replace('{r}', dep.route); return; }
  goToRouteMode(dep.route);
  showKmbRoute(route);
}

// Leave whatever screen we were on and hand the panel to the route lookup,
// with the number filled in so the search box matches what is on screen.
function goToRouteMode(routeNo) {
  const panel = document.getElementById('panel');
  panel.classList.remove('favmode', 'setmode', 'mtrmode', 'stopmode');
  document.getElementById('favview').style.display = 'none';
  document.getElementById('setview').style.display = 'none';
  document.getElementById('mtrview').style.display = 'none';
  document.getElementById('stopview').style.display = 'none';
  activeMode = 'bus';
  paintBottomBar();
  document.getElementById('route-text').value = routeNo;
  enterRouteMode();
}

// The point of saving a departure is to see the countdown without asking for
// it, so these fire the moment the screen opens.
async function loadDepartureEta(dep, index) {
  const cell = document.getElementById('depeta-' + index);
  if (!cell) return;
  try {
    // A route saved by number carries no stop, so find the nearest one on
    // that route to where the person is standing.
    const stopId = await resolveNearestStop(dep);
    if (!stopId) {
      cell.textContent = T('needLocation');
      cell.classList.add('quiet');
      return;
    }
    if (!dep.stop) {
      // A countdown with no place attached is just a number, so name the stop.
      const found = allStops.find(s => s.stop === stopId);
      const label = document.getElementById('depstop-' + index);
      if (found && label) label.textContent = plainStopName(stopName(found));
    }

    const response = await fetch(
      'https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + stopId,
      { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);

    const now = Date.now();
    const minutes = ((await response.json()).data || [])
      .filter(row => String(row.route).toUpperCase() === String(dep.route).toUpperCase()
                  && (!dep.dir || row.dir === dep.dir) && row.eta)
      .map(row => Math.round((new Date(row.eta).getTime() - now) / 60000))
      .filter(n => n >= 0)
      .slice(0, 3);

    if (!document.getElementById('depeta-' + index)) return;   // screen changed
    cell.textContent = minutes.length
      ? minutes.map(n => n === 0 ? T('due') : n + T('min')).join(', ')
      : T('noneDue');
    cell.classList.toggle('quiet', minutes.length === 0);
  } catch (error) {
    cell.textContent = T('etaOffline');
    cell.classList.add('quiet');
  }
}

document.getElementById('bottombar').addEventListener('click', event => {
  const button = event.target.closest('.bnav');
  if (button && !button.disabled) showMode(button.dataset.nav);
});

// ============================================================
// SLIDING BETWEEN SECTIONS
// ============================================================
// Left to right moves one section back, right to left moves one on — the
// same order as the buttons along the top.
//
// WHY IT ONLY WORKS FROM THE EDGES. The middle of this app is full of things
// that already slide sideways: the MTR station strip, the rows of saved
// buses, the destination chips. A swipe anywhere on the screen would fight
// every one of them, and the loser would usually be the one the rider meant.
// The outer 44px of each side belongs to no such control, so a slide that
// STARTS there is unambiguous. It also has to travel 60px and be clearly more
// sideways than up-down before it counts — an older thumb resting on the edge
// of a phone while scrolling must never be able to change the screen by
// accident.
const TAB_ORDER  = ['stop', 'mtr', 'fav', 'set'];
const SWIPE_EDGE = 44;   // px from either side a slide must begin in
const SWIPE_MIN  = 60;   // px it must travel before the section changes
const SWIPE_SLOP = 40;   // px of up-down movement that abandons it

let swipe = null;

function swipeToTab(step) {
  // Route mode is not in the order; it belongs to the 巴士 tab, so a slide
  // out of it starts from there.
  const from = activeMode === 'bus' ? 'stop' : activeMode;
  const at = TAB_ORDER.indexOf(from);
  const to = TAB_ORDER[(at < 0 ? 0 : at) + step];
  if (!to) return;                       // already at one end: nothing to do
  showMode(to);
  // A section that simply appears leaves the rider wondering whether they
  // pressed something. The panel slides in from the side it came from, once,
  // for a fifth of a second.
  const panel = document.getElementById('panel');
  panel.classList.remove('slidefromleft', 'slidefromright');
  void panel.offsetWidth;                // restart the animation
  panel.classList.add(step > 0 ? 'slidefromright' : 'slidefromleft');
}

document.addEventListener('touchstart', event => {
  swipe = null;
  if (event.touches.length !== 1) return;
  // Not while a sheet is up, and not while a search box has the keyboard.
  if (document.querySelector('#dirsheet.open, #alertsheet.open')) return;
  if (event.target.closest('input, textarea, select')) return;
  const touch = event.touches[0];
  const width = window.innerWidth;
  const side  = touch.clientX <= SWIPE_EDGE ? 'left'
              : touch.clientX >= width - SWIPE_EDGE ? 'right' : null;
  if (!side) return;
  swipe = { x: touch.clientX, y: touch.clientY, side, decided: false };
}, { passive: true });

document.addEventListener('touchmove', event => {
  if (!swipe || event.touches.length !== 1) return;
  const touch = event.touches[0];
  const dx = touch.clientX - swipe.x;
  const dy = touch.clientY - swipe.y;
  if (Math.abs(dy) > SWIPE_SLOP && Math.abs(dy) > Math.abs(dx)) { swipe = null; return; }
  if (Math.abs(dx) < SWIPE_MIN) return;
  // Only the direction that leads away from the edge counts. A right-to-left
  // drag beginning on the LEFT edge is somebody swiping back into the screen,
  // not asking for the next section.
  const step = swipe.side === 'left' ? -1 : 1;
  if ((step === -1 && dx < 0) || (step === 1 && dx > 0)) { swipe = null; return; }
  if (!swipe.decided) {
    swipe.decided = true;
    // Stops the browser treating the rest of this drag as a back-gesture or
    // a scroll. Only possible because this listener is not passive.
    if (event.cancelable) event.preventDefault();
    swipeToTab(step);
  }
}, { passive: false });

document.addEventListener('touchend', () => { swipe = null; }, { passive: true });
document.addEventListener('touchcancel', () => { swipe = null; }, { passive: true });

let chosenNumber = 1;

// Show the detail card for ONE option only. Stacking all three meant
// scrolling past a card you have already rejected to reach the next.

function selectOption(pick) {
