function openStopView() {
  const panel = document.getElementById('panel');
  const view  = document.getElementById('stopview');
  panel.classList.remove('favmode', 'setmode', 'mtrmode', 'routemode');
  for (const id of ['favview', 'setview', 'mtrview']) document.getElementById(id).style.display = 'none';
  view.style.display = 'block';
  panel.classList.add('stopmode');
  panel.scrollTop = 0;
  // The planner builds the route index the first time a trip is searched.
  // This tab reads the same index, so it has to be built here too — without
  // it no pole can say where its buses go and the destination search has
  // nothing to walk. Cached after the first time, so this is a one-off wait.
  if (!stopIndex && !stopState.indexing) {
    stopState.indexing = true;
    buildIndexes().catch(error => console.warn('Index unavailable:', error))
      .then(() => { stopState.indexing = false; if (activeMode === 'stop') renderStopView(); });
  }
  if (!stopState.stop && !herePoint && navigator.geolocation && geoChoice() === 'yes'
      && !stopState.locating && !stopState.locateTried) {
    stopState.locateTried = true;
    stopLocate();
  }
  renderStopView();
  if (stopState.stop && !stopState.rows && !stopState.loading) stopLoadRows();
}

function stopLocate() {
  if (!navigator.geolocation) { status.textContent = T('noGeo'); return; }
  stopState.locating = true; renderStopView();
  status.textContent = T('findingYou');
  navigator.geolocation.getCurrentPosition(
    position => {
      herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
      stopState.locating = false; renderStopView();
    },
    () => { stopState.locating = false; status.textContent = T('locationFailed'); renderStopView(); },
    { enableHighAccuracy:true, timeout:10000 });
}

function stopSetStop(stop, groupStops) {
  const group = groupStops && groupStops.length > 1 ? groupStops : poleGroup(stop);
  stopState = Object.assign(freshStopState(), { locateTried: true, stop, group, destQuery: stopState.destQuery, indexing: stopState.indexing });
  renderStopView();
  stopLoadRows();
}

// One tap on a saved stop is this screen with the stop already chosen.
function stopOpenSaved(sf) {
  // The place typed above stays with you: it becomes the 往… filter here.
  const dest = String(stopState.destQuery || '').trim();
  stopState = Object.assign(freshStopState(), { locateTried: true, stop: sf, group: poleGroup(sf),
                                                destQuery: dest, destFilter: dest, indexing: stopState.indexing });
  if (activeMode !== 'stop') { showMode('stop'); return; }
  renderStopView(); stopLoadRows();
}

// Live rows for one pole: an array, or null when its company has no feed.
async function fetchPoleRows(stop) {
  const co = stopCompany(stop.stop);
  let rows = null;
  if (co === 'KMB') {
    const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + stop.stop,
                                 { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    rows = (await response.json()).data || [];
  } else if (co === 'CTB') {
    // Citybus answers per route, so ask for each route the index says stops here.
    const routes = [...new Set(routesAtStop(stop.stop).filter(r => r.co === 'CTB').map(r => r.route))].slice(0, 12);
    const lists = await Promise.all(routes.map(async route => {
      try {
        const response = await fetch(CTB_BASE + '/eta/CTB/' + stop.stop + '/' + encodeURIComponent(route),
                                     { signal: AbortSignal.timeout(10000) });
        return response.ok ? ((await response.json()).data || []) : [];
      } catch (error) { return []; }
    }));
    rows = lists.flat();
  }
  return rows === null ? null : rows.map(row => Object.assign({}, row,
    { stop: stop.stop, stopName_en: stop.name_en, stopName_tc: stop.name_tc, co: row.co || co }));
}

async function stopLoadRows(force) {
  const stop = stopState.stop;
  if (!stop) return;
  if (!force && stopState.rows && Date.now() - stopState.fetchedAt < 30000) return;
  stopState.loading = true; stopState.alert = null; renderStopView();
  // One screen for every bay of the group: ask each, show all.
  const group = stopGroupNow();
  const results = await Promise.all(group.map(s => fetchPoleRows(s).catch(() => undefined)));
  if (stopState.stop !== stop) return;                   // moved on meanwhile
  const failed = results.filter(r => r === undefined).length;
  if (failed === results.length) {
    stopState.rows = []; stopState.alert = T('etaOffline');
  } else {
    const live = results.filter(Array.isArray);
    stopState.noLive = !live.length;
    stopState.rows = live.flat();
  }
  stopState.fetchedAt = Date.now(); stopState.loading = false;
  const rowsBox = document.getElementById('stop-rows');
  if (rowsBox && document.activeElement && document.activeElement.id === 'stop-filter') rowsBox.innerHTML = stopRowsHtml();
  else renderStopView();
}

function renderStopView() {
  const view = document.getElementById('stopview');
  if (!view) return;
  const st = stopState;
  let html = '';   // no heading: the tab is the heading, and the space is worth more

  // The typed destination, if any, narrows every list on this screen to
  // poles that have a direct bus there — and each pole's line to just those
  // buses. A pole that cannot take you where you said is not an option.
  const destIds = destIdsNow();
  const filtering = !!(destIds && destIds.size);
  const keep = stop => !filtering || reachingRoutes(stop.stop, destIds).length > 0;

  const poleButton = (group, metres) => {
    const stop = group[0];
    const chip = group.length > 1 ? T('stopBays').replace('{n}', group.length) : poleCodeOf(stop);
    return '<button data-stop-id="' + esc(stop.stop) + '"><span class="pickmain">📍 ' + esc(stopName(stop)) +
      (chip ? ' <span class="polecode">' + esc(chip) + '</span>' : '') +
      poleRoutesLine(group.map(g => g.stop), 4, filtering ? destIds : null) + '</span>' +
      (metres != null ? '<span class="mtrdist">' + Math.round(metres) + ' m</span>' : '') + '</button>';
  };

  if (!st.stop) {
    if (st.locating) {
      html += '<div class="favempty">' + T('findingYou') + '</div>';
    } else {
      if (navigator.geolocation && !herePoint && geoChoice() !== 'no' && geoChoice() !== 'yes') {
        html += '<div class="mtrgeo"><div class="geotitle">' + T('stopGeoTitle') + '</div>' +
                '<div class="geobody">' + T('stopGeoBody') + '</div>' +
                '<div class="geobtns"><button class="geoyes" data-stop-act="geo-yes">' + T('geoYes') + '</button>' +
                '<button class="geono" data-stop-act="geo-no">' + T('geoNo') + '</button></div></div>';
      } else if (navigator.geolocation && !herePoint) {
        html += '<div class="mtrpick"><button data-stop-act="geo-yes">' + T('myLocation') + '</button></div>';
      }
      if (st.indexing || !stopIndex) html += '<div class="rshint">' + T('stopIndexing') + '</div>';
      // Where are you going? Answered from the poles around you.
      const destTyped = String(st.destQuery || '').trim();
      const destSaved = destTyped && isSavedDest(destTyped);
      const canSaveDest = destTyped && (destSaved || filtering);   // only a name that names real stops
      html += '<div class="mtrsub">' + T('stopDestPh').replace(/[（(].*$/, '') + '</div>' +
              '<div class="frow"><input id="stop-dest" type="text" placeholder="' + esc(T('stopDestPh')) + '" autocomplete="off" value="' + esc(st.destQuery || '') + '">' +
              (canSaveDest ? '<button class="rsstar' + (destSaved ? ' on' : '') + '" data-stop-act="deststar" title="' + esc(T(destSaved ? 'stopDestUnstar' : 'stopDestStar')) + '" aria-label="' + esc(T(destSaved ? 'stopDestUnstar' : 'stopDestStar')) + '">' + (destSaved ? '★' : '☆') + '</button>' : '') +
              '</div>' +
              '<div id="stop-dest-results"></div>';
      if (stopDests.length) {
        // One tap sets the place; tapping the lit one again clears it.
        html += '<div class="mtrsub">' + T('stopDestSaved') + '</div><div class="destchips">' +
          stopDests.map(d => '<button class="destchip' + (d === destTyped ? ' on' : '') + '" data-stop-act="dest" data-name="' + esc(d) + '">' + (d === destTyped ? '★ ' : '') + esc(d) + '</button>').join('') +
          '</div>';
      }
      // The starting stop: type it, or tap one saved. The nearest poles come
      // last — they are the fallback when you have not said where you are.
      html += '<div class="mtrsub sectionbreak">' + T('stopStartHead') + '</div>' +
              '<div class="frow"><input id="stop-search" type="text" placeholder="' + esc(T('stopSearchPh')) + '" autocomplete="off"></div>' +
              '<div class="mtrpick" id="stop-search-results"></div>';
      // Saved poles as one-tap pills, same shape as the saved places above.
      const savedShown = stopFavs.slice(0, MAX_STOPS);   // always shown — they are yours, whatever the place
      if (savedShown.length) {
        html += '<div class="mtrsub">' + T('stopSavedPicks') + '</div><div class="destchips">' +
          savedShown.map(f => '<button class="destchip" data-stop-act="fav" data-index="' + stopFavs.indexOf(f) + '">📍 ' + esc(stopName(f)) +
            (poleCodeOf(f) ? ' <small>' + esc(poleCodeOf(f)) + '</small>' : '') + '</button>').join('') + '</div>';
      }
      if (st.destQuery && destIds && !destIds.size)
        html += '<div class="favempty">' + T('stopDestNoName').replace('{d}', esc(st.destQuery)) + '</div>';
      if (filtering) html += '<div class="rshint">' + T('stopShowingTo').replace('{d}', esc(st.destQuery)) + '</div>';
      if (herePoint) {
        const nearAll = stopsNear(herePoint.lat, herePoint.lng, filtering ? 600 : STOP_NEAR_M).filter(n => !n.stop.isStation);
        const near = groupPoles(nearAll, keep, filtering ? 6 : 4);
        if (near.length)
          html += '<div class="mtrsub sectionbreak">' + T('stopNearby') + '</div><div class="mtrpick">' + near.map(n => poleButton(n.group, n.metres)).join('') + '</div>';
        else
          html += '<div class="favempty">' + (filtering ? T('stopNearNoneTo').replace('{d}', esc(st.destQuery)) : T('stopNoneNear')) + '</div>';
      }
    }
    view.innerHTML = html;
    if (st.destQuery) stopRenderDest(st.destQuery);
    return;
  }

  // ---- 2. THE STOP ----
  const stop = st.stop;
  const group = stopGroupNow();
  const groupIds = group.map(g => g.stop);
  const here = herePoint ? Math.round(metresBetween(herePoint.lat, herePoint.lng, Number(stop.lat), Number(stop.long))) : null;
  const saved = isSavedStop(stop.stop);
  const code = poleCodeOf(stop);
  const chip = group.length > 1 ? T('stopBays').replace('{n}', group.length) : code;
  html += '<div class="mtrsta"><div class="mtrname">🚏 ' + esc(stopName(stop)) +
          (chip ? ' <span class="polecode">' + esc(chip) + '</span>' : '') +
          (here !== null ? '<small>' + T('mtrAway').replace('{m}', here) + '</small>' : '') + '</div>' +
          // Save / unsave is one small star beside 更改 — the full-width
          // 已收藏 bar it replaces was a whole line saying something the
          // rider already knew, on the screen where every line counts.
          '<button class="' + (saved ? 'rsstar on' : 'rsstar') + '" data-stop-act="star" title="' + esc(T(saved ? 'stopSavedBtn' : 'stopSaveBtn')) +
          '" aria-label="' + esc(T(saved ? 'stopSavedBtn' : 'stopSaveBtn')) + '">' + (saved ? '★' : '☆') + '</button>' +
          '<button class="refreshbtn" data-stop-act="change">' + T('mtrChange') + '</button></div>';

  // ---- 3. EVERY BUS FROM IT, narrowed to a direction if asked ----
  html += '<div class="mtrhead"><div class="mtrsub">' + T('stopRoutesHere') + '</div>' +
          '<button class="refreshbtn" data-stop-act="refresh"' + (st.loading ? ' disabled' : '') + '>' +
          T(st.loading ? 'refreshing' : 'refresh') + '</button></div>' +
          '<div class="frow"><input id="stop-filter" type="text" placeholder="' + esc(T('stopFilterPh')) + '" autocomplete="off" value="' + esc(st.destFilter || '') + '"></div>' +
          '<div id="stop-rows">' + stopRowsHtml() + '</div>';
  view.innerHTML = html;
}

// The route rows for the chosen pole, filtered by destination when one is
// typed. Kept separate so typing in the filter redraws only this part and
// the box keeps focus.
function stopRowsHtml() {
  const st = stopState, stop = st.stop;
  if (!stop) return '';
  const stamp = st.fetchedAt ? new Date(st.fetchedAt).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) : '';
  const destIds = st.destFilter ? stopIdsMatching(st.destFilter) : null;
  const groupIds = stopGroupNow().map(g => g.stop);
  let html = '';
  if (st.loading && !st.rows) return '<div class="favempty">' + T('rsCheckingEta') + '</div>';
  if (st.alert) return '<div class="mtralert">⚠ ' + esc(st.alert) + '</div>';
  if (st.noLive) {
    let routes = routesServingAny(groupIds);
    if (destIds) routes = routes.filter(r => routeReaches(r.key, r.seq, destIds));
    if (!routes.length && destIds) return '<div class="favempty">' + T('stopFilterNone').replace('{d}', esc(st.destFilter)) + '</div>';
    return '<div class="rshint">' + T('stopNoLive') + '</div>' +
      routes.map(r => '<div class="stoproute"><span class="rt">' + esc(r.route) + '</span>' +
        '<span class="quiet">' + (r.dest ? T('towards') + ' ' + esc(r.dest) + ' · ' : '') + esc(r.co) + '</span></div>').join('');
  }
  if (st.rows) {
    let rows = st.rows;
    let arrive = null;
    if (destIds) {
      arrive = new Map();                       // route key → stops from here to the place
      rows = rows.filter(row => {
        const key = routeKeyForRow(row);
        const seq = Number(row.seq) || (routesServing(row.stop || stop.stop).find(r => r.key === key) || {}).seq || 0;
        const reach = routeReaches(key, seq, destIds);
        if (reach) arrive.set(key, reach.stopsAway);
        return !!reach;
      });
      if (!rows.length) return '<div class="favempty">' + T('stopFilterNone').replace('{d}', esc(st.destFilter)) + '</div>';
      html += '<div class="rshint">' + T('stopFilterOn').replace('{d}', esc(st.destFilter)) + '</div>';
    } else {
      html += '<div class="rshint">' + T('stopTapRoute') + '</div>';
    }
    html += formatArrivals(rows, arrive ? { arrive, destName: st.destFilter } : null);
    if (stamp) html += '<div class="mtrupdated">' + T('updatedAt').replace('{t}', stamp) + '</div>';
  }
  return html;
}

// "I want to go to X": every pole within 600 m, and every bus from it that
// stops at X further down its route. Grouped by pole, nearest first, so the
// answer is "cross to MK752 and take the 60X", not a list of route numbers.
function stopRenderDest(query) {
  const box = document.getElementById('stop-dest-results');
  if (!box) return;
  stopState.destQuery = query;
  const q = String(query || '').trim();
  box.innerHTML = '';
  if (q.length < 1) return;
  if (!stopIndex) { box.innerHTML = '<div class="rshint">' + T('stopIndexing') + '</div>'; return; }
  if (!herePoint) { box.innerHTML = '<div class="favempty">' + T('stopDestNeedLoc') + '</div>'; return; }
  // The picker itself now narrows every list to poles that reach the place typed.
}

function stopRenderSearch(query) {
  const box = document.getElementById('stop-search-results');
  if (!box) return;
  const needle = tidyName(query);
  box.innerHTML = '';
  if (needle.length < 1) return;
  const destIds = destIdsNow();
  const filtering = !!(destIds && destIds.size);
  const stops = allPlannableStops().filter(st => !st.isStation);
  let named = stops.filter(stop => nameMatches(stop, needle, false));
  if (!named.length && needle.length >= 2) named = stops.filter(stop => nameMatches(stop, needle, true));
  // Both ends known: list the STATIONS that match, each as one card even
  // when it is several poles (屯門公路轉車站 is TM750 and TM756, two stops on
  // the same 60X run). The card names the buses that reach the place; the
  // tap opens every one of those poles together, filtered to the place and
  // sorted soonest-arrival first — the full answer, with live times.
  if (filtering) {
    const groups = new Map();
    for (const stop of named) {
      const reach = reachingRoutes(stop.stop, destIds);
      if (!reach.length) continue;
      const k = stationKey(stop);
      if (!groups.has(k)) groups.set(k, { stops: [], best: Infinity });
      const g = groups.get(k);
      g.stops.push(stop);
      g.best = Math.min(g.best, ...reach.map(x => x.reach.stopsAway));
    }
    const list = [...groups.values()].sort((a, b) => a.best - b.best).slice(0, 8);
    const place = esc(stopState.destQuery);
    // The typed name matched more than one station name: offer them all at
    // once first — "every bus from any 屯門轉車 stop to any 太子站".
    let allCard = '';
    if (list.length > 1) {
      const all = list.flatMap(g => g.stops);
      const ids = all.map(x => x.stop);
      allCard = '<button data-stop-id="' + esc(all[0].stop) + '" data-stop-group="' + esc(ids.join(',')) + '"><span class="pickmain">🚏 ' +
        esc(T('stopAllFrom').replace('{s}', query.trim())) + ' <span class="polecode">' + esc(T('stopBays').replace('{n}', all.length)) + '</span>' +
        poleRoutesLine(ids, 6, destIds) + '</span></button>';
    }
    box.innerHTML = list.length
      ? '<div class="mtrsub">' + T('stopOptHead').replace('{s}', esc(query.trim())).replace('{d}', place) + '</div>' + allCard +
        list.map(g => {
          // Board at the pole nearest the phone, else the first named.
          const lead = herePoint
            ? g.stops.slice().sort((a, b) => metresBetween(herePoint.lat, herePoint.lng, Number(a.lat), Number(a.long)) - metresBetween(herePoint.lat, herePoint.lng, Number(b.lat), Number(b.long)))[0]
            : g.stops[0];
          const ids = g.stops.map(x => x.stop);
          const chip = g.stops.length > 1 ? T('stopBays').replace('{n}', g.stops.length) : poleCodeOf(lead);
          return '<button data-stop-id="' + esc(lead.stop) + '" data-stop-group="' + esc(ids.join(',')) + '"><span class="pickmain">🚏 ' + esc(stopName(lead)) +
            (chip ? ' <span class="polecode">' + esc(chip) + '</span>' : '') +
            poleRoutesLine(ids, 6, destIds) + '</span></button>';
        }).join('')
      : '<div class="favempty">' + (named.length ? T('stopSearchNoneTo').replace('{d}', place) : T('noMatch')) + '</div>';
    return;
  }
  const keep = stop => true;
  const hits = groupPoles(named, keep, 8);
  box.innerHTML = hits.length
    ? hits.map(h => { const stop = h.group[0];
        const chip = h.group.length > 1 ? T('stopBays').replace('{n}', h.group.length) : poleCodeOf(stop);
        return '<button data-stop-id="' + esc(stop.stop) + '"><span class="pickmain">🚏 ' + esc(stopName(stop)) +
        (chip ? ' <span class="polecode">' + esc(chip) + '</span>' : '') +
        poleRoutesLine(h.group.map(g => g.stop), 4, filtering ? destIds : null) + '</span></button>'; }).join('')
    : '<div class="favempty">' + (filtering && named.length ? T('stopSearchNoneTo').replace('{d}', esc(stopState.destQuery)) : T('noMatch')) + '</div>';
}

document.getElementById('stopview').addEventListener('click', event => {
  // The ☆ on a route row is the app-wide "save this bus" star; let it through.
  if (event.target.closest('[data-star]')) return;
  const el = event.target.closest('[data-stop-id],[data-stop-act],.eta-row');
  if (!el) return;
  if (el.dataset.stopId) {
    const stop = findStopById(el.dataset.stopId);
    if (stop) {
      const groupStops = el.dataset.stopGroup ? el.dataset.stopGroup.split(',').map(findStopById).filter(Boolean) : null;
      stopSetStop(stop, groupStops);
      const carry = el.dataset.filter || stopState.destQuery;
      if (carry) { stopState.destFilter = carry; renderStopView(); }
    }
    return;
  }
  if (el.classList.contains('eta-row')) {
    // The row's own star carries route, direction, type and company.
    const star = el.querySelector('[data-star]');
    if (star) openSavedDepartureRoute({ route: star.dataset.route, dir: star.dataset.dir,
                                        serviceType: star.dataset.type, co: star.dataset.co });
    return;
  }
  switch (el.dataset.stopAct) {
    case 'change':  stopState = Object.assign(freshStopState(), { locateTried: true, destQuery: stopState.destQuery, indexing: stopState.indexing }); renderStopView(); break;
    case 'refresh': stopLoadRows(true); break;
    case 'geo-yes': rememberGeoChoice('yes'); stopLocate(); break;
    case 'geo-no':  rememberGeoChoice('no'); renderStopView(); break;
    case 'dest': {
      const name = el.dataset.name || '';
      stopState.destQuery = stopState.destQuery === name ? '' : name;
      renderStopView();
      break;
    }
    case 'deststar': {
      const name = String(stopState.destQuery || '').trim();
      const result = toggleStopDest(name);
      if (result === null) { status.textContent = T('stopDestFull'); break; }
      status.textContent = T(result ? 'stopDestSavedMsg' : 'stopDestRemovedMsg').replace('{d}', name);
      renderStopView();
      break;
    }
    case 'fav':     stopOpenSaved(stopFavs[Number(el.dataset.index)]); break;
    case 'star': {
      const result = toggleStopFav(stopState.stop);
      if (result === null) { status.textContent = T('stopFull'); break; }
      status.textContent = T(result ? 'stopSavedMsg' : 'stopRemovedMsg').replace('{s}', stopName(stopState.stop));
      renderStopView();
      break;
    }
  }
});
document.getElementById('stopview').addEventListener('input', event => {
  if (event.target.id === 'stop-search') stopRenderSearch(event.target.value);
  if (event.target.id === 'stop-dest') {
    stopState.destQuery = event.target.value;
    const pos = event.target.selectionStart;
    renderStopView();                              // the lists themselves change
    const again = document.getElementById('stop-dest');
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
    stopRenderDest(event.target.value);
  }
  if (event.target.id === 'stop-filter') {
    stopState.destFilter = event.target.value;
    const rows = document.getElementById('stop-rows');
    if (rows) rows.innerHTML = stopRowsHtml();
  }
});

// ============================================================
// THE MTR TAB — nearest station, line, direction, next trains
// ============================================================
// The official line colours, used only as a stripe on the line buttons: the
// words stay dark on white, so the colour helps but is never relied on.
const MTR_LINE_COLOURS = { AEL:'#00888A', TCL:'#F3982D', TWL:'#E2231A', ISL:'#0075C2',
  KTL:'#00AF41', TKL:'#7D499D', EAL:'#5EB7E8', TML:'#9C2E00', SIL:'#B5BD00', DRL:'#EB6EA5' };
const MTR_NEAR_M   = 1500;     // further than this and "nearest" is not near
const MTR_CACHE_MS = 30000;    // the feed itself is refreshed about this often

let mtrState = freshMtrState();
function freshMtrState() {
  return { station:null, line:null, dir:null, dest:null,
           block:null, blockKey:null, fetchedAt:0, alert:null,
           loading:false, locating:false, locateTried:false, noneNear:false };
}

function stationName(code) {
  const s = mtrData && mtrData.stations[code];
  return s ? (lang === 'zh' ? (s[1] || s[0]) : s[0]) : code;
}

// The running order of this line that passes through this station (some
// lines have branch variants), so "ahead" means something.
function mtrOrderFor(line, station, alsoWith) {
  const variants = (mtrData.lines || {})[line] || [];
  return variants.find(v => v.includes(station) && (!alsoWith || v.includes(alsoWith)))
      || variants.find(v => v.includes(station)) || variants[0] || [];
}

// A saved train is the MTR screen with its three answers already given.
function mtrOpenSaved(t) {
  if (!t) return;
  mtrState = Object.assign(freshMtrState(), { locateTried: true, station: t.station, line: t.line, dir: t.dir });
  if (activeMode !== 'mtr') { showMode('mtr'); return; }   // openMtrView keeps a preset station
  renderMtrView(); mtrLoadBlock();
}

// The feed for one line at one station, both directions, or null.
async function fetchTrainBlock(line, station) {
  const url = MTR_ETA_URL + '?line=' + encodeURIComponent(line) +
              '&sta=' + encodeURIComponent(station) + '&lang=' + (lang === 'zh' ? 'TC' : 'EN');
  const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
  if (!response.ok) throw new Error('server said ' + response.status);
  const data = await response.json();
  if (data.status === 0) return { alert: data.message || T('trainAlert') };
  return (data.data || {})[line + '-' + station] || {};
}

async function loadTrainFavEta(t, index) {
  const cell = document.getElementById('trainfav-eta-' + index);
  if (!cell) return;
  try {
    const block = await fetchTrainBlock(t.line, t.station);
    if (!document.getElementById('trainfav-eta-' + index)) return;
    if (block.alert) { cell.textContent = block.alert; cell.classList.add('quiet'); return; }
    const mins = (block[t.dir] || []).filter(x => x.valid !== 'N').map(x => Number(x.ttnt))
      .filter(n => isFinite(n) && n >= 0).slice(0, 3);
    if (!mins.length) { cell.textContent = T('noneDue'); cell.classList.add('quiet'); return; }
    cell.textContent = mins.map(n => n === 0 ? T('due') : n + T('min')).join(' · ');
    cell.classList.remove('quiet');
  } catch (error) { cell.textContent = T('etaOffline'); cell.classList.add('quiet'); }
}

function openMtrView() {
  const panel = document.getElementById('panel');
  const view  = document.getElementById('mtrview');
  panel.classList.remove('favmode', 'setmode', 'routemode', 'stopmode');
  document.getElementById('favview').style.display = 'none';
  document.getElementById('setview').style.display = 'none';
  document.getElementById('stopview').style.display = 'none';
  view.style.display = 'block';
  panel.classList.add('mtrmode');
  panel.scrollTop = 0;

  if (!mtrData) {
    view.innerHTML = '<div class="favhead">🚇 ' + T('mtrTitle') + '</div>' +
                     '<div class="favempty">' + T('loading') + '</div>';
    loadMtr().then(() => { if (activeMode === 'mtr') openMtrView(); });
    return;
  }

  if (!mtrState.station) {
    if (herePoint) {
      const near = railStationsNear(herePoint.lat, herePoint.lng, MTR_NEAR_M);
      if (near.length) { mtrSetStation(near[0].code); return; }
      mtrState.noneNear = true;
    } else if (navigator.geolocation && geoChoice() === 'yes'
               && !mtrState.locating && !mtrState.locateTried) {
      // They already said yes once; do not ask again, just look.
      mtrState.locateTried = true;
      mtrLocate();
    }
  }
  renderMtrView();
  if (mtrState.station && mtrState.line) mtrLoadBlock();
}

function mtrLocate() {
  if (!navigator.geolocation) { status.textContent = T('noGeo'); return; }
  mtrState.locating = true; renderMtrView();
  status.textContent = T('findingYou');
  navigator.geolocation.getCurrentPosition(
    position => {
      herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
      mtrState.locating = false;
      const near = railStationsNear(herePoint.lat, herePoint.lng, MTR_NEAR_M);
      if (near.length) mtrSetStation(near[0].code);
      else { mtrState.noneNear = true; renderMtrView(); }
    },
    () => { mtrState.locating = false; status.textContent = T('locationFailed'); renderMtrView(); },
    { enableHighAccuracy:true, timeout:10000 });
}

function mtrSetStation(code) {
  mtrState = Object.assign(freshMtrState(), { locateTried: mtrState.locateTried, station: code });
  const lines = whichLinesServe(code);
  if (lines.length === 1) mtrState.line = lines[0];     // one line is not a choice
  renderMtrView();
  if (mtrState.line) mtrLoadBlock();
}
function mtrSetLine(line) {
  Object.assign(mtrState, { line, dir:null, dest:null, block:null, blockKey:null, alert:null });
  renderMtrView(); mtrLoadBlock();
}
function mtrSetDir(dir)   { mtrState.dir = dir; mtrState.dest = null; renderMtrView(); }
function mtrSetDest(code) { mtrState.dest = (mtrState.dest === code ? null : code); renderMtrView(); }

// One request: the feed for this line at this station, both directions.
async function mtrLoadBlock(force) {
  const { line, station } = mtrState;
  if (!line || !station) return;
  const key = line + '-' + station;
  if (!force && mtrState.blockKey === key && Date.now() - mtrState.fetchedAt < MTR_CACHE_MS) return;
  mtrState.loading = true; renderMtrView();
  try {
    const url = MTR_ETA_URL + '?line=' + encodeURIComponent(line) +
                '&sta=' + encodeURIComponent(station) + '&lang=' + (lang === 'zh' ? 'TC' : 'EN');
    const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const data = await response.json();
    if (mtrState.line !== line || mtrState.station !== station) return;   // moved on meanwhile
    if (data.status === 0) { mtrState.alert = data.message || T('trainAlert'); mtrState.block = {}; }
    else { mtrState.alert = null; mtrState.block = (data.data || {})[key] || {}; }
  } catch (error) {
    mtrState.block = null; mtrState.alert = T('etaOffline');
  }
  mtrState.blockKey = key; mtrState.fetchedAt = Date.now(); mtrState.loading = false;
  // One direction with trains is not a choice either.
  const dirs = mtrDirections();
  if (!mtrState.dir && dirs.length === 1) mtrState.dir = dirs[0].key;
  if (mtrState.dir && !dirs.some(d => d.key === mtrState.dir)) mtrState.dir = dirs.length === 1 ? dirs[0].key : null;
  renderMtrView();
}

function mtrTrains(key) {
  const block = mtrState.block || {};
  return (block[key] || []).filter(t => t.valid !== 'N')
    .map(t => ({ min: Number(t.ttnt), dest: t.dest, plat: t.plat }))
    .filter(t => isFinite(t.min) && t.min >= 0);
}

// Directions are named by where the trains are actually going, read from the
// feed, never guessed from the timetable's idea of "up".
function mtrDirections() {
  const out = [];
  for (const key of ['UP', 'DOWN']) {
    const trains = mtrTrains(key);
    if (trains.length) out.push({ key, dest: trains[0].dest });
  }
  return out;
}

// The line laid out left to right, with this station in the middle. Which
// direction is "left" is decided by where its terminus sits in the running
// order, so the two direction buttons underneath can sit on the same sides
// as the stations they lead to.
function mtrSides() {
  const st = mtrState;
  const dirs = mtrDirections();
  if (!st.line || !st.station || !dirs.length) return null;
  const order = mtrOrderFor(st.line, st.station, dirs[0].dest);
  const i = order.indexOf(st.station);
  if (i < 0) return null;
  const at = d => order.indexOf(d.dest);
  const left  = dirs.find(d => at(d) >= 0 && at(d) < i) || null;
  const right = dirs.find(d => d !== left && at(d) > i) || dirs.find(d => d !== left) || null;
  return { order, i, left, right };
}
// Centre the strip on the station, then listen: when the rider slides it
// and lets go, whichever station is now in the middle becomes the station,
// and directions, trains and destination follow from it.
let mtrStripSettled = 0;
function mtrCentreStrip() {
  const strip = document.getElementById('mtr-strip');
  const here = strip && strip.querySelector('.mtrstop.here');
  if (!strip || !here) return;
  strip.scrollLeft = Math.max(0, here.offsetLeft - strip.clientWidth / 2 + here.offsetWidth / 2);
  mtrStripSettled = Date.now();
  let timer = null;
  strip.onscroll = () => {
    if (Date.now() - mtrStripSettled < 400) return;      // our own centring, not a slide
    clearTimeout(timer);
    timer = setTimeout(() => {
      const middle = strip.scrollLeft + strip.clientWidth / 2;
      let best = null, bestGap = Infinity;
      for (const chip of strip.querySelectorAll('.mtrstop')) {
        const gap = Math.abs(chip.offsetLeft + chip.offsetWidth / 2 - middle);
        if (gap < bestGap) { bestGap = gap; best = chip; }
      }
      const code = best && best.dataset.code;
      if (!code || code === mtrState.station) { mtrCentreStrip(); return; }
      mtrState = Object.assign(freshMtrState(), { locateTried: true, station: code, line: mtrState.line });
      renderMtrView();
      mtrLoadBlock();
    }, 220);
  };
}

// Every station ahead in the chosen direction, to the end of the line.
function mtrStationsAhead() {
  const { line, station, dir } = mtrState;
  if (!line || !station || !dir) return [];
  const trains = mtrTrains(dir);
  if (!trains.length) return [];
  const order = mtrOrderFor(line, station, trains[0].dest);
  const i = order.indexOf(station), d = order.indexOf(trains[0].dest);
  if (i < 0 || d < 0 || d === i) return [];
  return d > i ? order.slice(i + 1) : order.slice(0, i).reverse();
}

function clockIn(minutes) {
  return new Date(Date.now() + minutes * 60000)
    .toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function renderMtrView() {
  const view = document.getElementById('mtrview');
  if (!view || !mtrData) return;
  const st = mtrState;
  let html = '<div class="favhead">🚇 ' + T('mtrTitle') + '</div>';

  // ---- 1. WHICH STATION ----
  if (!st.station) {
    if (st.locating) {
      html += '<div class="favempty">' + T('findingYou') + '</div>';
    } else {
      if (navigator.geolocation && geoChoice() !== 'no' && geoChoice() !== 'yes' && !herePoint) {
        html += '<div class="mtrgeo"><div class="geotitle">' + T('mtrGeoTitle') + '</div>' +
                '<div class="geobody">' + T('mtrGeoBody') + '</div>' +
                '<div class="geobtns"><button class="geoyes" data-mtr-act="geo-yes">' + T('geoYes') + '</button>' +
                '<button class="geono" data-mtr-act="geo-no">' + T('geoNo') + '</button></div></div>';
      } else if (navigator.geolocation && !herePoint) {
        html += '<div class="mtrpick"><button data-mtr-act="geo-yes">' + T('myLocation') + '</button></div>';
      }
      if (herePoint) {
        const near = railStationsNear(herePoint.lat, herePoint.lng, MTR_NEAR_M);
        if (near.length) {
          html += '<div class="mtrsub">' + T('mtrNearby') + '</div><div class="mtrpick">' +
            near.slice(0, 3).map(n => '<button data-mtr-station="' + n.code + '">📍 ' + esc(stationName(n.code)) +
              '<span class="mtrdist">' + Math.round(n.metres) + ' m</span></button>').join('') + '</div>';
        } else {
          html += '<div class="favempty">' + T('mtrNoneNear') + '</div>';
        }
      }
      const saved = savedStations();
      if (saved.length) {
        html += '<div class="mtrsub">' + T('mtrSaved') + '</div><div class="mtrpick">' +
          saved.map(sv => '<button data-mtr-station="' + sv.code + '">⭐ ' + esc(stationName(sv.code)) + '</button>').join('') + '</div>';
      }
      if (trainFavs.length) {
        html += '<div class="mtrsub">' + T('mtrSavedTrains') + '</div><div class="mtrpick">' +
          trainFavs.map((t, i) => '<button data-mtr-act="train" data-index="' + i + '" style="border-left:12px solid ' +
            (MTR_LINE_COLOURS[t.line] || '#999') + '">★ ' + esc(stationName(t.station)) + ' · ' +
            T('towards') + ' ' + esc(stationName(t.dest)) + '</button>').join('') + '</div>';
      }
      html += '<div class="mtrsub">' + T('mtrSearchPh').replace('…', '') + '</div>' +
              '<div class="frow"><input id="mtr-search" type="text" placeholder="' + esc(T('mtrSearchPh')) + '" autocomplete="off"></div>' +
              '<div class="mtrpick" id="mtr-search-results"></div>';
    }
    view.innerHTML = html;
    return;
  }

  // ---- station chosen ----
  // The station card only draws when there is no strip to stand in for it:
  // once the line is known, the big centred chip on the strip is the station,
  // and sliding the strip changes it.
  const here = herePoint ? Math.round(metresBetween(herePoint.lat, herePoint.lng,
                 mtrData.stations[st.station][2], mtrData.stations[st.station][3])) : null;
  const headerCard = '<div class="mtrsta"><div class="mtrname">📍 ' + esc(stationName(st.station)) +
          (here !== null ? '<small>' + T('mtrAway').replace('{m}', here) + '</small>' : '') + '</div>' +
          '<button class="refreshbtn" data-mtr-act="change">' + T('mtrChange') + '</button></div>';

  // ---- 2. WHICH LINE ----
  const lines = whichLinesServe(st.station);
  const lineChooser = lines.length > 1
    ? '<div class="mtrsub">' + T('mtrChooseLine') + '</div><div class="mtrlines">' +
      lines.map(l => '<button class="mtrline' + (st.line === l ? ' on' : '') + '" data-mtr-line="' + l +
        '" style="border-left-color:' + (MTR_LINE_COLOURS[l] || '#999') + '">' + esc(railLineName(l)) + '</button>').join('') +
      '</div>'
    : '';
  if (!st.line) { view.innerHTML = html + headerCard + lineChooser; return; }

  // ---- 3. WHICH DIRECTION ----
  if (st.loading && !st.block) {
    view.innerHTML = html + headerCard + lineChooser + '<div class="favempty">' + T('rsCheckingEta') + '</div>';
    return;
  }
  const dirs = mtrDirections();
  if (dirs.length === 0) {
    html += headerCard + lineChooser;
    if (st.alert) html += '<div class="mtralert">⚠ ' + esc(st.alert) + '</div>';
    else html += '<div class="favempty">' + T('noneDue') + '</div>';
    html += '<div class="mtrpick"><button data-mtr-act="refresh">' + T('refresh') + '</button></div>';
    view.innerHTML = html; return;
  }
  // The line, left to right, this station big in the middle; slide to stand
  // at another station, tap one to make it the destination.
  const sides = mtrSides();
  const colour = MTR_LINE_COLOURS[st.line] || '#999';
  if (sides) {
    html += '<div class="mtrhead"><div class="mtrsub">' + T('mtrLineStrip') + '</div>' +
            '<button class="refreshbtn" data-mtr-act="change">' + T('mtrChange') + '</button></div>' +
            '<div class="mtrstrip" id="mtr-strip"><span class="mtrpad"></span>' +
      sides.order.map((code, j) => {
        const side = j < sides.i ? sides.left : (j > sides.i ? sides.right : null);
        const cls = 'mtrstop' + (j === sides.i ? ' here' : '') + (st.dest === code ? ' on' : '') + (j !== sides.i && !side ? ' off' : '');
        return '<button class="' + cls + '" data-code="' + code + '" style="border-top-color:' + colour + '"' +
          (side ? ' data-mtr-jump="' + code + '" data-side="' + side.key + '"' : ' disabled') + '>' + esc(stationName(code)) + '</button>';
      }).join('') + '<span class="mtrpad"></span></div>' + lineChooser;
    if (st.alert) html += '<div class="mtralert">⚠ ' + esc(st.alert) + '</div>';
    // The two direction buttons sit under the stations they lead to.
    const dirBtn = (d, cls) => d
      ? '<button class="mtrdir ' + cls + (st.dir === d.key ? ' on' : '') + '" data-mtr-dir="' + d.key + '">' +
        (cls === 'left' ? '◀ ' : '') + T('towards') + ' ' + esc(stationName(d.dest)) + (cls === 'right' ? ' ▶' : '') + '</button>'
      : '<div class="mtrdir blank"></div>';
    html += '<div class="mtrsub">' + T('mtrChooseDir') + '</div><div class="mtrdirs">' + dirBtn(sides.left, 'left') + dirBtn(sides.right, 'right') + '</div>';
  } else {
    html += headerCard + lineChooser;
    if (st.alert) html += '<div class="mtralert">⚠ ' + esc(st.alert) + '</div>';
    if (dirs.length > 1) {
      html += '<div class="mtrsub">' + T('mtrChooseDir') + '</div><div class="mtrdirs">' +
        dirs.map(d => '<button class="mtrdir' + (st.dir === d.key ? ' on' : '') + '" data-mtr-dir="' + d.key + '">' +
          T('towards') + ' ' + esc(stationName(d.dest)) + '</button>').join('') + '</div>';
    }
  }
  if (!st.dir) { view.innerHTML = html; mtrCentreStrip(); return; }

  // ---- 4. NEXT TRAINS HERE ----
  const trains = mtrTrains(st.dir).slice(0, 4);
  const stamp = new Date(st.fetchedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const headDest = trains[0] ? trains[0].dest : dirs.find(d => d.key === st.dir).dest;
  const saved = isSavedTrain(st.station, st.line, st.dir);
  html += '<div class="mtrhead"><div class="mtrsub">' + T('mtrNextTrains') + ' · ' + T('towards') + ' ' +
          esc(stationName(headDest)) + '</div>' +
          '<button class="rsstar' + (saved ? ' on' : '') + '" data-mtr-act="star" data-dest="' + headDest +
          '" aria-label="' + T('favTrains') + '">' + (saved ? '★' : '☆') + '</button>' +
          '<button class="refreshbtn" data-mtr-act="refresh"' + (st.loading ? ' disabled' : '') + '>' +
          T(st.loading ? 'refreshing' : 'refresh') + '</button></div>';
  html += trains.map((t, i) => '<div class="mtrtrain' + (i === 0 ? ' hero' : '') + '">' +
    '<div class="mtrmin">' + (t.min === 0 ? T('due') : t.min + T('min')) + '</div>' +
    '<div class="mtrmeta">' + T('towards') + ' ' + esc(stationName(t.dest)) +
    (t.plat ? '<br>' + T('mtrPlatform').replace('{p}', esc(t.plat)) : '') + '</div></div>').join('');
  html += '<div class="mtrupdated">' + T('updatedAt').replace('{t}', stamp) + '</div>';

  // ---- 5. DESTINATION (optional) ----
  const ahead = mtrStationsAhead();
  if (ahead.length) {
    if (!sides) {   // no strip drawn (order unknown): fall back to a plain list
      html += '<div class="mtrsub">' + T('mtrChooseDest') + '</div><div class="mtrdests">' +
        ahead.map(code => '<button class="mtrdest' + (st.dest === code ? ' on' : '') + '" data-mtr-dest="' + code + '">' +
          esc(stationName(code)) + '</button>').join('') + '</div>';
    }
    if (st.dest && ahead.includes(st.dest)) {
      const stops = ahead.indexOf(st.dest) + 1;
      const route = railRoute(st.station, st.dest);
      const ride  = Math.max(1, Math.round(route ? route.cost : stops * 2.5));
      const wait  = trains[0] ? trains[0].min : 0;
      const fare  = railFare(st.station, st.dest);
      html += '<div class="mtrsummary"><div class="big">🚉 ' + esc(stationName(st.dest)) + '</div>' +
        '<div class="line">' + (stops === 1 ? T('mtrOneStop') : T('mtrStops').replace('{n}', stops)) +
        ' · ' + T('mtrRide').replace('{m}', ride) + (fare !== null ? ' · $' + fare.toFixed(1) : '') + '</div>' +
        '<div class="arrive">' + (wait === 0 ? T('mtrArriveNow') : T('mtrArrive').replace('{w}', wait))
          .replace('{t}', clockIn(wait + ride)) + '</div></div>';
    }
  }

  // ---- the planner's train results, if a trip was searched ----
  if (typeof railPicks !== 'undefined' && railPicks.length) {
    html += '<div class="mtrsub">' + T('mtrTrips') + '</div><div class="mtrpick">' +
      '<button data-mtr-act="trips">🧭 ' + T('mtrShowTrips').replace('{n}', railPicks.length) + '</button></div>';
  }
  view.innerHTML = html;
  mtrCentreStrip();
}

function mtrRenderSearch(query) {
  const box = document.getElementById('mtr-search-results');
  if (!box || !mtrData) return;
  const q = String(query || '').trim().toLowerCase();
  box.innerHTML = '';
  if (!q) return;
  const hits = Object.keys(mtrData.stations).filter(code => {
    const s = mtrData.stations[code];
    return (s[1] && s[1].includes(q)) || s[0].toLowerCase().includes(q);
  }).slice(0, 6);
  box.innerHTML = hits.length
    ? hits.map(code => '<button data-mtr-station="' + code + '">🚇 ' + esc(stationName(code)) + '</button>').join('')
    : '<div class="favempty">' + T('noMatch') + '</div>';
}

// Back to the planner's train cards, for anyone who searched a trip.
function showRailResults() {
  const panel = document.getElementById('panel');
  panel.classList.remove('mtrmode');
  document.getElementById('mtrview').style.display = 'none';
  document.getElementById('compare').style.display = '';
  document.getElementById('journeys').style.display = '';
  currentPicks = railPicks;
  if (!currentPicks.length) return;
  setResultsMode(true);
  buildCompareStrip(currentPicks);
  selectOption(currentPicks[0]);
  panel.scrollTop = 0;
  currentPicks.forEach(pick => loadNextBus(pick));
}

// One listener for the whole screen: it is redrawn from scratch on every
// change, so per-button handlers would be lost on each redraw.
document.getElementById('mtrview').addEventListener('click', event => {
  const el = event.target.closest('[data-mtr-station],[data-mtr-line],[data-mtr-dir],[data-mtr-dest],[data-mtr-jump],[data-mtr-act]');
  if (!el) return;
  const d = el.dataset;
  if (d.mtrJump) {     // a station on the strip: direction follows from its side
    mtrState.dir = d.side;
    mtrState.dest = mtrState.dest === d.mtrJump ? null : d.mtrJump;
    renderMtrView();
    return;
  }
  if (d.mtrStation) return mtrSetStation(d.mtrStation);
  if (d.mtrLine)    return mtrSetLine(d.mtrLine);
  if (d.mtrDir)     return mtrSetDir(d.mtrDir);
  if (d.mtrDest)    return mtrSetDest(d.mtrDest);
  switch (d.mtrAct) {
    case 'change':  mtrState = Object.assign(freshMtrState(), { locateTried: true }); renderMtrView(); break;
    case 'refresh': mtrLoadBlock(true); break;
    case 'geo-yes': rememberGeoChoice('yes'); mtrLocate(); break;
    case 'geo-no':  rememberGeoChoice('no'); renderMtrView(); break;
    case 'trips':   showRailResults(); break;
    case 'star': {
      const entry = { station: mtrState.station, line: mtrState.line, dir: mtrState.dir, dest: d.dest };
      const added = toggleTrainFav(entry);
      status.textContent = T(added ? 'trainSaved' : 'trainRemoved').replace('{s}', stationName(entry.station));
      renderMtrView();
      break;
    }
    case 'train': mtrOpenSaved(trainFavs[Number(d.index)]); break;
  }
});
document.getElementById('mtrview').addEventListener('input', event => {
  if (event.target.id === 'mtr-search') mtrRenderSearch(event.target.value);
});

// ============================================================
// WEATHER — Hong Kong Observatory open data
// ============================================================
// Two calls: the current report (temperature per weather station, plus any
// warning headline) and the warning summary. Both are public, both are
// free, and neither is worth blocking the app for — if the Observatory is
// unreachable the bar simply does not appear.
//
// Fetched once on open and refreshed every 10 minutes, never faster: this
// app's rule is no background chatter, and the Observatory updates hourly.
const HKO_BASE = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php';
const WEATHER_REFRESH_MS = 10 * 60 * 1000;

// Where each Observatory weather station actually is, so "the weather near
// your stop" means the nearest reading rather than the city average.
//
// Keyed by BOTH names on purpose: the feed answers in whichever language it
// was asked in, so a Chinese-only table would match nothing at all in
// English and every stop would quietly fall back to the general reading.
const HKO_STATIONS = [
  ['京士柏','King\'s Park',22.3119,114.1741],
  ['香港天文台','Hong Kong Observatory',22.3022,114.1741],
  ['黃竹坑','Wong Chuk Hang',22.2480,114.1680],
  ['打鼓嶺','Ta Kwu Ling',22.5283,114.1558],
  ['流浮山','Lau Fau Shan',22.4682,113.9836],
  ['大帽山','Tai Mo Shan',22.4103,114.1247],
  ['將軍澳','Tseung Kwan O',22.3153,114.2600],
  ['沙田','Sha Tin',22.4025,114.2100],
  ['屯門','Tuen Mun',22.3908,113.9769],
  ['青衣','Tsing Yi',22.3444,114.1000],
  ['石崗','Shek Kong',22.4361,114.0850],
  ['大美督','Tai Mei Tuk',22.4756,114.2367],
  ['沙田馬場','Sha Tin Racecourse',22.4008,114.2039],
  ['九龍城','Kowloon City',22.3358,114.1928],
  ['跑馬地','Happy Valley',22.2708,114.1836],
  ['黃大仙','Wong Tai Sin',22.3419,114.1938],
  ['赤鱲角','Chek Lap Kok',22.3089,113.9219],
  ['滘西洲','Kau Sai Chau',22.3628,114.3092],
  ['橫瀾島','Waglan Island',22.1831,114.3033],
  ['荃灣可觀','Tsuen Wan Ho Koon',22.3853,114.1092],
  ['荃灣城門谷','Tsuen Wan Shing Mun Valley',22.3819,114.1147],
  ['香港公園','Hong Kong Park',22.2783,114.1614],
  ['筲箕灣','Shau Kei Wan',22.2792,114.2286],
  ['西貢','Sai Kung',22.3758,114.2733],
  ['長洲','Cheung Chau',22.2011,114.0269],
  ['慈雲山','Tsz Wan Shan',22.3506,114.2033],
  ['深水埗','Sham Shui Po',22.3306,114.1594],
  ['啟德跑道公園','Kai Tak Runway Park',22.3061,114.2133],
  ['元朗公園','Yuen Long Park',22.4436,114.0219],
  ['大埔','Tai Po',22.4483,114.1697],
  ['上水','Sheung Shui',22.5017,114.1136],
  ['天水圍','Tin Shui Wai',22.4569,114.0044],
  ['北角','North Point',22.2917,114.1936],
  ['觀塘','Kwun Tong',22.3150,114.2256],
  ['尖沙咀','Tsim Sha Tsui',22.2950,114.1722],
  ['中環','Central',22.2818,114.1580],
  ['機場','Hong Kong International Airport',22.3089,113.9219],
  ['濕地公園','Wetland Park',22.4667,114.0100],
  ['清水灣','Clear Water Bay',22.2631,114.2989],
  ['九龍天文台','Kowloon',22.3022,114.1741]
];

// Beyond this, a reading is not "near" anything. Better to say nothing about
// that end than to print a temperature from the other side of Hong Kong.
const WEATHER_NEAR_METRES = 9000;

// Look-up that accepts whichever name the feed used.
function hkoStationAt(place) {
  const name = String(place || '').trim();
  for (const row of HKO_STATIONS) {
    if (row[0] === name || row[1] === name) return [row[2], row[3]];
  }
  return null;
}

async function loadWeather() {
  const langParam = lang === 'zh' ? 'tc' : 'en';
  try {
    const [report, warnings] = await Promise.all([
      fetch(HKO_BASE + '?dataType=rhrread&lang=' + langParam,
            { signal: AbortSignal.timeout(10000) }).then(r => r.ok ? r.json() : null),
      fetch(HKO_BASE + '?dataType=warnsum&lang=' + langParam,
            { signal: AbortSignal.timeout(10000) }).then(r => r.ok ? r.json() : null)
        .catch(() => null)
    ]);
    if (!report) throw new Error('no report');
    weatherData = { report, warnings };
    renderWeatherBar();
  } catch (error) {
    // Quietly absent rather than an error the rider cannot act on. The bus
    // times are the job; the weather is a courtesy.
    console.warn('Weather unavailable:', error.message);
    // The bar is redrawn anyway: unreachable usually means no connection,
    // and THAT is worth saying — it explains the missing live times too.
    renderWeatherBar();
  }
}

// Nearest Observatory station to a point, with its temperature. Returns null
// when the closest reading is too far to describe that place honestly — the
// Observatory does not have a thermometer on every street.
function weatherNear(point) {
  if (!point || !weatherData) return null;
  const readings = (weatherData.report.temperature || {}).data || [];
  let best = null, bestMetres = Infinity;
  for (const reading of readings) {
    const at = hkoStationAt(reading.place);
    if (!at) continue;
    const metres = metresBetween(point.lat, point.lng, at[0], at[1]);
    if (metres < bestMetres) { bestMetres = metres; best = reading; }
  }
  return bestMetres <= WEATHER_NEAR_METRES ? best : null;
}

// The bar answers one question: what do I need to know before I set off?
// A rainstorm signal is one answer to it; having no connection is another,
// and so is a new version of the app waiting to be used. So all three share
// this one strip rather than each taking its own line of a phone screen.
function renderWeatherBar() {
  const bar = document.getElementById('weatherbar');
  if (!bar) return;
  bar.innerHTML = '';

  const parts = [];
  if (updateWaiting) parts.push(updateChip());
  if (!navigator.onLine) parts.push(offlineChip());
  if (weatherData) parts.push(...weatherParts());

  if (parts.length === 0) { hideWeatherBar(); return; }
  for (const part of parts) bar.appendChild(part);
  showWeatherBar();
}

// The weather half, as elements. Split out from the bar itself so that no
// connection and no weather are two different things: the Observatory being
// unreachable must not be able to hide the notice explaining why it is.
function weatherParts() {
  const parts = [];

  // ---- WARNINGS FIRST ----
  const warnings = weatherData.warnings || {};
  for (const key of Object.keys(warnings)) {
    const warning = warnings[key];
    if (!warning || !warning.name) continue;
    const code = String(warning.code || '');
    // Rainstorm black/red and typhoon 8+ are the ones that stop buses.
    const severe = /^(WRAINB|WRAINR|TC8|TC9|TC10)/.test(code) || /BLACK|RED/i.test(code);
    const amber  = /^(WRAINA|TC3)/.test(code) || /AMBER/i.test(code);
    // `type` carries the specific signal — "一號戒備信號", "紅色暴雨警告信號" —
    // while `name` is only the family it belongs to. Signal 1 and Signal 8
    // are both "熱帶氣旋警告信號"; only one of them stops the buses, so the
    // specific one is what goes on the bar.
    const tag = document.createElement('span');
    tag.className = 'wxwarn' + (severe ? '' : amber ? ' amber' : ' notice');
    tag.textContent = '⚠ ' + (warning.type || warning.name);
    parts.push(tag);
  }

  const item = (label, text) => {
    const span = document.createElement('span');
    span.className = 'wxitem';
    const l = document.createElement('span');
    l.className = 'wxlabel'; l.textContent = label;
    const v = document.createElement('span');
    v.className = 'wxtemp'; v.textContent = text;
    span.appendChild(l); span.appendChild(v);
    return span;
  };

  // ---- WHERE THE RIDER IS ----
  const here = herePoint ? weatherNear(herePoint) : null;
  const icon = (weatherData.report.icon || [])[0];
  if (here) {
    parts.push(item(weatherIcon(icon) + ' ' + plainStopName(here.place),
                    here.value + '°'));
  } else {
    // No location yet: the Observatory headquarters reading stands for
    // "Hong Kong", which is what a general forecast means anyway.
    const readings = (weatherData.report.temperature || {}).data || [];
    const general = readings.find(d => d.place === '香港天文台'
                                    || d.place === 'Hong Kong Observatory')
                 || readings[0];
    if (general) parts.push(item(weatherIcon(icon) + ' ' + T('wxHere'), general.value + '°'));
  }

  // ---- EACH END OF THE TRIP ----
  const atStart = weatherNear(startPoint);
  const atEnd   = weatherNear(endPoint);
  if (atStart) parts.push(item('🟢 ' + plainStopName(atStart.place), atStart.value + '°'));
  if (atEnd)   parts.push(item('🔴 ' + plainStopName(atEnd.place),   atEnd.value + '°'));

  return parts;
}

// A rough face for the Observatory's icon number. Only the broad groups
// matter here — the exact icon is on their own site.
function weatherIcon(code) {
  const n = Number(code);
  if (!isFinite(n)) return '🌡';
  if (n >= 60 && n <= 65) return '🌧';
  if (n >= 70 && n <= 78) return '🌙';
  if (n === 80 || n === 83 || n === 84) return '🌫';
  if (n >= 90) return '🌡';
  if (n <= 51) return '☀️';
  return '⛅';
}

// The bar is fixed, so everything below has to be told how tall it is.
// Measured, never assumed: it grows with the number of warnings.
function showWeatherBar() {
  const bar = document.getElementById('weatherbar');
  bar.style.display = 'flex';
  document.documentElement.style.setProperty('--wxh', bar.offsetHeight + 'px');
}

function hideWeatherBar() {
  const bar = document.getElementById('weatherbar');
  bar.style.display = 'none';
  document.documentElement.style.setProperty('--wxh', '0px');
}

// ============================================================
// THE STOP LIST
// ============================================================
// The map answers "where"; a rider on the bus is asking "how many more?".
// This is that answer: every stop in order, numbered, with the live times
// and a star on each one.
//
// Times are fetched as rows come into view, never all at once. A long route
// is fifty stops, and fifty simultaneous requests to a government API is
// both slow for the user and rude to the service.
function clearRouteStops() {
  if (routeStopsState && routeStopsState.observer) routeStopsState.observer.disconnect();
  if (routeStopsState && routeStopsState.watchId != null && navigator.geolocation)
    navigator.geolocation.clearWatch(routeStopsState.watchId);
  routeStopsState = null;
  const box = document.getElementById('routestops');
  if (box) box.innerHTML = '';
}

function renderRouteStops(context, stops) {
  clearRouteStops();
  const box = document.getElementById('routestops');
  if (!box || !stops.length) return;

  routeStopsState = { context, stops, boardAt: null, alightAt: null, autoBoard: false,
                      watchId: null, observer: null, inFlight: 0, queue: [] };

  const head = document.createElement('div');
  head.className = 'rshead';
  const title = document.createElement('div');
  title.className = 'rstitle';
  title.textContent = context.routeNo + '  ' + context.from + ' → ' + context.to;
  const sub = document.createElement('small');
  sub.textContent = T('stopsOnRoute').replace('{n}', stops.length);
  title.appendChild(sub);
  const close = document.createElement('button');
  close.className = 'rsclose';
  close.textContent = '✕';
  close.title = T('rsClose');
  close.setAttribute('aria-label', T('rsClose'));
  close.addEventListener('click', clearRouteStops);
  // Times are fetched once. A rider waiting at the stop for five minutes is
  // looking at a number that is five minutes old, so they can ask again —
  // by hand, which keeps the app's no-timers rule.
  const refresh = document.createElement('button');
  refresh.className = 'refreshbtn';
  refresh.textContent = T('refresh');
  refresh.addEventListener('click', () => {
    if (!routeStopsState) return;
    const keep = { context: routeStopsState.context, stops: routeStopsState.stops,
                   boardAt: routeStopsState.boardAt, alightAt: routeStopsState.alightAt,
                   autoBoard: routeStopsState.autoBoard };
    const panel = document.getElementById('panel');
    const scrollWas = panel ? panel.scrollTop : 0;
    renderRouteStops(keep.context, keep.stops);
    if (routeStopsState) { Object.assign(routeStopsState, { boardAt: keep.boardAt, alightAt: keep.alightAt, autoBoard: keep.autoBoard }); paintStopCounts(); syncRideWatch(); }
    if (panel) panel.scrollTop = scrollWas;
    status.textContent = T('refreshing');
  });
  head.appendChild(title); head.appendChild(refresh); head.appendChild(close);
  box.appendChild(head);

  const hint = document.createElement('div');
  hint.className = 'rshint';
  hint.textContent = T('rsHint');
  box.appendChild(hint);

  // The ride banner: filled in once both marks are set, hidden otherwise.
  const ride = document.createElement('div');
  ride.id = 'rsride'; ride.className = 'rsride'; ride.style.display = 'none';
  box.appendChild(ride);

  stops.forEach((stop, index) => {
    const row = document.createElement('div');
    row.className = 'rsrow';
    row.dataset.index = index;

    const num = document.createElement('div');
    num.className = 'rsnum';
    num.textContent = index + 1;

    const pick = document.createElement('button');
    pick.className = 'rspick';
    const name = document.createElement('div');
    name.className = 'rsname';
    name.textContent = plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en)
                                                   : stop.name_en);
    const note = document.createElement('div');       // count or boarding tag
    const eta  = document.createElement('div');
    eta.className = 'rseta quiet';
    eta.textContent = T('rsCheckingEta');
    pick.appendChild(name); pick.appendChild(note); pick.appendChild(eta);

    // First tap: where you get on. A later stop: where you get off. Tapping a
    // mark again clears it; tapping an earlier stop moves the boarding mark.
    pick.addEventListener('click', () => {
      const st = routeStopsState;
      st.autoBoard = false;
      if (st.boardAt === null || index < st.boardAt) {
        st.boardAt = index;
        if (st.alightAt !== null && st.alightAt <= index) st.alightAt = null;
      } else if (index === st.boardAt) {
        st.boardAt = null; st.alightAt = null;
      } else if (index === st.alightAt) {
        st.alightAt = null;
      } else {
        st.alightAt = index;
      }
      paintStopCounts();
      syncRideWatch();
      const lat = Number(stop.lat), lng = Number(stop.long);
      if (isFinite(lat) && isFinite(lng)) map.setView([lat, lng], 17);
    });

    const star = document.createElement('button');
    star.className = 'rsstar';
    star.textContent = '☆';
    star.setAttribute('aria-label', 'Save this stop');
    star.addEventListener('click', () => {
      const added = toggleDeparture({
        route: context.routeNo, dir: context.dir, serviceType: context.serviceType,
        co: context.co, stop: stop.stop,
        stopName_en: stop.name_en, stopName_tc: stop.name_tc,
        dest_en: context.destEn, dest_tc: context.destTc
      });
      star.textContent = added ? '★' : '☆';
      star.classList.toggle('on', added);
      status.textContent = (added ? T('departureSaved') : T('departureRemoved'))
        .replace('{r}', context.routeNo);
    });
    if (isSavedDeparture(context.routeNo, context.dir, stop.stop)) {
      star.textContent = '★';
      star.classList.add('on');
    }

    row.appendChild(num); row.appendChild(pick); row.appendChild(star);
    row.etaCell = eta;
    row.noteCell = note;
    box.appendChild(row);
  });

  // Standing within a short walk of a stop on this route, you are almost
  // certainly getting on there. Mark it, and say why it was marked.
  if (routeStopsState.boardAt === null && herePoint) {
    const near = nearestRouteStop(herePoint);
    // Within RS_AUTO_BOARD_M you are at the stop. Further out, up to a real
    // walk, it is still "your nearest stop on this route" — marked, scrolled
    // to, and labelled with the distance so nobody thinks they are there.
    if (near && near.metres <= RS_NEAREST_MARK_M) {
      routeStopsState.boardAt = near.index;
      routeStopsState.autoBoard = true;
      routeStopsState.autoMetres = near.metres;
    }
  }

  paintStopCounts();
  watchForVisibleRows();

  const panel = document.getElementById('panel');
  if (!panel) return;

  if (panel.classList.contains('routemode')) {
    // In route mode the list is already the only thing under the search box,
    // and the box is sticky — scrolling would slide the list's own heading
    // underneath it. Unless a stop was marked for the rider: then that row
    // is what they need, and it may be forty stops down.
    panel.scrollTop = 0;
    if (routeStopsState.autoBoard) {
      const row = box.querySelector('.rsrow[data-index="' + routeStopsState.boardAt + '"]');
      const field = document.getElementById('routefield');
      if (row) panel.scrollTop = Math.max(0, row.offsetTop - (field ? field.offsetHeight : 0) - 12);
    }
    // The blue banner says route, from, to and stop count; so does the header
    // three lines above. On a phone the duplicate costs a third of the screen,
    // and the list is what the rider came for.
    document.getElementById('routebanner').style.display = 'none';
  } else {
    // Built below the whole entry form, so without this it appears off the
    // bottom of the sheet and looks as though nothing happened.
    panel.scrollTop = Math.max(0, box.offsetTop - panel.offsetTop - 8);
  }
}

// How far each stop is from the one the rider marked. Only stops AFTER the
// mark get a count — a stop already behind you is not "3 away", it is gone.
function paintStopCounts() {
  if (!routeStopsState) return;
  const box = document.getElementById('routestops');
  const board = routeStopsState.boardAt, alight = routeStopsState.alightAt;

  for (const row of box.querySelectorAll('.rsrow')) {
    const index = Number(row.dataset.index);
    row.classList.toggle('board', board !== null && index === board);
    row.classList.toggle('alight', alight !== null && index === alight);
    row.classList.toggle('after', board !== null && index > board && (alight === null || index < alight));

    const note = row.noteCell;
    note.className = '';
    note.textContent = '';
    if (board === null) continue;

    if (index === board) {
      note.className = 'rsboardtag';
      const st = routeStopsState;
      note.textContent = !st.autoBoard ? T('rsBoarding')
        : (st.autoMetres > RS_AUTO_BOARD_M ? T('rsBoardNear').replace('{m}', Math.round(st.autoMetres)) : T('rsBoardAuto'));
    } else if (alight !== null && index === alight) {
      note.className = 'rsalighttag';
      note.textContent = T('rsAlight');
    } else if (alight !== null && index > alight) {
      note.className = 'rseta quiet';
      note.textContent = T('rsAfterAlight');
    } else if (index > board) {
      const away = index - board;
      note.className = 'rscount';
      note.textContent = away === 1 ? T('rsOneStopAway')
                                    : T('rsStopsAway').replace('{n}', away);
    } else {
      note.className = 'rseta quiet';
      note.textContent = T('rsBefore');
    }
  }
  paintRideBanner();
}

const RS_AUTO_BOARD_M = 250;    // "standing at the stop", give or take a road
const RS_NEAREST_MARK_M = 1500; // beyond this the nearest stop is not "yours"
const RS_RIDE_NEAR_M  = 600;    // a moving bus is "at" the nearest stop

function rsStopName(index) {
  const stop = routeStopsState && routeStopsState.stops[index];
  if (!stop) return '';
  return plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en);
}

// The stop on this route closest to a point.
function nearestRouteStop(point) {
  if (!routeStopsState || !point) return null;
  let best = null;
  routeStopsState.stops.forEach((stop, index) => {
    const lat = Number(stop.lat), lng = Number(stop.long);
    if (!isFinite(lat) || !isFinite(lng)) return;
    const metres = metresBetween(point.lat, point.lng, lat, lng);
    if (!best || metres < best.metres) best = { index, metres };
  });
  return best;
}

// "How many more?" — answered from where the phone is, not from a guess.
function paintRideBanner() {
  const st = routeStopsState;
  const el = document.getElementById('rsride');
  if (!st || !el) return;
  if (st.boardAt === null || st.alightAt === null) { el.style.display = 'none'; el.innerHTML = ''; return; }

  const total = st.alightAt - st.boardAt;
  let html = '<div class="rsridehead">🚌 ' + esc(rsStopName(st.boardAt)) + ' → ▼ ' + esc(rsStopName(st.alightAt)) +
             ' · ' + (total === 1 ? T('rsOneStop') : T('rsStops').replace('{n}', total)) + '</div>';
  if (!herePoint) {
    html += '<div class="rsridesub">' + T('rsNeedLocation') + '</div>';
  } else {
    const near = nearestRouteStop(herePoint);
    if (!near || near.metres > RS_RIDE_NEAR_M) {
      html += '<div class="rsridesub">' + T('rsNotOnRoute') + '</div>';
    } else {
      const remaining = st.alightAt - near.index;
      if (remaining <= 0)      html += '<div class="rsridebig arrived">' + T('rsArrived') + '</div>';
      else if (remaining === 1) html += '<div class="rsridebig soon">' + T('rsNextStop') + '</div>';
      else                      html += '<div class="rsridebig">' + T('rsRemaining').replace('{n}', remaining) + '</div>';
      html += '<div class="rsridesub">' + T('rsNearNow').replace('{s}', esc(rsStopName(near.index))) + '</div>';
    }
  }
  el.innerHTML = html;
  el.style.display = 'block';
}

// Watch the phone's position only while a ride is marked and the list is
// open. It is the phone talking to its own GPS — no network, no timer of
// ours — and it is cleared the moment the list closes.
function syncRideWatch() {
  const st = routeStopsState;
  const wanted = !!(st && st.boardAt !== null && st.alightAt !== null && navigator.geolocation);
  if (wanted && st.watchId == null) {
    st.watchId = navigator.geolocation.watchPosition(
      position => {
        herePoint = { lat: position.coords.latitude, lng: position.coords.longitude };
        paintRideBanner();
      },
      () => {},
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
  } else if (!wanted && st && st.watchId != null) {
    navigator.geolocation.clearWatch(st.watchId);
    st.watchId = null;
  }
}

// Fetch times only for the rows actually on screen, four at a time.
function watchForVisibleRows() {
  const box = document.getElementById('routestops');
  if (!box || !routeStopsState) return;

  const pump = () => {
    while (routeStopsState && routeStopsState.inFlight < 4 && routeStopsState.queue.length) {
      const row = routeStopsState.queue.shift();
      routeStopsState.inFlight++;
      loadStopEta(row).finally(() => {
        if (!routeStopsState) return;
        routeStopsState.inFlight--;
        pump();
      });
    }
  };

  const rows = [...box.querySelectorAll('.rsrow')];

  // No IntersectionObserver (older browser): just load them in order rather
  // than showing "checking…" for ever.
  if (typeof IntersectionObserver === 'undefined') {
    routeStopsState.queue = rows;
    pump();
    return;
  }

  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      observer.unobserve(entry.target);        // each stop is asked for once
      routeStopsState.queue.push(entry.target);
    }
    pump();
  }, { root: document.getElementById('panel'), rootMargin: '200px' });

  for (const row of rows) observer.observe(row);
  routeStopsState.observer = observer;

  // The observer is an optimisation, not the mechanism. It does not fire at
  // all while the tab is in the background, and a rider who opens a route and
  // switches away for ten seconds would come back to a list still saying
  // "checking…". The first stops are wanted in every case, so they are asked
  // for outright and the observer is left to cover the rest.
  for (const row of rows.slice(0, 6)) {
    observer.unobserve(row);
    routeStopsState.queue.push(row);
  }
  pump();
}

async function loadStopEta(row) {
  if (!routeStopsState) return;
  const { context, stops } = routeStopsState;
  const stop = stops[Number(row.dataset.index)];
  const cell = row.etaCell;
  if (!stop || !cell) return;

  try {
    let minutes = [];
    if (context.co === 'CTB') {
      const response = await fetch(CTB_BASE + '/eta/CTB/' + stop.stop + '/' +
        encodeURIComponent(context.routeNo), { signal: AbortSignal.timeout(10000) });
      if (!response.ok) throw new Error(response.status);
      minutes = etaMinutes((await response.json()).data, context.dir, null);
    } else {
      const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' +
        stop.stop, { signal: AbortSignal.timeout(10000) });
      if (!response.ok) throw new Error(response.status);
      const rows = ((await response.json()).data || [])
        .filter(r => String(r.route).toUpperCase() === String(context.routeNo).toUpperCase());
      minutes = etaMinutes(rows, context.dir, context.serviceType);
    }

    if (!routeStopsState) return;                 // list closed while waiting
    if (minutes.length === 0) {
      cell.className = 'rseta quiet';
      cell.textContent = T('rsNoEta');
      return;
    }
    cell.className = 'rseta';
    cell.textContent = minutes.slice(0, 3)
      .map(m => (m <= 0 ? T('due') : m + T('min'))).join(' · ');
  } catch (error) {
    if (!routeStopsState) return;
    cell.className = 'rseta quiet';
    cell.textContent = T('rsEtaFailed');
  }
}

// Minutes from now, for this direction only, soonest first.
function etaMinutes(rows, dir, serviceType) {
  const now = Date.now();
  return (rows || [])
    .filter(r => r.eta)
    .filter(r => !dir || !r.dir || r.dir === dir)
    .filter(r => !serviceType || String(r.service_type) === String(serviceType))
    .map(r => Math.round((new Date(r.eta).getTime() - now) / 60000))
    .filter(m => m >= 0)
    .sort((a, b) => a - b);
}

function paintRoute(routeNo, company, from, to, stops, fill, edge, ctbRouteNo, context) {
  // Same rule as choosing a journey: once a route is on screen, the general
  // bus stop dots are clutter. They come back when the route is closed.
  journeyMode = true;
  stopLayer.clearLayers();

  const points = [];
  for (const stop of stops) {
    const lat = Number(stop.lat), lng = Number(stop.long);
    if (!isFinite(lat) || !isFinite(lng)) continue;
    points.push([lat, lng]);

    const marker = L.circleMarker([lat, lng], { radius:9, color:edge, weight:3,
      fillColor:fill, fillOpacity:0.9 }).addTo(routeLayer);
    marker.bindPopup(stopHeader(stop) + '<div class="eta-note">' + T('loadingArrivals') + '</div>');
    marker.on('popupopen', () => ctbRouteNo
      ? loadCtbArrivals(stop, marker, ctbRouteNo)
      : loadKmbArrivals(stop, marker));
  }
  if (points.length === 0) { status.textContent = T('noStopLocations'); return; }

  L.polyline(points, { color:fill, weight:4, opacity:0.6, dashArray:'6 6' }).addTo(routeLayer);
  markEnds(points, from, to);
  map.fitBounds(L.latLngBounds(points), mapPadding());

  document.getElementById('rb-route').textContent = routeNo;
  document.getElementById('rb-company').textContent = company;
  document.getElementById('rb-from').textContent = from;
  document.getElementById('rb-to').textContent = to;
  document.getElementById('rb-note').textContent =
    T('stopsOnRoute').replace('{n}', points.length);
  const banner = document.getElementById('routebanner');
  banner.classList.toggle('ctb', company === 'Citybus');
  banner.style.display = 'block';
  status.textContent = T('stopsOnRoute').replace('{n}', points.length);

  // The list in the panel, alongside the dots on the map.
  if (context) renderRouteStops(Object.assign({ routeNo, from, to }, context), stops);
}

async function loadCtbArrivals(stop, marker, routeNo) {
  try {
    const response = await fetch(CTB_BASE + '/eta/CTB/' + stop.stop + '/' + encodeURIComponent(routeNo),
                                 { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    marker.setPopupContent(stopHeader(stop) + formatArrivals((await response.json()).data));
  } catch (error) {
    marker.setPopupContent(stopHeader(stop) +
      '<div class="eta-note">' + T('couldNotLoadArrivals') + '</div>');
  }
}

function markEnds(points, fromName, toName) {
  if (points.length < 2) return;
  const make = (latlng, letter, word, finish) => L.marker(latlng, { zIndexOffset:900,
    icon: L.divIcon({ className:'', iconSize:null, iconAnchor:[22,22],
      html:'<div class="endwrap' + (finish ? ' finish' : '') + '">' +
           '<div class="enddot">' + letter + '</div>' +
           '<div class="endtext">' + word + '<br>' + fromToText(word, fromName, toName) +
           '</div></div>' }) }).addTo(routeLayer);
  make(points[0], 'A', 'START', false);
  make(points[points.length-1], 'B', 'END', true);
}
function fromToText(word, fromName, toName) { return word === 'START' ? fromName : toName; }


// ============================================================
// 10. CLEAR EVERYTHING
// ============================================================
document.getElementById('clear-all').addEventListener('click', () => {
  setResultsMode(false);
  startPoint = null; endPoint = null; arm(null);
  routeLayer.clearLayers();
  journeyMode = false;
  drawStops();
  document.getElementById('routebanner').style.display = 'none';
  document.getElementById('journeys').innerHTML = '';
  document.getElementById('compare').innerHTML = '';
  clearRouteStops();
  for (const id of ['start-text','end-text','route-text']) document.getElementById(id).value = '';
  for (const id of ['start-results','end-results','route-results']) document.getElementById(id).innerHTML = '';
  redrawJourney();
  status.textContent = T('cleared');
});

// The big ✕ on the banner means "I'm done with this trip". It clears both
// points and returns the panel to the entry form, ready for a new search.
document.getElementById('rb-close').addEventListener('click', resetTrip);

function resetTrip() {
  startPoint = null; endPoint = null; arm(null);
  currentPicks = [];

  document.getElementById('routebanner').style.display = 'none';
  document.getElementById('stopdetail').style.display = 'none';
  routeLayer.clearLayers();
  detailLayer.clearLayers();
  journeyLayer.clearLayers();

  document.getElementById('journeys').innerHTML = '';
  document.getElementById('compare').innerHTML = '';
  clearRouteStops();
  for (const id of ['start-text','end-text','route-text'])
    document.getElementById(id).value = '';
  for (const id of ['start-results','end-results','route-results'])
    document.getElementById(id).innerHTML = '';

  setResultsMode(false);
  journeyMode = false;
  drawStops();
  redrawJourney();
  status.textContent = T('cleared');
}

// ============================================================
// LAST OF ALL
// ============================================================
// The Observatory, once now and then every ten minutes. Two small requests
// that never block anything: if they fail the bar simply stays hidden.
//
// This runs at the very bottom, not with the other start-up calls, because
// its constants are declared further down the file than those calls are —
// and `const` cannot be read before the line declaring it has run. Starting
// it here is the fix; moving the whole weather section up would be the other.
// Drawn once before the first request goes out, so that opening the app with
// no signal says so straight away instead of after a ten-second timeout.
renderWeatherBar();
loadWeather();
setInterval(loadWeather, WEATHER_REFRESH_MS);
// Open on 車站. The trip planner is one tap away under 巴士.
showMode('stop');
</script>
