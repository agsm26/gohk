<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>香港快線</title>

<!-- INSTALLABLE APP (PWA).
     The lines below are what let the app be added to a phone's home screen
     and opened like any other app, with no browser bar around it.

     manifest.json holds the name, the icon and the colours. sw.js (registered
     at the very bottom of this file) is what makes it open without a
     connection — read the top of that file for what is and is not stored.

     The status bar style is "default", not "black-translucent": translucent
     draws WHITE status-bar text, and the bar underneath it here is white.
     iOS ignores the manifest icon and reads apple-touch-icon.png instead. -->
<meta name="theme-color" content="#1e3a8a">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="香港快線">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* ==========================================================
     DESIGN TOKENS. Every text colour here is at least 7:1 on white (WCAG
     AAA), which is the level that matters for older eyes — the previous
     secondary grey was 4.8:1 and the "quiet" grey 2.5:1, which is not
     readable at all in sunlight. One green, one red, one blue, one navy.
     ========================================================== */
  :root {
    --ink:#111827;        /* body text            15.9:1 */
    --ink-2:#374151;      /* strong secondary     10.3:1 */
    --ink-3:#4b5563;      /* secondary, captions   7.6:1 */
    --navy:#1e3a8a;       /* primary action, active tab */
    --navy-tint:#eff6ff;
    --blue:#1e40af;       /* route numbers, links  8.8:1 */
    --blue-tint:#dbeafe;
    --green:#166534;      /* start, go, arriving   7.5:1 */
    --green-tint:#f0fdf4;
    --red:#991b1b;        /* destination, alerts   9.4:1 */
    --red-tint:#fee2e2;
    --amber:#92400e;      /* saved star, warnings  7.1:1 */
    --amber-tint:#fffbeb;
    --teal:#115e59;       /* fares                 7.4:1 */
    --teal-tint:#f0fdfa;
    --line:#d1d5db;       /* input and card edges */
    --line-soft:#e5e7eb;  /* dividers */
    --surface:#ffffff;
    --surface-2:#f3f4f6;
    --surface-3:#f9fafb;
    --r-sm:8px;           /* tags, small chips */
    --r-md:12px;          /* buttons, inputs, cards */
    --r-lg:16px;          /* the sheet */
  }
  /* END TOKENS */

  /* A tap must be SEEN to land. Older hands are less sure a press registered,
     and a button that does nothing visible gets pressed again. */
  button:not(:disabled):active,
  .ctile:active, .jcard:active, ul.results li:active {
    transform:scale(.97); filter:brightness(.94);
  }
  button, .ctile, .jcard, ul.results li {
    transition:transform .08s ease, filter .08s ease, background-color .12s ease;
  }
  /* Keyboard and switch users get a ring they can actually see. */
  :focus-visible { outline:3px solid var(--navy); outline-offset:2px; }
  button:focus:not(:focus-visible) { outline:none; }
  /* Some people are made unwell by motion. The bobbing arrow and the sheet
     animation are decoration; they go, the app does not. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }

  /* PHONE-ONLY, ELDERLY-FIRST DESIGN.
     Every text size in this file is in rem, so all of it keys off the one
     number below. clamp() reads the screen width and picks a size: about
     16.6px on a small 360px Android, 17.9px on an iPhone 14, 19.8px on a Pro
     Max, and never more than 21px. So the app fits the phone it is on rather
     than being drawn for one imaginary handset.
     Tap targets stay in px — 48px is a floor, not something to scale down. */
  html, body { margin:0; padding:0; height:100%; font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
               -webkit-font-smoothing:antialiased;
               font-size:calc(clamp(17px, 4.6vw, 21px) * var(--text-scale, 1));
               color-scheme:light;   /* Samsung/Chrome auto-dark would invert every colour above */
               -webkit-text-size-adjust:100%;      /* iOS must not re-inflate it */
               -webkit-tap-highlight-color:rgba(0,0,0,.08); }
  #map { height:100%; width:100%; }

  /* The Lands Department logo. Their terms require it on the map face. */
  #landsdlogo { position:absolute; bottom:6px; left:8px; z-index:1000;
                height:26px; background:white; padding:2px 4px; border-radius:4px; }

  /* EVERYTHING the user types or taps lives in ONE panel on the LEFT. */
  #panel {
    position:absolute; top:10px; left:10px; z-index:1000; width:400px;
    max-width:calc(100vw - 20px); max-height:calc(100vh - 20px); overflow-y:auto;
    background:white; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.35); padding:14px;
  }
  .field { margin-bottom:16px; }
  .flabel { font-size:1rem; font-weight:800; letter-spacing:.5px; margin-bottom:6px; }
  .flabel.start { color:var(--green); }
  .flabel.end   { color:var(--red); }

  .frow { display:flex; gap:6px; margin-bottom:8px; }
  .frow input {
    flex:1; min-width:0; box-sizing:border-box; padding:12px 14px;
    border:2px solid var(--line); border-radius:10px; font-size:1.0588rem; min-height:50px;
  }
  .gobtn { min-width:64px; min-height:50px; border:none; border-radius:10px;
           background:var(--navy); color:white; font-size:1rem; font-weight:700; cursor:pointer; }

  .btns { display:flex; gap:6px; }
  .btn { flex:1; min-height:48px; border:2px solid var(--line); background:white;
         border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; padding:6px; }

  /* Icon only, and shorter than the 48px used everywhere else. It is the one
     control here that trades tap size for the row it used to occupy — the
     pin is still 64px wide and carries a title and aria-label, because the
     word "location" is gone from the face of it. */
  .gpsbtn { min-height:42px; height:42px; flex:0 0 auto; font-size:1.1765rem;
            padding:0; line-height:1; }
  .btn:hover { background:var(--surface-2); }
  .btn.armed { background:var(--navy); color:white; border-color:var(--navy); }

  .chosen { font-size:1rem; margin-bottom:8px; line-height:1.4; }
  .chosen.empty { color:var(--ink-3); font-weight:600; }
  .chosen small { color:var(--ink-2); }

  ul.results { list-style:none; margin:6px 0 0; padding:0; background:white;
               border:2px solid var(--line-soft); border-radius:10px; max-height:260px; overflow-y:auto; }
  ul.results li { padding:14px; font-size:1rem; cursor:pointer; border-bottom:2px solid var(--surface-2); line-height:1.4; }
  ul.results li:hover { background:var(--navy-tint); }
  ul.results:empty { display:none; }

  .badge { display:inline-block; font-size:0.94rem; font-weight:800; padding:3px 8px;
           border-radius:8px; margin-right:8px; }
  .badge-kmb { background:var(--blue-tint); color:var(--blue); }
  .badge-ctb { background:#ffedd5; color:#9a3412; }

  .badge-place{background:#dcfce7; color:var(--green); }
  .routeno { font-weight:800; color:var(--blue); font-size:1.1765rem; margin-right:8px; }

  #walkinfo { border-top:2px solid var(--line-soft); padding-top:12px; margin-bottom:16px; font-size:1rem; display:none; }
  #walkinfo .big { font-size:1.3529rem; font-weight:800; color:#111; margin:4px 0; }
  #walkinfo .warn { font-size:0.94rem; color:var(--amber); margin-top:8px; line-height:1.4; }

  /* The label keeps only the width its words need; the five favourite slots
     take the rest of the row. */
  .flabelrow { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .flabelrow .flabel { flex:0 0 auto; margin-bottom:0; }

  /* Five slots, always five, so the row never changes height as favourites
     come and go and each place keeps the same position — and so the same
     colour — every time the screen is opened.
     They share the leftover width rather than wrapping: a second row here
     would cost exactly the line this layout was meant to save. */
  /* Five fit; a sixth to eighth is reached by swiping the row sideways.
     Shrinking eight chips to fit instead would put each one under 30px. */
  .favs { display:flex; gap:5px; flex:1; min-width:0;
          overflow-x:auto; overflow-y:visible; padding:7px 7px 0 0;
          margin:-7px -7px 0 0; scrollbar-width:none; }
  .favs::-webkit-scrollbar { display:none; }
  .favchip, .favslot {
    flex:0 0 calc((100% - 20px) / 5); min-width:44px; height:46px;
    border-radius:12px; padding:0; box-sizing:border-box;
  }
  .favchip { position:relative; border:2px solid var(--green); background:var(--green-tint); color:var(--green);
             font-size:1.0588rem; font-weight:800; cursor:pointer;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .favchip:hover { filter:brightness(.96); }

  /* One colour per position. A favourite is recognised by where it sits and
     what colour it is long before the two characters are read, which is the
     whole point of a chip this small. */
  .favchip.c1 { border-color:var(--green); background:var(--green-tint); color:var(--green); }
  .favchip.c2 { border-color:var(--blue); background:var(--navy-tint); color:var(--blue); }
  .favchip.c3 { border-color:#6b21a8; background:#faf5ff; color:#6b21a8; }
  .favchip.c4 { border-color:#9a3412; background:#fff7ed; color:#9a3412; }
  .favchip.c5 { border-color:var(--teal); background:var(--teal-tint); color:var(--teal); }
  .favchip.c6 { border-color:#9d174d; background:#fdf2f8; color:#9d174d; }
  .favchip.c7 { border-color:#3f6212; background:#f7fee7; color:#3f6212; }
  .favchip.c8 { border-color:var(--amber); background:var(--amber-tint); color:var(--amber); }

  /* An empty slot is deliberately NOT a button: a target that cannot do
     anything reads as a broken app. It is a dashed outline holding the
     place, in that position's own colour, faintly. */
  .favslot { border:2px dashed var(--line); background:transparent; }
  .favslot.c1 { border-color:#bbf7d0; }
  .favslot.c2 { border-color:#bfdbfe; }
  .favslot.c3 { border-color:#e9d5ff; }
  .favslot.c4 { border-color:#fed7aa; }
  .favslot.c5 { border-color:#99f6e4; }

  .favchip .x { position:absolute; top:-6px; right:-6px; width:20px; height:20px;
                border-radius:12px; background:var(--red); color:white; font-size:13px;
                font-weight:800; line-height:20px; }
  .favempty { font-size:0.94rem; color:var(--ink-3); margin-bottom:8px; }

  /* Search, with My location stacked above it where there is one. */
  .fcol { display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }
  .addfav { border:2px solid var(--green); background:white; color:var(--green);
            border-radius:10px; padding:10px; font-size:1rem; font-weight:700;
            cursor:pointer; min-height:46px; width:100%; margin-top:8px; }
  .addfav:hover { background:var(--green-tint); }

  /* COMPARISON STRIP
     Three tiles side by side, so the whole choice is visible without
     scrolling. The detailed cards stay below for whichever they pick. */
  #compare { display:flex; gap:8px; margin-bottom:14px; }
  .ctile { flex:1; min-width:0; border:3px solid var(--line); border-radius:12px;
           padding:10px 8px; cursor:pointer; background:white; text-align:center; }
  .ctile:hover { background:var(--surface-3); }
  .ctile.on { background:var(--navy-tint); }
  .ctile .cnum { width:26px; height:26px; border-radius:13px; color:white;
                 font-size:1rem; font-weight:800; line-height:26px; margin:0 auto 6px; }
  .ctile .ctitle { font-size:0.94rem; font-weight:800; line-height:1.3;
                   min-height:30px; margin-bottom:4px; }
  .ctile .ctime { font-size:1.4118rem; font-weight:800; color:#111; line-height:1.1; }
  .ctile .cunit { font-size:0.94rem; font-weight:700; color:var(--ink-3); }
  /* A route number cut to "98S \u2192 N..." tells you nothing. Let it wrap and
     shrink instead: two short lines beat one truncated one. */
  .ctile .cbus  { font-size:1.2941rem; font-weight:800; color:var(--blue); margin-top:6px;
                  line-height:1.15; overflow-wrap:anywhere; word-break:break-word; }
  .ctile .cfare { font-size:1rem; font-weight:800; color:var(--teal); margin-top:4px; }
  .ctile .cwalk { font-size:0.94rem; color:var(--amber); font-weight:700; margin-top:4px; }
  .ctile .ceta  { font-size:0.94rem; font-weight:800; color:var(--green); margin-top:6px;
                  background:var(--green-tint); border-radius:8px; padding:3px 2px; }

  #journeys { margin-bottom:16px; }
  .jcard { border:2px solid var(--line-soft); border-radius:12px; padding:14px; margin-bottom:12px; cursor:pointer; }
  .jcard:hover { background:var(--navy-tint); border-color:var(--navy); }
  .jcard .jtop { font-size:1rem; color:var(--ink-3); font-weight:700; }
  .jcard .jbus { font-size:1.6471rem; font-weight:800; color:var(--blue); margin:4px 0; }
  .cotag { font-size:0.94rem; font-weight:800; padding:3px 8px; border-radius:8px;
           margin-left:10px; vertical-align:middle; }
  .cotag.kmb { background:var(--blue-tint); color:var(--blue); }
  .cotag.ctb { background:#ffedd5; color:#9a3412; }
  .cotag.nlb { background:#dcfce7; color:var(--green); }
  .cotag.gmb { background:#f3e8ff; color:#6b21a8; }
  .cotag.mtr { background:var(--red-tint); color:var(--red); }

  /* TOP BAR — bus, train, favourites, settings.
     It sits above the sheet rather than inside it, so it never scrolls away
     and always sits in the same place. Four targets, each well over the 48px
     minimum, with the count in the label so a section that would open empty
     says so before it is tapped.
     Every panel height below is measured against --navh, so the bar and the
     sheet can never overlap however tall the bar ends up. */
  /* 60px button + the bar's own 2px bottom border. Miss the border and every
     panel below starts 2px too high, tucked under the bar.
     --wxh is the weather bar, which is 0 until there is weather to show and
     is measured from the real element rather than assumed — its height
     changes with the number of warnings. --toph is what everything below
     actually hangs from. */
  :root { --navh:62px;
          --wxh:0px;
          --toph:calc(var(--navh) + var(--wxh)); }
  #bottombar {
    position:fixed; top:0; left:0; right:0; z-index:1400;
    display:flex; background:white; border-bottom:2px solid var(--line-soft);
    box-shadow:0 2px 12px rgba(0,0,0,.18);
  }
  /* border-box keeps the button exactly 60px including its underline, which
     is what --navh above assumes. Without it the 4px border is added on top
     and every panel sits 4px too low. */
  .bnav { flex:1; height:60px; box-sizing:border-box; border:none; background:none;
          cursor:pointer;
          display:flex; flex-direction:column; align-items:center; justify-content:center;
          gap:2px; padding:8px 2px; color:var(--ink-3); font-weight:800;
          font-size:0.94rem; border-bottom:4px solid transparent; }
  .bnav .bicon { font-size:1.2941rem; line-height:1; }
  /* The active marker moves to the underside now that the bar is on top, so
     it still points at the panel it belongs to. */
  .bnav.on { color:var(--navy); border-bottom-color:var(--navy); background:var(--navy-tint); }
  .bnav:disabled { opacity:.4; cursor:default; }

  /* ==========================================================
     WEATHER BAR. One line under the nav bar: what it is doing where the
     rider is, and at each end of the trip when those are known. Warnings
     come first and in the Observatory's own words — a rainstorm signal is
     the one thing here that changes whether you travel at all.
     ========================================================== */
  #weatherbar {
    position:fixed; top:var(--navh); left:0; right:0; z-index:1390;
    background:#f8fafc; border-bottom:2px solid var(--line-soft);
    padding:6px 12px; box-sizing:border-box;
    display:flex; align-items:center; gap:10px;
    overflow-x:auto; white-space:nowrap;
    scrollbar-width:none; font-size:0.94rem; font-weight:700; color:var(--ink-2);
  }
  #weatherbar::-webkit-scrollbar { display:none; }
  .wxitem { flex:0 0 auto; display:flex; align-items:center; gap:4px; }
  .wxlabel { color:var(--ink-3); font-weight:700; }
  .wxtemp { color:#111; font-weight:800; }
  /* A warning is not decoration: it gets the loud colour and the first place. */
  .wxwarn { flex:0 0 auto; background:var(--red); color:white; border-radius:8px;
            padding:3px 8px; font-weight:800; }
  .wxwarn.amber { background:var(--amber); }
  .wxwarn.notice { background:var(--navy); }

  /* NO CONNECTION. Shares the weather bar because it belongs to the same
     question — what do I need to know before I set off? Grey, not red: being
     offline is a limit, not a danger, and the red is spoken for by rainstorm
     and typhoon signals that really do stop the buses. */
  .wxoff { flex:0 0 auto; background:var(--ink-3); color:white; border-radius:8px;
           padding:3px 8px; font-weight:800; }

  /* A NEW VERSION IS READY. A button, not a notice, because it does
     something when tapped — and 44px tall so it can be tapped by someone
     whose hands are not steady, in a bar built for 0.8235rem text. */
  .wxupdate { flex:0 0 auto; min-height:44px; border:none; border-radius:8px;
              background:var(--green); color:white; font-weight:800;
              font-size:0.94rem; padding:0 12px; cursor:pointer; }

  /* ==========================================================
     THE MTR TAB. Station → line → direction → next trains → (destination).
     Each step is a row of big buttons; the chosen one is filled. Nothing is
     asked that the data can answer itself: one line is not a choice, one
     direction with trains is not a choice.
     ========================================================== */
  .mtrsub { font-size:1rem; font-weight:800; color:var(--ink-3); margin:14px 0 8px; }
  /* A new section: a rule and air above it, so 起點 is not read as part of 目的地. */
  .mtrsub.sectionbreak { margin-top:24px; padding-top:14px; border-top:2px solid var(--line-soft); }
  .mtrgeo { border:2px solid var(--navy); border-radius:12px; padding:14px; margin-bottom:12px;
            background:var(--navy-tint); }
  .mtrsta { display:flex; align-items:center; gap:10px; border:2px solid var(--line-soft);
            border-radius:12px; padding:12px 14px; margin-bottom:6px; }
  .mtrsta .mtrname { flex:1; min-width:0; font-size:1.18rem; font-weight:800; color:var(--ink);
                     overflow-wrap:anywhere; }
  .mtrsta small { display:block; font-size:0.94rem; font-weight:700; color:var(--ink-3); margin-top:2px; }
  .mtrpick { display:flex; flex-direction:column; gap:6px; }
  .mtrpick button { min-height:52px; border:2px solid var(--line); border-radius:10px; background:white;
                    font-size:1rem; font-weight:700; color:var(--ink); cursor:pointer; text-align:left;
                    padding:8px 12px; display:flex; align-items:center; gap:10px; }
  .mtrpick button .mtrdist { margin-left:auto; color:var(--ink-3); font-weight:700; white-space:nowrap; }
  .mtrlines, .mtrdirs, .mtrdests { display:flex; flex-wrap:wrap; gap:8px; }
  /* The stripe is the line's own colour — the one every rider already knows.
     Text stays dark on white so the colour never has to carry the words. */
  .mtrline { flex:1 1 45%; min-height:52px; border:2px solid var(--line); border-left:12px solid var(--line);
             border-radius:10px; background:white; font-size:1rem; font-weight:800; color:var(--ink);
             cursor:pointer; text-align:left; padding:8px 12px; }
  .mtrline.on { background:var(--navy-tint); border-color:var(--navy); }
  .mtrdir { flex:1 1 45%; min-height:56px; border:2px solid var(--line); border-radius:10px;
            background:white; font-size:1.06rem; font-weight:800; color:var(--ink); cursor:pointer;
            padding:8px 10px; overflow-wrap:anywhere; }
  .mtrdir.on { background:var(--navy); border-color:var(--navy); color:white; }
  .mtrdirs { flex-wrap:nowrap; }
  .mtrdir.left  { text-align:left; }
  .mtrdir.right { text-align:right; }
  .mtrdir.blank { border:none; background:transparent; }
  /* The line laid out sideways. Scrolls; the current station starts centred. */
  .mtrstrip { display:flex; align-items:center; gap:6px; overflow-x:auto; padding:6px 0 10px; margin-bottom:4px;
              scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .mtrpad { flex:0 0 calc(50% - 60px); }   /* so the end stations can reach the middle */
  .mtrstop { flex:0 0 auto; min-height:52px; padding:0 12px; border:2px solid var(--line); border-top:8px solid var(--line);
             border-radius:10px; background:white; font-weight:700; font-size:0.94rem; white-space:nowrap;
             color:var(--ink); scroll-snap-align:center; }
  /* The station you are at: the big one in the middle. */
  .mtrstop.here { background:var(--navy); border-color:var(--navy) !important; color:white;
                  font-size:1.24rem; min-height:64px; padding:0 18px; }
  .mtrstop.on { background:var(--red); border-color:var(--red) !important; color:white; }
  .mtrstop.off { color:var(--ink-3); background:#f3f4f6; }
  .mtrtrain { display:flex; align-items:center; gap:12px; border:2px solid var(--line-soft);
              border-radius:12px; padding:10px 14px; margin-bottom:6px; }
  .mtrtrain .mtrmin { font-size:1.88rem; font-weight:800; color:var(--green); flex:0 0 auto; min-width:100px; }
  .mtrtrain .mtrmeta { flex:1; min-width:0; font-size:1rem; font-weight:700; color:var(--ink-2);
                       overflow-wrap:anywhere; }
  .mtrtrain.hero { border-color:var(--green); background:var(--green-tint); }
  .mtrdest { flex:1 1 45%; min-height:48px; border:2px solid var(--line); border-radius:10px;
             background:white; font-size:1rem; font-weight:700; color:var(--ink); cursor:pointer;
             padding:6px 10px; overflow-wrap:anywhere; }
  .mtrdest.on { background:var(--red); border-color:var(--red); color:white; }
  .mtrsummary { border:2px solid var(--red); border-left-width:12px; border-radius:12px;
                padding:12px 14px; margin-top:10px; background:white; }
  .mtrsummary .big { font-size:1.29rem; font-weight:800; color:var(--ink); }
  .mtrsummary .line { font-size:1rem; font-weight:700; color:var(--ink-2); margin-top:4px; }
  .mtrsummary .arrive { font-size:1.18rem; font-weight:800; color:var(--green); margin-top:8px; }
  .mtrhead { display:flex; align-items:center; gap:10px; margin-top:14px; }
  .mtrhead .mtrsub { flex:1; margin:0; }
  .mtrupdated { font-size:0.94rem; color:var(--ink-3); font-weight:700; margin:4px 0 8px; }
  .mtralert { border:2px solid var(--amber); background:var(--amber-tint); color:var(--amber);
              border-radius:10px; padding:10px 12px; font-weight:700; line-height:1.4; margin:8px 0; }

  /* GETTING OFF. The second mark, in the destination colour, and the ride
     banner that counts down from where the phone actually is. */
  .rsrow.alight { background:var(--red-tint); border-radius:8px; }
  .rsrow.alight .rsnum { background:var(--red); color:white; }
  .rsalighttag { font-size:0.94rem; font-weight:800; color:var(--red); margin-top:2px; }
  .rsride { border:2px solid var(--navy); border-radius:12px; padding:12px 14px;
            margin-bottom:10px; background:var(--navy-tint); }
  .rsridehead { font-size:1rem; font-weight:800; color:var(--ink-2); overflow-wrap:anywhere; }
  .rsridebig { font-size:1.88rem; font-weight:800; color:var(--navy); margin-top:4px; line-height:1.15; }
  .rsridebig.soon { color:var(--red); }
  .rsridebig.arrived { color:var(--green); }
  .rsridesub { font-size:0.94rem; font-weight:700; color:var(--ink-3); margin-top:4px; }
  /* A saved bus on the bus tab opens its route — the card says so. */
  .livecard.tap { cursor:pointer; }
  .livecard.tap:active { filter:brightness(.95); }
  .livefoot { font-size:0.94rem; font-weight:800; color:var(--blue); margin-top:6px; }

  /* THE BUS STOP TAB. Same bones as the MTR tab; the route rows are the map
     popup's own rows, laid out for a panel instead of a bubble. */
  /* Three lines per bus, three buses per screen: route · terminus · ☆ /
     next times / arrival estimate · fare. Sized so three rows fit under
     the filter on a phone. */
  #stopview .eta-row { display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px;
                       border:2px solid var(--line-soft); border-radius:12px; padding:8px 12px;
                       margin:6px 0; cursor:pointer; }
  #stopview .eta-row:active { filter:brightness(.95); }
  #stopview .eta-star { order:1; margin-left:auto; flex:0 0 40px; height:40px; padding:0;
                        border:2px solid var(--line-soft); border-radius:10px; font-size:1.18rem; }
  #stopview .eta-star.on { border-color:var(--amber); background:var(--amber-tint); }
  #stopview .eta-route { order:0; font-size:1.24rem; min-width:0; }
  #stopview .eta-dest { order:0; flex:1; min-width:0; font-weight:700; font-size:0.94rem; overflow-wrap:anywhere; }
  #stopview .eta-times { order:2; flex-basis:100%; font-size:1.12rem; color:var(--green); margin-top:0; }
  #stopview .eta-arrive { order:3; flex:1 1 auto; min-width:0; flex-basis:auto; font-size:0.88rem; margin-top:0; }
  #stopview .eta-fare { order:4; margin-left:auto; font-size:0.88rem; }
  #stopview .eta-note { color:var(--ink-3); font-weight:700; padding:8px 0; }
  .stoproute { display:flex; align-items:center; gap:10px; border:2px solid var(--line-soft);
               border-radius:12px; padding:12px; margin:8px 0; }
  .stoproute .rt { font-size:1.41rem; font-weight:800; color:var(--blue); }
  .stoproute .quiet { color:var(--ink-3); font-weight:700; font-size:0.94rem; }
  /* What leaves from a pole, under its name — the line that tells MK751 from
     MK752 without knowing either code. */
  .pickmain { flex:1; min-width:0; }
  .poleroutes { display:block; font-size:0.94rem; font-weight:700; color:var(--ink-3);
                margin-top:3px; overflow-wrap:anywhere; }
  .poleroutes b { color:var(--blue); }

  /* THE TOAST. Fixed under the bars, so it is in view whatever the sheet is
     doing. Dark on light, not a coloured pill: it carries errors, "ready",
     "saved" — all of them — and one plain style keeps it readable for all. */
  #toast { position:fixed; top:calc(var(--toph) + 10px); left:12px; right:12px;
           z-index:1500; background:var(--ink); color:white; border-radius:12px;
           padding:12px 16px; font-size:1rem; font-weight:700; line-height:1.4;
           box-shadow:0 6px 20px rgba(0,0,0,.35); pointer-events:none;
           opacity:0; transform:translateY(-8px);
           transition:opacity .18s ease, transform .18s ease; }
  #toast.show { opacity:1; transform:none; }







  #favview .favcount { font-size:0.94rem; font-weight:700; color:var(--ink-3); }

  /* LIVE STRIP — the answer before the question. */
  #livestrip { margin-bottom:12px; }
  #livestrip:empty { display:none; }
  .livehead { font-size:1rem; font-weight:800; color:var(--ink-3); margin-bottom:8px; }
  /* ASKING FOR LOCATION. Sits above everything on first open, phrased as a
     question with a reason, because the browser's own box gives neither. */
  #geoask { border:2px solid var(--navy); border-radius:12px; padding:14px; margin-bottom:12px;
            background:var(--navy-tint); }
  .geotitle { font-size:1.0588rem; font-weight:800; color:var(--navy); margin-bottom:6px; }
  .geobody { font-size:1rem; line-height:1.5; color:var(--ink-2); margin-bottom:12px; }
  .geobtns { display:flex; gap:10px; }
  .geobtns button { flex:1; min-height:52px; border-radius:10px; font-size:1rem;
                    font-weight:800; cursor:pointer; padding:8px 6px; }
  /* "好，使用我的位置" is twice the length of "暫時不用". Equal widths broke its
     last character onto a second line on a 360px phone; the yes button gets
     room in proportion to what it has to say. */
  /* Written as .geobtns .geoyes on purpose: a bare .geoyes loses to
     ".geobtns button" above on specificity and the flex never applies. */
  .geobtns .geoyes { flex:1.4; border:none; background:var(--green); color:white; }
  .geono  { border:2px solid var(--line); background:white; color:var(--ink-3); }

  /* NEARBY: one line per route, so the eye runs straight down the times. */
  .livecard.nearby { border-left-color:var(--blue); }
  .nearrow { display:flex; align-items:baseline; gap:8px; padding:4px 0;
             border-top:1px solid var(--line-soft); }
  .nearrow:first-child { border-top:none; }
  .nearroute { font-size:1.1765rem; font-weight:800; color:var(--blue);
               flex:0 0 68px; }
  .neardest { flex:1; min-width:0; font-size:1rem; color:var(--ink-3); font-weight:700;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nearmin { font-size:1.0588rem; font-weight:800; color:var(--green); white-space:nowrap; }

  /* The pole code, shown ONLY where it helps: standing in the street, it is
     painted on the pole and it is how you know you are at the right one. */
  .polecode { display:inline-block; margin-left:8px; padding:1px 7px; border-radius:8px;
              background:var(--blue); color:white; font-size:0.94rem; font-weight:800;
              vertical-align:2px; }

  /* ADD A ROUTE BY NUMBER */
  .addroutebtn { width:100%; min-height:52px; margin-bottom:8px; border:2px dashed var(--blue);
                 border-radius:12px; background:white; color:var(--blue);
                 font-size:1rem; font-weight:800; cursor:pointer; }
  .addroutebtn.on { background:var(--navy-tint); }
  .addroutepanel { margin-bottom:10px; }
  .addroutepanel input { width:100%; box-sizing:border-box; padding:12px 14px; min-height:52px;
                         border:2px solid var(--line); border-radius:10px; font-size:1.0588rem;
                         font-weight:700; }
  .addroutehint { font-size:0.94rem; color:var(--ink-3); margin:8px 0 6px; }
  .addrouteitem { display:flex; align-items:center; gap:10px; width:100%; min-height:52px;
                  margin-bottom:6px; padding:8px 12px; border:2px solid var(--line);
                  border-radius:10px; background:white; cursor:pointer; text-align:left; }
  .addrouteitem.on { border-color:var(--amber); background:var(--amber-tint); }
  .ariroute { font-size:1.1765rem; font-weight:800; color:var(--blue); flex:0 0 68px; }
  .aridest { flex:1; min-width:0; font-size:1rem; font-weight:700; color:var(--ink-2);
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .aritick { font-size:1.1765rem; font-weight:800; color:var(--amber); flex:0 0 auto; }

  /* ==========================================================
     THE STOP LIST — every stop on the chosen route, in order.
     The map shows WHERE the stops are; this shows HOW MANY, which is the
     question people actually ask on a bus. Each row is numbered, so
     counting to your stop is reading a number rather than tallying dots.
     ========================================================== */
  #routestops:empty { display:none; }
  #routestops { margin-bottom:14px; }
  .rshead { display:flex; align-items:center; gap:10px; margin:4px 0 10px; }
  .rstitle { flex:1; min-width:0; font-size:1.0588rem; font-weight:800; color:#111; }
  .rstitle small { display:block; font-size:0.94rem; font-weight:700; color:var(--ink-3);
                   margin-top:2px; }
  .rsclose { flex:0 0 44px; height:44px; border-radius:10px; border:2px solid var(--line-soft);
             background:white; color:var(--ink-3); font-size:1rem; font-weight:800; cursor:pointer; }

  .rshint { font-size:0.94rem; color:var(--ink-3); line-height:1.45; margin-bottom:10px; }
  /* Saved places on the 車站 tab: pill buttons, one tap each. */
  .destchips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .destchip { min-height:44px; padding:0 16px; border-radius:22px; border:2px solid var(--line);
              background:white; font-weight:700; font-size:1rem; color:var(--ink); }
  .destchip.on { border-color:var(--amber); background:var(--amber-tint); color:var(--amber); }
  /* The "which way?" sheet for a looked-up bus: one big button per direction. */
  #dirsheet { display:none; position:fixed; inset:0; z-index:2000; background:rgba(15,23,42,.55);
              align-items:flex-end; justify-content:center; padding:10px; }
  #dirsheet.open { display:flex; }
  .dircard { background:white; border-radius:16px; width:100%; max-width:460px; padding:16px 16px 14px;
             max-height:85vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .dirhead { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .dirhead b { font-size:1.6rem; color:var(--blue); }
  .dirhead span { font-size:1.06rem; font-weight:800; color:var(--ink-2); }
  .dirbtn { display:block; width:100%; min-height:64px; text-align:left; border:2px solid var(--line);
            border-radius:12px; background:white; padding:10px 14px; margin-top:10px; color:var(--ink); }
  .dirbtn b { display:block; font-size:1.18rem; line-height:1.3; }
  .dirbtn b i { font-style:normal; color:var(--blue); }
  .dirbtn small { display:block; font-size:0.94rem; font-weight:700; color:var(--ink-3); margin-top:2px; }
  .dirbtn .dirnote { color:var(--amber); }
  .dirbtn:active { background:var(--blue-tint); }
  .dirmore { width:100%; min-height:44px; margin-top:10px; border:none; background:transparent;
             color:var(--blue); font-weight:800; font-size:0.94rem; text-decoration:underline; }
  .dircancel { width:100%; min-height:48px; margin-top:12px; border-radius:12px; border:2px solid var(--line);
               background:#f3f4f6; font-weight:800; font-size:1rem; color:var(--ink); }

  .rsrow { display:flex; align-items:center; gap:8px; padding:8px 6px;
           border-bottom:2px solid var(--surface-2); }
  .rsrow:last-child { border-bottom:none; }
  /* The number is the point of the list, so it is the one thing that never
     shrinks and never wraps. */
  .rsnum { flex:0 0 34px; height:34px; border-radius:17px; background:var(--navy-tint);
           color:var(--navy); font-size:1rem; font-weight:800;
           display:flex; align-items:center; justify-content:center; }
  .rspick { flex:1; min-width:0; text-align:left; background:none; border:none;
            padding:6px 2px; min-height:44px; cursor:pointer; font:inherit; }
  .rsname { font-size:1rem; font-weight:700; color:#111; line-height:1.3;
            word-break:break-word; }
  .rseta { font-size:0.94rem; font-weight:800; color:var(--green); margin-top:2px; }
  .rseta.quiet { font-weight:600; color:var(--ink-3); }
  .rsstar { flex:0 0 44px; height:44px; border-radius:10px; border:2px solid var(--line-soft);
            background:white; color:var(--ink-3); font-size:1.1765rem; cursor:pointer; padding:0; }
  .rsstar.on { border-color:var(--amber); background:var(--amber-tint); color:var(--amber); }

  /* BOARDING MARK. Tapping a stop marks it; every stop after it then says how
     many stops away it is, which is the actual question — "how many more?" */
  .rsrow.board { background:var(--green-tint); border-radius:10px; }
  .rsrow.board .rsnum { background:var(--green); color:white; }
  .rsrow.after .rsnum { background:var(--blue-tint); }
  .rscount { font-size:0.94rem; font-weight:800; color:var(--blue); margin-top:2px; }
  .rsboardtag { font-size:0.94rem; font-weight:800; color:var(--green); margin-top:2px; }

  .livehint { border:2px dashed var(--line); border-radius:12px; padding:12px;
              font-size:1rem; line-height:1.5; color:var(--ink-3); }
  .livecard { border:2px solid var(--line-soft); border-left:6px solid var(--green); border-radius:12px;
              padding:10px 12px; margin-bottom:8px; background:var(--surface-3); }
  .livetitle { font-size:1.0588rem; font-weight:800; color:#111; line-height:1.3;
               overflow-wrap:anywhere; }
  .livesub { font-size:0.94rem; color:var(--ink-3); margin-top:2px; overflow-wrap:anywhere; }
  .livetimes { font-size:1.2941rem; font-weight:800; color:var(--green); margin-top:6px; }
  .livetimes.quiet { font-size:1rem; font-weight:600; color:var(--ink-3); }
  .liveway { display:flex; justify-content:space-between; align-items:baseline;
             gap:10px; margin-top:4px; }
  .liveto { font-size:1rem; font-weight:700; color:var(--ink-2); min-width:0;
            overflow-wrap:anywhere; }
  .livemin { font-size:1.1765rem; font-weight:800; color:var(--green); white-space:nowrap; }
  .livemin.quiet { font-size:0.94rem; font-weight:600; color:var(--ink-3); }
  .livecard.compact { padding:8px 12px; margin-bottom:6px; }
  .liverow { display:flex; align-items:baseline; gap:10px; }
  .liverow .livetitle { flex:1; min-width:0; font-size:1rem; }
  .liverow .livemin { flex:0 0 auto; }
  .livecard.compact .livesub { margin-top:0; font-size:0.88rem; }

  /* TRIP PICKER: two columns, one shared list. */
  /* One list per section, full width, so a long stop name is read in one
     line instead of being wrapped into a narrow column. */
  #favview .triplist { margin-bottom:18px; }
  /* Choose and delete are two separate targets side by side, so one is never
     mistaken for the other. */
  #favview .triprow { display:flex; gap:6px; margin-bottom:6px; }
  #favview .tripitem { flex:1; min-width:0; min-height:56px;
                       border:2px solid var(--line); border-left:8px solid var(--line);
                       border-radius:10px; background:white;
                       font-size:1rem; font-weight:700; color:#111; cursor:pointer;
                       padding:8px 12px; line-height:1.3; text-align:left;
                       word-break:break-word; box-sizing:border-box; }
  /* No colour stripe on "my location": it is not a saved place, and an 8px
     dashed edge renders as a column of blocks. */
  #favview .tripitem.here { width:100%; border:2px dashed var(--line);
                            color:var(--blue); text-align:center; margin-bottom:6px; }
  #favview .tripitem.on { background:var(--navy); border-color:var(--navy); color:white; }
  #favview .tripitem:disabled { opacity:.5; }
  #favview .tripdel { flex:0 0 52px; min-height:56px; border-radius:10px;
                      border:2px solid var(--line-soft); background:white; color:var(--ink-3);
                      font-size:1rem; font-weight:800; cursor:pointer; padding:0; }
  #favview .tripdel:hover { background:#fef2f2; border-color:#fecaca; color:var(--red); }
  /* Send this place to the other list. */
  #favview .tripcopy { flex:0 0 52px; min-height:56px; border-radius:10px;
                       border:2px solid var(--line-soft); background:white;
                       font-size:0.94rem; cursor:pointer; padding:0; }
  #favview .tripcopy:disabled { opacity:.35; cursor:default; }
  #favview .tripcopy.done { border-color:#bbf7d0; background:var(--green-tint); }



  /* SAVED DEPARTURES. No button at all — the countdown is the content. */
  #favview .deprow { position:relative; border:2px solid var(--line-soft); border-radius:12px;
                     padding:10px 52px 10px 12px; margin-bottom:8px; }
  #favview .depmain { display:flex; align-items:baseline; gap:8px; }
  #favview .deproute { font-size:1.2941rem; font-weight:800; color:var(--blue); }
  #favview .depdest { font-size:1rem; color:var(--ink-2); font-weight:700;
                      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #favview .depstop { font-size:0.94rem; color:var(--ink-3); margin-top:2px; }
  #favview .depeta { font-size:1.2941rem; font-weight:800; color:var(--green); margin-top:4px; }
  #favview .depeta.quiet { font-size:1rem; font-weight:600; color:var(--ink-3); }
  #favview .depopen { width:100%; min-height:48px; margin-top:8px; border-radius:10px;
                      border:2px solid #bfdbfe; background:var(--navy-tint); color:var(--blue);
                      font-size:1rem; font-weight:800; cursor:pointer; }
  #favview .depopen:hover { background:var(--blue-tint); }
  #favview .depdel { position:absolute; top:10px; right:10px; flex:0 0 auto;
                     width:40px; min-height:40px; }

  /* The star on an arrival row. */
  .eta-star { border:none; background:none; cursor:pointer; font-size:1.2941rem;
              line-height:1; padding:2px 6px 2px 0; color:var(--ink-3); }
  .eta-star.on { color:var(--amber); }







  #favview .favempty { color:var(--ink-3); padding:18px 4px; line-height:1.5; }

  /* FAVOURITES TAKES THE WHOLE PANEL. Hiding the form and the results by
     name would break the moment either grew a new element, so instead
     everything except the grip and the list itself steps aside. */
  #panel.favmode > *:not(#favview):not(#sheetgrip) { display:none !important; }
  #panel.setmode > *:not(#setview):not(#sheetgrip) { display:none !important; }
  #panel.mtrmode > *:not(#mtrview):not(#sheetgrip) { display:none !important; }
  #panel.stopmode > *:not(#stopview):not(#sheetgrip) { display:none !important; }
  /* ROUTE MODE. Looking up a bus number takes the panel the same way
     favourites and settings do — the trip form is not part of this job. */
  #panel.routemode > *:not(#routefield):not(#routestops):not(#sheetgrip):not(#status) {
    display:none !important;
  }
  #panel.routemode { top:var(--toph); max-height:calc(100vh - var(--toph));
                     max-height:calc(100dvh - var(--toph)); border-radius:0;
                     padding-top:16px; }
  /* The whole point is that it fits: the list scrolls inside the panel, the
     header and the search box stay put above it. */
  #panel.routemode #routefield { position:sticky; top:0; z-index:2;
                                 background:white; padding-bottom:6px; margin-bottom:0; }
  #panel.routemode #route-exit { display:block !important; }
  #panel.favmode, #panel.setmode, #panel.mtrmode, #panel.stopmode { top:var(--toph); max-height:calc(100vh - var(--toph));
                  max-height:calc(100dvh - var(--toph)); border-radius:0;
                   padding-top:16px; }
  #favview .favhead, #setview .favhead { font-size:1.1765rem; font-weight:800; color:#111;
                      margin:4px 0 14px; }

  /* SETTINGS. One row per setting: what it is on the left, the control on
     the right, each control a full 48px tap target. */
  #setview .setrow { display:flex; align-items:center; gap:12px;
                     border:2px solid var(--line-soft); border-radius:12px;
                     padding:12px 14px; margin-bottom:10px; }
  #setview .setlabel { flex:1; min-width:0; font-size:1rem; font-weight:700; color:#111; }
  #setview .setnote { color:var(--ink-3); padding:4px 4px 18px; line-height:1.5;
                      font-size:1rem; }
  #setview .setrow-stack { flex-direction:column; align-items:stretch; gap:10px; }
  .sizebtns { display:flex; gap:8px; }
  .sizebtn { flex:1; min-height:50px; border-radius:10px; border:2px solid var(--line);
             background:white; color:var(--ink); font-size:1rem; font-weight:800;
             cursor:pointer; }
  .sizebtn.on { background:var(--navy); border-color:var(--navy); color:white; }
  /* One refresh control, used on every list that shows live times. */
  .refreshbtn { flex:0 0 auto; min-height:44px; padding:0 14px; border-radius:10px;
                border:2px solid var(--line); background:white; color:var(--blue);
                font-size:1rem; font-weight:800; cursor:pointer; white-space:nowrap; }
  .refreshbtn:disabled { color:var(--ink-3); }
  .legfare { font-size:1.0588rem; font-weight:800; color:var(--teal); margin-left:12px;
             background:var(--teal-tint); padding:3px 10px; border-radius:8px;
             vertical-align:middle; }
  /* Long Chinese place names such as 港珠澳大橋旅檢大樓 (落客站) were running
     off the right edge instead of wrapping. */
  .jcard .jdet { font-size:1rem; line-height:1.6; color:#111;
                 overflow-wrap:anywhere; word-break:break-word; }
  .jcard, .jcard * { min-width:0; }

  #findbuses { width:100%; min-height:56px; border:none; border-radius:10px; background:var(--green);
               color:white; font-size:1.1176rem; font-weight:800; cursor:pointer; margin-bottom:16px; }
  #findbuses:disabled { background:#6b7280; cursor:default; }

  /* RESULTS MODE
     Once a journey is on screen, the entry form is just clutter — the user
     has already told us where they are going. We hide it and show a compact
     A → B summary instead, so the whole panel is results. */
  #panel.results .field,
  #panel.results #findbuses { display:none; }

  /* The trip (A → B) lives in the bottom banner, not the panel, so the
     three options can sit right at the top of the panel where the eye lands. */
  #rb-trip { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
             padding-bottom:10px; margin-bottom:10px;
             border-bottom:2px solid rgba(255,255,255,.25); }
  #rb-trip .tp { font-size:1rem; font-weight:800; }
  #rb-trip .tp small { display:block; font-size:0.94rem; font-weight:600; opacity:.8; }
  #rb-trip .arrow { font-size:1.1765rem; opacity:.8; }
  #rb-edit { margin-left:auto; border:2px solid rgba(255,255,255,.6); background:transparent;
             color:white; border-radius:10px; padding:10px 14px; font-size:1rem;
             font-weight:700; cursor:pointer; min-height:44px; }
  #rb-edit:hover { background:rgba(255,255,255,.15); }

  /* The whole row toggles it, but the box is what an older eye aims for, so
     the box itself is big enough to be a target — 24px was the one control
     the audit found under size. */
  #shownotrunning { display:flex; align-items:center; gap:12px; font-size:1rem;
                    color:var(--ink-2); margin-bottom:12px; cursor:pointer;
                    min-height:48px; font-weight:700; }
  #shownotrunning input { width:30px; height:30px; flex:0 0 30px; accent-color:var(--navy);
                          cursor:pointer; }
  #panel.results #shownotrunning { display:none; }

  #status { font-size:1rem; color:var(--ink-2); border-top:2px solid var(--line-soft); padding-top:10px; }

  /* Arrival times: the thing people squint at, so the biggest text in the app. */
  .eta-row { margin:12px 0; }
  .eta-route { display:inline-block; min-width:60px; font-weight:800; color:var(--red); font-size:1.4118rem; }
  .eta-dest { color:#222; font-size:1rem; }
  .eta-times { font-weight:800; font-size:1.5294rem; color:#111; display:block; margin-top:2px; }
  .eta-arrive { display:block; flex-basis:100%; font-size:0.94rem; font-weight:700; color:var(--green); margin-top:2px; }
  .eta-fare { display:inline-block; margin-left:8px; padding:1px 7px; border-radius:12px;
              background:var(--red-tint); color:var(--red); font-weight:800; font-size:1rem; vertical-align:2px; }
  .eta-note { color:#444; font-size:1rem; }
  .leaflet-popup-content { font-size:1.0588rem; min-width:240px; }
  .leaflet-popup-content b { font-size:1.1765rem; }

  /* START / END markers: large enough to read at arm's length. */
  .endwrap { display:flex; align-items:center; white-space:nowrap; }
  .enddot { width:44px; height:44px; border-radius:22px; flex:0 0 44px; background:var(--green);
            border:4px solid white; color:white; font-size:1.2941rem; font-weight:800;
            line-height:36px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.5); }
  .endtext { background:var(--green); color:white; font-weight:800; font-size:1rem; padding:8px 14px;
             border-radius:10px; margin-left:-6px; box-shadow:0 2px 8px rgba(0,0,0,.5);
             max-width:250px; overflow:hidden; text-overflow:ellipsis; }
  .endwrap.finish .enddot, .endwrap.finish .endtext { background:var(--red); }
  .endwrap.flip { flex-direction:row-reverse; justify-content:flex-end; }
  .endwrap.flip .endtext { margin-left:0; margin-right:-6px; text-align:right; }




  .jcard { position:relative; padding-left:56px; }
  .jnum { position:absolute; left:12px; top:12px; width:36px; height:36px;
          border-radius:18px; color:white; font-size:1.1176rem; font-weight:800;
          text-align:center; line-height:36px; }



  /* Four big numbers in one flex row could not fit a phone, so each one
     wrapped and left its unit stranded on the next line: "67 / 分鐘",
     "2 程 / 巴士". A 2x2 grid gives every figure a fixed cell, and putting
     the label UNDER the number rather than beside it means the two can
     never be separated. */
  .jheadline { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px;
               margin:10px 0 12px; }
  .jcell { background:var(--surface-3); border-radius:12px; padding:10px 12px; min-width:0; }
  .jbig { font-size:1.8824rem; font-weight:800; color:#111; line-height:1.1;
          white-space:nowrap; }
  .junit { display:block; font-size:1rem; font-weight:700; color:var(--ink-3);
           margin-top:2px; }

  .jextra { font-size:1rem; font-weight:700; color:var(--teal); background:var(--teal-tint);
            border-radius:8px; padding:6px 10px; margin-bottom:8px; }
  .jwhy { font-size:1rem; line-height:1.5; color:var(--ink-3); margin-bottom:10px; }
  .jnext { background:#052e16; color:#bbf7d0; border-radius:10px; padding:10px 12px;
           margin:8px 0; font-size:1rem; font-weight:700; }
  .jnext .mins { font-size:1.5294rem; font-weight:800; color:white; }
  .jnext.waiting { background:var(--surface-2); color:var(--ink-2); font-weight:700; }
  .jnext.warn { background:#fef3c7; color:var(--amber); font-weight:700; }

  .jwarn { background:#fff7ed; color:#9a3412; border-radius:10px; padding:9px 11px;
           margin:8px 0; font-size:1rem; font-weight:700; line-height:1.4; }

  .jzoom { display:flex; gap:8px; margin-top:10px; }
  .zoombtn { flex:1; min-height:48px; border:2px solid var(--blue); background:white;
             color:var(--blue); border-radius:10px; font-size:1rem; font-weight:700;
             cursor:pointer; padding:8px 6px; }
  .zoombtn:hover { background:var(--navy-tint); }



  #stopdetail { position:absolute; top:14px; right:14px; z-index:1200; width:330px;
                max-width:calc(100vw - 30px); background:white; border-radius:12px;
                padding:16px 18px; box-shadow:0 4px 18px rgba(0,0,0,.4);
                border-left:10px solid var(--green); display:none; }
  #stopdetail.alighting { border-left-color:var(--red); }
  #sd-close { position:absolute; top:8px; right:10px; border:none; background:var(--surface-2);
              width:40px; height:40px; border-radius:20px; font-size:1.1176rem; cursor:pointer; }
  .sd-head { font-size:1rem; font-weight:800; color:var(--green); padding-right:44px; }
  #stopdetail.alighting .sd-head { color:var(--red); }
  .sd-stop { font-size:1.4118rem; font-weight:800; margin:6px 0 2px; line-height:1.25; }
  .sd-sub  { font-size:1rem; color:#555; }
  .sd-line { font-size:1rem; margin-top:10px; line-height:1.4; }
  .sd-walk { font-size:1.2941rem; font-weight:800; margin-top:10px; }
  .sd-note { font-size:0.94rem; color:var(--amber); margin-top:10px; line-height:1.4; }

  .bigarrow { font-size:3.0588rem; line-height:52px; font-weight:900;
              text-shadow:0 0 6px white, 0 0 12px white, 0 2px 4px rgba(0,0,0,.4);
              animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }

  /* The grip itself is styled further down, with the rest of the sheet. */

  /* ==========================================================
     PHONE LAYOUT — the only layout.
     This app is used on a phone and nowhere else, so there is no desktop
     branch to fall out of step with. The panel is a bottom sheet, the
     controls sit under the thumb, and the grip cycles three heights.
     ========================================================== */
  #panel {
    top:auto; bottom:0; left:0; right:0; width:auto;
    /* max-height must COUNT the padding. Without this the 84px of bottom-bar
       clearance is added on TOP of a 100dvh sheet, the extra hangs above the
       screen, and the first row of option tiles is cut off with no way to
       scroll to it. */
    box-sizing:border-box;
    max-width:none; border-radius:16px 16px 0 0;
    max-height:55vh; padding:8px 14px 20px;
    box-shadow:0 -3px 16px rgba(0,0,0,.3);
    transition:max-height .2s ease;
    overscroll-behavior:contain;    /* scrolling the sheet must not drag the page */
    /* Keep the last button clear of the iPhone home indicator. */
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  }
  /* dvh follows the browser toolbar as it slides away; vh does not, which is
     why a "full height" sheet on iOS Safari used to run off the bottom of the
     screen. Older browsers ignore the dvh line and keep the vh one above it. */
  #panel { max-height:55dvh; }
  #panel.peek { max-height:150px; overflow:hidden; }
  /* Every tall state is capped at the space below the bar, so the top of the
     sheet can never slide underneath it. */
  #panel.tall { max-height:min(88vh, calc(100vh - var(--toph)));
                max-height:min(88dvh, calc(100dvh - var(--toph))); }

  /* RESULTS: the whole screen, same as the entry form.
     Comparing three journeys means reading three cards, and a 55vh sheet
     showed barely one and a half of them. The map is behind the sheet at
     this moment anyway, so the options take the screen. The sheet still
     hangs from the bottom, so pulling the grip down brings the map back. */
  #panel.results { max-height:calc(100vh - var(--toph));
                   max-height:calc(100dvh - var(--toph)); }
  #panel.results.peek { max-height:150px; }
  #panel.results.tall { max-height:min(88vh, calc(100vh - var(--toph)));
                        max-height:min(88dvh, calc(100dvh - var(--toph))); }

  /* ENTERING A TRIP: full screen, no map.
     On a phone, hunting for a stop on a small map is fiddly and slow.
     Typing a name is far easier, so the form gets the whole screen and
     the map only appears once there is a journey worth looking at. */
  #panel:not(.results) {
    top:var(--toph); max-height:calc(100vh - var(--toph));
    max-height:calc(100dvh - var(--toph)); border-radius:0;
    padding-top:16px; box-shadow:none;
  }
  #panel:not(.results) #sheetgrip { display:none; }
  /* The bar is overhead now, so the sheet only needs to clear the iPhone
     home indicator at the bottom, not a 84px bar. */
  #panel { padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px)); }

  /* "Tap on map" cannot work when the map is hidden, so it goes away
     until the map is back. Typing and GPS still cover both ends. */
  #panel:not(.results) .btn[id$="-pin"] { display:none; }
  #panel:not(.results) .btns { gap:0; }

  /* The grip needs a real tap target, not a 6px hairline. The bar itself
     stays slim, but the area around it is 44px tall and grabs the touch. */
  #sheetgrip {
    display:flex; align-items:center; justify-content:center;
    height:44px; margin:-8px -14px 4px; cursor:grab;
    touch-action:none;                 /* let us handle the drag ourselves */
  }
  #sheetgrip::before {
    content:''; width:64px; height:7px; border-radius:4px;
    background:#94a3b8; box-shadow:0 0 0 1px rgba(0,0,0,.05);
  }
  #sheetgrip:active { cursor:grabbing; }
  #sheetgrip:active::before { background:#475569; }

  #compare { gap:6px; }
  .ctile { padding:8px 4px; }
  .ctile .ctitle { font-size:0.94rem; min-height:26px; }
  .ctile .ctime  { font-size:1.2353rem; }
  .ctile .cbus   { font-size:1.1176rem; }
  .ctile .cfare  { font-size:0.94rem; }

  #stopdetail { top:calc(var(--toph) + 10px); right:10px; left:10px; width:auto; }

  #routebanner { padding:10px 12px; }
  #routebanner .rb-route { font-size:1.4118rem; }
  #routebanner .rb-line  { font-size:1rem; }
  #rb-trip .tp { font-size:1rem; }
  #rb-close { width:44px; height:44px; font-size:1.1765rem; top:8px; right:8px; }

  /* The Lands Department logo must stay visible. The bar is overhead now, so
     the bottom-left corner is clear again — and that is where the sheet's
     rounded corner leaves map showing. */
  #landsdlogo { top:auto; bottom:6px; left:8px; }

  #routebanner { position:absolute; bottom:0; left:0; right:0; z-index:1000;
                 background:var(--navy); color:white; padding:14px 18px; display:none;
                 padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px)); }
  #routebanner.ctb { background:#9a3412; }
  #routebanner .rb-route { font-size:1.8824rem; font-weight:800; }
  #routebanner .rb-company { font-size:1rem; opacity:.85; margin-left:10px; }
  #routebanner .rb-line { font-size:1.2941rem; margin-top:8px; }
  #routebanner .rb-label { display:inline-block; min-width:76px; font-weight:800; font-size:1rem; opacity:.9; }
  #routebanner .rb-note { font-size:0.94rem; opacity:.85; margin-top:8px; }
  #rb-close { position:absolute; top:10px; right:12px; background:rgba(255,255,255,.2);
              border:none; color:white; font-size:1.4118rem; width:52px; height:52px;
              border-radius:26px; cursor:pointer; }
</style>
</head>
<body>

<div id="map"></div>
<img id="landsdlogo"
     src="https://api.hkmapservice.gov.hk/mapapi/landsdlogo.jpg"
     alt="Lands Department">

<div id="panel">
  <div id="sheetgrip" title="Expand or collapse"></div>
  <div id="geoask" style="display:none"></div>
  <!-- BUS NUMBER FIRST. "When is my bus coming" is the daily question, and
       most riders know their number; it should not sit below the whole trip
       planner. Typing here switches the panel to "route mode" and the trip
       form steps aside — the two are different jobs, and on a phone together
       they are more scrolling than either is worth. -->
  <div class="field" id="routefield">
    <div class="flabelrow">
      <div class="flabel">🚌 查詢巴士路線</div>
      <button class="rsclose" id="route-exit" style="display:none">✕</button>
    </div>
    <div class="frow">
      <input id="route-text" type="text" inputmode="text" autocapitalize="characters"
             placeholder="路線號碼，例如 60M" autocomplete="off">
    </div>
    <ul class="results" id="route-results"></ul>
  </div>
  <!-- Every stop on the chosen route, in order. Filled by renderRouteStops(). -->
  <div id="routestops"></div>
  <div id="livestrip"></div>
  <!-- The name and language button used to sit in a red bar here. The bar
       spent a whole row of a phone screen saying something the user already
       knows, so the name is now only in the title and the language switch
       lives in SETTINGS. -->
  <div id="setview" style="display:none"></div>
  <div id="mtrview" style="display:none"></div>
  <div id="stopview" style="display:none"></div>


  <!-- START: three ways to set it, exactly like DESTINATION below. -->
  <div class="field">
    <!-- Label and favourites share one row: the five slots were a whole line
         of their own before, and on a phone that line was worth more than the
         repetition of showing them under a heading. -->
    <div class="flabelrow">
      <div class="flabel start">● 起點</div>
      <div class="favs" id="start-favs"></div>
    </div>
    <div class="chosen empty" id="start-chosen">未設定</div>
    <button class="addfav" id="start-save" style="display:none">⭐ 加入常用地點</button>
    <div class="frow">
      <input id="start-text" type="text" placeholder="輸入大廈或地點名稱…" autocomplete="off">
      <!-- GPS sits above Search in one column instead of taking its own
           full-width row underneath. -->
      <div class="fcol">
        <button class="btn gpsbtn" id="start-gps" title="我的位置" aria-label="我的位置">📍</button>
        <button class="gobtn" id="start-go">搜尋</button>
      </div>
    </div>
    <div class="btns">
      <button class="btn" id="start-pin">在地圖上點選</button>
    </div>
    <ul class="results" id="start-results"></ul>
  </div>

  <!-- DESTINATION: same three options. -->
  <div class="field">
    <div class="flabelrow">
      <div class="flabel end">■ 目的地</div>
      <div class="favs" id="end-favs"></div>
    </div>
    <div class="chosen empty" id="end-chosen">未設定</div>
    <button class="addfav" id="end-save" style="display:none">⭐ 加入常用地點</button>
    <div class="frow">
      <!-- No "my location" here: you are already at your location, so it can
           only ever be a starting point. The column keeps Search the same
           size and position as the one above. -->
      <input id="end-text" type="text" placeholder="輸入大廈或地點名稱…" autocomplete="off">
      <div class="fcol">
        <button class="gobtn" id="end-go">搜尋</button>
      </div>
    </div>
    <div class="btns">
      <button class="btn" id="end-pin">在地圖上點選</button>
    </div>
    <ul class="results" id="end-results"></ul>
  </div>

  <button id="findbuses" disabled>請先設定起點及目的地</button>
  <label id="shownotrunning"><input type="checkbox" id="notrunning-box"> <span id="notrunning-label"></span></label>
  <div id="favview" style="display:none"></div>
  <div id="compare"></div>
  <div id="journeys"></div>
  <div id="walkinfo"></div>


  <button class="btn" id="clear-all" style="width:100%">全部清除</button>

  <div id="status">正在載入巴士資料…</div>
</div>

<div id="stopdetail"></div>

<!-- "Which way?" for a looked-up bus. Filled by showDirections(). -->
<div id="dirsheet" role="dialog" aria-modal="true"><div class="dircard" id="dircard"></div></div>

<div id="routebanner">
  <button id="rb-close" title="Close">✕</button>
  <div id="rb-trip" style="display:none">
    <div class="tp"><small id="rb-tripfromlabel"></small><span id="rb-tripfrom"></span></div>
    <div class="arrow">→</div>
    <div class="tp"><small id="rb-triptolabel"></small><span id="rb-tripto"></span></div>
    <button id="rb-edit"></button>
  </div>
  <div><span class="rb-route" id="rb-route"></span><span class="rb-company" id="rb-company"></span></div>
  <div class="rb-line"><span class="rb-label">FROM</span> <b id="rb-from"></b></div>
  <div class="rb-line"><span class="rb-label">TO</span> <b id="rb-to"></b></div>
  <div class="rb-note" id="rb-note"></div>
</div>

<nav id="bottombar">
  <!-- 車站 first: "which bus is coming to take me there" is the daily question. -->
  <button class="bnav on" data-nav="stop"><span class="bicon">🚏</span><span class="blabel"></span></button>
  <button class="bnav"    data-nav="bus"><span class="bicon">🚌</span><span class="blabel"></span></button>
  <button class="bnav"    data-nav="mtr"><span class="bicon">🚇</span><span class="blabel"></span></button>
  <button class="bnav"    data-nav="fav"><span class="bicon">⭐</span><span class="blabel"></span></button>
  <button class="bnav"    data-nav="set"><span class="bicon">⚙️</span><span class="blabel"></span></button>
</nav>

<!-- Weather and Observatory warnings, under the bar. Hidden until there is
     something real to show, so a failed fetch costs no screen space. -->
<div id="weatherbar" style="display:none"></div>

<!-- Every message the app has to say goes to #status at the BOTTOM of the
     panel, which on a phone is usually off screen. This mirrors each new
     message here, under the bar, for a few seconds. -->
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

// KMB bakes its own pole code into the stop name — "FESTIVAL WALK (SS920)".
// That code means nothing to a rider, and it is the reason two poles at the
// very same spot used to show up as two separate choices. We hide it.
// The pattern is strict (two capitals, three digits, sometimes a letter) so
// real names keep their brackets: "CENTRAL (MACAO FERRY)" is untouched.
const POLE_CODE = /\s*\([A-Z]{2}\d{3}[A-Za-z]?\)\s*$/;

function plainStopName(name) {
  return String(name || '').replace(POLE_CODE, '').trim();
}

function stopName(stop) {
  if (!stop) return '';
  return plainStopName(lang === 'zh' ? (stop.name_tc || stop.name_en) : stop.name_en);
}

  let hideTimer = null, last = '';

// HOW MUCH OF THE MAP IS HIDDEN BEHIND OUR OWN PANELS?
// The map runs edge to edge, but panels float on top of it. Framing a route
// without allowing for them centres things the user cannot see. On a phone
// the panel is a bottom sheet, so the reserved space moves — measuring the
// real elements keeps the numbers right on any screen.
// This app is phone-only, so the bottom-sheet behaviour is always on. The

function mapPadding() {
  const panel  = document.getElementById('panel');
  const banner = document.getElementById('routebanner');
  const bar    = document.getElementById('bottombar');

  // offsetParent is null for a position:fixed element even when it is on
  // screen, so the nav bar would measure as hidden. Its rectangle does not
  // lie, so ask that instead.
  const visible = el => el && el.getBoundingClientRect().height > 0;
  const bannerH = visible(banner) ? banner.offsetHeight : 0;

  // The nav bar covers the top of the map. Measured rather than assumed:
  // it grows with the notch, and a route framed under it is a route the
  // user cannot see.
  const barH = visible(bar) ? bar.offsetHeight : 0;

  // The sheet covers the bottom of the map, so reserve that much space when
  // framing a route. Cap it at 55% — beyond that the sheet is covering the
  // map anyway and there is nothing left worth framing.
  const sheetH = visible(panel)
    ? Math.min(panel.offsetHeight, window.innerHeight * 0.55) : 0;

  return { paddingTopLeft: [20, barH + 20],
           paddingBottomRight: [20, sheetH + bannerH + 20] };
}

// ============================================================
// 1b. A CACHE THAT ACTUALLY HOLDS THE BIG FILES
// ============================================================
// sessionStorage caps out around 5 MB and throws the rest away silently, so
// the large network files were being re-downloaded on EVERY page load.
// IndexedDB has no practical size limit and survives closing the browser,
// so the first visit pays the cost and later visits are near-instant.
//
// Each entry is stamped with the day it was fetched. The bus network changes
// once a day, so anything from today is good enough to use as-is.
const CACHE_DB = 'hkfast-cache';
let cacheReady = null;

function openCache() {
  if (cacheReady) return cacheReady;
  cacheReady = new Promise(resolve => {
    const request = indexedDB.open(CACHE_DB, 1);
    request.onupgradeneeded = () => request.result.createObjectStore('files');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => resolve(null);          // carry on without a cache
  });
  return cacheReady;
}

function today() { return new Date().toISOString().slice(0, 10); }

async function cacheGet(key) {
  try {
    const db = await openCache();
    if (!db) return null;
    return await new Promise(resolve => {
      const request = db.transaction('files').objectStore('files').get(key);
      request.onsuccess = () => {
        const entry = request.result;
        resolve(entry && entry.day === today() ? entry.value : null);
      };
      request.onerror = () => resolve(null);
    });
  } catch (error) { return null; }
}

async function cachePut(key, value) {
  try {
    const db = await openCache();
    if (!db) return;
    db.transaction('files', 'readwrite').objectStore('files')
      .put({ day: today(), value }, key);
  } catch (error) { /* a full or blocked cache must never break the app */ }
}

async function loadOnce(cacheKey, url, onDone) {
  const cached = await cacheGet(cacheKey);
  if (cached) { onDone(cached); return; }

  try {
    const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const json = await response.json();
    cachePut(cacheKey, json.data);
    onDone(json.data);
  } catch (error) {
    console.error(cacheKey + ' failed:', error);
    status.textContent = T('someDataFailed') + ' ' + error.message;
  }
}

// ============================================================
// 3. DISTANCE AND WALKING TIME
// ============================================================
// Haversine: STRAIGHT-LINE distance, as a bird flies. Not the walked path.
function metresBetween(lat1, lng1, lat2, lng2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function findNearestStop(lat, lng) {
  let best = null, bestMetres = Infinity;
  for (const stop of allStops) {
    const m = metresBetween(lat, lng, Number(stop.lat), Number(stop.long));
    if (m < bestMetres) { bestMetres = m; best = stop; }
  }
  return { stop: best, metres: bestMetres };
}

// ASSUMPTIONS, stated openly rather than hidden:
//  * +30% on straight-line distance, because pavements bend around buildings.
//  * 3.5 km/h, slower than the usual 5 km/h adult average, because our main
//    users are older riders. Better to over-estimate than to rush someone.
const DETOUR_FACTOR = 1.3, WALK_KMH = 3.5;

function walkingEstimate(straightMetres) {
  const metres = straightMetres * DETOUR_FACTOR;
  return { metres: Math.round(metres),
           minutes: Math.max(1, Math.round(metres / 1000 / WALK_KMH * 60)) };
}

// ============================================================
// 5. TYPE A PLACE NAME
// ============================================================
// Hong Kong's Lands Department publishes an official Location Search API that
// finds a place by building name, facility name or address. If it is ever
// unavailable, we fall back to searching bus stop names so the app still works.
//
// NOTE: this runs only when the user presses Find or Enter — never on every
// keystroke. Type-ahead would fire a request per letter, which is rude to any
// free service and the fastest way to get an app blocked.
const GEOCODER = 'https://geodata.gov.hk/gs/api/v1.0.0/locationSearch?q=';

// HOW SEARCH-AS-YOU-TYPE WORKS HERE
// Two speeds, deliberately:
//  * Bus stops are already downloaded, so they filter INSTANTLY with every
//    keystroke — no network, no cost, no rate limit to worry about.
//  * The government place lookup runs only after you STOP typing for 600ms.
//    Firing it on every letter would send eight requests for "太子站" and the
//    Lands Department asks that its APIs not be hit hard in short bursts.
let searchTimers = { start: null, end: null };

// MERGING NEARBY DUPLICATE STOPS
// Bus companies often list one physical stop several times — TM167 and TM168
// are both 屯門公園, a few metres apart, because different routes are recorded
// separately. Showing all of them makes the list confusing and the choice
// meaningless: the rider stands in the same place either way.
//
// We merge stops that share a NAME and sit within 15 m of each other.
// 15 m is deliberate: a Hong Kong road is wider than that, so stops on
// OPPOSITE sides stay separate — which matters, because those really are
// different places going in different directions.
const MERGE_RADIUS_M = 15;

// On the map a dot must sit where the pole really is, so 15 m is right there.
// In the SEARCH LIST the opposite is true: "又一城 (SS920)" and "又一城 (SS922)"
// are one place to a rider, and nobody knows which code they want. We merge
// same-named poles far more generously there. Picking the right pole is not
// the rider's job — once a destination is set, the planner looks at every
// stop within walking range of the chosen point and takes whichever one
// actually runs a bus to where they are going.
const SEARCH_MERGE_RADIUS_M = 250;

function mergeNearbyStops(stops, radius) {
  const limit = radius === undefined ? MERGE_RADIUS_M : radius;
  const groups = [];

  for (const stop of stops) {
    const lat = Number(stop.lat), lng = Number(stop.long);
    const name = plainStopName(stop.name_en).toUpperCase();

    // Does this stop belong to a group we have already started?
    let joined = false;
    for (const group of groups) {
      if (group.nameKey !== name) continue;
      if (metresBetween(lat, lng, group.lat, group.lng) > limit) continue;

      group.members.push(stop);
      // Keep the group sitting at the middle of its poles, so any walking
      // distance we show is fair to all of them.
      group.lat += (lat - group.lat) / group.members.length;
      group.lng += (lng - group.lng) / group.members.length;
      joined = true;
      break;
    }

    if (!joined) {
      groups.push({
        nameKey: name, lat, lng,
        name_en: plainStopName(stop.name_en),
        name_tc: plainStopName(stop.name_tc),
        stop: stop.stop, members: [stop]
      });
    }
  }

  return groups;
}

// WHICH STOPS CAN I ACTUALLY GET TO?
// Once a start is chosen, we work out every stop reachable by one bus, or by
// one bus plus one change. Destination suggestions outside that set are
// hidden — offering somewhere no bus goes wastes an older rider's time.
//
// The catch: this needs the whole network file. So we start fetching it the
// moment a start point is set, while the user is still typing. If it has not
// arrived yet we hide NOTHING — an instant list beats a filtered one that
// makes you wait.
let reachableStops = null;      // Set of stop IDs, or null = "don't know yet"

async function computeReachable() {
  reachableStops = null;
  if (!startPoint) return;

  const forPoint = startPoint;          // remember which start this was for
  await buildIndexes();

  // The user may have changed their start while we were downloading.
  if (startPoint !== forPoint) return;

  const near = stopsNear(startPoint.lat, startPoint.lng);
  const firstLegRoutes = new Map();     // routeKey -> earliest boarding seq

  for (const entry of near)
    for (const service of (stopIndex.get(entry.stop.stop) || [])) {
      const existing = firstLegRoutes.get(service.routeKey);
      if (existing === undefined || service.seq < existing)
        firstLegRoutes.set(service.routeKey, service.seq);
    }

  // One bus.
  const reached = new Set();
  for (const [routeKey, boardSeq] of firstLegRoutes)
    for (const entry of (routeIndex.get(routeKey) || []))
      if (entry.seq > boardSeq) reached.add(entry.stopId);

  // One bus, then a change onto another.
  const afterOneLeg = [...reached];
  for (const stopId of afterOneLeg)
    for (const service of (stopIndex.get(stopId) || []))
      for (const entry of (routeIndex.get(service.routeKey) || []))
        if (entry.seq > service.seq) reached.add(entry.stopId);

  reachableStops = reached;
  console.log('Reachable stops from start:', reached.size);

  // If they are already typing a destination, refresh the list now.
  if (document.getElementById('end-text').value) searchLocalStops('end');
}

// Every place name in the government data is Traditional, but plenty of
// people type Simplified — 荃湾 rather than 荃灣, 观塘 rather than 觀塘. Without
// this, those searches return nothing at all, which looks like the app is

//
// The table below covers only the 531 characters that actually appear in
// Hong Kong stop, station and terminus names AND differ between the two
