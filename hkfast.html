// ============================================================
// 6b. FIND BUSES FROM START TO DESTINATION
// ============================================================
// This finds DIRECT routes only — one bus, no changing. Journeys needing a
// transfer are not covered yet; that is a much bigger problem and is the
// honest next step rather than something to fake.
//
// How it works, in plain steps:
//   1. Find every bus stop within walking distance of START and of DESTINATION.
//   2. Look up which routes serve each of those stops, and in what order.
//   3. Keep any route that visits a START stop BEFORE a DESTINATION stop.
//      (Order matters — the same route going the other way is no use.)
//   4. Estimate the time and sort the best first.

// ---- OPTIONAL: real road shapes for bus routes ----------------------
// The Transport Department publishes bus route geometry in its
// "Routes and fares of public transport (GeoJSON)" dataset, under the
// resource named "Bus Route (CSDI Portal)":
//   https://data.gov.hk/en-data/dataset/hk-td-tis_23-routes-fares-geojson
//
// Open that page, find that resource, copy its download URL, and paste it
// below. Until then the app joins consecutive bus stops, which follows the
// roads closely for local routes but cuts corners on long express hops.
// Transport Department bus route file: real road geometry AND fares.
// Data dictionary:
// https://static.data.gov.hk/td/routes-fares-geojson/dataspec/ptroutefare_geojson_dataspec.pdf
const TD_BUS_URL = 'https://static.data.gov.hk/td/routes-fares-geojson/JSON_BUS.json';

// ---- FARES ----------------------------------------------------------
// The Transport Department publishes fares only inside Microsoft Access
// (.mdb) files, which a browser cannot read. HK Bus Crawling republishes
// the same government data as JSON, rebuilt daily.
//
// LICENSING NOTE (why this is safe to use):
// The crawler itself is GPL-2.0, but this file is its OUTPUT. GPL-2.0 says
// "the output from the Program is covered only if its contents constitute a
// work based on the Program", and the FSF adds that output "inherits the
// copyright status of the input it was generated from". The input here is
// DATA.GOV.HK open data — free for commercial and non-commercial use with
// attribution. GPL would only apply if we copied their Python code, which
// we have not. We credit both sources, as each asks.
//   Crawler: https://github.com/hkbus/hk-bus-crawling  (cite: HK Bus Crawling@2021)
//
// HOST NOTE: this file is also published at hkbus.github.io, but GitHub Pages
// sends NO Access-Control-Allow-Origin header, so a browser refuses to read
// it and every fare, timetable and Citybus stop silently vanishes. The raw
// host below serves the identical file from the same repository's gh-pages
// branch and does send "Access-Control-Allow-Origin: *".
const HKBUS_URL = 'https://raw.githubusercontent.com/hkbus/hk-bus-crawling/gh-pages/routeFareList.min.json';

// The network file above is 8.2 MB, most of which this app never reads: MTR,
// light rail, ferries, holidays, KMB stop lists we already get from the KMB
// API. LITE_URL is that same data trimmed to what the planner actually uses —
// Citybus, New Lantao Bus and green minibus — and it sits beside this page,
// so it costs no mobile data at all. The network file stays as the fallback
// for anyone running this without the local copy.
const LITE_URL = 'hk-bus-lite.json';

let fareIndex = null;      // "ROUTE|BOUND|TYPE|CO" -> { fares, stops }
let hkbusRoutes = null;    // the raw route list, reused to build the journey index
let serviceInfo = new Map();   // routeKey -> { freq } for working out service hours
let ctbStops = [];         // Citybus stops, reshaped to look like KMB stops

// One number that decides how a value is read, in one place: this file nests
// things differently from the government feeds, so we unwrap it defensively.
function readStopRecord(id, record) {
  if (!record) return null;

  // The trimmed file stores a stop as a bare array — [name EN, name ZH, lat,
  // lng] — because 7,600 of them as objects cost about a third of a megabyte
  // in repeated key names. The network file uses objects. Accept both.
  if (Array.isArray(record)) {
    const lat = Number(record[2]), lng = Number(record[3]);
    if (!isFinite(lat) || !isFinite(lng)) return null;
    return { stop: id, name_en: record[0] || id, name_tc: record[1] || '', lat, long: lng };
  }

  const lat = Number(record.location ? record.location.lat : record.lat);
  const lng = Number(record.location ? record.location.lng : record.long);
  if (!isFinite(lat) || !isFinite(lng)) return null;

  const name = record.name || {};
  return {
    stop: id,
    name_en: name.en || record.name_en || id,
    name_tc: name.zh || record.name_tc || '',
    lat, long: lng
  };
}

// The trimmed file stores each route as short keys to keep it small. Widen it
// back into the shape the rest of this app already expects, so nothing
// downstream has to care which file the data arrived in.
function widenLiteRoutes(list) {
  const out = {};
  (list || []).forEach((row, index) => {
    out['lite' + index] = {
      route: row.r, serviceType: row.t,
      bound: row.b || {}, stops: row.s || {},
      fares: row.f || null, freq: row.q || null
    };
  });
  return out;
}

async function loadFareData() {
  if (fareIndex) return;
  fareIndex = new Map();

  try {
    let data = await cacheGet('hkbus-lite');
    let stopList;

    if (!data) {
      // Local trimmed file first. It is beside this page, so on a phone it
      // costs nothing and finishes before the network file would have begun.
      try {
        const local = await fetch(LITE_URL, { signal: AbortSignal.timeout(20000) });
        if (!local.ok) throw new Error('server said ' + local.status);
        data = await local.json();
      } catch (localError) {
        console.warn('Trimmed file unavailable, downloading the full one:', localError);
        const response = await fetch(HKBUS_URL, { signal: AbortSignal.timeout(60000) });
        if (!response.ok) throw new Error('server said ' + response.status);
        const full = await response.json();
        data = { routes: null, stops: full.stopList || {}, routeList: full.routeList || {} };
      }
      cachePut('hkbus-lite', data);
    }

    hkbusRoutes = data.routes ? widenLiteRoutes(data.routes) : (data.routeList || {});
    stopList = data.stops || {};

    // Citybus, minibus and NLB have no bulk stop download of their own, so
    // their stops travel with this file. Collecting them here is what makes
    // those journeys possible at all.
    const wanted = new Set();
    for (const entry of Object.values(hkbusRoutes)) {
      if (!entry || !entry.stops) continue;
      for (const co of PLANNED_OPERATORS)
        for (const id of (entry.stops[co] || [])) wanted.add(id);
    }

    ctbStops = [];
    for (const id of wanted) {
      const stop = readStopRecord(id, stopList[id]);
      if (stop) ctbStops.push(stop);
    }

    // Fares, keyed per company so KMB 6 and Citybus 6 never collide.
    for (const entry of Object.values(hkbusRoutes)) {
      if (!entry || !entry.route) continue;

      for (const company of Object.keys(entry.bound || {})) {
        const key = String(entry.route).toUpperCase() + '|' + entry.bound[company] +
                    '|' + (entry.serviceType || '1') + '|' + company;

        fareIndex.set(key, {
          fares: entry.fares || [],
          stops: (entry.stops || {})[company] || []
        });

        // Keep the timetable summary so we can tell whether a route is
        // actually running right now. Never let a blank one overwrite a
        // timetable the KMB file already supplied.
        if (entry.freq || !serviceInfo.has(key))
          serviceInfo.set(key, { freq: entry.freq || null });
      }
    }

    console.log('Fare routes indexed:', fareIndex.size, '· Citybus stops:', ctbStops.length);
  } catch (error) {
    console.warn('Fare data unavailable:', error);
  }
}

// ============================================================
// WHAT KIND OF DAY IS IT?
// ============================================================
// Hong Kong bus timetables differ on Sundays and public holidays — fewer
// early buses, different last buses. Treating every day as a weekday means
// quietly wrong service hours for about a fifth of the year.
//
// Public holidays come from 1823 (Digital Policy Office), published on
// DATA.GOV.HK under the same free terms as the bus data. Sundays and public
// holidays count as the same class: the General Holidays Ordinance treats
// Sunday as a general holiday, and moves a clashing holiday to the next day.
// Public holidays come from the General Holidays Ordinance (Cap. 149) lists
// the Government gazettes each year. 1823 publishes them as a live iCal feed,
// but that server sends NO Access-Control-Allow-Origin header, so a browser
// can never read it — not from a file, not from localhost, not from a real
// domain. So the gazetted dates live in a small file beside this page, and
// the feed stays only as a long-shot fallback in case that file is missing.
//
// Sundays and public holidays count as the same class of day: the Ordinance
// treats Sunday as a general holiday and moves a clashing holiday to the next
// free day. dayType() already treats every Sunday as a holiday from the date
// itself, so only the gazetted weekday holidays are in the file.
const HOLIDAY_FILE   = 'hk-holidays.json';
const HOLIDAY_URL_EN = 'https://www.1823.gov.hk/common/ical/en.json';
const HOLIDAY_URL_ZH = 'https://www.1823.gov.hk/common/ical/tc.json';

let holidays = null;      // Map 'YYYYMMDD' -> holiday name

async function loadHolidays() {
  if (holidays) return;
  holidays = new Map();

  // Local gazetted file first.
  try {
    const response = await fetch(HOLIDAY_FILE, { signal: AbortSignal.timeout(15000) });
    if (response.ok) {
      const data = await response.json();
      for (const [day, names] of Object.entries(data.days || {}))
        holidays.set(day, (lang === 'zh' ? names[1] : names[0]) || '');

      // Gazetted lists only run a year or two ahead. Say so plainly rather
      // than quietly treating a future holiday as an ordinary weekday.
      const year = String(new Date().getFullYear());
      const covered = (data.covers || []).includes(year);
      console.log('Public holidays loaded:', holidays.size,
                  covered ? '' : '· WARNING: ' + year + ' is not in this file, refresh it');
      if (holidays.size > 0) return;
    }
  } catch (error) {
    console.warn('Local holiday file unavailable:', error);
  }

  // Fallback: the 1823 feed. Expected to fail on CORS in a browser; harmless.
  const url = lang === 'zh' ? HOLIDAY_URL_ZH : HOLIDAY_URL_EN;
  const cacheKey = 'hk-holidays-' + (lang === 'zh' ? 'zh' : 'en');

  try {
    let events = await cacheGet(cacheKey);

    if (!events) {
      const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
      if (!response.ok) throw new Error('server said ' + response.status);
      const data = await response.json();

      // The file is iCalendar expressed as JSON. Rather than assume the exact
      // nesting, walk it and collect anything that looks like a dated event.
      events = [];
      const walk = node => {
        if (!node || typeof node !== 'object') return;
        if (node.dtstart) {
          const raw = Array.isArray(node.dtstart) ? node.dtstart[0] : node.dtstart;
          const day = String(raw).replace(/[^0-9]/g, '').slice(0, 8);
          if (day.length === 8) events.push({ day, name: node.summary || '' });
        }
        for (const value of Object.values(node)) {
          if (Array.isArray(value)) value.forEach(walk);
          else if (typeof value === 'object') walk(value);
        }
      };
      walk(data);
      cachePut(cacheKey, events);
    }

    for (const event of events) holidays.set(event.day, event.name);
    console.log('Public holidays loaded from 1823:', holidays.size);
  } catch (error) {
    console.warn('Holiday list unavailable:', error);
  }
}

function todayKey(date) {
  const d = date || new Date();
  return String(d.getFullYear()) +
         String(d.getMonth() + 1).padStart(2, '0') +
         String(d.getDate()).padStart(2, '0');
}

// 'holiday' (Sunday or public holiday), 'saturday', or 'weekday'.
function dayType(date) {
  const d = date || new Date();
  if (holidays && holidays.has(todayKey(d))) return 'holiday';
  const weekday = d.getDay();          // 0 = Sunday, 6 = Saturday
  if (weekday === 0) return 'holiday';
  if (weekday === 6) return 'saturday';
  return 'weekday';
}

function holidayName() {
  return (holidays && holidays.get(todayKey())) || '';
}


// IS THIS BUS ACTUALLY RUNNING RIGHT NOW?
// Suggesting a night bus at two in the afternoon sends someone to a stop to
// wait for nothing. That is worse than showing one option fewer.
//
// Two sources, in order of trust:
//   1. The timetable in the route file, when we can read it.
//   2. Hong Kong's route-numbering convention: a leading "N" means a night
//      service. This is a real convention, not a guess, and it catches the
//      case that actually bit us.
//
// Anything we cannot judge confidently is KEPT. Hiding a bus that is running
// is a worse failure than showing one that is not.
const NIGHT_START_HOUR = 0;      // night services broadly run midnight–06:00
const NIGHT_END_HOUR   = 6;

function minutesNow() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

// "0530" or "05:30" -> minutes since midnight. Returns null if unreadable.
function parseClock(text) {
  const digits = String(text).replace(/[^0-9]/g, '');
  if (digits.length < 3) return null;
  const padded = digits.padStart(4, '0');
  const hours = Number(padded.slice(0, 2)), mins = Number(padded.slice(2, 4));
  if (!isFinite(hours) || !isFinite(mins) || hours > 23 || mins > 59) return null;
  return hours * 60 + mins;
}

// Some timetables are split by kind of day. If we can find a branch matching
// today, use only that; otherwise fall back to reading the whole thing.
const DAY_KEYS = {
  weekday:  ['weekday','wd','mon-fri','monfri','1'],
  saturday: ['saturday','sat','6'],
  holiday:  ['holiday','sun','sunday','ph','publicholiday','0']
};

function branchForToday(freq) {
  if (!freq || typeof freq !== 'object') return null;
  const wanted = DAY_KEYS[dayType()] || [];

  for (const [key, value] of Object.entries(freq)) {
    const plain = key.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (wanted.includes(plain) && value && typeof value === 'object') return value;
  }
  return null;
}

// Pull every [start, end] window we can find, whatever shape the data is in.
function serviceWindows(freq) {
  if (!freq || typeof freq !== 'object') return [];
  freq = branchForToday(freq) || freq;
  const windows = [];

  const walk = node => {
    if (!node || typeof node !== 'object') return;
    for (const [key, value] of Object.entries(node)) {
      const start = parseClock(key);
      // A timetable entry looks like "0530": ["2350", 600]
      if (start !== null && Array.isArray(value) && value.length >= 1) {
        const finish = parseClock(value[0]);
        if (finish !== null) windows.push([start, finish]);
      } else {
        walk(value);
      }
    }
  };
  walk(freq);
  return windows;
}

function isRunningNow(routeKey) {
  const nowMins = minutesNow();
  const info = serviceInfo.get(routeKey);
  const windows = info ? serviceWindows(info.freq) : [];

  if (windows.length > 0) {
    return windows.some(([start, finish]) => finish >= start
      ? nowMins >= start && nowMins <= finish      // ordinary daytime window
      : nowMins >= start || nowMins <= finish);    // window crossing midnight
  }

  // No readable timetable — fall back to the naming convention.
  const routeNo = routeKey.split('|')[0].toUpperCase();
  if (/^N/.test(routeNo)) {
    const hour = new Date().getHours();
    return hour >= NIGHT_START_HOUR && hour < NIGHT_END_HOUR;
  }

  return true;     // cannot judge — keep it
}

// Hong Kong buses charge SECTION fares: what you pay depends on where you
// board, so we look up the boarding stop's position along the route.
function fareForLeg(routeNo, bound, serviceType, boardStopId, co) {
  const number = String(routeNo).toUpperCase();
  const type   = String(serviceType || '1');
  const company = String(co || 'kmb').toLowerCase();
  const key = number + '|' + bound + '|' + type + '|' + company;

  // Trains are priced per station pair, not per boarding stop, and MTR
  // publishes every pair exactly. No estimating needed here.
  if (company === 'mtr') return null;   // handled by journeyFare, which sees both ends

  // FIRST the small local fare file. The route index already knows this
  // stop's position along the route, which is all stopFare() needs — and
  // that file is here even when the big network one is still downloading.
  if (routeIndex) {
    const line = routeIndex.get(key) || [];
    const here = line.find(item => item.stopId === boardStopId);
    if (here) {
      const quick = stopFare(routeNo, bound, serviceType, here.seq, co);
      if (quick !== null) return quick;
    }
  }

  // THEN the full crawler file, which is what covers Citybus.
  if (!fareIndex) return null;

  const entry = fareIndex.get(key);
  if (!entry || entry.fares.length === 0) return null;

  const index = entry.stops.indexOf(boardStopId);
  const raw = (index >= 0 && index < entry.fares.length) ? entry.fares[index] : entry.fares[0];

  const fare = Number(raw);
  return isFinite(fare) && fare > 0 ? fare : null;
}

// ---- KMB FARES AND TIMETABLES, HELD LOCALLY -------------------------
// A 549 KB KMB-only extract of the same government data, sitting beside this
// page. It loads in an instant, so a stop tapped the moment the app opens
// already has a fare, and a route that finished for the night is already
// known to have finished. The larger file below covers the other operators.
const KMB_FARE_URL = 'kmb-fares.json';
let kmbFares = null;      // "ROUTE|BOUND|TYPE" -> [fare boarding at seq 1, seq 2, ...]

async function loadKmbFares() {
  try {
    const response = await fetch(KMB_FARE_URL, { signal: AbortSignal.timeout(15000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    const data = await response.json();
    kmbFares = data.fares || null;

    // The same file carries KMB's published service windows. Feeding them in
    // here is what stops the planner offering a route that finished hours
    // ago — previously that only worked once the big file had downloaded.
    for (const [key, freq] of Object.entries(data.freq || {}))
      if (!serviceInfo.has(key + '|kmb')) serviceInfo.set(key + '|kmb', { freq });
  } catch (error) {
    console.warn('Local KMB fare/timetable file unavailable:', error);
  }
}
loadKmbFares();

// Hong Kong buses charge SECTION fares: the price depends on where you get
// on, so the stop's position along the route (its seq) is what we look up.
function stopFare(routeNo, bound, serviceType, seq, co) {
  const position = Number(seq);
  if (!isFinite(position) || position < 1 || !bound) return null;

  const type = String(serviceType || '1');
  // Long Win runs on KMB's fare tables and is filed under 'kmb'.
  let company = String(co || 'kmb').toLowerCase();
  if (company === 'lwb') company = 'kmb';

  if (kmbFares && company === 'kmb') {
    const list = kmbFares[String(routeNo).toUpperCase() + '|' + bound + '|' + type];
    if (list) {
      const fare = Number(list[position - 1]);
      if (isFinite(fare) && fare > 0) return fare;
    }
  }

  if (fareIndex) {
    const entry = fareIndex.get(String(routeNo).toUpperCase() + '|' + bound +
                                '|' + type + '|' + company);
    if (entry && entry.fares.length) {
      const fare = Number(entry.fares[position - 1]);
      if (isFinite(fare) && fare > 0) return fare;
    }
  }
  return null;
}

// Total fare as a NUMBER, or null if any leg's fare is unknown.
//
// A train journey is ONE fare from entry gate to exit gate, however many
// times you change line inside the paid area. Adding up per-leg prices the
// way we do for buses would overcharge every interchange, so rail is priced
// once, end to end.
function journeyFare(journey) {
  if (journey.legs.length > 0 && journey.legs.every(leg => leg.co === 'mtr'))
    return railFare(journey.legs[0].on.stop, journey.legs[journey.legs.length - 1].off.stop);

  const fares = journey.legs.map(leg =>
    fareForLeg(leg.route, leg.bound, leg.serviceType, leg.on.stop, leg.co));
  if (fares.some(f => f === null)) return null;
  return fares.reduce((a, b) => a + b, 0);
}

// Total for a journey — each bus is a separate fare, the whole train ride one.
function journeyFareText(journey) {
  const total = journeyFare(journey);
  return total === null ? '\u2014' : '$' + total.toFixed(1);
}

// The official shape, trimmed to the part between two stops.
let tdRoutes = null;    // route number -> { shapes: [[[lat,lng]...]] }

// Loads the Transport Department's bus route geometry so journey lines
// follow real roads instead of cutting straight across the map.
async function loadTdBusFile() {
  if (tdRoutes) return;
  tdRoutes = new Map();

  try {
    let features = await cacheGet('td-bus-shapes');

    if (!features) {
      const response = await fetch(TD_BUS_URL, { signal: AbortSignal.timeout(60000) });
      if (!response.ok) throw new Error('server said ' + response.status);
      features = (await response.json()).features || [];
      cachePut('td-bus-shapes', features);
    }

    const ROUTE_FIELDS = ['ROUTE_NAMEE','ROUTE_NAME_E','ROUTE_ID','ROUTE','routeNameE','ROUTE_NO'];

    for (const feature of features) {
      const properties = feature.properties || {};

      let routeName;
      for (const name of ROUTE_FIELDS)
        if (properties[name] !== undefined) { routeName = properties[name]; break; }
      if (routeName === undefined) continue;

      // GeoJSON stores coordinates as [longitude, latitude] — the OPPOSITE
      // order to Leaflet. Getting this backwards puts Hong Kong in Mongolia.
      // Keep each line piece separate: joining unconnected pieces invents a
      // straight line between them.
      const pieces = [];
      const geometry = feature.geometry;
      if (geometry && geometry.type === 'LineString')
        pieces.push(geometry.coordinates.map(c => [c[1], c[0]]));
      else if (geometry && geometry.type === 'MultiLineString')
        for (const line of geometry.coordinates) pieces.push(line.map(c => [c[1], c[0]]));

      const key = String(routeName).toUpperCase();
      if (!tdRoutes.has(key)) tdRoutes.set(key, { shapes: [] });
      for (const piece of pieces) if (piece.length > 1) tdRoutes.get(key).shapes.push(piece);
    }

    console.log('TD routes indexed:', tdRoutes.size);
  } catch (error) {
    console.warn('TD bus file unavailable, lines will be approximate:', error);
  }
}

function officialShape(routeNo, fromStop, toStop) {
  const entry = tdRoutes && tdRoutes.get(String(routeNo).toUpperCase());
  if (!entry || entry.shapes.length === 0) return null;

  const nearestIndex = (shape, stop) => {
    let best = 0, bestM = Infinity;
    shape.forEach((point, index) => {
      const m = metresBetween(point[0], point[1], Number(stop.lat), Number(stop.long));
      if (m < bestM) { bestM = m; best = index; }
    });
    return { index: best, metres: bestM };
  };

  // Try every stored shape for this route and keep the one that passes
  // closest to both our stops. That is the direction the rider is going.
  let bestSlice = null, bestCost = Infinity;

  for (const shape of entry.shapes) {
    const a = nearestIndex(shape, fromStop);
    const b = nearestIndex(shape, toStop);

    // The shape must genuinely pass near both stops, and in the right order.
    // Stops sit at the kerb, shapes follow the road centre, and termini can
    // be set back from the road — so allow a little slack.
    if (a.metres > 600 || b.metres > 600) continue;
    if (a.index >= b.index) continue;

    const cost = a.metres + b.metres;
    if (cost < bestCost) {
      bestCost = cost;
      bestSlice = shape.slice(a.index, b.index + 1);
    }
  }

  return (bestSlice && bestSlice.length > 1) ? bestSlice : null;
}


// How many legs got a real road shape? Useful for spotting when the
// official file is not matching and everything is drawing straight.
let shapeHits = 0, shapeMisses = 0;

const ROUTE_SHAPES_URL = '';     // (superseded by TD_BUS_URL above)

const WALK_LIMIT_M = 800;        // how far we ask someone to walk to a stop
const TRANSFER_WALK_M = 200;     // how far we allow walking between two buses

let stopIndex  = null;   // stopId  -> [{routeKey, seq}]
let routeIndex = null;   // routeKey -> [{stopId, seq}]

// ============================================================
// THE RAILWAY
// ============================================================
// Buses and trains are different animals, so the rail side is kept whole and
// separate rather than bent to fit the bus code. It shares only the two things
// that matter to a rider: the journey shape the cards render, and the fare.
//
// DATA: stations and line order come from MTR's own open data; fares are
// MTR's published adult Octopus table, every station pair, exact.
//
// TIMES are estimates, like the bus times already are. There is no public
// station-to-station timetable, so each hop is worked out from the real
// distance between the two stations at the line's average speed. Checked
// against MTR's own published figure for the Airport Express: they say about
// 24 minutes airport to city, this model says 25.

// Average speed in km/h INCLUDING station stops. The Airport Express is an
// express with four stops in 35 km; the urban lines stop every kilometre.
const RAIL_SPEED = { AEL:70, TCL:55, EAL:45, TML:42, TKL:40, DRL:35, TWL:33, KTL:32, SIL:32, ISL:30 };
const RAIL_CHANGE_MIN = 4;      // walking between platforms and waiting again
const RAIL_FIRST_HOUR = 6;      // first trains are around 05:50-06:00 network-wide
const RAIL_LAST_HOUR  = 1;      // last trains are around 00:30-01:00

async function loadMtr() {
  if (mtrData) return;
  try {
    const response = await fetch(MTR_URL, { signal: AbortSignal.timeout(15000) });
    if (!response.ok) throw new Error('server said ' + response.status);
    mtrData = await response.json();
    buildRailGraph();

    // Stations join the searchable places. Without this you cannot type
    // "Kowloon Tong" or "九龍塘" and get the station, which makes an MTR
    // station impossible to save as a favourite — the map only draws buses.
    addStationsToSearch();

    console.log('MTR loaded:', Object.keys(mtrData.stations).length, 'stations ·',
                Object.keys(mtrData.fares).length, 'fare pairs');
  } catch (error) {
    console.warn('MTR data unavailable, trains will be left out:', error);
    mtrData = null;
  }
}

// Stations are shaped like stops so the existing search, ranking and merging
// treat them as just another place. The MTR: prefix keeps their ids from ever
// colliding with a bus stop id.
function addStationsToSearch() {
  if (!mtrData || allStops.some(s => s.isStation)) return;
  const label = lang === 'zh' ? ' 站' : ' Station';
  for (const [code, s] of Object.entries(mtrData.stations)) {
    allStops.push({
      stop: 'MTR:' + code, isStation: true,
      name_en: s[0] + ' Station', name_tc: (s[1] || s[0]) + '站',
      lat: s[2], long: s[3]
    });
  }
}

function buildRailGraph() {
  railGraph = new Map();
  const join = (a, b, line) => {
    const A = mtrData.stations[a], B = mtrData.stations[b];
    if (!A || !B) return;
    const km = metresBetween(A[2], A[3], B[2], B[3]) / 1000;
    const minutes = (km / (RAIL_SPEED[line] || 33)) * 60;
    if (!railGraph.has(a)) railGraph.set(a, []);
    railGraph.get(a).push({ to: b, line, minutes });
  };
  // Every branch matters: Lok Ma Chau and LOHAS Park live only on one variant,
  // and taking just the longest one strands them.
  for (const [line, variants] of Object.entries(mtrData.lines))
    for (const stops of variants)
      for (let i = 0; i < stops.length - 1; i++) {
        join(stops[i], stops[i + 1], line);
        join(stops[i + 1], stops[i], line);
      }
}

// Cheapest path by time, counting a change of line as four extra minutes.
// The state is (station, line you arrived on), so staying put costs nothing
// and changing costs the penalty exactly once.
function railRoute(from, to) {
  if (!railGraph || from === to) return null;

  const best = new Map([[from + '|', { cost: 0, path: [{ station: from, line: null }] }]]);
  const settled = new Set();

  for (;;) {
    let key = null, here = null;
    for (const [k, v] of best)
      if (!settled.has(k) && (!here || v.cost < here.cost)) { key = k; here = v; }
    if (!key) return null;
    settled.add(key);

    const [station, line] = key.split('|');
    if (station === to) return here;

    for (const edge of (railGraph.get(station) || [])) {
      const cost = here.cost + edge.minutes + (line && line !== edge.line ? RAIL_CHANGE_MIN : 0);
      const next = edge.to + '|' + edge.line;
      if (!best.has(next) || cost < best.get(next).cost)
        best.set(next, { cost, path: here.path.concat([{ station: edge.to, line: edge.line }]) });
    }
  }
}

// A station in the same shape as a bus stop, so the cards and the map can
// draw it without knowing it is a station at all.
function railStop(code) {
  const s = mtrData && mtrData.stations[code];
  if (!s) return null;
  return { stop: code, name_en: s[0], name_tc: s[1], lat: s[2], long: s[3] };
}

function railStationsNear(lat, lng, limit) {
  if (!mtrData) return [];
  const near = [];
  for (const code of Object.keys(mtrData.stations)) {
    const s = mtrData.stations[code];
    const m = metresBetween(lat, lng, s[2], s[3]);
    if (m <= (limit || WALK_LIMIT_M)) near.push({ code, metres: m });
  }
  return near.sort((a, b) => a.metres - b.metres).slice(0, 4);
}

function railFare(a, b) {
  if (!mtrData) return null;
  const fare = mtrData.fares[a < b ? a + '>' + b : b + '>' + a];
  return typeof fare === 'number' && fare > 0 ? fare : null;
}

function railLineName(code) {
  const pair = mtrData && mtrData.lineNames && mtrData.lineNames[code];
  if (!pair) return code;
  return lang === 'zh' ? pair[1] : pair[0];
}

function railRunningNow() {
  const hour = new Date().getHours();
  return hour >= RAIL_FIRST_HOUR || hour < RAIL_LAST_HOUR;
}

// Up to three genuinely different train journeys, best first. Two stations
// can both be in walking range of the same address — Central and Hong Kong
// are one example — and they lead to different lines, so it is worth
// offering the alternative rather than silently picking one.
function railJourneys(startLat, startLng, endLat, endLng) {
  if (!mtrData || !railGraph) return [];

  const fromList = railStationsNear(startLat, startLng);
  const toList   = railStationsNear(endLat, endLng);
  if (fromList.length === 0 || toList.length === 0) return [];

  const found = [];
  for (const a of fromList) {
    for (const b of toList) {
      if (a.code === b.code) continue;
      const path = railRoute(a.code, b.code);
      if (!path) continue;

      const walkOn = walkingEstimate(a.metres), walkOff = walkingEstimate(b.metres);
      const journey = buildRailJourney(path, walkOn, walkOff);
      if (journey) found.push(journey);
    }
  }

  found.sort((x, y) => x.total - y.total);

  // Drop journeys that use the same stations and lines as one already kept.
  const seen = new Set(), out = [];
  for (const journey of found) {
    const id = journey.legs[0].on.stop + '>' +
               journey.legs.map(l => l.lineCode).join('>') + '>' +
               journey.legs[journey.legs.length - 1].off.stop;
    if (seen.has(id)) continue;
    seen.add(id);
    out.push(journey);
    if (out.length === 3) break;
  }
  return out;
}

// Turn a rail path into the same journey object the bus planner produces, so
// every card, fare line, map draw and sort works on it unchanged.
function buildRailJourney(found, walkOn, walkOff) {
  const path = found.path;
  const legs = [];
  let startAt = 0;

  // Split wherever the line changes — one leg per train.
  for (let i = 1; i <= path.length; i++) {
    const ending = i === path.length || (i > 1 && path[i].line !== path[i - 1].line);
    if (!ending) continue;
    const line = path[startAt + 1] ? path[startAt + 1].line : path[1].line;
    legs.push({
      route: railLineName(line), lineCode: line,
      on: railStop(path[startAt].station), off: railStop(path[i - 1].station),
      stops: (i - 1) - startAt,
      path: path.slice(startAt, i).map(p => railStop(p.station)).filter(Boolean),
      bound: 'O', serviceType: '1', co: 'mtr'
    });
    startAt = i - 1;
  }
  if (legs.length === 0 || legs.some(leg => !leg.on || !leg.off)) return null;

  return {
    legs, walkOn, walkOff, transferWalk: null, fares: 1, rail: true,
    total: Math.round(walkOn.minutes + found.cost + walkOff.minutes)
  };
}

function stopsNear(lat, lng, limit) {
  const near = [];
  for (const stop of allPlannableStops()) {
    const m = metresBetween(lat, lng, Number(stop.lat), Number(stop.long));
    if (m <= (limit || WALK_LIMIT_M)) near.push({ stop, metres: m });
  }
  return near.sort((a, b) => a.metres - b.metres).slice(0, 25);
}

// The whole network in one file. It is big, so: long timeout, one retry,
// and a clear message while it works. It only has to happen once per session.
async function buildIndexes() {
  if (stopIndex) return;

  let rows = await cacheGet('kmb-route-stop');

  for (let attempt = 1; attempt <= 2 && !rows; attempt++) {
    try {
      status.textContent = T('loadingNetwork') + ' (' + attempt + '/2)';
      const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop',
                                   { signal: AbortSignal.timeout(90000) });
      if (!response.ok) throw new Error('server said ' + response.status);
      rows = (await response.json()).data;
      cachePut('kmb-route-stop', rows);
    } catch (error) {
      console.warn('Network file attempt ' + attempt + ' failed:', error);
      if (attempt === 2) throw new Error('the bus network file would not download (' + error.message + ')');
    }
  }

  stopIndex = new Map();
  routeIndex = new Map();

  for (const row of rows) {
    // The company goes on the END of the key, so the existing splits for
    // route / bound / serviceType keep working unchanged.
    const routeKey = row.route + '|' + row.bound + '|' + row.service_type + '|kmb';
    const seq = Number(row.seq);

    if (!stopIndex.has(row.stop)) stopIndex.set(row.stop, []);
    stopIndex.get(row.stop).push({ routeKey, seq });

    if (!routeIndex.has(routeKey)) routeIndex.set(routeKey, []);
    routeIndex.get(routeKey).push({ stopId: row.stop, seq });
  }

  addOperatorsToIndexes();
}

// Citybus journeys, built from the same HK Bus Crawling file we already use
// for fares. Its "stops" array IS the order the bus calls at them, so the
// position in the array is the sequence number.
// WHICH OPERATORS WE PLAN JOURNEYS WITH
// The HK Bus Crawling file holds every operator in one place. Each one is
// just another key in the same structure, so supporting a new company is
// adding it to this list — not writing new code.
//
// Deliberately NOT included: 'mtr' and 'lightRail'. Those are trains, and our
// timing model assumes road speeds and road-following shapes. Including them
// would produce confident, wrong numbers.
const PLANNED_OPERATORS = ['ctb', 'nlb', 'gmb'];

function addOperatorsToIndexes() {
  if (!hkbusRoutes) return;
  const counts = {};

  for (const co of PLANNED_OPERATORS) {
    let added = 0;

    for (const entry of Object.values(hkbusRoutes)) {
      if (!entry || !entry.route) continue;

      const stops = (entry.stops || {})[co];
      if (!stops || stops.length < 2) continue;

      const bound = (entry.bound || {})[co] || 'O';
      const routeKey = String(entry.route) + '|' + bound + '|' +
                       (entry.serviceType || '1') + '|' + co;

      if (routeIndex.has(routeKey)) continue;        // already added

      stops.forEach((stopId, index) => {
        const seq = index + 1;

        if (!stopIndex.has(stopId)) stopIndex.set(stopId, []);
        stopIndex.get(stopId).push({ routeKey, seq });

        if (!routeIndex.has(routeKey)) routeIndex.set(routeKey, []);
        routeIndex.get(routeKey).push({ stopId, seq });
      });
      added++;
    }
    counts[co] = added;
  }

  console.log('Routes added to journey search:', counts);
}

// ASSUMPTION: about 2 minutes riding per stop, plus 5 minutes to change buses.
// Real times swing wildly with traffic. These are for COMPARING options,
// not promises of arrival.
const MINUTES_PER_STOP = 2;
const TRANSFER_PENALTY_MIN = 5;

// A bus leg shorter than this is not worth boarding: by the time you wait,
// board, pay and get off, you could have walked. Riding one stop and then
// walking three minutes to change buses is a technically valid journey and
// a useless one, so we throw those away.
const MIN_USEFUL_LEG_M = 700;

// HOW WE JUDGE A JOURNEY FOR AN OLDER RIDER
// Time is not the only cost. Walking, standing waiting, climbing footbridges
// and changing buses all cost more effort at 80 than at 30. So each journey
// gets an "effort score" as well as a time, and these weights say what we
// think that effort is worth. They are deliberately visible and adjustable
// rather than buried in the sorting code.
const EFFORT = {
  perWalkMinute:     3,    // walking is three times as costly as sitting
  perTransfer:      12,    // changing bus: stairs, crossings, uncertainty
  perTransferWalk:   4,    // walking BETWEEN buses is the worst walking
  perRideMinute:     1     // sitting on the bus is the cheapest minute
};

function effortScore(journey) {
  const walkMinutes = journey.walkOn.minutes + journey.walkOff.minutes;
  const transferWalkMinutes = journey.transferWalk ? journey.transferWalk.minutes : 0;
  const transfers = journey.legs.length - 1;

  return walkMinutes * EFFORT.perWalkMinute
       + transferWalkMinutes * EFFORT.perTransferWalk
       + transfers * EFFORT.perTransfer
       + journey.total * EFFORT.perRideMinute;
}

// Total time on foot — the number an older rider most wants to know.
function totalWalkMinutes(journey) {
  return journey.walkOn.minutes + journey.walkOff.minutes +
         (journey.transferWalk ? journey.transferWalk.minutes : 0);
}
// Two speeds, because one number cannot describe both. A local bus stopping
// every 300 m is slow; an express on the highway is not. We pick by distance.
const BUS_KMH_LOCAL   = 17;
const BUS_KMH_EXPRESS = 32;

// Time from the distance measured ALONG the chain of stops — road distance,
// near enough — rather than the straight line, which cut across the harbour.
function rideMinutesForPath(path) {
  const km = pathMetres(path) / 1000;
  const speed = km > 8 ? BUS_KMH_EXPRESS : BUS_KMH_LOCAL;
  return Math.max(1, Math.round(km / speed * 60));
}

function routeNumberOf(routeKey) { return routeKey.split('|')[0]; }

// Every stop the bus calls at between boarding and alighting, in order.
// Bus stops sit on roads, so joining them follows the real corridor closely —
// far better than one straight line across the map.
const stopById = new Map();
function refreshStopById() {
  stopById.clear();
  for (const stop of allStops) stopById.set(stop.stop, stop);
  for (const stop of ctbStops) stopById.set(stop.stop, stop);   // Citybus too
}

// Every stop we can plan a journey with, both companies together.
function allPlannableStops() {
  return ctbStops.length ? allStops.concat(ctbStops) : allStops;
}

function pathBetween(routeKey, fromSeq, toSeq) {
  const entries = (routeIndex.get(routeKey) || [])
    .filter(entry => entry.seq >= fromSeq && entry.seq <= toSeq)
    .sort((a, b) => a.seq - b.seq);

  const path = [];
  for (const entry of entries) {
    const stop = stopById.get(entry.stopId);
    if (stop) path.push(stop);
  }
  return path;
}

// Distance ALONG that chain of stops — the road distance, near enough.
function pathMetres(path) {
  let total = 0;
  for (let i = 1; i < path.length; i++)
    total += metresBetween(Number(path[i-1].lat), Number(path[i-1].long),
                           Number(path[i].lat),   Number(path[i].long));
  return total;
}

// Off by default: normally you want buses you can actually catch. But if the
// timetable data is wrong, the user needs a way to see everything.
let showNotRunning = false;

let searchRunning = false;

async function findBuses() {
  if (!startPoint || !endPoint) return;
  if (searchRunning) return;                 // ignore double taps
  searchRunning = true;

  const box = document.getElementById('journeys');
  box.innerHTML = '<div class="jcard">' + T('working') + '</div>';
  journeyMode = false;
  drawStops();

  try {
    // The HK Bus Crawling file carries Citybus stops and route orders, so it
    // must arrive BEFORE we build the journey index. Road shapes are only
    // decoration, so those still load in the background.
    await Promise.all([loadFareData(), loadHolidays(), loadMtr()]);
    await buildIndexes();
    refreshStopById();

    const extras = loadTdBusFile();

    // Those downloads take time. The user may have pressed "Clear everything"
    // while we waited. Re-check rather than trusting what was true before.
    if (!startPoint || !endPoint) {
      box.innerHTML = '';
      status.textContent = T('searchCancelled');
      return;
    }
    status.textContent = T('lookingFor');

    const fromStops = stopsNear(startPoint.lat, startPoint.lng);
    const toStops   = stopsNear(endPoint.lat, endPoint.lng);

    if (fromStops.length === 0 || toStops.length === 0) {
      box.innerHTML = '<div class="jcard">' +
        T('noNearbyStops').replace('{m}', WALK_LIMIT_M) + '</div>';
      status.textContent = T('noNearby');
      return;
    }

    // Where can we board, and where can we get off?
    const boardable = new Map();
    for (const near of fromStops)
      for (const service of (stopIndex.get(near.stop.stop) || [])) {
        const existing = boardable.get(service.routeKey);
        if (!existing || near.metres < existing.metres)
          boardable.set(service.routeKey, { stop: near.stop, metres: near.metres, seq: service.seq });
      }

    const alightable = new Map();
    for (const near of toStops)
      for (const service of (stopIndex.get(near.stop.stop) || [])) {
        const existing = alightable.get(service.routeKey);
        if (!existing || near.metres < existing.metres)
          alightable.set(service.routeKey, { stop: near.stop, metres: near.metres, seq: service.seq });
      }

    const journeys = [];
    let hiddenNotRunning = 0;

    // ---- DIRECT: one bus all the way ----
    for (const [routeKey, board] of boardable) {
      const alight = alightable.get(routeKey);
      if (!alight || alight.seq <= board.seq) continue;   // wrong direction

      if (!showNotRunning && !isRunningNow(routeKey)) { hiddenNotRunning++; continue; }

      const walkOn = walkingEstimate(board.metres), walkOff = walkingEstimate(alight.metres);
      const path = pathBetween(routeKey, board.seq, alight.seq);

      journeys.push({
        legs: [{ route: routeNumberOf(routeKey), on: board.stop, off: alight.stop,
                 stops: alight.seq - board.seq, path,
                 bound: routeKey.split('|')[1], serviceType: routeKey.split('|')[2],
                 co: routeKey.split('|')[3] || 'kmb' }],
        walkOn, walkOff, transferWalk: null, fares: 1,
        total: walkOn.minutes + rideMinutesForPath(path) + walkOff.minutes
      });
    }

    // ---- ONE CHANGE: bus, then another bus ----
    for (const [keyA, board] of boardable) {
      if (!showNotRunning && !isRunningNow(keyA)) continue;

      const ahead = new Map();
      for (const entry of (routeIndex.get(keyA) || [])) {
        if (entry.seq <= board.seq) continue;
        const existing = ahead.get(entry.stopId);
        if (existing === undefined || entry.seq < existing) ahead.set(entry.stopId, entry.seq);
      }
      if (ahead.size === 0) continue;

      for (const [keyB, alight] of alightable) {
        if (routeNumberOf(keyA) === routeNumberOf(keyB)) continue;
        if (!showNotRunning && !isRunningNow(keyB)) continue;

        let best = null;
        for (const entry of (routeIndex.get(keyB) || [])) {
          if (entry.seq >= alight.seq) continue;

          let changeOff = null, changeOn = null, walkM = 0;
          if (ahead.has(entry.stopId)) {
            changeOff = changeOn = stopById.get(entry.stopId);
          } else {
            const target = stopById.get(entry.stopId);
            if (!target) continue;
            for (const aheadStopId of ahead.keys()) {
              const candidate = stopById.get(aheadStopId);
              if (!candidate) continue;
              const m = metresBetween(Number(candidate.lat), Number(candidate.long),
                                      Number(target.lat), Number(target.long));
              if (m <= TRANSFER_WALK_M) { changeOff = candidate; changeOn = target; walkM = m; break; }
            }
          }
          if (!changeOff) continue;

          const changeSeqA = ahead.get(changeOff.stop);
          const pathA = pathBetween(keyA, board.seq, changeSeqA);
          const pathB = pathBetween(keyB, entry.seq, alight.seq);
          const minutes = rideMinutesForPath(pathA) + rideMinutesForPath(pathB) + TRANSFER_PENALTY_MIN;

          if (!best || minutes < best.minutes)
            best = { minutes, changeOff, changeOn, walkM, pathA, pathB,
                     legAStops: changeSeqA - board.seq, legBStops: alight.seq - entry.seq };
        }
        if (!best) continue;

        // Both legs must be long enough to be worth the trouble.
        if (pathMetres(best.pathA) < MIN_USEFUL_LEG_M ||
            pathMetres(best.pathB) < MIN_USEFUL_LEG_M) continue;

        const walkOn = walkingEstimate(board.metres), walkOff = walkingEstimate(alight.metres);
        const transferWalk = best.walkM > 0 ? walkingEstimate(best.walkM) : null;

        journeys.push({
          legs: [
            { route: routeNumberOf(keyA), on: board.stop, off: best.changeOff,
              stops: best.legAStops, path: best.pathA,
              bound: keyA.split('|')[1], serviceType: keyA.split('|')[2],
              co: keyA.split('|')[3] || 'kmb' },
            { route: routeNumberOf(keyB), on: best.changeOn, off: alight.stop,
              stops: best.legBStops, path: best.pathB,
              bound: keyB.split('|')[1], serviceType: keyB.split('|')[2],
              co: keyB.split('|')[3] || 'kmb' }
          ],
          walkOn, walkOff, transferWalk, fares: 2,
          total: walkOn.minutes + best.minutes + walkOff.minutes +
                 (transferWalk ? transferWalk.minutes : 0)
        });
      }
    }

    // ---- BY TRAIN ----
    // Trains are worked out here but kept in their own list, never mixed into
    // the bus pool. Someone who wants the MTR wants the MTR; burying it as
    // card two of three, or hiding it because three buses scored better,
    // makes them hunt for it. The tabs let them just ask.
    railOptions = (!showNotRunning && !railRunningNow())
      ? []
      : railJourneys(startPoint.lat, startPoint.lng, endPoint.lat, endPoint.lng);

    if (journeys.length === 0 && railOptions.length === 0) {
      box.innerHTML = '<div class="jcard"><b>' + T('noJourney') + '</b><br>' +
        T('noJourneyBody') + '</div>';
      status.textContent = T('nothingFound');
      return;
    }

    // ---- PICK THE THREE ----
    // They told us where they are standing, so journeys leaving from THEIR
    // stop come first. Walking further is a choice, never the default.
    const chosenStopId = startPoint.stop ? startPoint.stop.stop : null;

    const fromYourStop = journeys
      .filter(journey => chosenStopId && journey.legs[0].on.stop === chosenStopId)
      .sort((a, b) => a.total - b.total);

    // When two journeys are within 5 minutes, prefer the one with fewer buses.
    // Saving four minutes is not worth an extra change for most people, and
    // certainly not for an older rider with luggage.
    const byTime = [...journeys].sort((a, b) => {
      if (Math.abs(a.total - b.total) <= 5) return a.legs.length - b.legs.length;
      return a.total - b.total;
    });
    // Gentlest = least total effort, not simply fewest changes.
    const byEffort = [...journeys].sort((a, b) => effortScore(a) - effortScore(b));
    const byWalking = [...journeys].sort((a, b) =>
      totalWalkMinutes(a) - totalWalkMinutes(b) || a.total - b.total);

    // Cheapest first, ignoring journeys whose fare we could not work out —
    // a "cheapest" card with an unknown price would be meaningless.
    const byFare = journeys
      .filter(journey => journeyFare(journey) !== null)
      .sort((a, b) => journeyFare(a) - journeyFare(b) || a.total - b.total);

    // WHY THIS IS NOT JUST "TAKE THE TOP OF EACH LIST"
    // If the same journey is both the gentlest AND the fastest, handing the
    // "FASTEST" label to the runner-up produces a card that says FASTEST
    // above a slower time than the card beside it. The label would be lying.
    // So a journey that wins several categories carries several titles, and
    // any remaining cards are honestly labelled as alternatives.
    const fingerprint = journey =>
      journey.legs[0].on.stop + '>' + journey.legs.map(l => l.route).join('>');

    // Journeys leaving from the stop the user actually chose, easiest first.
    const gentlestFromOwnStop = [...fromYourStop].sort((a, b) => effortScore(a) - effortScore(b));
    const boardName = startPoint.stop ? stopName(startPoint.stop) : '';

    const categories = [
      { list: gentlestFromOwnStop, title: T('easiestYourStop'),
        why: boardName ? T('boardAt') + ' ' + boardName + ' ' + T('leastEffort') : T('gentleWhy'),
        colour: '#166534' },
      { list: byEffort,  title: T('gentlest'),     why: T('gentleWhy'), colour: '#6b21a8' },
      { list: byTime,    title: T('fastest'),      why: T('fastWhy'),   colour: '#1e40af' },
      { list: byWalking, title: T('leastWalking'), why: T('walkWhy'),   colour: '#92400e' },
      { list: byFare,    title: T('cheapest'),     why: T('cheapWhy'),  colour: '#115e59' }
    ];

    // Which journey wins each category, and which titles it earns.
    const winners = new Map();     // fingerprint -> { journey, titles[], why, colour }

    for (const category of categories) {
      const best = category.list[0];
      if (!best) continue;

      const id = fingerprint(best);
      if (winners.has(id)) {
        winners.get(id).titles.push(category.title);      // same journey wins again
      } else {
        winners.set(id, { journey: best, titles: [category.title],
                          why: category.why, colour: category.colour });
      }
    }

    const picks = [...winners.values()].map(entry => ({
      journey: entry.journey,
      title: entry.titles.join(' · '),        // e.g. "GENTLEST · FASTEST"
      why: entry.why,
      colour: entry.colour
    }));

    // If that leaves fewer than three cards, offer genuinely different
    // alternatives — labelled as alternatives, not as a superlative.
    const shown = new Set([...winners.keys()]);
    for (const journey of byTime) {
      if (picks.length >= 3) break;
      const id = fingerprint(journey);
      if (shown.has(id)) continue;
      shown.add(id);
      picks.push({ journey, title: T('another'), why: T('anotherWhy'), colour: '#4b5563' });
    }

    // Always list them fastest first, so the times read in a sensible order.
    picks.sort((a, b) => a.journey.total - b.journey.total);

    // If the options differ in price, note how much each costs above the
    // cheapest — the number people actually compare.
    const prices = picks.map(pick => journeyFare(pick.journey)).filter(f => f !== null);
    if (prices.length > 1) {
      const lowest = Math.min(...prices);
      for (const pick of picks) {
        const fare = journeyFare(pick.journey);
        if (fare !== null && fare > lowest) pick.extraCost = fare - lowest;
      }
    }

    picks.forEach((pick, index) => { pick.number = index + 1; });

    busPicks = picks;
    railPicks = buildRailPicks(railOptions);

    setResultsMode(true);            // the form has done its job — hide it
    sheetToResults();
    // Open on whichever tab actually has something in it.
    if (busPicks.length) showMode('bus');
    else { activeMode = 'mtr'; paintBottomBar(); showRailResults(); }

    // Live arrival times for the FIRST bus of each option. Only three
    // requests — one per option — not one per stop on the map.
    picks.forEach(pick => loadNextBus(pick));

    // When the shapes and fares arrive, quietly refresh what is on screen.
    extras.then(() => {
      if (currentPicks !== picks) return;        // user has moved on
      buildCompareStrip(picks);
      const stillChosen = picks.find(p => p.number === chosenNumber) || picks[0];
      showCardFor(stillChosen);
      picks.forEach(pick => loadNextBus(pick));
      const chosen = picks.find(p => p.number === 1);
      if (chosen) drawOneOption(chosen);
    });

    if (fromYourStop.length === 0 && startPoint.stop) {
      box.insertAdjacentHTML('afterbegin',
        '<div style="background:#fef3c7;border:2px solid #f59e0b;border-radius:8px;' +
        'padding:12px;margin-bottom:10px;font-size:1rem;line-height:1.45">' +
        '<b>' + T('noBusFromStop').replace('{stop}', stopName(startPoint.stop)) + '</b> ' +
        T('goesToDest') + '</div>');
    }

    // Say plainly which timetable these results assume. On a holiday that is
    // the difference between catching a bus and standing at an empty stop.
    const kind = dayType();
    if (kind !== 'weekday') {
      const name = holidayName();
      box.insertAdjacentHTML('afterbegin',
        '<div style="background:#fef3c7;border:2px solid #f59e0b;border-radius:8px;' +
        'padding:11px 13px;margin-bottom:10px;font-size:1rem;font-weight:700;line-height:1.45">' +
        (kind === 'holiday'
          ? T('holidayToday').replace('{name}', name ? ' (' + name + ')' : '')
          : T('saturdayToday')) + '</div>');
    }

    if (hiddenNotRunning > 0) {
      box.insertAdjacentHTML('beforeend',
        '<div style="background:#eff6ff;border:2px solid #93c5fd;border-radius:8px;' +
        'padding:10px 12px;margin-top:10px;font-size:1rem;line-height:1.45">' +
        T('hiddenNotRunning').replace('{n}', hiddenNotRunning) + '</div>');
    }

    box.insertAdjacentHTML('beforeend',
      '<div style="font-size:0.94rem;color:#92400e;line-height:1.45;margin-top:6px">' +
      T('pleaseRead').replace('{t}', TRANSFER_PENALTY_MIN) +
      '<br><br>' + T('credits') + '</div>');

    // Offer to save these points now that the user has seen a real result.
    const addRow = document.createElement('div');
    for (const [which, point] of [['start', startPoint], ['end', endPoint]]) {
      const button = document.createElement('button');
      button.className = 'addfav';
      button.textContent = T(which === 'start' ? 'saveStart' : 'saveEnd')
                             .replace('{name}', point.label);
      button.addEventListener('click', () => addFavourite(which, point));
      addRow.appendChild(button);
    }
    box.appendChild(addRow);

    status.textContent = T('optionsFound').replace('{n}', picks.length);
  } catch (error) {
    box.innerHTML = '<div class="jcard">' + T('couldNotWork') + ' ' + error.message +
                    '<br><br>' + T('checkInternet') + '</div>';
    status.textContent = T('searchFailed');
    console.error(error);
  } finally {
    searchRunning = false;                 // never let the flag stick
  }
}

document.getElementById('notrunning-box').addEventListener('change', event => {
  showNotRunning = event.target.checked;
  if (startPoint && endPoint) findBuses();      // redo the search straight away
});

document.getElementById('findbuses').addEventListener('click', findBuses);


// PHONE: three sheet heights — peeking, normal, tall. Tapping the grip
// cycles them, so the map can always be brought back into view.
// Smallest to largest. The empty string is "no class", which in results mode
// means the full screen — that is where we want to land by default.
const SHEET_STATES = ['peek', 'tall', ''];
let sheetState = 2;

function applySheet() {
  const panel = document.getElementById('panel');
  panel.style.maxHeight = '';          // drop any height left by a drag
  panel.classList.remove('peek', 'tall');
  const state = SHEET_STATES[sheetState];
  if (state) panel.classList.add(state);
}

// DRAGGING THE SHEET
// People reach for a sheet and pull it, so dragging has to work. A short
// tap still cycles the three heights, because on a small screen a precise
// drag is hard for older hands.
(function setUpSheetDrag() {
  const grip  = document.getElementById('sheetgrip');
  const panel = document.getElementById('panel');

  let startY = 0, startHeight = 0, dragging = false, moved = 0;

  const heightNow = () => panel.getBoundingClientRect().height;

  grip.addEventListener('pointerdown', event => {
    if (!isPhone()) return;
    if (!panel.classList.contains('results')) return;   // no map behind it yet
    dragging = true;
    moved = 0;
    startY = event.clientY;
    startHeight = heightNow();

    // While dragging we set the height directly, so drop the class limits.
    panel.classList.remove('peek', 'tall');
    panel.style.transition = 'none';
    grip.setPointerCapture(event.pointerId);
  });

  grip.addEventListener('pointermove', event => {
    if (!dragging) return;

    // Dragging UP (a smaller clientY) should make the sheet TALLER.
    const delta = startY - event.clientY;
    moved = Math.max(moved, Math.abs(delta));

    const wanted = startHeight + delta;
    const smallest = 110;
    const largest  = window.innerHeight * 0.9;

    panel.style.maxHeight = Math.min(largest, Math.max(smallest, wanted)) + 'px';
  });

  function endDrag(event) {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = '';

    // A short press with almost no movement is a tap: cycle the heights.
    if (moved < 8) {
      panel.style.maxHeight = '';
      sheetState = (sheetState + 1) % SHEET_STATES.length;
      applySheet();
    }
    setTimeout(() => map.invalidateSize(), 220);
    if (event && event.pointerId !== undefined) {
      try { grip.releasePointerCapture(event.pointerId); } catch (e) {}
    }
  }

  grip.addEventListener('pointerup', endDrag);
  grip.addEventListener('pointercancel', endDrag);
})();

// After results arrive on a phone, open the sheet to the full screen so all
// three options are readable at once. The grip pulls it back down.
function sheetToResults() {
  if (!isPhone()) return;
  sheetState = 2;
  applySheet();
  document.getElementById('panel').scrollTop = 0;
}


// Switch the panel between "entering a trip" and "reading the results".
// The blue route banner floats over the bottom of the sheet. Whatever it
// covers is invisible, and the last line of a journey card was landing
// underneath. Measure it and pad the sheet by exactly that much — measuring
// beats a guessed constant, because the banner's height changes with the
// length of the stop names inside it.
// The nav bar is NOT counted here: it sits above the sheet now, and the
// sheet's own max-height already stops short of it.
function reserveRoomForBanner() {
  const panel  = document.getElementById('panel');
  const banner = document.getElementById('routebanner');
  const shown  = el => el && el.offsetParent !== null;

  const height = (shown(banner) ? banner.offsetHeight : 0) + 24;
  panel.style.paddingBottom = height + 'px';
}

function setResultsMode(on) {
  const panel = document.getElementById('panel');
  panel.classList.toggle('results', on);

  // The bar stays put on every screen. Leaving the results should never mean
  // losing the way back to them.

  const trip = document.getElementById('rb-trip');

  if (!on) {
    trip.style.display = 'none';
    panel.style.paddingBottom = '';        // back to the CSS default
    // Back to the entry form: clear any height left over from dragging.
    panel.style.maxHeight = '';
    panel.classList.remove('peek', 'tall');
    sheetState = 2;
    if (isPhone()) setTimeout(() => map.invalidateSize(), 220);
    return;
  }

  document.getElementById('rb-tripfromlabel').textContent = T('start');
  document.getElementById('rb-tripfrom').textContent = startPoint ? startPoint.label : '';
  document.getElementById('rb-triptolabel').textContent = T('destination');
  document.getElementById('rb-tripto').textContent = endPoint ? endPoint.label : '';
  document.getElementById('rb-edit').textContent = T('changeTrip');
  trip.style.display = 'flex';
}

// Wired once, not on every render — re-adding a listener each time would
// make one tap fire it several times over.
document.getElementById('rb-edit').addEventListener('click', () => {
  setResultsMode(false);
  document.getElementById('panel').scrollTop = 0;
});

// One place that knows what each operator is called and how it is coloured.
const OPERATORS = {
  kmb: { en:'KMB',     zh:'九巴',   css:'kmb' },
  ctb: { en:'CITYBUS', zh:'城巴',   css:'ctb' },
  nlb: { en:'NLB',     zh:'嶼巴',   css:'nlb' },
  gmb: { en:'MINIBUS', zh:'小巴',   css:'gmb' },
  mtr: { en:'MTR',     zh:'港鐵',   css:'mtr' }
};

function coName(co) {
  const entry = OPERATORS[co] || OPERATORS.kmb;
  return lang === 'zh' ? entry.zh : entry.en;
}

function coClass(co) { return (OPERATORS[co] || OPERATORS.kmb).css; }


// A one-glance comparison of all the options. The detail lives in the cards
// below; this is purely "which one do I want?" — the numbers people weigh:
// how long, how much, which bus, how far to walk, and when is the next one.
function buildCompareStrip(picks) {
  const strip = document.getElementById('compare');
  strip.innerHTML = '';

  for (const pick of picks) {
    const journey = pick.journey;
    const fare = journeyFare(journey);

    const tile = document.createElement('div');
    tile.className = 'ctile';
    tile.dataset.number = pick.number;
    tile.style.borderColor = pick.colour;

    tile.innerHTML =
      '<div class="cnum" style="background:' + pick.colour + '">' + pick.number + '</div>' +
      // The tile is a summary, so it carries the FIRST title only. Three
      // superlatives chained together wrapped to three lines of 12px text —
      // unreadable, and it pushed the rest of the tile off the top. The full
      // list still appears on the detail card below.
      '<div class="ctitle" style="color:' + pick.colour + '">' +
        pick.title.split(' · ')[0] + '</div>' +
      '<div class="ctime">' + journey.total + '<span class="cunit">' + T('min') + '</span></div>' +
      '<div class="cbus">' + journey.legs.map(l => l.lineCode || l.route).join(' → ') + '</div>' +
      (fare !== null ? '<div class="cfare">$' + fare.toFixed(1) + '</div>' : '') +
      '<div class="cwalk">🚶 ' + totalWalkMinutes(journey) + T('min') + '</div>' +
      '<div class="ceta" id="ceta-' + pick.number + '">…</div>';

    tile.addEventListener('click', () => selectOption(pick));
    strip.appendChild(tile);
  }
}

function makeCard(pick) {
  const journey = pick.journey;
  const card = document.createElement('div');
  card.className = 'jcard';
  card.dataset.number = pick.number;
  card.style.borderColor = pick.colour;

  const boardsAtChosen = startPoint.stop && journey.legs[0].on.stop === startPoint.stop.stop;
  const extraCost = pick.extraCost
    ? '<div class="jextra">' + T('costsMore').replace('{n}', pick.extraCost.toFixed(1)) + '</div>'
    : '';

  // The two numbers people actually decide on, made the biggest thing here.
  let inner =
    '<div class="jnum" style="background:' + pick.colour + '">' + pick.number + '</div>' +
    '<div class="jtop" style="color:' + pick.colour + '">' + pick.title + '</div>' +
    // Four figures, four equal cells, each with its label underneath so a
    // number and its unit can never be split across lines.
    '<div class="jheadline">' +
      '<div class="jcell"><span class="jbig">' + journey.total + '</span>' +
        '<span class="junit">' + T('totalTime') + '</span></div>' +
      '<div class="jcell"><span class="jbig" style="color:#166534">' + journeyFareText(journey) +
        '</span><span class="junit">' + T('totalFare') + '</span></div>' +
      '<div class="jcell"><span class="jbig" style="color:#92400e">' + totalWalkMinutes(journey) +
        '</span><span class="junit">' + T('totalWalk') + '</span></div>' +
      '<div class="jcell"><span class="jbig" style="color:#4b5563">' + journey.legs.length +
        '</span><span class="junit">' +
        (journey.legs[0].co === 'mtr' ? T('totalTrains') : T('totalBuses')) + '</span></div>' +
    '</div>' +
    '<div class="jwhy">' + pick.why + '</div>' + extraCost;

  // Green minibuses carry 19 people and do not take standees. For an older
  // rider that is worth knowing before they plan around one.
  if (journey.legs.some(leg => leg.co === 'gmb')) {
    inner += '<div class="jwarn" style="background:#faf5ff;color:#6b21a8">' +
             T('minibusNote') + '</div>';
  }

  const walkTotal = totalWalkMinutes(journey);
  if (walkTotal >= 12) {
    inner += '<div class="jwarn">' + T('lotsWalking').replace('{n}', walkTotal) + '</div>';
  }
  if (journey.legs.length > 1) {
    // Changing platform inside a station is not the same as getting off one
    // bus and finding another in the street, and it should not read as if
    // it were.
    inner += '<div class="jwarn" style="background:#fef3c7;color:#92400e">' +
             T(journey.legs[0].co === 'mtr' ? 'mustChangeTrain' : 'mustChange') + '</div>';
  }

  inner += boardsAtChosen
    ? '<div class="jdet" style="color:#166534;font-weight:700">' + T('boardHere') + ' <b>' +
      stopName(journey.legs[0].on) + '</b></div>'
    : '<div class="jdet">' + T('walkTo') + ' ' + journey.walkOn.minutes + ' ' + T('minTo') + ' <b>' +
      stopName(journey.legs[0].on) + '</b></div>';

  journey.legs.forEach((leg, index) => {
    const isTrain = leg.co === 'mtr';
    // One train fare covers the whole ride, changes included, so it is shown
    // once on the first leg rather than repeated on each.
    const legFare = isTrain
      ? (index === 0 ? journeyFare(journey) : null)
      : fareForLeg(leg.route, leg.bound, leg.serviceType, leg.on.stop, leg.co);

    inner += '<div class="jbus">' + (isTrain ? '🚇 ' : '🚌 ') + leg.route +
             '<span class="cotag ' + coClass(leg.co) + '">' + coName(leg.co) + '</span>' +
             (legFare !== null
               ? '<span class="legfare">$' + legFare.toFixed(1) + '</span>'
               : '') + '</div>' +
             '<div class="jdet">' + T('rideTo') + ' <b>' + stopName(leg.off) + '</b>' +
             ' <span style="color:#4b5563">(' + leg.stops + ' ' +
             T(isTrain ? 'stations' : 'stops') + ')</span></div>';

    if (index === 0 && journey.legs.length > 1) {
      // Hong Kong runs Bus-Bus Interchange schemes where the second fare is
      // free or discounted. The rules are NOT published in any API we use,
      // so we flag the possibility instead of inventing a price.
      const changeStop = (leg.off.name_en || '') + (leg.off.name_tc || '');
      if (/轉車站|INTERCHANGE|BBI/i.test(changeStop)) {
        inner += '<div class="jwarn" style="background:#eff6ff;color:#1e40af">' +
                 T('bbiNote') + '</div>';
      }

      inner += '<div class="jdet" style="color:#9a3412;font-weight:700">' +
               T(journey.legs[1] && journey.legs[1].co === 'mtr' && leg.co === 'mtr'
                 ? 'changeTrain' : 'changeBus') +
               (journey.transferWalk
                 ? ' — ' + T('walkTo') + ' ' + journey.transferWalk.minutes + ' ' +
                   T('minTo') + ' ' + stopName(journey.legs[1].on)
                 : ' ' + T('here')) + '</div>';
    }
  });

  inner += '<div class="jdet">' + T('thenWalk') + ' ' + journey.walkOff.minutes +
           ' ' + T('toDest') + '</div>' +
           '<div class="jnext waiting" id="next-' + pick.number + '">' + T('checkingBus') + '</div>' +
           '<div class="jzoom">' +
             '<button class="zoombtn on">🔍 ' + T('showBoarding') + '</button>' +
             '<button class="zoombtn off">🔍 ' + T('showAlighting') + '</button>' +
           '</div>' +
           '';

  card.innerHTML = inner;

  const firstLeg = journey.legs[0], lastLeg2 = journey.legs[journey.legs.length - 1];

  card.querySelector('.zoombtn.on').addEventListener('click', event => {
    event.stopPropagation();                     // don't also re-select the card
    selectOption(pick);
    zoomToStopDetail(firstLeg.on, startPoint, firstLeg, true);
  });

  card.querySelector('.zoombtn.off').addEventListener('click', event => {
    event.stopPropagation();
    selectOption(pick);
    zoomToStopDetail(lastLeg2.off, endPoint, lastLeg2, false);
  });

  return card;
}

// Show ONE route at a time. Three lines drawn together always tangle where
// they share a road, which is exactly what we are trying to avoid.

// Train options get plain, honest labels. The bus side earns superlatives by
// comparing dozens of routes; with at most three train options, calling one
// of them "CHEAPEST" out of three would be dressing up a thin list.
function buildRailPicks(options) {
  return (options || []).map((journey, index) => ({
    journey, number: index + 1,
    title: index === 0 ? T('bestTrain') : T('another'),
    why: index === 0 ? T('bestTrainWhy') : T('anotherWhy'),
    colour: '#991b1b'
  }));
}

// The bar is only useful once there is something to switch between, so it
// appears with the results and hides again on the entry form.
function paintBottomBar() {
  const bar = document.getElementById('bottombar');
  // Settings carries no count: there is nothing to have none of, and "(0)"
  // beside it would read as a section not worth opening.
  // "(0)" on a section that has simply not been searched yet reads as a
  // fault. The count appears once there are results to count.
  const withCount = (label, n) => n > 0 ? label + ' (' + n + ')' : label;
  const labels = { bus: withCount(T('tabBus'), busPicks.length),
                   mtr: withCount(T('tabMtr'), railPicks.length),
                   fav: T('tabFav') + ' (' +
                        (favStart.length + favEnd.length + departures.length + trainFavs.length + stopFavs.length) + ')',
                   stop: T('tabStop'), set: T('tabSet') };

  for (const button of bar.querySelectorAll('.bnav')) {
    const name = button.dataset.nav;
    button.querySelector('.blabel').textContent = labels[name];
    // Nothing is ever disabled. The bar is how you move around the app, and
    // a dead button is a dead end — an empty section still has something
    // worth saying, and favourites is where you learn how to fill it.
    button.classList.toggle('on', name === activeMode);
  }
}

function showMode(mode) {
  const panel   = document.getElementById('panel');
  const favView = document.getElementById('favview');
  const setView = document.getElementById('setview');
  const mtrView = document.getElementById('mtrview');
  const stopView = document.getElementById('stopview');
  const compare = document.getElementById('compare');
  const box     = document.getElementById('journeys');

  // Whichever section is being opened, it starts at its own first line.
  // Landing halfway down a list you have just asked to see reads as a
  // broken screen, and on a phone the scroll needed to fix it is the whole
  // reason the section felt hard to use.
  panel.scrollTop = 0;
  // Tapping a section in the bar is leaving the route lookup, whether or not
  // the ✕ was used.
  panel.classList.remove('routemode');

  // ---- FAVOURITES ----
  // Reachable from anywhere, including before a search has been run, so it
  // takes the panel rather than sitting under a results list that may not
  // exist yet.
  if (mode === 'fav') {
    activeMode = 'fav';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('setmode', 'mtrmode', 'stopmode');
    setView.style.display = 'none';
    mtrView.style.display = 'none';
    stopView.style.display = 'none';
    panel.classList.add('favmode');
    favView.style.display = 'block';
    renderFavouriteList();
    paintBottomBar();
    return;
  }

  // ---- BUS STOPS ----
  // The nearest poles or a saved one, and every bus leaving from it.
  if (mode === 'stop') {
    activeMode = 'stop';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('favmode', 'setmode', 'mtrmode');
    favView.style.display = 'none';
    setView.style.display = 'none';
    mtrView.style.display = 'none';
    openStopView();
    paintBottomBar();
    return;
  }

  // ---- MTR ----
  // Its own screen: nearest station, line, direction, next trains. The trip
  // planner's train results are one tap away at the bottom of it.
  if (mode === 'mtr') {
    activeMode = 'mtr';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('favmode', 'setmode', 'stopmode');
    favView.style.display = 'none';
    setView.style.display = 'none';
    stopView.style.display = 'none';
    openMtrView();
    paintBottomBar();
    return;
  }

  // ---- SETTINGS ----
  // Same rules as favourites: reachable at any time, takes the whole panel.
  if (mode === 'set') {
    activeMode = 'set';
    document.getElementById('livestrip').innerHTML = '';
    panel.classList.remove('favmode', 'mtrmode', 'stopmode');
    favView.style.display = 'none';
    mtrView.style.display = 'none';
    stopView.style.display = 'none';
    panel.classList.add('setmode');
    setView.style.display = 'block';
    renderSettings();
    paintBottomBar();
    return;
  }

  panel.classList.remove('favmode', 'setmode', 'mtrmode', 'stopmode');
  favView.style.display = 'none';
  setView.style.display = 'none';
  mtrView.style.display = 'none';
  stopView.style.display = 'none';
  compare.style.display = '';
  box.style.display = '';
  activeMode = mode;
  currentPicks = (mode === 'mtr' ? railPicks : busPicks);
  paintBottomBar();

  // The saved buses or stations, with live times, before anything else.
  renderLiveStrip(mode);

  // Nothing searched yet, or nothing found for this mode: the useful thing
  // to show is the form, not an empty list. Tapping a section is then a way
  // back to planning rather than a dead end.
  if (currentPicks.length === 0) {
    setResultsMode(false);
    status.textContent = T(mode === 'mtr' ? 'noTrain' : 'noBus');
    return;
  }

  setResultsMode(true);
  buildCompareStrip(currentPicks);
  selectOption(currentPicks[0]);
  // Start at the top. Resetting before the cards are built leaves the old
  // scroll position in place once they arrive.
  document.getElementById('panel').scrollTop = 0;
  currentPicks.forEach(pick => loadNextBus(pick));
}

// The settings screen. Redrawn on open and after a language change, so it
// is built from T() every time rather than patched in place.
function renderSettings() {
  const view = document.getElementById('setview');
  if (!view) return;
  view.innerHTML =
    '<div class="favhead">⚙️ ' + T('settings') + '</div>' +
    '<div class="setrow">' +
      '<span class="setlabel">' + T('settingLanguage') + '</span>' +
      '<button class="gobtn" id="langbtn" style="min-width:110px">' +
        T('langButton') + '</button>' +
    '</div>' +
    // Three sizes, the current one filled in. Buttons, not a slider: a slider
    // is the one control older thumbs reliably struggle with.
    '<div class="setrow setrow-stack">' +
      '<span class="setlabel">' + T('textSize') + '</span>' +
      '<div class="sizebtns">' +
        [['normal','textNormal'],['large','textLarge'],['xlarge','textXLarge']].map(([k,t]) =>
          '<button class="sizebtn' + (textScale === k ? ' on' : '') + '" data-textsize="' + k + '">' +
            T(t) + '</button>').join('') +

// ADD TO HOME SCREEN. Three states, and only two of them are worth a row:
// offered (the browser has said the app qualifies), already installed, or
// neither — on a desktop, or in a browser that does not do this, where a
// button that cannot work would read as a broken app.
function installRow() {
  if (installPrompt) {
    return '<div class="setrow">' +
             '<span class="setlabel">' + T('settingInstall') + '</span>' +
             '<button class="gobtn" id="installbtn" style="min-width:110px">' +
               T('install') + '</button>' +
           '</div>' +
           '<div class="setnote">' + T('installNote') + '</div>';
  }
  if (isInstalled()) {
    return '<div class="setrow">' +
             '<span class="setlabel">' + T('settingInstall') + '</span>' +
             '<span class="setlabel" style="flex:0 0 auto;color:#166534">' +
               T('installedAlready') + '</span>' +
           '</div>';
  }
